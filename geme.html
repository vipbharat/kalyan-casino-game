<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Tiger VIP - Real Original</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; position: relative; user-select: none; }
        
        #game-mount {
            position: absolute; width: 100vw; height: 100vh;
            background: linear-gradient(180deg, #11052c 0%, #2a0b5c 100%);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        @media screen and (orientation: portrait) {
            #game-mount {
                width: 100vh; height: 100vw;
                transform: rotate(90deg); transform-origin: center;
                top: calc((100vh - 100vw) / 2); left: calc((100vw - 100vh) / 2);
            }
        }

        .back-btn {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            width: 35px; height: 35px; background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #ffd700; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 10px #000; transition: 0.2s;
        }

        .casino-board {
            width: 90%; height: 80%; 
            background: rgba(30, 20, 60, 0.9);
            border: 3px solid #5a419c; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(90, 65, 156, 0.6);
            display: flex; flex-direction: column; position: relative;
            margin-bottom: 8%;
        }

        .action-area { flex: 0.8; position: relative; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 25px; z-index: 10;}
        .cards-stage { display: flex; align-items: center; gap: 30px; position: relative; z-index: 20;}
        .crd { width: 50px; height: 70px; border-radius: 4px; border: 2px solid #ffd700; background: #fff; position: relative; box-shadow: 0 5px 15px #000; transition: transform 0.3s;}
        .cbk { position: absolute; inset: 0; background: url('https://deckofcardsapi.com/static/img/back.png') center/cover; border-radius: 2px; z-index: 10; transition: 0.3s;}
        .crd-val { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 2px; overflow: hidden;}
        
        .timer-badge { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #600, #300); color: #ffd700; padding: 2px 15px; border-radius: 12px; border: 1.5px solid #ffd700; font-size: 12px; font-weight: 900; white-space: nowrap; z-index: 25;}

        .betting-area { flex: 1.3; display: flex; padding: 8px; gap: 8px; position: relative;}
        .bet-box { flex: 1; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; box-shadow: inset 0 0 25px rgba(0,0,0,0.5); transition: 0.2s;}
        .dbx { background: linear-gradient(180deg, #7c6cf0, #5c4cdb); border: 2px solid #9c8fff; }
        .tibx { background: linear-gradient(180deg, #6bcf6b, #43a047); border: 2px solid #8be08b; }
        .tbx { background: linear-gradient(180deg, #f0a33c, #e68900); border: 2px solid #ffd085; }
        
        .box-title { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 5px #000; z-index: 5;}
        .mbb { position: absolute; top: 6px; left: 6px; background: #00e5ff; color: #000; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 4px; display: none; z-index: 10;}
        .pa { position: absolute; bottom: 6px; right: 6px; background: #ffd700; color: #000; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 4px; z-index: 10;}

        /* Chips Animation CSS */
        .white-chip {
            position: absolute; width: 22px; height: 22px;
            background: radial-gradient(circle, #fff 40%, #ccc 100%);
            border: 2px dashed #999; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 1000; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .side-panel { width: 75px; display: flex; flex-direction: column; justify-content: space-evenly; padding: 5px; background: rgba(0,0,0,0.3); z-index: 20; }
        .bot-user { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .player-icon { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ffd700; box-shadow: 0 2px 5px #000; object-fit: cover; background: #222; }
        .player-bal { font-size: 10px; color: #00ff88; font-weight: bold;}

        /* Status Popups */
        .status-popup { position: absolute; top: -10px; font-size: 14px; font-weight: 900; z-index: 2000; opacity: 0; pointer-events: none; transition: 0.5s; }
        .win-txt { color: #00ff00; text-shadow: 0 0 10px #000; }
        .loss-txt { color: #ff0000; text-shadow: 0 0 10px #000; }

        .chip-tray { width: 49%; background: rgba(0,0,0,0.8); border-radius: 12px; display: flex; justify-content: space-evenly; align-items: center; padding: 5px; border: 2px solid #5a419c; }
        .chip { height: 85%; max-width: 40px; cursor: pointer; filter: drop-shadow(0 4px 5px #000); transition: 0.2s;}
        .chip.sel { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 15px #ffd700); }

        .tie-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 70%; max-width: 400px; z-index: 1000; opacity: 0; transition: 0.4s; }
        .tie-alert.show { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }

        .tst { position:fixed; top:-60px; left:50%; transform:translateX(-50%); background:linear-gradient(45deg,#d32f2f,#c62828); color:#fff; padding:10px 20px; border-radius:8px; z-index:9999; border:2px solid #fff; transition:top .4s; font-size:14px; font-weight: 900;}
        .tst.sh { top:15px; }

        #start-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0515; z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ffd700; }
        #click-catcher { position: absolute; inset: 0; z-index: 999999; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="enterCasino()">
        <h1>TAP TO PLAY</h1>
    </div>

    <div id="game-mount">
        <div id="click-catcher" onclick="initAudio()"></div>

        <audio id="snd-drop" src="assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3" preload="auto"></audio>
        <audio id="snd-fly" src="assets/7ba0aedc-0356-404d-9c4a-c34acec66469.mp3" preload="auto"></audio>
        <audio id="snd-card-flip" src="assets/6f1124e7-aec9-44c9-b898-4ca3c32bbe46.mp3" preload="auto"></audio>
        <audio id="snd-tick" src="assets/22d0dc27-b727-42be-ac04-d9182459f976.mp3" preload="auto"></audio>

        <div class="back-btn" onclick="window.history.back()">&#8592;</div>

        <div class="side-panel" id="left-players"></div>

        <div class="casino-board">
            <div class="action-area">
                <div class="cards-stage">
                    <div class="crd" id="c-d"><div class="cbk" id="b-d"></div><div id="d-v" class="crd-val"></div></div>
                    <img src="assets/VS.png" style="width:50px;" alt="VS">
                    <div class="crd" id="c-t"><div class="cbk" id="b-t"></div><div id="t-v" class="crd-val"></div></div>
                    <div class="timer-badge" id="tmr">WAITING...</div>
                </div>
            </div>

            <div class="history-bar" id="hr" style="height:30px; display:flex; gap:5px; padding:5px; background:rgba(0,0,0,0.5);"></div>

            <div class="betting-area">
                <div class="bet-box dbx" onclick="pB('dragon')" id="bx-d">
                    <div class="box-title">Dragon</div>
                    <div class="mbb" id="mb-d">₹0</div><div class="pa" id="md">₹0</div>
                </div>
                <div class="bet-box tibx" onclick="pB('tie')" id="bx-ti">
                    <div class="box-title">Tie</div>
                    <div class="mbb" id="mb-ti">₹0</div><div class="pa" id="mti">₹0</div>
                </div>
                <div class="bet-box tbx" onclick="pB('tiger')" id="bx-t">
                    <div class="box-title">Tiger</div>
                    <div class="mbb" id="mb-t">₹0</div><div class="pa" id="mt">₹0</div>
                </div>
            </div>
        </div>

        <div class="side-panel" id="right-players"></div>

        <div class="bottom-area" style="position:absolute; bottom:5px; width:90%; display:flex; justify-content:space-between; align-items:center;">
            <div class="wallet-panel" style="background:rgba(0,0,0,0.8); padding:10px; border-radius:10px; border:1px solid gold;">
                <div style="color:gold;">₹ <span id="bal-bot">0.00</span></div>
            </div>
            <div class="chip-tray">
                <img src="assets/10_0.png" class="chip sel" data-value="10" onclick="sC(this)">
                <img src="assets/50_0.png" class="chip" data-value="50" onclick="sC(this)">
                <img src="assets/100_0.png" class="chip" data-value="100" onclick="sC(this)">
                <img src="assets/500_0.png" class="chip" data-value="500" onclick="sC(this)">
                <img src="assets/1000_0.png" class="chip" data-value="1000" onclick="sC(this)">
            </div>
        </div>

        <img src="assets/kaishitouzhub.png" id="alert-start" class="tie-alert">
        <img src="assets/tingzhitouzhu.png" id="alert-stop" class="tie-alert">
    </div>

    <script>
        const $ = i => document.getElementById(i);
        const avatars = ['Avatar0.png', 'Avatar2.png', 'Avatar3.png', 'Avatar4.png', 'Avatar5.png'];
        
        function enterCasino() {
            document.documentElement.requestFullscreen().catch(e=>{});
            $('start-screen').style.display='none';
        }

        let iAI = 0;
        function initAudio() {
            $('click-catcher').style.display = 'none'; 
            if(!iAI) {
                ['snd-drop','snd-fly','snd-card-flip','snd-tick'].forEach(i => { let e=$(i); e.play().then(()=>e.pause()); });
                iAI = 1;
            }
        }

        function pS(i, v) { 
            let s = $(i); 
            if(s) { 
                let clone = s.cloneNode(); clone.volume = v; clone.play().catch(e => {});
                clone.onended = () => clone.remove();
            } 
        }

        function genPlayers() {
            let leftH = '', rightH = '';
            for(let i=0; i<4; i++) {
                leftH += `<div class="bot-user" id="p-l-${i}"><div class="status-popup" id="s-l-${i}"></div><img class="player-icon" src="assets/${avatars[i]}"><div class="player-bal">${Math.floor(Math.random()*90)+10}K</div></div>`;
                rightH += `<div class="bot-user" id="p-r-${i}"><div class="status-popup" id="s-r-${i}"></div><img class="player-icon" src="assets/${avatars[i]}"><div class="player-bal">${Math.floor(Math.random()*90)+10}K</div></div>`;
            }
            $('left-players').innerHTML = leftH; $('right-players').innerHTML = rightH;
        }
        genPlayers();

        // 🔥 ANIMATION: Chip Flying from Player to Box
        function flyChip(fromEl, toBoxId) {
            let fromRect = fromEl.getBoundingClientRect();
            let toRect = $(`bx-${toBoxId === 'dragon' ? 'd' : toBoxId === 'tiger' ? 't' : 'ti'}`).getBoundingClientRect();
            
            let chip = document.createElement('div');
            chip.className = 'white-chip placed-chip';
            chip.style.left = fromRect.left + 'px';
            chip.style.top = fromRect.top + 'px';
            document.body.appendChild(chip);

            pS('snd-drop', 0.4);

            setTimeout(() => {
                let randomX = (Math.random() * 40) - 20;
                let randomY = (Math.random() * 40) - 20;
                chip.style.left = (toRect.left + toRect.width/2 + randomX) + 'px';
                chip.style.top = (toRect.top + toRect.height/2 + randomY) + 'px';
            }, 50);
        }

        // 🔥 ANIMATION: Gather all chips and return to winning players
        function returnChips(winner) {
            let allChips = document.querySelectorAll('.placed-chip');
            let centerX = window.innerWidth / 2;
            let centerY = window.innerHeight / 2;

            // 1. Gather all chips to center
            allChips.forEach(chip => {
                chip.style.left = centerX + 'px';
                chip.style.top = centerY + 'px';
                chip.style.transform = 'scale(1.5)';
            });

            setTimeout(() => {
                pS('snd-fly', 0.8);
                allChips.forEach((chip, index) => {
                    // 2. Fly back to side players (randomly)
                    let side = Math.random() > 0.5 ? 'l' : 'r';
                    let idx = Math.floor(Math.random() * 4);
                    let target = $(`p-${side}-${idx}`).getBoundingClientRect();
                    
                    chip.style.left = target.left + 'px';
                    chip.style.top = target.top + 'px';
                    chip.style.opacity = '0';
                    chip.style.transform = 'scale(0.2)';
                });

                // 3. Show Win/Loss Status on Avatars
                for(let i=0; i<4; i++) {
                    showStatus(`s-l-${i}`, Math.random() > 0.3 ? 'WIN' : 'LOSS');
                    showStatus(`s-r-${i}`, Math.random() > 0.3 ? 'WIN' : 'LOSS');
                }
                
                setTimeout(() => {
                    allChips.forEach(c => c.remove());
                }, 1000);
            }, 600);
        }

        function showStatus(id, type) {
            let el = $(id);
            el.innerText = (type === 'WIN' ? '+₹' : '-₹') + (Math.floor(Math.random()*500)+100);
            el.className = `status-popup ${type === 'WIN' ? 'win-txt' : 'loss-txt'}`;
            el.style.opacity = '1'; el.style.top = '-30px';
            setTimeout(() => { el.style.opacity = '0'; el.style.top = '-10px'; }, 2000);
        }

        // Firebase & Logic
        try {
            firebase.initializeApp({
                databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com",
            });
            const db = firebase.database();
            const ph = localStorage.getItem('phone') || "TEST";
            let tB = 0, iBO = 0, cC = 10;

            db.ref('users/'+ph).on('value', s => {
                let d = s.val() || {}; tB = (d.balance||0) + (d.winning_balance||0);
                $('bal-bot').innerText = tB.toFixed(2);
                updateChips();
            });

            function updateChips() {
                document.querySelectorAll('.chip').forEach(c => {
                    let v = parseInt(c.dataset.value);
                    c.style.opacity = v > tB ? '0.3' : '1';
                    c.style.pointerEvents = v > tB ? 'none' : 'auto';
                });
            }

            window.sC = (el) => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
                el.classList.add('sel'); cC = parseInt(el.dataset.value);
            };

            window.pB = (s) => {
                if(!iBO || tB < cC) return;
                db.ref(`Game/DragonTiger/Bets/${ph}/${s}`).set(firebase.database.ServerValue.increment(cC));
                // Player's manual fly
                flyChip($('bal-bot'), s);
            };

            db.ref('Game/DragonTiger/Status').on('value', s => {
                let st = s.val(); if(!st) return;
                let te = $('tmr');
                if(st.state === 'betting') {
                    if(iBO === 0) {
                        iBO = 1; rUI();
                        $('alert-stop').classList.remove('show'); $('alert-start').classList.add('show');
                        setTimeout(() => $('alert-start').classList.remove('show'), 1500);
                        // Start Bot Flying Chips
                        this.botInt = setInterval(() => {
                            let side = Math.random() > 0.5 ? 'l' : 'r';
                            let idx = Math.floor(Math.random() * 4);
                            let target = ['dragon','tiger','tie'][Math.floor(Math.random()*3)];
                            flyChip($(`p-${side}-${idx}`), target);
                        }, 400);
                    }
                    te.innerText = st.timer + "s";
                    if(st.timer <= 5) pS('snd-tick', 1);
                } else {
                    if(iBO === 1) {
                        iBO = 0; clearInterval(this.botInt);
                        $('alert-start').classList.remove('show'); $('alert-stop').classList.add('show');
                        setTimeout(() => {
                            $('alert-stop').classList.remove('show');
                            sR(st.winner || 'dragon');
                        }, 1500);
                    }
                }
            });

            function sR(w) {
                pS('snd-card-flip', 1);
                $('b-d').style.opacity = '0'; $('b-t').style.opacity = '0';
                // (Simplified Card Logic)
                $('d-v').innerHTML = `<div style="background:white; height:100%; display:flex; align-items:center; justify-content:center; color:red;">K♥</div>`;
                $('t-v').innerHTML = `<div style="background:white; height:100%; display:flex; align-items:center; justify-content:center; color:black;">5♠</div>`;
                
                setTimeout(() => {
                    $(`bx-${w==='dragon'?'d':w==='tiger'?'t':'ti'}`).classList.add('gw');
                    // 🔥 Return chips to winners!
                    returnChips(w);
                }, 1000);
            }

            function rUI() {
                ['bx-d','bx-t','bx-ti'].forEach(i => $(i).classList.remove('gw'));
                $('d-v').innerHTML = ''; $('t-v').innerHTML = '';
                $('b-d').style.opacity = '1'; $('b-t').style.opacity = '1';
                document.querySelectorAll('.placed-chip').forEach(c => c.remove());
            }

        } catch(e) {}
    </script>
</body>
</html>
