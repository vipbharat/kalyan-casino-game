<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Tiger VIP - Real Original</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; position: relative; user-select: none; }
        
        #game-mount {
            position: absolute; width: 100vw; height: 100vh;
            background: linear-gradient(180deg, #11052c 0%, #2a0b5c 100%);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        @media screen and (orientation: portrait) {
            #game-mount {
                width: 100vh; height: 100vw;
                transform: rotate(90deg); transform-origin: center;
                top: calc((100vh - 100vw) / 2); left: calc((100vw - 100vh) / 2);
            }
        }

        .back-btn {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            width: 35px; height: 35px; background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #ffd700; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 10px #000; transition: 0.2s;
        }

        .casino-board {
            width: 90%; height: 80%; 
            background: rgba(30, 20, 60, 0.9);
            border: 3px solid #5a419c; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(90, 65, 156, 0.6);
            display: flex; flex-direction: column; position: relative;
            margin-bottom: 8%;
        }

        .action-area { flex: 0.8; position: relative; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 25px; z-index: 10;}
        
        /* 🔥 DRAGON & TIGER VIDEO CONTAINER ANIMATION 🔥 */
        .flying-beast { 
            position: absolute; 
            bottom: -5%; 
            object-fit: contain; 
            pointer-events: none; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9)); 
            z-index: 5;
            mix-blend-mode: screen; /* Black background hatane ke liye */
        }
        
        #beast-left { 
            left: -2%; 
            width: 55%; /* Dragon ki lambai (Width) badhayi */
            height: 135%; /* Chaudai badhayi */
            animation: aliveMovement 5s infinite ease-in-out; 
            transform-origin: bottom left;
        }
        
        #beast-right { 
            right: -2%; 
            width: 45%; 
            height: 125%; 
            animation: aliveMovement 5s infinite ease-in-out 0.5s; 
            transform-origin: bottom right;
        }

        /* Jaga hilane wala logic: Float + Rotate + Scale (Breathing effect) */
        @keyframes aliveMovement {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            25% { transform: scale(1.03) translate(10px, -8px) rotate(-1.5deg); }
            50% { transform: scale(0.98) translate(0px, -18px) rotate(1.5deg); }
            75% { transform: scale(1.02) translate(-10px, -6px) rotate(-0.5deg); }
            100% { transform: scale(1) translate(0, 0) rotate(0deg); }
        }

        .cards-stage { display: flex; align-items: center; gap: 30px; position: relative; z-index: 20;}
        .crd { width: 50px; height: 70px; border-radius: 4px; border: 2px solid #ffd700; background: #fff; position: relative; box-shadow: 0 5px 15px #000; transition: transform 0.3s;}
        .cbk { position: absolute; inset: 0; background: url('https://deckofcardsapi.com/static/img/back.png') center/cover; border-radius: 2px; z-index: 10; transition: 0.3s;}
        .crd-val { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 2px; overflow: hidden;}
        
        .vs-logo { width: 50px; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; filter: drop-shadow(0 0 10px red);}
        .timer-badge { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #600, #300); color: #ffd700; padding: 2px 15px; border-radius: 12px; border: 1.5px solid #ffd700; font-size: 12px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 5px #000; z-index: 25;}

        .history-bar { height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: rgba(0,0,0,0.6); overflow: hidden; border-top: 2px solid #4a317c; border-bottom: 2px solid #4a317c; z-index: 5; }
        .h-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #fff; border: 1.5px solid rgba(255,255,255,0.5); box-shadow: 0 2px 4px #000; flex-shrink: 0;}
        .h-d { background: #5c4cdb; } .h-t { background: #e68900; } .h-tie { background: #43a047; font-size: 8px;}

        .betting-area { flex: 1.3; display: flex; padding: 8px; gap: 8px; position: relative;}
        .bet-box { flex: 1; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; box-shadow: inset 0 0 25px rgba(0,0,0,0.5); overflow: hidden; transition: 0.2s;}
        
        .dbx { background: linear-gradient(180deg, #7c6cf0, #5c4cdb); border: 2px solid #9c8fff; }
        .tibx { background: linear-gradient(180deg, #6bcf6b, #43a047); border: 2px solid #8be08b; }
        .tbx { background: linear-gradient(180deg, #f0a33c, #e68900); border: 2px solid #ffd085; }
        
        .watermark { position: absolute; bottom: -10%; width: 90%; opacity: 0.15; pointer-events: none; z-index: 1;}

        .box-title { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 5px #000; z-index: 5;}
        .box-ratio { font-size: 14px; font-weight: 900; color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px #000; z-index: 5; margin-top: 2px;}
        
        .pa { position: absolute; bottom: 6px; right: 6px; background: #ffd700; color: #000; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 4px; box-shadow: 0 2px 5px #000; z-index: 10;}
        .mbb { position: absolute; top: 6px; left: 6px; background: #00e5ff; color: #000; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 4px; border: 1px solid #fff; display: none; z-index: 10;}
        
        .gw { box-shadow: inset 0 0 30px #fff, 0 0 20px #39ff14 !important; border-color: #39ff14 !important; z-index: 10; transform: scale(1.02);}

        .chips-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20;}
        .placed-chip { position: absolute; width: 28px; filter: drop-shadow(0 2px 3px #000); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .win-anim-chip { transition: all 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); z-index: 9999 !important; border: 1.5px solid #fff; border-radius: 50%; box-shadow: 2px 2px 6px rgba(0,0,0,0.8); }

        .bottom-area { position: absolute; bottom: 5px; width: 90%; height: 12%; display: flex; justify-content: space-between; align-items: stretch; gap: 10px; z-index: 50;}
        
        .wallet-panel { width: 49%; background: linear-gradient(135deg, #4a00e0, #8e2de2); border-radius: 12px; border: 2px solid #ffd700; display: flex; flex-direction: column; justify-content: center; padding: 0 15px; box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 5px 15px rgba(0,0,0,0.8);}
        .w-info { display: flex; justify-content: space-between; align-items: center; }
        .w-id { font-size: 11px; color: #fff; font-weight: bold;}
        .w-live { color: #00ff88; font-size: 11px; font-weight: bold; text-shadow: 0 1px 2px #000; }
        .w-bal { font-size: 20px; color: #ffd700; text-shadow: 0 2px 4px #000; margin-top: 2px;}

        .chip-tray { width: 49%; background: rgba(0,0,0,0.8); border-radius: 12px; display: flex; justify-content: space-evenly; align-items: center; padding: 5px; border: 2px solid #5a419c; box-shadow: 0 5px 15px #000; }
        .chip { height: 85%; max-width: 40px; cursor: pointer; filter: drop-shadow(0 4px 5px #000); transition: 0.2s;}
        .chip.sel { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 15px #ffd700); }

        #vs-clash-screen {
            position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; overflow: hidden;
        }
        .clash-dragon { position: absolute; width: 45%; height: auto; left: -50%; animation: flyInLeft 0.4s ease-in forwards; mix-blend-mode: screen; }
        .clash-tiger { position: absolute; width: 45%; height: auto; right: -50%; animation: flyInRight 0.4s ease-in forwards; mix-blend-mode: screen; }
        @keyframes flyInLeft { to { left: 5%; } }
        @keyframes flyInRight { to { right: 5%; } }

        #click-catcher { position: absolute; inset: 0; z-index: 999999; }
        #start-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0515; z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ffd700; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="enterCasino()">
        <h1>TAP TO PLAY</h1>
    </div>

    <div id="game-mount">
        <div id="click-catcher" onclick="initAudio()"></div>

        <audio id="snd-drop" src="assets/C9c7036e-1502-4e98-9b70-b8fec24836e4.mp3" preload="auto"></audio>
        <audio id="snd-fly" src="assets/7ba0aedc-0356-404d-9c4a-c34acec66469.mp3" preload="auto"></audio>
        <audio id="snd-card-flip" src="assets/6f1124e7-aec9-44c9-b898-4ca3c32bbe46.mp3" preload="auto"></audio>
        <audio id="snd-clash" src="assets/1777f138-eabb-42d5-a004-a1431ae48e0b.mp3" preload="auto"></audio>

        <div class="back-btn" onclick="window.history.back()">&#8592;</div>

        <div class="side-panel" id="left-players"></div>

        <div class="casino-board">
            <div class="action-area">
                <video class="flying-beast" id="beast-left" src="assets/VID_20260425_134936_4.mp4" autoplay loop muted playsinline></video>
                
                <div class="cards-stage">
                    <div class="crd" id="c-d"><div class="cbk" id="b-d"></div><div id="d-v" class="crd-val"></div></div>
                    <img src="assets/VS.png" class="vs-logo" alt="VS">
                    <div class="crd" id="c-t"><div class="cbk" id="b-t"></div><div id="t-v" class="crd-val"></div></div>
                    <div class="timer-badge" id="tmr">WAITING...</div>
                </div>

                <video class="flying-beast" id="beast-right" src="assets/VID_20260426_202810_2.mp4" autoplay loop muted playsinline></video>
            </div>

            <div class="history-bar" id="hr"></div>

            <div class="betting-area">
                <div class="bet-box dbx" onclick="pB('dragon')" id="bx-d">
                    <div class="box-title">Dragon</div><div class="box-ratio">1:1</div>
                    <div class="mbb" id="mb-d">₹0</div><div class="pa" id="md">₹0</div>
                    <div class="chips-overlay" id="ch-d"></div>
                </div>
                <div class="bet-box tibx" onclick="pB('tie')" id="bx-ti">
                    <div class="box-title">Tie</div><div class="box-ratio">8:1</div>
                    <div class="mbb" id="mb-ti">₹0</div><div class="pa" id="mti">₹0</div>
                    <div class="chips-overlay" id="ch-ti"></div>
                </div>
                <div class="bet-box tbx" onclick="pB('tiger')" id="bx-t">
                    <div class="box-title">Tiger</div><div class="box-ratio">1:1</div>
                    <div class="mbb" id="mb-t">₹0</div><div class="pa" id="mt">₹0</div>
                    <div class="chips-overlay" id="ch-t"></div>
                </div>
            </div>
        </div>

        <div class="side-panel" id="right-players"></div>

        <div class="bottom-area">
            <div class="wallet-panel">
                <div class="w-info">
                    <div class="w-id">ID: <span id="player-id-bottom">Loading...</span></div>
                    <div class="w-live">🟢 <span id="oc-bot">1,248</span> LIVE</div>
                </div>
                <div class="w-bal">₹ <span id="bal-bot">0.00</span></div>
            </div>

            <div class="chip-tray">
                <img src="assets/10_0.png" class="chip sel" data-value="10" onclick="sC(this)">
                <img src="assets/50_0.png" class="chip" data-value="50" onclick="sC(this)">
                <img src="assets/100_0.png" class="chip" data-value="100" onclick="sC(this)">
                <img src="assets/500_0.png" class="chip" data-value="500" onclick="sC(this)">
                <img src="assets/1000_0.png" class="chip" data-value="1000" onclick="sC(this)">
                <img src="assets/5000_1.png" class="chip" data-value="5000" onclick="sC(this)">
                <img src="assets/10000_0.png" class="chip" data-value="10000" onclick="sC(this)">
            </div>
        </div>

        <div id="vs-clash-screen">
            <video class="clash-dragon" src="assets/VID_20260425_134936_4.mp4" autoplay muted></video>
            <img src="assets/VS.png" class="clash-vs">
            <video class="clash-tiger" src="assets/VID_20260426_202810_2.mp4" autoplay muted></video>
        </div>
    </div>

    <script>
        const $ = i => document.getElementById(i);
        
        function enterCasino() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            $('start-screen').style.display='none';
        }

        let iAI = 0;
        function initAudio() {
            $('click-catcher').style.display = 'none'; 
            if(!iAI) {
                try {
                    ['snd-drop','snd-fly','snd-card-flip','snd-clash'].forEach(i => { let e=$(i); if(e){ e.play().catch(e=>{}); } });
                    iAI=1;
                } catch(e) {}
            }
        }
        
        function pS(i,v) { 
            try { 
                let s=$(i); 
                if(s) { s.currentTime = 0; s.volume = v; s.play().catch(e=>{}); } 
            } catch(e){} 
        }

        try {
            if(!firebase.apps.length) firebase.initializeApp({
                apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo",
                databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com",
                projectId: "kalyan-casino"
            });
            const db = firebase.database();
            const ph = localStorage.getItem('userPhone') || "TEST_USER";

            let iBO = 0, cC = 10, tB = 0, mB = {dragon:0, tiger:0, tie:0};
            let sPl = {dragon:0, tiger:0, tie:0}, bPl = {dragon:0, tiger:0, tie:0};

            window.sC = function(element) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
                element.classList.add('sel');
                cC = parseInt(element.getAttribute('data-value'));
            }

            window.pB = function(s) {
                if(!iBO) return;
                pS('snd-drop', 0.5); 
                spC(s, document.querySelector('.chip.sel').src);
            };

            function spC(s, imgSrc) {
                let sid = (s=='tie'?'ti':s.charAt(0));
                let b = $('ch-'+sid); if(!b) return;
                let p = document.createElement('img');
                p.src = imgSrc; p.className = 'placed-chip';
                p.style.top = "150%"; p.style.left = "50%";
                b.appendChild(p);
                setTimeout(() => {
                    p.style.left = `calc(50% + ${Math.random() * 40 - 20}px)`;
                    p.style.top = `calc(50% + ${Math.random() * 40 - 20}px)`;
                    p.style.opacity = "1";
                }, 50);
            }

            db.ref('Game/DragonTiger/Status').on('value', s => {
                let st = s.val(); if(!st) return;
                let te = $('tmr');
                if(st.state === 'betting') {
                    if(!iBO) { iBO = 1; rUI(); }
                    te.innerText = st.timer + "s";
                }
                else if(st.state === 'result') {
                    if(iBO) { iBO = 0; te.innerText = "STOP!"; triggerClashAnimation(); }
                }
            });

            function triggerClashAnimation() {
                let clashScreen = $('vs-clash-screen');
                pS('snd-clash', 1.0); 
                clashScreen.style.display = 'flex'; 
                setTimeout(() => { clashScreen.style.display = 'none'; sR('dragon'); }, 1500); 
            }

            function sR(w) {
                pS('snd-card-flip', 1.0);
                setTimeout(() => { pS('snd-fly', 1.0); }, 800);
            }

            function rUI() {
                document.querySelectorAll('.placed-chip').forEach(c => c.remove());
            }

        } catch(err) {}
    </script>
</body>
</html>
