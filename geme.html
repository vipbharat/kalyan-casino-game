<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dragon Tiger VIP - Smart Limit Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        
        body { 
            background: #1a0b2e url('assets/360_F_654861640_W8QmNeS82ZhiAZhdd6E7QW43qQQFkKOj.jpg') center/cover no-repeat; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            user-select: none; 
        }

        #game-mount {
            position: absolute; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.2); 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        @media screen and (orientation: portrait) {
            #game-mount { width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: center; top: calc((100vh - 100vw) / 2); left: calc((100vw - 100vh) / 2); }
        }
        .back-btn { position: absolute; top: 10px; left: 10px; z-index: 1000; padding: 5px 20px; background: rgba(0,0,0,0.8); border: 2px solid #ffd700; border-radius: 20px; color: #ffd700; font-size: 14px; cursor: pointer; }
        .online-counter { position: absolute; top: 10px; right: 10px; z-index: 1000; padding: 5px 15px; background: rgba(0,0,0,0.8); border: 2px solid #00ff88; border-radius: 20px; color: #00ff88; font-size: 12px; }
        
        /* 🔥 Overflow hidden hata diya gaya hai taki chips bahar wallet tak ud sakein 🔥 */
        .casino-board { width: 85%; height: 75%; background: rgba(30, 20, 60, 0.75); border: 3px solid #5a419c; border-radius: 12px; display: flex; flex-direction: column; position: relative; margin-bottom: 50px; backdrop-filter: blur(5px); }
        
        .action-area { flex: 0.9; position: relative; display: flex; justify-content: center; align-items: center; border-radius: 10px 10px 0 0; overflow: hidden;}
        .bg-gif { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.55; pointer-events: none; mix-blend-mode: screen; border-radius: 10px 10px 0 0; }
        .flying-beast { position: absolute; bottom: 5%; height: 90%; width: 38%; object-fit: cover; pointer-events: none; z-index: 5; mix-blend-mode: screen; filter: brightness(1.2); }
        #beast-left { left: 0; } #beast-right { right: 0; }

        .cards-stage { display: flex; align-items: center; gap: 10px; position: relative; z-index: 20; padding-bottom: 10px;}
        .crd { width: 55px; height: 80px; border-radius: 4px; border: 2px solid #ffd700; background: #fff; position: relative; box-shadow: 0 5px 15px #000; transition: transform 0.3s; transform-style: preserve-3d; }
        .cbk { position: absolute; inset: 0; background: #222 url('https://deckofcardsapi.com/static/img/back.png') center/cover; border-radius: 2px; z-index: 10; backface-visibility: hidden; transition: 0.3s; }
        .crd-val { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 2px; background: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 20px; line-height: 1.2;}
        .red-suit { color: red; } .black-suit { color: black; }
        .timer-badge { position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); background: #600; color: #ffd700; padding: 3px 20px; border-radius: 15px; border: 1.5px solid #ffd700; font-size: 14px; font-weight: 900; z-index: 500; }
        
        .history-bar { height: 35px; display: flex; align-items: center; justify-content: flex-start; gap: 5px; padding: 0 15px; background: rgba(0,0,0,0.5); overflow: hidden; border-top: 2px solid #4a317c; position: relative; z-index: 30;}
        .h-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
        .h-d { background: #5c4cdb; } .h-t { background: #e68900; } .h-tie { background: #43a047; color: #000; }
        .newest-record { animation: popNew 0.5s ease-out forwards; border: 2px solid #fff; box-shadow: 0 0 8px #fff; }
        @keyframes popNew { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); } 100% { transform: scale(1); opacity: 1; } }

        .betting-area { flex: 1.2; display: flex; padding: 10px; gap: 10px; position: relative; z-index: 10; }
        .bet-box { flex: 1; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; cursor: pointer; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); transition: 0.2s; overflow: hidden; }
        .dbx { background: rgba(124, 108, 240, 0.4); border: 2px solid #7c6cf0; } .tibx { background: rgba(107, 207, 107, 0.4); border: 2px solid #6bcf6b; } .tbx { background: rgba(240, 163, 60, 0.4); border: 2px solid #f0a33c; }

        .vortex-container { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; z-index: 0; pointer-events: none; }
        .vortex {
            position: absolute; top: 50%; left: 50%; width: 250%; height: 250%;
            background: repeating-radial-gradient(circle at center, rgba(0, 150, 255, 0) 0%, rgba(0, 150, 255, 0.4) 10%, rgba(0, 255, 255, 0) 20%), 
                        conic-gradient(from 0deg, rgba(0, 100, 255, 0.5), rgba(0, 255, 255, 0.9), rgba(0, 100, 255, 0.5), rgba(0, 50, 255, 0.7), rgba(0, 100, 255, 0.5));
            transform: translate(-50%, -50%);
            animation: spinVortex 3s ease-in-out infinite alternate; mix-blend-mode: screen; filter: blur(4px) contrast(1.5);
        }

        @keyframes spinVortex { 0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); } 100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); } }

        .beast-img-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; z-index: 2 !important; pointer-events: none; opacity: 0.8; transition: all 0.3s ease-out; }

        @keyframes roarEffect { 
            0% { transform: scale(1) translateY(0); z-index: 2; } 
            20% { transform: scale(1.3) translateY(-15px); z-index: 50; box-shadow: 0 10px 30px #ffd700; border-radius: 12px; } 
            80% { transform: scale(1.3) translateY(-15px); z-index: 50; box-shadow: 0 10px 30px #ffd700; border-radius: 12px; } 
            100% { transform: scale(1) translateY(0); z-index: 2; } 
        }
        .roaring { animation: roarEffect 2.5s ease-in-out forwards; z-index: 50; }

        .box-video-hidden { display: none; } 

        .box-title { font-size: 24px; color: #fff; text-shadow: 0 3px 6px #000, 0 0 10px #000; pointer-events: none; position: relative; z-index: 10; font-weight: 900;}
        
        .text-layer { position: relative; z-index: 500; width: 100%; height: 100%; pointer-events: none;}
        
        .pa { position: absolute; bottom: 5px; right: 8px; background: rgba(0,0,0,0.9); color: #00ff88; font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: 900; z-index: 500; border: 1.5px solid #00ff88; transition: all 0.1s; box-shadow: 0 2px 5px rgba(0,0,0,0.8);}
        .pool-flash { color: #fff !important; background: #00ff88 !important; transform: scale(1.15); }
        
        .mbb { position: absolute; top: 5px; left: 8px; background: #ff0055; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; display: none; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,0.9); border: 2px solid #fff; z-index: 500; text-shadow: 0 1px 2px #000; letter-spacing: 0.5px;}
        
        .gw { box-shadow: 0 0 25px #39ff14, inset 0 0 20px #fff !important; border-color: #39ff14 !important; transform: scale(1.02); }
        
        /* 🔥 CHIPS LAYER OVERFLOW VISIBLE 🔥 */
        #chips-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; overflow: visible; }
        .placed-chip { position: absolute; width: 26px; height: 26px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6)); transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); z-index: 50; pointer-events: none;}
        
        .side-panel { width: 75px; display: flex; flex-direction: column; justify-content: space-evenly; background: rgba(0,0,0,0.4); z-index: 80; border-left: 1px solid #ffd700; border-right: 1px solid #ffd700; }
        .bot-user { display: flex; flex-direction: column; align-items: center; position: relative; height: 50px; }
        .player-icon { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #ffd700; object-fit: cover; background: #222; }
        .player-bal { font-size: 8px; color: #0ff; font-weight: bold; }
        .wl-tag { position: absolute; top: 10px; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: 900; background: rgba(0,0,0,0.8); z-index: 100; opacity: 0; pointer-events: none; transition: all 0.5s ease-out; }
        .wl-tag.show-win { color: #39ff14; border: 1px solid #39ff14; transform: translateY(-25px); opacity: 1; }
        .wl-tag.show-lose { color: #ff3333; border: 1px solid #ff3333; transform: translateY(-25px); opacity: 1; }
        
        .bottom-area { position: absolute; bottom: 8px; width: 95%; height: 60px; display: flex; justify-content: space-between; align-items: stretch; gap: 10px; z-index: 500; }
        .wallet-panel { width: 40%; background: linear-gradient(135deg, #220066, #440099); border-radius: 12px; border: 2px solid #ffd700; display: flex; flex-direction: column; justify-content: center; padding-left: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .w-id { font-size: 9px; color: #aaa; font-weight: 900;} .w-bal { font-size: 18px; color: #ffd700; font-weight: 900;}
        .chip-tray { width: 58%; background: rgba(0,0,0,0.7); border-radius: 12px; display: flex; justify-content: space-evenly; align-items: center; border: 1px solid #5a419c; box-shadow: 0 4px 10px rgba(0,0,0,0.8);}
        .chip { height: 80%; max-width: 38px; cursor: pointer; transition: 0.2s; }
        .chip.sel { transform: scale(1.2) translateY(-8px); filter: drop-shadow(0 0 10px #ffd700); }
        .chip.locked { opacity: 0.25; filter: grayscale(1); pointer-events: none; }
        
        .banner-overlay { position: absolute; top: 50%; left: -100vw; transform: translate(-50%, -50%) scale(2.2); width: 60vw; z-index: 2000; pointer-events: none; transition: 0.5s; }
        .banner-overlay.show { left: 50%; }
        #vs-clash-screen { position: absolute; inset: 0; z-index: 3000; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; overflow: hidden; }
        .clash-dragon, .clash-tiger { width: 45%; mix-blend-mode: screen; }

        #network-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99999999; display: none; flex-direction: column; justify-content: center; align-items: center; color: #ffd700; }
        .loading-chakra { width: 60px; height: 60px; border: 6px solid rgba(255, 215, 0, 0.2); border-top-color: #ffd700; border-radius: 50%; animation: spinChakra 1s linear infinite; margin-bottom: 20px; }
        @keyframes spinChakra { 100% { transform: rotate(360deg); } }
        .net-text { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
    </style>
</head>

                <img src="assets/10_0.png" class="chip sel" data-value="10" onclick="sC(this)">

    <script>
        const pathRef = window.location.pathname.includes('DragonTiger2') ? 'DragonTiger2' : 'DragonTiger';
        function wakeUpServer() { fetch("https://kalyan-engine.onrender.com/").catch(e => {}); }
        wakeUpServer(); setInterval(wakeUpServer, 180000); 

        const $ = i => document.getElementById(i);
        let iBO = 0, cC = 10, tB = 0, dB=0, wB=0, bB=0;
        let myBets = { dragon: 0, tiger: 0, tie: 0 };
        let realPool = { dragon: 0, tiger: 0, tie: 0 };
        let botPool = { dragon: 0, tiger: 0, tie: 0 };
        let lastBeep = -1;
        const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png", 10000: "assets/10000_0.png" };
        
        let globalHistory = []; 

        function renderHistoryBoard() {
            let hr = $('hr');
            if(!hr) return;
            hr.innerHTML = '';
            globalHistory.forEach((w, index) => {
                let val = String(w).toLowerCase().trim();
                let char = val === 'dragon' ? 'D' : (val === 'tiger' ? 'T' : 'Tie');
                let cls = val === 'dragon' ? 'h-d' : (val === 'tiger' ? 'h-t' : 'h-tie');
                let isNew = (index === globalHistory.length - 1) ? 'newest-record' : '';
                hr.innerHTML += `<div class="h-dot ${cls} ${isNew}">${char}</div>`;
            });
        }

        function enterCasino() { 
            $('start-screen').style.display='none'; $('loading-screen').style.display='flex'; 
            if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            try { let v1=$('vid-box-dragon'); v1.play().then(()=>v1.pause()); }catch(e){}
            try { let v2=$('vid-box-tiger'); v2.play().then(()=>v2.pause()); }catch(e){}
            setTimeout(() => { $('loading-screen').style.display='none'; }, 2000); 
        }

        let audioUnlocked = false; let lastChipSoundTime = 0;
        function initAudio() { 
            if(!audioUnlocked) {
                $('click-catcher').style.display = 'none'; 
                ['snd-beep','snd-drop','snd-fly','snd-card','snd-clash'].forEach(i => { try{ let s=$(i); s.play().then(()=>s.pause()).catch(()=>{}); }catch(e){} });
                audioUnlocked = true;
            }
        }

        function pS(i,v) { if(!audioUnlocked) return; let s=$(i); if(s) { let cl = s.cloneNode(); cl.volume = v; cl.play().catch(()=>{}); } }
        function playChipSound() { let now = Date.now(); if (now - lastChipSoundTime > 80) { pS('snd-drop', 0.5); lastChipSoundTime = now; } }

        function genPlayers() {
            const avs = ['Avatar0.png', 'Avatar2.png', 'Avatar3.png', 'Avatar4.png', 'Avatar5.png', 'Avatar6.png', 'Avatar7.png', 'Avatar9.png', 'Avatar11.png'];
            let lh = '', rh = '';
            for(let i=0; i<5; i++) {
                let rBal1 = (Math.floor(Math.random()*50)+20) * 1000; 
                let rBal2 = (Math.floor(Math.random()*50)+20) * 1000;
                lh += `<div class="bot-user" id="bl${i}"><img class="player-icon" src="assets/${avs[Math.floor(Math.random()*avs.length)]}"><div class="player-bal">${rBal1}</div><div class="wl-tag"></div></div>`;
                rh += `<div class="bot-user" id="br${i}"><img class="player-icon" src="assets/${avs[Math.floor(Math.random()*avs.length)]}"><div class="player-bal">${rBal2}</div><div class="wl-tag"></div></div>`;
            }
            $('left-players').innerHTML = lh; $('right-players').innerHTML = rh;
        }
        genPlayers();
        setInterval(() => { $('oc-top').innerText = Math.floor(Math.random() * 25) + 220; }, 4000);

        function flashPool(side) {
            let pb = $('m' + (side === 'tie' ? 'ti' : side.charAt(0)));
            if(pb) { pb.classList.add('pool-flash'); setTimeout(() => pb.classList.remove('pool-flash'), 100); }
        }

        function updatePoolUI() {
            $('md').innerText = '₹' + (realPool.dragon + botPool.dragon);
            $('mt').innerText = '₹' + (realPool.tiger + botPool.tiger);
            $('mti').innerText = '₹' + (realPool.tie + botPool.tie);
        }

        // 🔥 PERFECT MATH: OMIT TRANSFORM ERRORS 🔥
        function getPos(el) {
            let x = 0, y = 0;
            while(el && el.id !== 'game-mount' && el.tagName !== 'BODY') {
                x += el.offsetLeft; 
                y += el.offsetTop; 
                el = el.offsetParent;
            }
            return {x, y};
        }

        function spC(side, imgSrc, srcEl, isSystemAnim = false, chipVal = 0) {
            if(!srcEl) return;
            
            let layer = $('chips-layer'), box = $('bx-' + (side === 'tie' ? 'ti' : side.charAt(0)));
            if(!box || !layer) return;

            let chip = document.createElement('img');
            chip.src = imgSrc; chip.className = 'placed-chip';
            
            let boardP = getPos($('c-board'));
            let srcP = getPos(srcEl);
            let boxP = getPos(box);

            let startX = srcP.x - boardP.x + (srcEl.offsetWidth/2) - 13;
            let startY = srcP.y - boardP.y + (srcEl.offsetHeight/2) - 13;
            
            chip.style.left = startX + "px";
