<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bharat VIP Dragon vs Tiger</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; user-select: none; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        .game-container { position: relative; width: 100%; height: 100%; background: radial-gradient(circle, #2a0a0a 0%, #1a0505 100%); overflow: hidden; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #ffd700; height: 50px; z-index: 100; position: relative; }
        .back-btn { font-size: 24px; cursor: pointer; color: #ffd700; }
        .bal-box { background: rgba(255,215,0,0.1); border: 1px solid #ffd700; padding: 5px 15px; border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 14px; }
        .history { display: flex; gap: 4px; }
        .h-dot { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 1px solid #fff; }
        .h-d { background: #ff4d4d; } .h-t { background: #4d94ff; } .h-tie { background: #00ff88; color: #000; }

        /* 🔥 Dealer & Card Area (Alignment Fixed) 🔥 */
        .dealer-area { height: 180px; position: relative; width: 100%; }
        .video-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; justify-content: space-around; padding: 0 10px; }
        .video-gif { width: 42%; height: 160px; object-fit: contain; margin-top: 5px; }
        
        .card-area { position: absolute; width: 100%; top: 20px; display: flex; justify-content: space-around; z-index: 10; padding: 0 30px;}
        .card-spot { width: 90px; height: 130px; border: 2px dashed #ff4d4d; border-radius: 10px; background: rgba(0,0,0,0.5); font-size: 50px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.2); }
        .dragon-spot { border-color: #ff4d4d; } .tiger-spot { border-color: #4d94ff; }
        .playing-card { width: 100%; height: 100%; border-radius: 8px; backface-visibility: hidden; transition: transform 0.5s; position: absolute; }
        .playing-card.flipped { transform: rotateY(180deg); }

        /* Timer Popup */
        .timer-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: rgba(0,0,0,0.9); border: 4px solid #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 200; box-shadow: 0 0 20px #ffd700; }
        .timer-text { font-size: 40px; font-weight: 900; color: #0f0; }

        /* Betting Areas */
        .betting-grid { display: flex; justify-content: space-around; align-items: flex-end; height: 35%; padding: 0 10px 10px; position: relative; z-index: 20; }
        .bet-area { position: relative; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .bet-area:active { transform: scale(0.95); }
        
        .main-bet { width: 42%; height: 100%; border: 3px solid; }
        .tie-bet { width: 100px; height: 80px; border: 3px solid #00ff88; background: rgba(0,255,136,0.1); margin: 0 10px; }
        
        .dragon-bet { border-color: #ff4d4d; background: linear-gradient(180deg, rgba(255,77,77,0.2) 0%, rgba(139,0,0,0.3) 100%); }
        .tiger-bet { border-color: #4d94ff; background: linear-gradient(180deg, rgba(77,148,255,0.2) 0%, rgba(0,0,139,0.3) 100%); }
        
        .area-title { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
        .pool-amt { font-size: 12px; color: #ccc; margin-top: 3px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; }
        .my-bet { position: absolute; top: -10px; right: -10px; background: #ffd700; color: #000; font-weight: 900; font-size: 10px; padding: 3px 8px; border-radius: 10px; display: none; box-shadow: 0 2px 5px #000; border: 1px solid #fff; }

        .win-glow { animation: winGlow 0.5s infinite alternate; z-index: 30; }
        @keyframes winGlow { from { box-shadow: 0 0 10px #fff; border-color: #fff; } to { box-shadow: 0 0 25px #ffd700; border-color: #ffd700; transform: scale(1.02); } }

        /* Bots Area */
        .live-bots { position: absolute; width: 100%; bottom: 85px; display: flex; justify-content: space-around; padding: 0 10px; z-index: 10; }
        .bot-user { text-align: center; }
        .bot-avatar { width: 30px; height: 30px; background: #333; border-radius: 50%; border: 1px solid #ffd700; line-height: 30px; font-size: 14px; margin: 0 auto; color: #ffd700; }
        .bot-id { font-size: 9px; color: #aaa; margin-top: 2px; }

        /* Chips Tray */
        .footer { position: absolute; bottom: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #ffd700; padding: 0 10px; z-index: 110; }
        .chip-box { display: flex; gap: 8px; overflow-x: auto; padding: 5px; width: 80%; justify-content: space-around; }
        .chip-box::-webkit-scrollbar { display: none; }
        .chip-img { width: 45px; height: 45px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 3px 3px #000); }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 8px #ffd700); }
        .chip-img.locked { opacity: 0.4; filter: grayscale(1); pointer-events: none; }

        /* 🔥 Real Chips Layer 🔥 */
        #chip-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 50; overflow: hidden; }
        .chip { position: absolute; width: 26px; height: 26px; transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); filter: drop-shadow(0 2px 3px #000); }
        
        #msg-overlay { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 15px 30px; border-radius: 10px; border: 2px solid #ffd700; color: #ffd700; font-weight: bold; font-size: 18px; z-index: 250; display: none; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="game-container">
        <div id="chip-container"></div>
        <div id="msg-overlay">STOP BETTING</div>

        <div class="header">
            <div class="back-btn" onclick="window.history.back()">⬅️</div>
            <div class="history" id="history-row"></div>
            <div class="bal-box">💰 ₹<span id="balance">0.00</span></div>
        </div>

        <div class="dealer-area">
            <div class="video-container">
                <img src="assets/joker_video.gif" class="video-gif">
                <img src="assets/joker_video_2.gif" class="video-gif">
            </div>
            <div class="card-area">
                <div class="card-spot dragon-spot" id="dragon-cardspot">D</div>
                <div class="card-spot tiger-spot" id="tiger-cardspot">T</div>
            </div>
        </div>

        <div class="timer-popup" id="timer-pop" style="display:none;">
            <div class="timer-text" id="timer-num">20</div>
        </div>

        <div class="betting-grid">
            <div class="bet-area main-bet dragon-bet" id="dragon-bet" onclick="placeBet('dragon', event)">
                <span class="area-title" style="color:#ff4d4d">DRAGON</span>
                <span class="pool-amt">Pool: ₹<span id="pool-dragon">0</span></span>
                <div class="my-bet" id="my-dragon">0</div>
            </div>
            
            <div class="bet-area tie-bet" id="tie-bet" onclick="placeBet('tie', event)">
                <span class="area-title" style="color:#00ff88; font-size:16px;">TIE</span>
                <span class="pool-amt">8x</span>
                <div class="my-bet" id="my-tie">0</div>
            </div>

            <div class="bet-area main-bet tiger-bet" id="tiger-bet" onclick="placeBet('tiger', event)">
                <span class="area-title" style="color:#4d94ff">TIGER</span>
                <span class="pool-amt">Pool: ₹<span id="pool-tiger">0</span></span>
                <div class="my-bet" id="my-tiger">0</div>
            </div>
        </div>

        <div class="live-bots">
            <div class="bot-user" id="bot-1"><div class="bot-avatar">👤</div><div class="bot-id">User_234</div></div>
            <div class="bot-user" id="bot-2"><div class="bot-avatar">👤</div><div class="bot-id">User_781</div></div>
            <div class="bot-user" id="bot-3"><div class="bot-avatar">👤</div><div class="bot-id">User_902</div></div>
            <div class="bot-user" id="bot-4"><div class="bot-avatar">👤</div><div class="bot-id">User_115</div></div>
        </div>

        <div class="footer">
            <div class="chip-box" id="chip-tray">
                <img src="assets/10_0.png" class="chip-img" data-val="10" onclick="selectChip(10, this)">
                <img src="assets/50_0.png" class="chip-img" data-val="50" onclick="selectChip(50, this)">
                <img src="assets/100_0.png" class="chip-img active" data-val="100" onclick="selectChip(100, this)">
                <img src="assets/500_0.png" class="chip-img" data-val="500" onclick="selectChip(500, this)">
                <img src="assets/1000_0.png" class="chip-img" data-val="1000" onclick="selectChip(1000, this)">
                <img src="assets/5000_1.png" class="chip-img" data-val="5000" onclick="selectChip(5000, this)">
                <img src="assets/10000_0.png" class="chip-img" data-val="10000" onclick="selectChip(10000, this)">
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // 🔥 RENDER MASTER ENGINE SOCKET 🔥
    const socket = io("https://kalyan-engine.onrender.com");

    const currentUserId = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "GUEST";
    let userBalance = 0, depBal = 0, winBal = 0, bonBal = 0;
    
    // 🔥 ASSET CHIPS MAPPING 🔥
    const chipImgs = {
        10: 'assets/10_0.png', 50: 'assets/50_0.png', 100: 'assets/100_0.png', 
        500: 'assets/500_0.png', 1000: 'assets/1000_0.png', 5000: 'assets/5000_1.png', 10000: 'assets/10000_0.png'
    };
    let currentChipVal = 100; let currentChipSrc = chipImgs[100];
    let isBettingOpen = false, currentTimer = 20, botInterval;
    let myBets = { dragon: 0, tiger: 0, tie: 0 };
    let bots = []; for(let i=1; i<=4; i++) bots.push({ id: Math.floor(100+Math.random()*800), bal: Math.floor(10000+Math.random()*50000) });

    const s_bet = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const s_win = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
    const chipContainer = document.getElementById('chip-container');

    // 💰 Wallet Sync & 🔥 Back Button Chip Recovery 🔥
    if (currentUserId && currentUserId !== "GUEST") {
        db.ref(`users/${currentUserId}`).on('value', s => {
            const d = s.val() || {}; depBal = parseFloat(d.balance||0); winBal = parseFloat(d.winning_balance||0); bonBal = parseFloat(d.bonus_balance||0);
            userBalance = depBal + winBal + bonBal;
            document.getElementById('balance').innerText = userBalance.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.querySelectorAll('.chip-img').forEach(c => { if(parseInt(c.dataset.val) > userBalance) c.classList.add('locked'); else c.classList.remove('locked'); });
        });

        // 🔥 Recovery Logic: Fetch existing bets during current round
        db.ref(`Game/DragonTiger/Bets/${currentUserId}`).once('value', snapshot => {
            if(!isBettingOpen) return; // Only recover if round is active
            const data = snapshot.val();
            if(data) {
                Object.entries(data).forEach(([side, amt]) => {
                    if(amt > 0) {
                        myBets[side] = amt;
                        let myTag = document.getElementById('my-'+side);
                        myTag.style.display = 'block'; myTag.innerText = amt >= 1000 ? (amt/1000)+'K' : amt;
                        // Spawn some visual chips to represent recovered bet
                        let tempAmt = amt; const vals = [10000, 5000, 1000, 500, 100, 50, 10];
                        let recoveredCount = 0;
                        vals.forEach(v => {
                            while(tempAmt >= v && recoveredCount < 5) { // Visual cap 5 chips per side
                                spawnInstantChip(side, chipImgs[v]); tempAmt -= v; recoveredCount++;
                            }
                        });
                    }
                });
            }
        });
    }

    db.ref('Game/DragonTiger/History').on('value', s => {
        let h = s.val(); if(!h) return;
        let html = ''; [...h].reverse().slice(0, 10).forEach(w => {
            let cls = w === 'dragon' ? 'h-d' : (w === 'tiger' ? 'h-t' : 'h-tie');
            let char = w === 'dragon' ? 'D' : (w === 'tiger' ? 'T' : 'T');
            html += `<div class="h-dot ${cls}">${char}</div>`;
        });
        document.getElementById('history-row').innerHTML = html;
    });

    db.ref('Game/DragonTiger/Bets').on('value', s => {
        let allB = s.val() || {}; let p = { dragon:0, tiger:0 };
        Object.entries(allB).forEach(([uid, b]) => { if(!uid.includes('bot')) { p.dragon += (b.dragon||0); p.tiger += (b.tiger||0); } });
        document.getElementById('pool-dragon').innerText = p.dragon.toLocaleString();
        document.getElementById('pool-tiger').innerText = p.tiger.toLocaleString();
    });

    function selectChip(v, el) {
        if(el.classList.contains('locked')) return;
        document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active'));
        el.classList.add('active'); currentChipVal = v; currentChipSrc = chipImgs[v];
    }

    // 🔥 PRECISE CHIP POSITIONING & TARGETING FIXED 🔥
    function createChip(val, imgSrc, targetAreaId, isMe, cX, cY, botId) {
        const targetArea = document.getElementById(targetAreaId);
        if(!targetArea) return;
        const targetRect = targetArea.getBoundingClientRect();

        const chip = document.createElement('img');
        chip.src = imgSrc; chip.className = 'chip';
        
        let startX, startY;
        if(isMe) { startX = cX; startY = cY; chip.style.zIndex = "60"; } 
        else {
            const botRect = document.getElementById('bot-'+botId).getBoundingClientRect();
            startX = botRect.left + 15; startY = botRect.top; chip.style.zIndex = "45";
        }
        chip.style.transform = `translate(${startX-13}px, ${startY-13}px)`;
        chipContainer.appendChild(chip);

        // Targeted position: Randomized SPREAD INSIDE THE BOX, not outside
        const padding = 15;
        const availWidth = targetRect.width - padding * 2;
        const availHeight = targetRect.height - padding * 2;
        const targetX = targetRect.left + padding + Math.random() * availWidth;
        const targetY = targetRect.top + padding + Math.random() * availHeight;

        setTimeout(() => {
            chip.style.transform = `translate(${targetX-13}px, ${targetY-13}px) rotate(${Math.random()*360}deg)`;
        }, 10);
    }

    // Spawn recovered chips instantly without animation
    function spawnInstantChip(targetAreaId, imgSrc) {
        const targetArea = document.getElementById(targetAreaId);
        const targetRect = targetArea.getBoundingClientRect();
        const chip = document.createElement('img');
        chip.src = imgSrc; chip.className = 'chip'; chip.style.zIndex = "55";
        const padding = 20;
        const targetX = targetRect.left + padding + Math.random() * (targetRect.width - padding*2);
        const targetY = targetRect.top + padding + Math.random() * (targetRect.height - padding*2);
        chip.style.transform = `translate(${targetX-13}px, ${targetY-13}px) rotate(${Math.random()*360}deg)`;
        chipContainer.appendChild(chip);
    }

    function placeBet(side, e) {
        if(!isBettingOpen) return;
        if(!currentUserId || currentUserId === "GUEST") { alert("Login please!"); return; }
        if(userBalance < currentChipVal) return;

        // Anti-fraud limit
        let sidesWithBet = Object.entries(myBets).filter(([s,v]) => v > 0).map(([s,v]) => s);
        if(myBets[side] === 0 && sidesWithBet.length >= 2) { alert("Max 2 sides allowed!"); return; }

        s_bet.currentTime = 0; s_bet.play().catch(err=>{});
        createChip(currentChipVal, currentChipSrc, side+'-bet', true, e.clientX, e.clientY);

        let rem = currentChipVal; let nDep = depBal, nWin = winBal;
        if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
        db.ref(`users/${currentUserId}`).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        db.ref(`Game/DragonTiger/Bets/${currentUserId}/${side}`).set(firebase.database.ServerValue.increment(currentChipVal));

        myBets[side] += currentChipVal;
        let myTag = document.getElementById('my-'+side);
        myTag.style.display = 'block'; myTag.innerText = myBets[side] >= 1000 ? (myBets[side]/1000)+'K' : myBets[side];
    }

    function botBetAction() {
        if(!isBettingOpen) return;
        const sides = ['dragon', 'tiger', 'tie']; const chipVals = [10,50,100,500];
        bots.forEach((bot, i) => {
            if(Math.random() > 0.4) {
                let side = sides[Math.floor(Math.random()*3)]; let val = chipVals[Math.floor(Math.random()*4)];
                if(bot.bal > val) {
                    bot.bal -= val;
                    createChip(val, chipImgs[val], side+'-bet', false, 0, 0, i+1);
                    if(Math.random()>0.8) s_bet.currentTime=0, s_bet.play().catch(e=>{});
                }
            }
        });
    }

    // 🔥 SOCKET.IO LISTENERS FIXED 🔥
    socket.on('DragonTiger_timerUpdate', (data) => {
        if (data.state === 'betting') {
            document.getElementById('timer-pop').style.display = 'flex';
            document.getElementById('msg-overlay').style.display = 'none';
            document.getElementById('timer-num').innerText = data.timer;
            document.getElementById('timer-num').style.color = data.timer <= 5 ? "#ff4d4d" : "#0f0";
            if(!isBettingOpen) { isBettingOpen = true; resetRound(); }
        }
    });

    socket.on('DragonTiger_result', (data) => {
        if (isBettingOpen) {
            isBettingOpen = false; clearInterval(botInterval);
            document.getElementById('timer-pop').style.display = 'none';
            document.getElementById('msg-overlay').style.display = 'block';
            document.getElementById('msg-overlay').innerText = "DEALING...";
            if(data.winner) showWinner(data.winner);
        }
    });

    socket.on('DragonTiger_newRound', () => { isBettingOpen = true; resetRound(); });

    function showWinner(win) {
        document.getElementById('msg-overlay').innerText = win.toUpperCase() + " WINS!";
        const winBox = document.getElementById(win+'-bet');
        if(winBox) winBox.classList.add('win-glow');
        s_win.play().catch(e=>{});

        // Winning chips animation
        let winTargetRect = winBox.getBoundingClientRect();
        for(let i=0; i<15; i++) {
            setTimeout(() => {
                let chip = document.createElement('img');
                chip.src = chipImgs[100]; chip.className = 'chip'; chip.style.zIndex = "90";
                chip.style.transform = `translate(${winTargetRect.left + winTargetRect.width/2}px, ${winTargetRect.top + winTargetRect.height/2}px)`;
                chipContainer.appendChild(chip);
                setTimeout(() => {
                    chip.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight+50}px) scale(0.5)`;
                    chip.style.opacity = "0";
                }, 50);
                setTimeout(()=>chip.remove(), 700);
            }, i*50);
        }

        if(myBets[win] > 0 && currentUserId && currentUserId !== "GUEST") {
            let winMult = win === 'tie' ? 9 : 2; let payout = myBets[win] * winMult;
            db.ref(`users/${currentUserId}/winning_balance`).set(firebase.database.ServerValue.increment(payout));
        }

        setTimeout(() => {
            document.getElementById('chip-container').innerHTML = '';
            document.getElementById('msg-overlay').innerText = "WAITING...";
        }, 5000);
    }

    function resetRound() {
        document.getElementById('chip-container').innerHTML = '';
        document.querySelectorAll('.bet-area').forEach(a => a.classList.remove('win-glow'));
        document.querySelectorAll('.my-bet').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.pool-amt span').forEach(s => s.innerText = '0');
        myBets = { dragon:0, tiger:0, tie:0 };
        document.getElementById('msg-overlay').innerText = "PLACE BETS";
        clearInterval(botInterval); botInterval = setInterval(botBetAction, 500);
    }
</script>
</body>
</html>
