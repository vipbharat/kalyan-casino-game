<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash VIP Pro - Fire Fix & Sound Update</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #0b0e14; --red: #ff3333; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        html, body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        
        .header { background: #1a1a24; padding: 12px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--neon); z-index: 100; }
        .wallet { font-weight: 900; color: var(--gold); border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; background: rgba(255,215,0,0.1); }

        .game-area { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1e222d 0%, #0b0e14 100%); }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        
        .multiplier-text { font-size: 85px; font-weight: 900; z-index: 50; text-shadow: 0 0 40px rgba(0,0,0,1); color: #fff; font-variant-numeric: tabular-nums; position: relative; margin-top: -30px;}
        .status-badge { position: absolute; top: 20px; z-index: 100; background: rgba(0,0,0,0.85); padding: 10px 30px; border-radius: 30px; border: 2px solid var(--neon); font-weight: 900; letter-spacing: 1px; }

        .history-strip { width: 100%; position: absolute; bottom: 0; left: 0; z-index: 100; background: rgba(0,0,0,0.6); padding: 6px 10px; display: flex; gap: 8px; overflow-x: auto; border-top: 1px solid #333; scrollbar-width: none; }
        .history-strip::-webkit-scrollbar { display: none; }
        .hist-item { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.1); white-space: nowrap; }

        .controls { background: #16161f; padding: 15px; border-top: 2px solid #333; border-radius: 25px 25px 0 0; z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); }
        .bet-input-row { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #444; }
        .bet-val { font-size: 26px; font-weight: 900; color: var(--gold); }

        .chips-container { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .chip { flex: 1; min-width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; cursor: pointer; border: 2.5px dashed rgba(255,255,255,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.4); color: #fff; transition: 0.1s;}
        .chip:active { transform: scale(0.9); }
        .c10 { background: #ff4b4b; } .c50 { background: #4b7bff; } .c100 { background: #4bff4b; color: #000; } .c500 { background: #ba68c8; } .c1k { background: var(--gold); color: #000; }

        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 22px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px;}
        .btn-bet { background: linear-gradient(to right, #00b09b, #96c93d); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.5); }
        .btn-cashout { background: linear-gradient(to right, #f5af19, #f12711); color: #fff; animation: pulse 1s infinite; }
        .btn-lock { background: #2a2a35; color: #666; cursor: not-allowed; border: 1px solid #444;}

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        #win-popup { position: absolute; top: 35%; z-index: 200; background: var(--neon); color: #000; padding: 15px 45px; border-radius: 40px; font-weight: 900; font-size: 30px; display: none; box-shadow: 0 0 50px var(--neon); border: 4px solid #fff; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body onclick="initAudio()">

    <audio id="sndFly" src="https://assets.mixkit.co/active_storage/sfx/1569/1569-preview.mp3" loop></audio>
    <audio id="sndBlast" src="https://assets.mixkit.co/active_storage/sfx/1702/1702-preview.mp3"></audio>

    <div class="header">
        <div style="font-weight: 900; font-size: 20px; letter-spacing: 1px;">CRASH <span style="color:var(--neon)">VIP Pro</span></div>
        <div class="wallet">₹<span id="balance">0.00</span></div>
    </div>

    <div class="game-area">
        <canvas id="graphCanvas"></canvas>
        <div class="status-badge" id="statusLabel">CONNECTING...</div>
        <div class="multiplier-text" id="multText">1.00x</div>
        <div id="win-popup">WON!</div>
        
        <div class="history-strip" id="history-bar"></div>
    </div>

    <div class="controls">
        <div class="bet-input-row">
            <span style="font-size: 11px; font-weight: bold; color: #aaa; letter-spacing: 1px;">SET AMOUNT</span>
            <div class="bet-val">₹<span id="betDisplay">10</span></div>
            <button onclick="clearBet()" style="background:#333; color:#fff; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; font-size:12px; cursor:pointer;">CLEAR</button>
        </div>

        <div class="chips-container">
            <div class="chip c10" onclick="addBet(10)">+10</div>
            <div class="chip c50" onclick="addBet(50)">+50</div>
            <div class="chip c100" onclick="addBet(100)">+100</div>
            <div class="chip c500" onclick="addBet(500)">+500</div>
            <div class="chip c1k" onclick="addBet(1000)">+1K</div>
        </div>

        <button class="action-btn btn-lock" id="mainBtn" onclick="handleAction()">CONNECTING...</button>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone') || localStorage.getItem('phone');

    let audioReady = false;
    const sFly = document.getElementById('sndFly');
    const sBlast = document.getElementById('sndBlast');
    
    function initAudio() {
        if(!audioReady) {
            sFly.volume = 0.5; sBlast.volume = 1.0;
            sFly.play().then(() => sFly.pause()).catch(()=>{});
            audioReady = true;
        }
    }

    let totalBal = 0, depBal = 0, winBal = 0;
    let selectedBet = 10, isBetted = false, isCashed = false;
    let crashHistory = [1.25, 2.50, 1.02, 10.40, 1.80, 4.20]; 

    if(phone && phone !== "Guest" && phone !== "null") {
        db.ref('users/'+phone).on('value', s => {
            const d = s.val() || {};
            depBal = parseFloat(d.balance || 0); winBal = parseFloat(d.winning_balance || 0);
            let bonBal = parseFloat(d.bonus_balance || 0);
            totalBal = Math.max(0, depBal + winBal + bonBal);
            document.getElementById('balance').innerText = totalBal.toFixed(2);
        });
    }

    function updateBetUI() { 
        document.getElementById('betDisplay').innerText = selectedBet; 
        if(!isBetted && gameState === "WAITING") {
            mainBtn.innerText = "PLACE BET ₹" + selectedBet;
        }
    }
    function addBet(v) { if(gameState === "WAITING" && !isBetted) { selectedBet += v; updateBetUI(); } }
    function clearBet() { if(gameState === "WAITING" && !isBetted) { selectedBet = 10; updateBetUI(); } }

    function renderHistory() {
        const bar = document.getElementById('history-bar');
        bar.innerHTML = "";
        crashHistory.forEach(val => {
            let col = val < 2 ? "#ff3333" : (val < 10 ? "#00ff88" : "#ffd700");
            bar.innerHTML += `<div class="hist-item" style="color:${col}; border: 1px solid ${col};">${val.toFixed(2)}x</div>`;
        });
    }
    renderHistory();

    let gameState = "WAITING", lastState = "";
    let currMult = 1.00, crashPoint = 1.00;
    let flightStart = 0, waitEnd = 0;

    const mainBtn = document.getElementById('mainBtn');
    const multLabel = document.getElementById('multText');
    const statusLabel = document.getElementById('statusLabel');

    db.ref('game_loop').on('value', snap => {
        const d = snap.val(); if(!d) return;
        gameState = d.state;

        if(gameState !== lastState) {
            if(gameState === "WAITING") {
                waitEnd = d.waitEndTime; currMult = 1.00; isCashed = false;
                document.getElementById('win-popup').style.display = "none";
                sFly.pause(); sBlast.pause();
                particles = []; 
                
                if(!isBetted) { mainBtn.innerText = "PLACE BET ₹" + selectedBet; mainBtn.className = "action-btn btn-bet"; }
                else { mainBtn.innerText = "WAITING FOR ROUND"; mainBtn.className = "action-btn btn-lock"; }
                
            } else if(gameState === "FLYING") {
                flightStart = d.startTime;
                if(audioReady) { sFly.currentTime = 0; sFly.play().catch(()=>{}); }
                if(isBetted && !isCashed) { mainBtn.innerText = "CASH OUT"; mainBtn.className = "action-btn btn-cashout"; }
                else { mainBtn.innerText = "ROUND IN PROGRESS"; mainBtn.className = "action-btn btn-lock"; }

            } else if(gameState === "CRASHED") {
                crashPoint = d.crashMultiplier; sFly.pause();
                
                crashHistory.unshift(crashPoint);
                if(crashHistory.length > 15) crashHistory.pop();
                renderHistory();

                if(audioReady) { sBlast.currentTime = 0; sBlast.play().catch(()=>{}); }
                if(isBetted && !isCashed) { mainBtn.innerText = "YOU LOST"; isBetted = false; }
                else { mainBtn.innerText = "CRASHED"; }
                mainBtn.className = "action-btn btn-lock";
            }
            lastState = gameState;
        }
    });

    function handleAction() {
        if(!phone || phone === "Guest" || phone === "null") return alert("Wallet Not Connected! Login First.");
        
        if(gameState === "WAITING" && !isBetted) {
            if(selectedBet > totalBal) return alert("Insufficient Balance!");
            
            let rem = selectedBet, nDep = depBal, nWin = winBal;
            if(nDep >= rem) nDep -= rem; else { rem -= nDep; nDep = 0; nWin -= rem; }
            
            db.ref('users/'+phone).update({ balance: nDep, winning_balance: nWin }).then(() => {
                isBetted = true;
                mainBtn.innerText = "WAITING FOR ROUND"; mainBtn.className = "action-btn btn-lock";
                db.ref('current_bets/'+phone).set({ amount: selectedBet });
            });

        } else if(gameState === "FLYING" && isBetted && !isCashed) {
            isCashed = true;
            let winAmt = (selectedBet * currMult).toFixed(2);
            db.ref('users/'+phone).update({ winning_balance: firebase.database.ServerValue.increment(parseFloat(winAmt)) }).then(() => {
                const pop = document.getElementById('win-popup');
                pop.innerText = "₹" + winAmt; pop.style.display = "block";
                
                mainBtn.innerText = "CASHED OUT"; mainBtn.className = "action-btn btn-lock";
                isBetted = false;
            });
        }
    }

    let particles = [];
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let cw, ch;
    function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = canvas.parentElement.clientHeight - 40; } 
    window.onresize = resize; resize();

    function draw() {
        ctx.clearRect(0,0,cw,ch);
        if(gameState === "WAITING") {
            let left = Math.max(0, (waitEnd - Date.now())/1000);
            statusLabel.innerText = "NEXT ROUND: " + left.toFixed(1) + "s";
            statusLabel.style.color = "var(--neon)";
            multLabel.innerText = "1.00x"; multLabel.style.color = "#fff";
            renderRocket(0, true);
        } else if(gameState === "FLYING") {
            statusLabel.innerText = "FLYING!";
            statusLabel.style.color = "#fff";
            let elapsed = Date.now() - flightStart;
            currMult = Math.pow(Math.E, 0.00006 * elapsed);
            multLabel.innerText = currMult.toFixed(2) + "x";
            multLabel.style.color = (currMult > 2) ? (currMult > 5 ? "#ff3333" : "#ffd700") : "var(--neon)";
            
            if(isBetted && !isCashed) { mainBtn.innerText = "CASH OUT (₹" + (selectedBet * currMult).toFixed(2) + ")"; }
            renderRocket(elapsed, false);
        } else {
            statusLabel.innerText = "FLEW AWAY!";
            statusLabel.style.color = "var(--red)";
            multLabel.innerText = crashPoint.toFixed(2) + "x"; multLabel.style.color = "var(--red)";
            renderRocket(Math.log(crashPoint)/0.00006, false);
        }
        requestAnimationFrame(draw);
    }

    function renderRocket(elapsed, isWaiting) {
        let sec = elapsed / 1000;
        
        let maxS = Math.max(8, sec * 1.25);
        let maxM = Math.max(2, currMult * 1.25);
        
        let startX = 40;
        let startY = ch - 40;

        let gridOffsetY = ((currMult - 1) * 30) % 50; 
        ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
        for(let x=startX; x<cw; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, startY); ctx.stroke(); }
        for(let y=startY + gridOffsetY; y>0; y-=50) { ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(cw, y); ctx.stroke(); }

        ctx.fillStyle = "rgba(255, 255, 255, 0.5)"; ctx.font = "bold 11px Arial";
        ctx.textAlign = "right"; 
        for(let i=0; i<=4; i++) {
            let v = 1 + ((maxM-1)*(i/4)); 
            let yp = startY - (i/4)*(ch-80);
            if(i===0) yp = startY - 5;
            ctx.fillText(v.toFixed(1)+"x", startX - 5, yp+4);
        }

        let xPos = startX + (sec/maxS)*(cw-80);
        let yPos = startY - ((currMult-1)/(maxM-1))*(ch-100);
        
        if (isWaiting) { xPos = startX; yPos = startY; }

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX + (xPos-startX)*0.7, startY, xPos, yPos);
        ctx.lineTo(xPos, startY);
        ctx.lineTo(startX, startY);
        
        let fillGrad = ctx.createLinearGradient(0, yPos, 0, startY);
        fillGrad.addColorStop(0, gameState === "CRASHED" ? "rgba(255, 51, 51, 0.4)" : "rgba(0, 255, 136, 0.4)");
        fillGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = fillGrad; 
        ctx.fill();

        ctx.beginPath(); ctx.lineWidth = 6; ctx.strokeStyle = (gameState === "CRASHED") ? "var(--red)" : "var(--neon)";
        ctx.moveTo(startX, startY); ctx.quadraticCurveTo(startX + (xPos-startX)*0.7, startY, xPos, yPos); ctx.stroke();
        
        // 🔥 PERFECT FIRE ALIGNMENT 🔥
        // xPos, yPos ke center par rocket hai. Tail (-25, +25) par set kar di gayi hai.
        let tailX = xPos - 25;
        let tailY = yPos + 25;

        if(gameState === "FLYING") {
            for(let p=0; p<4; p++) {
                particles.push({
                    x: tailX + (Math.random() * 10 - 5),
                    y: tailY + (Math.random() * 10 - 5),
                    vx: -Math.random() * 2 - 1.5, 
                    vy: Math.random() * 2 + 1.5,  
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#ff3333' : (Math.random() > 0.5 ? '#ff9900' : '#ffff00')
                });
            }
        }
        
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 6 * p.life, 0, Math.PI * 2); ctx.fill();
            p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            if(p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;

        // 🔥 ROCKET DRAWING CENTERED 🔥
        ctx.save();
        ctx.translate(xPos, yPos);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if(gameState === "CRASHED") {
            ctx.font = "60px Arial";
            ctx.fillText("💥", 0, 0);
        } else {
            ctx.font = "55px Arial";
            // Normal rocket symbol naturally points diagonally up-right
            ctx.fillText("🚀", 0, 0);
        }
        ctx.restore();
    }
    draw();

    // --- AUTO SERVER (Profit Logic) ---
    let isMaster = false;
    setInterval(() => {
        if(isMaster) return;
        db.ref('game_loop/hb').once('value', s => {
            if(Date.now() - (s.val() || 0) > 12000) { isMaster = true; runServer(); }
        });
    }, 4000);

    async function runServer() {
        if(!isMaster) return;
        db.ref('game_loop/hb').set(Date.now());

        db.ref('game_loop').update({ state: "WAITING", waitEndTime: Date.now() + 10000 });
        db.ref('current_bets').remove();
        await new Promise(r => setTimeout(r, 10000));

        const betSnap = await db.ref('current_bets').get();
        let totalBets = 0;
        if(betSnap.exists()) Object.values(betSnap.val()).forEach(b => totalBets += b.amount);

        let targetCrash = 1.00;
        const adminControl = await db.ref('admin_control/next_crash').get();
        
        if(adminControl.exists() && adminControl.val() > 0) {
            targetCrash = adminControl.val();
            db.ref('admin_control/next_crash').set(0);
        } else {
            if(totalBets > 3000) targetCrash = 1.01 + Math.random() * 0.49;
            else targetCrash = 1.15 + Math.pow(Math.random(), 3) * 15; 
        }

        let fDuration = Math.log(targetCrash) / 0.00006;
        db.ref('game_loop').update({ state: "FLYING", startTime: Date.now() });
        await new Promise(r => setTimeout(r, fDuration));

        db.ref('game_loop').update({ state: "CRASHED", crashMultiplier: targetCrash });
        await new Promise(r => setTimeout(r, 4000));
        runServer();
    }
</script>
</body>
</html>
