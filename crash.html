<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash X VIP - Kalyan Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #0b0e14; --red: #ff3333; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        html, body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        
        /* Top Header */
        .header { background: #1a1a24; padding: 12px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--neon); z-index: 100; }
        .wallet { font-weight: 900; color: var(--gold); border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; background: rgba(255,215,0,0.1); }

        /* Game Display Area */
        .game-area { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1e222d 0%, #0b0e14 100%); }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        
        .multiplier-text { font-size: 80px; font-weight: 900; z-index: 10; text-shadow: 0 0 30px rgba(0,0,0,0.8); font-variant-numeric: tabular-nums; }
        .status-badge { position: absolute; top: 20px; z-index: 20; background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 30px; border: 1.5px solid var(--neon); font-weight: 900; letter-spacing: 1px; color: #fff; }

        /* Betting Controls */
        .controls { background: #16161f; padding: 15px; border-top: 2px solid #333; border-radius: 25px 25px 0 0; z-index: 100; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .bet-input-row { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #444; }
        .bet-val { font-size: 24px; font-weight: 900; color: #fff; }

        .chips-container { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .chip { flex: 1; min-width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; cursor: pointer; border: 2.5px dashed rgba(255,255,255,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.4); color: #fff; }
        .c10 { background: #ff4b4b; } .c50 { background: #4b7bff; } .c100 { background: #4bff4b; color: #000; } .c500 { background: #ba68c8; } .c1k { background: var(--gold); color: #000; }

        .action-btn { width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 24px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-bet { background: linear-gradient(to right, #00b09b, #96c93d); color: #000; box-shadow: 0 0 15px rgba(0,255,136,0.4); }
        .btn-cashout { background: linear-gradient(to right, #f5af19, #f12711); color: #fff; animation: pulse 1s infinite; }
        .btn-lock { background: #2a2a35; color: #666; cursor: not-allowed; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        
        #win-popup { position: absolute; top: 40%; z-index: 50; background: var(--neon); color: #000; padding: 15px 40px; border-radius: 40px; font-weight: 900; font-size: 28px; display: none; box-shadow: 0 0 40px var(--neon); border: 4px solid #fff; }
    </style>
</head>
<body onclick="initAudio()">

    <audio id="sndFly" src="https://assets.mixkit.co/active_storage/sfx/1271/1271-preview.mp3" loop></audio>
    <audio id="sndBlast" src="https://assets.mixkit.co/active_storage/sfx/1702/1702-preview.mp3"></audio>

    <div class="header">
        <div style="font-weight: 900; font-size: 18px; letter-spacing: 1px;">CRASH <span style="color:var(--neon)">VIP</span></div>
        <div class="wallet">₹<span id="balance">0.00</span></div>
    </div>

    <div class="game-area">
        <canvas id="graphCanvas"></canvas>
        <div class="status-badge" id="statusLabel">CONNECTING...</div>
        <div class="multiplier-text" id="multText">1.00x</div>
        <div id="win-popup">YOU WON!</div>
    </div>

    <div class="controls">
        <div class="bet-input-row">
            <span style="font-size: 11px; font-weight: bold; color: #aaa;">BET AMOUNT</span>
            <div class="bet-val">₹<span id="betDisplay">10</span></div>
            <button onclick="clearBet()" style="background:#333; color:#fff; border:none; padding:5px 12px; border-radius:6px; font-weight:bold; font-size:11px;">CLEAR</button>
        </div>

        <div class="chips-container">
            <div class="chip c10" onclick="addBet(10)">10</div>
            <div class="chip c50" onclick="addBet(50)">50</div>
            <div class="chip c100" onclick="addBet(100)">100</div>
            <div class="chip c500" onclick="addBet(500)">500</div>
            <div class="chip c1k" onclick="addBet(1000)">1K</div>
        </div>

        <button class="action-btn btn-lock" id="mainBtn" onclick="handleAction()">CONNECTING...</button>
    </div>

<script>
    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone') || localStorage.getItem('phone');

    // --- 2. AUDIO HANDLER ---
    let audioReady = false;
    const sFly = document.getElementById('sndFly');
    const sBlast = document.getElementById('sndBlast');

    function initAudio() {
        if(!audioReady) {
            sFly.volume = 0.3; sBlast.volume = 0.8;
            audioReady = true;
        }
    }

    // --- 3. WALLET & BETTING ---
    let totalBal = 0, depBal = 0, winBal = 0;
    let selectedBet = 10, isBetted = false, isCashed = false;

    if(phone) {
        db.ref('users/'+phone).on('value', s => {
            const d = s.val() || {};
            depBal = parseFloat(d.balance || 0); winBal = parseFloat(d.winning_balance || 0);
            totalBal = depBal + winBal;
            document.getElementById('balance').innerText = totalBal.toFixed(2);
        });
    }

    function addBet(v) { if(gameState === "WAITING" && !isBetted) { selectedBet += v; document.getElementById('betDisplay').innerText = selectedBet; } }
    function clearBet() { if(gameState === "WAITING" && !isBetted) { selectedBet = 10; document.getElementById('betDisplay').innerText = selectedBet; } }

    // --- 4. ENGINE & MULTIPLAYER SYNC ---
    let gameState = "WAITING", lastState = "";
    let currMult = 1.00, crashPoint = 1.00;
    let flightStart = 0, waitEnd = 0;

    const mainBtn = document.getElementById('mainBtn');
    const multLabel = document.getElementById('multText');
    const statusLabel = document.getElementById('statusLabel');

    db.ref('game_loop').on('value', snap => {
        const d = snap.val(); if(!d) return;
        gameState = d.state;

        if(gameState !== lastState) {
            if(gameState === "WAITING") {
                waitEnd = d.waitEndTime; currMult = 1.00; isCashed = false;
                document.getElementById('win-popup').style.display = "none";
                sFly.pause(); sBlast.pause();
                if(!isBetted) { mainBtn.innerText = "PLACE BET"; mainBtn.className = "action-btn btn-bet"; }
                else { mainBtn.innerText = "BET PLACED"; mainBtn.className = "action-btn btn-lock"; }
                
            } else if(gameState === "FLYING") {
                flightStart = d.startTime;
                if(audioReady) { sFly.currentTime = 0; sFly.play().catch(()=>{}); }
                if(isBetted && !isCashed) { mainBtn.innerText = "CASH OUT"; mainBtn.className = "action-btn btn-cashout"; }
                else { mainBtn.innerText = "WAIT NEXT"; mainBtn.className = "action-btn btn-lock"; }

            } else if(gameState === "CRASHED") {
                crashPoint = d.crashMultiplier; sFly.pause();
                if(audioReady) { sBlast.currentTime = 0; sBlast.play().catch(()=>{}); }
                if(isBetted && !isCashed) { mainBtn.innerText = "LOST"; isBetted = false; }
                else { mainBtn.innerText = "CRASHED"; }
                mainBtn.className = "action-btn btn-lock";
            }
            lastState = gameState;
        }
    });

    function handleAction() {
        if(!phone) return alert("Login First!");
        if(gameState === "WAITING" && !isBetted) {
            if(selectedBet > totalBal) return alert("Low Balance!");
            let nDep = depBal, nWin = winBal, rem = selectedBet;
            if(nDep >= rem) nDep -= rem; else { rem -= nDep; nDep = 0; nWin -= rem; }
            db.ref('users/'+phone).update({ balance: nDep, winning_balance: nWin }).then(() => {
                isBetted = true;
                db.ref('current_bets/'+phone).set({ amount: selectedBet });
            });
        } else if(gameState === "FLYING" && isBetted && !isCashed) {
            isCashed = true;
            let winAmt = (selectedBet * currMult).toFixed(2);
            db.ref('users/'+phone).update({ winning_balance: firebase.database.ServerValue.increment(parseFloat(winAmt)) }).then(() => {
                const pop = document.getElementById('win-popup');
                pop.innerText = "WON: ₹" + winAmt; pop.style.display = "block";
                isBetted = false;
            });
        }
    }

    // --- 5. CANVAS RENDER ENGINE ---
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let cw, ch;
    function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = canvas.parentElement.clientHeight; }
    window.onresize = resize; resize();

    function draw() {
        ctx.clearRect(0,0,cw,ch);
        if(gameState === "WAITING") {
            let left = Math.max(0, (waitEnd - Date.now())/1000);
            statusLabel.innerText = "STARTING IN: " + left.toFixed(1) + "s";
            statusLabel.style.color = "#fff";
            multLabel.innerText = "1.00x"; multLabel.style.color = "#fff";
        } else if(gameState === "FLYING") {
            statusLabel.innerText = "ROCKET IS FLYING!";
            statusLabel.style.color = var(--neon);
            let elapsed = Date.now() - flightStart;
            currMult = Math.pow(Math.E, 0.00006 * elapsed);
            multLabel.innerText = currMult.toFixed(2) + "x";
            multLabel.style.color = (currMult > 2) ? "#ffd700" : "#00ff88";
            renderRocket(elapsed);
        } else {
            statusLabel.innerText = "FLEW AWAY!";
            statusLabel.style.color = "#ff3333";
            multLabel.innerText = crashPoint.toFixed(2) + "x"; multLabel.style.color = "#ff3333";
            renderRocket(Math.log(crashPoint)/0.00006);
        }
        requestAnimationFrame(draw);
    }

    function renderRocket(elapsed) {
        let sec = elapsed / 1000;
        let maxS = Math.max(5, sec * 1.3);
        let maxM = Math.max(2, currMult * 1.3);
        
        // Grid
        ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
        for(let x=50; x<cw; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x, ch-50); ctx.stroke(); }
        for(let y=ch-50; y>0; y-=50) { ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(cw, y); ctx.stroke(); }

        let xPos = 50 + (sec/maxS)*(cw-100);
        let yPos = (ch-50) - ((currMult-1)/(maxM-1))*(ch-150);

        // Path
        ctx.beginPath(); ctx.lineWidth = 6; ctx.strokeStyle = (gameState === "CRASHED") ? "#ff3333" : "#00ff88";
        ctx.moveTo(50, ch-50); ctx.quadraticCurveTo(50 + (xPos-50)*0.5, ch-50, xPos, yPos); ctx.stroke();

        ctx.font = "45px Arial";
        if(gameState === "CRASHED") ctx.fillText("💥", xPos-22, yPos+15);
        else ctx.fillText("🚀", xPos-22, yPos+15);
    }
    draw();

    // --- 6. MASTER SERVER LOGIC (PROFIT ENGINE) ---
    let isMaster = false;
    setInterval(() => {
        if(isMaster) return;
        db.ref('game_loop/hb').once('value', s => {
            if(Date.now() - (s.val() || 0) > 12000) { isMaster = true; runServer(); }
        });
    }, 4000);

    async function runServer() {
        if(!isMaster) return;
        db.ref('game_loop/hb').set(Date.now());

        // 1. Waiting
        db.ref('game_loop').update({ state: "WAITING", waitEndTime: Date.now() + 10000 });
        db.ref('current_bets').remove();
        await new Promise(r => setTimeout(r, 10000));

        // 2. Logic (Least Amount Wins)
        let totalBets = 0;
        const betSnap = await db.ref('current_bets').get();
        if(betSnap.exists()) Object.values(betSnap.val()).forEach(b => totalBets += b.amount);

        let targetCrash = 1.00;
        const adminControl = await db.ref('admin_control/next_crash').get();
        
        if(adminControl.exists() && adminControl.val() > 0) {
            targetCrash = adminControl.val();
            db.ref('admin_control/next_crash').set(0);
        } else {
            // Profit System: High bets = Early crash
            if(totalBets > 3000) targetCrash = 1.01 + Math.random() * 0.49;
            else targetCrash = 1.20 + Math.pow(Math.random(), 2) * 10; 
        }

        // 3. Flying
        let flightDuration = Math.log(targetCrash) / 0.00006;
        db.ref('game_loop').update({ state: "FLYING", startTime: Date.now() });
        await new Promise(r => setTimeout(r, flightDuration));

        // 4. Result
        db.ref('game_loop').update({ state: "CRASHED", crashMultiplier: targetCrash });
        await new Promise(r => setTimeout(r, 4000));
        runServer();
    }
</script>
</body>
</html>
