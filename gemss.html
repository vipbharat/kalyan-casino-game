<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Tiger Kalyan Casino</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a0b3a; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(circle at center, #2b1c55 0%, #1a0b3a 100%);
        }

        #rotate-message { display: none; color: white; font-size: 24px; font-weight: bold; text-align: center; flex-direction: column; align-items: center; gap: 15px; }

        /* Main Board Container */
        .board {
            display: flex; flex-direction: column; gap: 1vh; width: 96vw; height: 76vh; 
            background: rgba(43, 28, 85, 0.8); padding: 1vw; border-radius: 2vh; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.7); border: 2px solid #5a419c; margin-top: 1vh;
        }

        /* =========================================
           1. TOP ACTION AREA (VIDEOS & CARDS)
           ========================================= */
        .top-action-area {
            display: flex; justify-content: space-between; align-items: flex-end; 
            height: 25vh; position: relative; padding: 0 2vw;
        }

        /* Character Videos/Images */
        .char-media {
            height: 120%; /* Thoda bada taaki box se bahar nikalta hua feel aaye */
            max-width: 30vw; object-fit: contain; pointer-events: none;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            z-index: 5;
        }
        .dragon-media { transform: scaleX(1); } /* Flip if needed using scaleX(-1) */
        
        /* Cards & Timer in Center */
        .center-stage {
            display: flex; flex-direction: column; align-items: center; gap: 1vh; z-index: 10;
        }
        
        .cards-container {
            display: flex; align-items: center; gap: 2vw; position: relative;
        }
        
        .card-slot {
            width: 7vh; height: 10vh; background: url('https://upload.wikimedia.org/wikipedia/commons/d/d4/Card_back_01.svg') no-repeat center center / cover;
            border-radius: 0.5vh; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            border: 2px solid #ffd700;
        }

        .top-vs-logo {
            width: 6vh; height: auto; position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%); z-index: 2; filter: drop-shadow(0 0 10px red);
        }

        .timer-badge {
            background: linear-gradient(90deg, #5b1a1a, #8b2a2a);
            border: 1px solid #ffd700; color: #ffd700; padding: 0.5vh 2vw;
            border-radius: 2vh; font-size: 2vh; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* =========================================
           2. MIDDLE HISTORY BAR
           ========================================= */
        .history-bar {
            height: 4vh; background: rgba(0, 0, 0, 0.3); border-radius: 1vh;
            display: flex; align-items: center; padding: 0 1vw; gap: 0.5vw; overflow: hidden;
            border: 1px solid #4a317c;
        }
        .hist-dot {
            width: 2.5vh; height: 2.5vh; border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-size: 1.5vh; font-weight: bold; color: white;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.4);
        }
        .h-t { background: #e68900; } /* Tiger */
        .h-d { background: #2a52be; } /* Dragon */
        .h-tie { background: #43a047; font-size: 1vh; } /* Tie */

        /* =========================================
           3. BOTTOM BETTING COLUMNS (CLEAN)
           ========================================= */
        .betting-columns { display: flex; gap: 1vw; flex: 1; }

        .bet-box {
            flex: 1; border-radius: 1.5vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; overflow: hidden; cursor: pointer;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
        }
        .bet-box:active { transform: scale(0.98); }

        .title { font-size: 4.5vh; font-weight: 900; z-index: 3; position: relative; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .ratio { font-size: 2.5vh; font-weight: bold; z-index: 3; position: relative; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

        /* Very faint background watermark for empty boxes */
        .watermark { position: absolute; opacity: 0.15; width: 60%; height: auto; z-index: 0; pointer-events: none; }

        .dragon { background: linear-gradient(180deg, #6c7cdb 0%, #4a549c 100%); }
        .dragon .title { color: #dbe2ff; } .dragon .ratio { color: #a4afff; }

        .tiger { background: linear-gradient(180deg, #db9c4c 0%, #9c6c2a 100%); }
        .tiger .title { color: #ffecb3; } .tiger .ratio { color: #ffcc66; }

        .tie-box {
            background: linear-gradient(180deg, #6db370 0%, #437c46 100%); flex: 1; border-radius: 1.5vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .tie-box .title { color: #c8e6c9; } .tie-box .ratio { color: #a5d6a7; }
        .tie-col { flex: 1; display: flex; flex-direction: column; gap: 1vh; }

        /* Stats in Tie Col */
        .stats-bar { background: #110825; border-radius: 1vh; display: flex; justify-content: space-around; align-items: center; height: 5vh; border: 1px solid #332168; }
        .rate { color: #7b88aa; font-size: 2vh; }

        /* =========================================
           CHIP TRAY & ANIMATIONS
           ========================================= */
        .chip-tray {
            width: 96vw; height: 16vh; background: rgba(0, 0, 0, 0.5); border-radius: 2vh; margin-top: 1vh;
            display: flex; justify-content: center; align-items: center; gap: 1.5vw; padding: 1vh 2vw;
            overflow-x: auto; box-shadow: inset 0 5px 10px rgba(0,0,0,0.6); border: 1px solid #3c2a6b;
        }
        .chip { height: 10vh; width: auto; cursor: pointer; transition: all 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        .chip.active { transform: translateY(-1.5vh) scale(1.1); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)); }

        .placed-chip {
            position: absolute; width: 4.5vh; z-index: 10; pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); animation: dropChip 0.3s ease-out forwards;
        }
        @keyframes dropChip { 0% { transform: scale(1.5) translateY(-5vh); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

        /* Banners */
        .banner-overlay { position: absolute; top: 30vh; left: 50%; transform: translateX(-50%) scale(0); width: 60vw; z-index: 100; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
        .banner-overlay.show { transform: translateX(-50%) scale(1); opacity: 1; }

        @media screen and (orientation: portrait) {
            .board, .chip-tray { display: none; } #rotate-message { display: flex; }
        }
    </style>
</head>
<body>

    <div id="rotate-message">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><path d="M12 18h.01"></path><path d="M20 12A8 8 0 1 0 4 12"></path><path d="M22 12l-2 2-2-2"></path></svg>
        Please Rotate Your Device
    </div>

    <div class="board">
        
        <div class="top-action-area">
            <img src="image.png" class="char-media dragon-media" alt="Dragon">

            <div class="center-stage">
                <div class="cards-container">
                    <div class="card-slot"></div>
                    <img src="VS.png" class="top-vs-logo" alt="VS">
                    <div class="card-slot"></div>
                </div>
                <div class="timer-badge">Start Betting 15</div>
            </div>

            <video class="char-media" autoplay loop muted playsinline>
                <source src="1000053910.mp4" type="video/mp4">
            </video>
        </div>

        <div class="history-bar">
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-d">D</div>
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-t">T</div>
            <div class="hist-dot h-d">D</div>
            <div class="hist-dot h-d">D</div>
            <div class="hist-dot h-tie">Tie</div>
            <div class="hist-dot h-tie">Tie</div>
        </div>

        <div class="betting-columns">
            <div class="bet-box dragon" onclick="placeBet('Dragon', this)">
                <div class="title">Dragon</div><div class="ratio">1:1</div>
            </div>
            
            <div class="tie-col">
                <div class="tie-box" onclick="placeBet('Tie', this)"><div class="title">Tie</div><div class="ratio">8:1</div></div>
                <div class="stats-bar">
                    <div class="rate"><span style="color: #ff9800;">⭐</span> Rate:75%</div>
                </div>
            </div>

            <div class="bet-box tiger" onclick="placeBet('Tiger', this)">
                <div class="title">Tiger</div><div class="ratio">1:1</div>
            </div>
        </div>

    </div>

    <div class="chip-tray">
        <img src="10_0.png" class="chip active" data-value="10" onclick="selectChip(this)">
        <img src="50_0.png" class="chip" data-value="50" onclick="selectChip(this)">
        <img src="100_0.png" class="chip" data-value="100" onclick="selectChip(this)">
        <img src="500_0.png" class="chip" data-value="500" onclick="selectChip(this)">
        <img src="1000_0.png" class="chip" data-value="1000" onclick="selectChip(this)">
        <img src="5000_1.png" class="chip" data-value="5000" onclick="selectChip(this)">
        <img src="10000_0.png" class="chip" data-value="10000" onclick="selectChip(this)">
    </div>

    <img src="image_1.png" id="placeBetBanner" class="banner-overlay">
    <img src="image_2.png" id="stopBetBanner" class="banner-overlay">

    <script>
        let canBet = true; 
        let currentBetAmount = 10;
        let activeChipSrc = "10_0.png"; 

        function selectChip(element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentBetAmount = parseInt(element.getAttribute('data-value'));
            activeChipSrc = element.src; 
        }

        function placeBet(betType, targetBox) {
            if (!canBet) return; 

            let placedChip = document.createElement('img');
            placedChip.src = activeChipSrc;
            placedChip.className = 'placed-chip';

            let randomX = Math.floor(Math.random() * 60) - 30; 
            let randomY = Math.floor(Math.random() * 40) - 20;

            placedChip.style.left = `calc(50% + ${randomX}px - 2.25vh)`;
            placedChip.style.top = `calc(50% + ${randomY}px - 2.25vh)`; 

            targetBox.appendChild(placedChip);
        }
    </script>
</body>
</html>
