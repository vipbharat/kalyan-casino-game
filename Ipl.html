<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Mega League - VIP Server Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffd700; --green: #00ff88; --locked: rgba(30, 30, 30, 0.9); }
        body { background: #05050a; color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; text-align: center; overflow-x: hidden; padding-bottom: 50px;}

        /* 💰 HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #1a1a2e, #000); padding: 10px 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .wallet-box { background: rgba(0,255,136,0.1); border: 1px solid var(--green); padding: 5px 10px; border-radius: 5px; color: var(--green); font-size: 14px; font-weight: bold; }
        
        /* ⏱️ SERVER TIMER DISPLAY */
        .timer-container { margin: 15px 0; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .timer-wrap { width: 70px; height: 70px; border: 4px solid var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--green); background: #000; position: relative; }
        #timer { font-size: 20px; font-weight: 900; }
        .match-badge { background: var(--gold); color: #000; padding: 2px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-bottom: 5px; }

        /* 🛡️ SECURITY OVERLAY (For Closed Hours) */
        #game-closed-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }

        /* ⚔️ BETTING GRID */
        .sec-title { font-size: 12px; color: var(--gold); border-bottom: 1px dashed #333; padding-bottom: 3px; margin: 15px 10px 5px; text-align: left; text-transform: uppercase; }
        .bet-grid { display: flex; justify-content: space-around; gap: 10px; padding: 0 10px; }
        .team-bet-card { flex: 1; padding: 15px 5px; border-radius: 10px; border: 2px solid #4da6ff; background: rgba(0,0,0,0.5); cursor: pointer; position: relative; transition: 0.2s; }
        .team-bet-card:active { transform: scale(0.95); }
        .pool-badge { font-size: 9px; color: #aaa; margin-bottom: 5px; }
        
        .champion-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 0 10px; }
        .champ-box { background: #111; border: 1px solid #333; border-radius: 6px; padding: 8px 2px; font-size: 9px; cursor: pointer; }
        .champ-box img { width: 30px; height: 30px; margin-bottom: 3px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: #111; border: 2px solid var(--gold); border-radius: 10px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 15px; position: relative;}
    </style>
</head>
<body>

<div id="game-closed-overlay">
    <i class="fa-solid fa-server fa-spin" style="font-size:50px; color:var(--gold); margin-bottom:20px;"></i>
    <h2 id="closed-msg" style="color:var(--gold);">CONNECTING TO SERVER...</h2>
    <p style="color:#888; font-size:12px;">All players are synced to Firebase Central Time</p>
</div>

<div class="header">
    <div style="text-align: left;" onclick="window.location.href='index.html'">
        <span style="font-size:14px; font-weight:bold;"><i class="fa-solid fa-arrow-left"></i> IPL MEGA VIP</span>
    </div>
    <div class="wallet-box"><i class="fa-solid fa-wallet"></i> ₹<span id="wallet-bal">0.00</span></div>
</div>

<div class="timer-container">
    <div style="text-align: center;">
        <div class="match-badge">MATCH #<span id="match-no-display">1</span> / 74</div>
        <div class="timer-wrap"><div id="timer">00:00</div></div>
    </div>
</div>

<div class="sec-title">⚔️ LIVE BATTLE (1.95X)</div>
<div class="bet-grid">
    <div class="team-bet-card" onclick="placeBet('L1', 'Live Match', t1Name)">
        <div class="pool-badge">SERVER POOL: ₹<span id="pool-l1">0</span></div>
        <img id="logo-t1" src="" style="width:40px; margin-bottom:5px;">
        <div id="name-t1" style="font-weight:bold;">T1</div>
        <div style="font-size:11px; color:var(--gold)">MY BET: ₹<span id="mybet-l1">0</span></div>
    </div>
    <div class="team-bet-card" style="border-color:#ff4d4d" onclick="placeBet('L2', 'Live Match', t2Name)">
        <div class="pool-badge">SERVER POOL: ₹<span id="pool-l2">0</span></div>
        <img id="logo-t2" src="" style="width:40px; margin-bottom:5px;">
        <div id="name-t2" style="font-weight:bold;">T2</div>
        <div style="font-size:11px; color:var(--gold)">MY BET: ₹<span id="mybet-l2">0</span></div>
    </div>
</div>

<div class="sec-title">👑 CHAMPION RACE (6X)</div>
<div class="champion-grid" id="champ-grid"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let t1Name = "T1", t2Name = "T2", walletBal = 0, serverOffset = 0;
    const userPhone = localStorage.getItem('userPhone');
    const teamLogos = { "CSK": "assets/IPL_team_5001.png", "DC": "assets/IPL_team_5002.png", "GT": "assets/IPL_team_5003.png", "KKR": "assets/IPL_team_5004.png", "LSG": "assets/IPL_team_5005.png", "MI": "assets/IPL_team_5006.png", "PBKS": "assets/IPL_team_5007.png", "RR": "assets/IPL_team_5008.png", "RCB": "assets/IPL_team_5009.png", "SRH": "assets/IPL_team_5010.png" };
    const teams = ["CSK", "DC", "GT", "KKR", "LSG", "MI", "PBKS", "RR", "RCB", "SRH"];

    // 1. CHAMPION GRID GENERATE
    let gridHTML = "";
    teams.forEach(t => {
        gridHTML += `<div class="champ-box" onclick="placeBet('C-${t}', 'Champion', '${t}')"><img src="${teamLogos[t]}"><br>${t}<br><span id="mybet-c-${t}" style="color:var(--gold)">₹0</span></div>`;
    });
    document.getElementById('champ-grid').innerHTML = gridHTML;

    // 2. SERVER TIME SYNC
    db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

    function checkGameStatus() {
        let serverTime = new Date().getTime() + serverOffset;
        let now = new Date(serverTime);
        
        let start = new Date(serverTime); start.setHours(10, 0, 0, 0); 
        let end = new Date(start.getTime() + 703 * 60000); // 10:00 AM + 11h 43m

        if (serverTime < start.getTime()) {
            showOverlay("GAME OPENS AT 10:00 AM 🕙");
            window.isLocked = true;
        } else if (serverTime > end.getTime()) {
            showOverlay("MATCHES FINISHED! ✅<br>Starts tomorrow at 10:00 AM");
            window.isLocked = true;
        } else {
            document.getElementById('game-closed-overlay').style.display = 'none';
            window.isLocked = false;
            
            // Auto Match & Timer Calculation
            let elapsedMs = serverTime - start.getTime();
            let currentMatch = Math.floor(elapsedMs / (9.5 * 60000)) + 1;
            document.getElementById('match-no-display').innerText = currentMatch;

            let roundMs = elapsedMs % (9.5 * 60000);
            let remainMs = (9.5 * 60000) - roundMs;
            let m = Math.floor(remainMs / 60000).toString().padStart(2, '0');
            let s = Math.floor((remainMs % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('timer').innerText = m + ":" + s;
        }
    }
    setInterval(checkGameStatus, 1000);

    function showOverlay(msg) {
        document.getElementById('closed-msg').innerHTML = msg;
        document.getElementById('game-closed-overlay').style.display = 'flex';
    }

    // 3. FIREBASE DATA SYNC (Same for Everyone)
    db.ref('Game/IPL_Match/Today').on('value', snap => {
        let d = snap.val(); if(!d) return;
        t1Name = d.Team1; t2Name = d.Team2;
        document.getElementById('name-t1').innerText = t1Name;
        document.getElementById('name-t2').innerText = t2Name;
        document.getElementById('logo-t1').src = teamLogos[t1Name];
        document.getElementById('logo-t2').src = teamLogos[t2Name];
    });

    // 4. WALLET SYNC
    if(userPhone) {
        db.ref('users/' + userPhone).on('value', snap => {
            let d = snap.val() || {};
            walletBal = (parseFloat(d.balance||0) + parseFloat(d.winning_balance||0) + parseFloat(d.bonus_balance||0));
            document.getElementById('wallet-bal').innerText = walletBal.toFixed(2);
        });
    }

    // 5. BETTING LOGIC
    function placeBet(id, type, team) {
        if(window.isLocked) return alert("Game is Closed!");
        if(walletBal < 100) return alert("Insufficient Balance!");

        db.ref('users/' + userPhone + '/balance').transaction(current => {
            return (current || 0) - 100;
        }).then(() => {
            let betId = id.toLowerCase();
            let span = document.getElementById('mybet-' + betId);
            if(span) span.innerText = "₹" + (parseInt(span.innerText.replace('₹','')) + 100);
            alert(`✅ Bet Placed on ${team}!`);
        });
    }
</script>
</body>
</html>
