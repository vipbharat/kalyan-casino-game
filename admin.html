<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KALYAN PRO - SECURE ADMIN</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; --card: #141414; --green: #00ff88; --red: #ff3333; --blue: #00e5ff; }
        body { background: var(--bg); color: #fff; font-family: 'Arial', sans-serif; margin: 0; padding-bottom: 70px; }
        
        .top-header { background: #000; padding: 15px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(255,215,0,0.2); }
        .top-header h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 2px; font-weight: 900; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 2px solid var(--gold); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); }
        .nav-item { text-align: center; color: #666; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.3s; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); transform: translateY(-3px); }

        .page { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card-title { color: var(--gold); font-size: 14px; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px dashed #444; padding-bottom: 8px; font-weight: 900; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #1a1a1a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; }
        .stat-box h3 { margin: 0; font-size: 24px; color: var(--green); }
        .stat-box p { margin: 5px 0 0 0; font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; }

        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #444; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 14px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 13px; text-transform: uppercase; color: #fff; transition: 0.2s; }
        .btn-add { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .btn-cut { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
        .btn-save { background: linear-gradient(45deg, #f12711, #f5af19); width: 100%; margin-top: 10px; }

        .req-card { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .req-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .req-amt { font-size: 22px; font-weight: 900; color: var(--gold); }
        .req-details p { margin: 4px 0; font-size: 12px; color: #ccc; }
        .req-details span { color: #fff; font-weight: bold; }

        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #222; color: var(--gold); padding: 10px; text-align: left; }
        td { padding: 12px 10px; border-bottom: 1px solid #222; background: #0a0a0a; }
        .view-btn { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .switch { position: relative; display: inline-block; width: 45px; height: 22px; float: right; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--green); }
        input:checked + .slider:before { transform: translateX(23px); }
        .qr-preview-img { width: 150px; height: 150px; object-fit: contain; background: #fff; border-radius: 8px; display: none; margin: 10px auto; border: 2px solid var(--gold); }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: #111; margin: 15% auto; padding: 20px; border: 2px solid var(--gold); border-radius: 15px; width: 90%; max-width: 450px; position: relative; max-height: 75vh; overflow-y: auto; }
        .close-btn { color: #fff; position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .detail-row span:first-child { color: #888; }
        .detail-row span:last-child { color: #fff; font-weight: bold; }
        .history-item { font-size: 11px; padding: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; background: #1a1a1a; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="login-box" style="text-align:center; padding:20px; background:var(--bg); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box;">
        <i class="fa-solid fa-user-secret" style="font-size: 60px; color: var(--gold); margin-bottom: 20px;"></i>
        <h2 style="color: var(--gold); margin-top: 0; font-weight: 900; letter-spacing: 2px;">GOD MODE</h2>
        <p style="color: #888; font-size: 12px; margin-bottom: 30px; text-transform: uppercase;">100% Secure Login</p>
        
        <input type="password" id="adminInput" placeholder="Enter Firebase Password" style="padding:15px; font-weight:bold; text-align: center; width: 100%; max-width: 320px; font-size: 18px; background:#111; border:1px solid #444; color:#fff; border-radius:6px; outline:none; margin-bottom:15px;">
        <button onclick="loginAsAdmin()" class="btn btn-save" style="width: 100%; max-width: 320px; padding: 15px; font-size: 16px; background:linear-gradient(135deg, #00ff88, #00a05a); color:#000;">UNLOCK PANEL</button>
    </div>

    <div id="main-content" style="display: none;">
        <div class="top-header">
            <h1><i class="fa-solid fa-crown"></i> VIP ADMIN DASHBOARD</h1>
            <button onclick="logoutAdmin()" style="position:absolute; right:15px; top:15px; background:transparent; border:none; color:var(--red); font-size:18px; cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>
        </div>

        <div id="page-home" class="page active">
            <div class="stats-grid">
                <div class="stat-box"><h3 id="stat-users">0</h3><p>Total Players</p></div>
                <div class="stat-box"><h3 id="stat-withdraws" style="color:var(--gold)">0</h3><p>Pending Payouts</p></div>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fa-solid fa-wallet"></i> QUICK WALLET CONTROL</h2>
                <label>Player Mobile Number</label>
                <input type="number" id="quick-phone" placeholder="Enter 10 digit number">
                <label>Amount (₹)</label>
                <input type="number" id="quick-amount" placeholder="Enter Amount">
                
                <div class="btn-grid">
                    <button class="btn btn-add" onclick="quickWallet('add')"><i class="fa-solid fa-plus"></i> ADD FUNDS</button>
                    <button class="btn btn-cut" onclick="quickWallet('cut')"><i class="fa-solid fa-minus"></i> CUT FUNDS</button>
                </div>
            </div>
        </div>

        <div id="page-setup" class="page">
            <div class="card">
                <h2 class="card-title"><i class="fa-solid fa-gears"></i> GLOBAL APP SETUP</h2>
                <div style="margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                    <span style="font-size: 13px; color: #fff; font-weight: bold;">Show QR Code in App?</span>
                    <label class="switch"><input type="checkbox" id="qrStatus"><span class="slider"></span></label>
                </div>
                <label>Admin UPI ID</label><input type="text" id="upiId" placeholder="example@ybl">
                <label>Upload QR Code (Deposit)</label>
                <input type="file" id="qrFile" accept="image/*" style="padding: 8px; background: #222;" onchange="previewAndConvert(this)">
                <div style="text-align: center;"><img id="qrPreview" class="qr-preview-img"></div>
                <label>WhatsApp Link</label><input type="text" id="waNo" placeholder="https://wa.me/91...">
                <label>Telegram Link</label><input type="text" id="tgLink" placeholder="https://t.me/...">
                <label>Daily Banner Notice (Marquee)</label><input type="text" id="notif" placeholder="Enter scrolling welcome message...">
                <button class="btn btn-save" onclick="saveAll()"><i class="fa-solid fa-floppy-disk"></i> SAVE SETTINGS</button>
            </div>
        </div>

        <div id="page-payout" class="page">
            <div class="card">
                <h2 class="card-title"><i class="fa-solid fa-money-bill-transfer"></i> PENDING PAYOUTS</h2>
                <div id="new-req-list"><p style="text-align: center; color: #888;"><i class="fa-solid fa-spinner fa-spin"></i> Loading requests...</p></div>
            </div>
        </div>

        <div id="page-users" class="page">
            <div class="card">
                <h2 class="card-title"><i class="fa-solid fa-users"></i> PLAYERS LIST</h2>
                <div class="search-box"><input type="number" id="searchPhone" placeholder="Search Mobile No..." onkeyup="filterUsers()"></div>
                <div style="max-height: 60vh; overflow-y: auto;">
                    <table id="p-table">
                        <thead><tr><th>Mobile No.</th><th>Total Balance</th><th>Action</th></tr></thead>
                        <tbody id="p-list-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="playerModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()"><i class="fa-solid fa-circle-xmark"></i></span>
                <h3 style="color: var(--gold); border-bottom: 1px dashed #444; padding-bottom: 10px; margin-top: 0;"><i class="fa-solid fa-user-circle"></i> PLAYER FULL DATA</h3>
                <div id="modal-body" style="margin-top: 15px;">
                    </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('page-home', this)"><i class="fa-solid fa-house"></i>Home</div>
            <div class="nav-item" onclick="switchTab('page-payout', this)"><i class="fa-solid fa-hand-holding-dollar"></i>Payout</div>
            <div class="nav-item" onclick="switchTab('page-users', this)"><i class="fa-solid fa-users"></i>Users</div>
            <div class="nav-item" onclick="switchTab('page-setup', this)"><i class="fa-solid fa-gear"></i>Setup</div>
        </div>
    </div>

<script>
    // 🔥 1. FIREBASE CONFIGURATION 🔥
    const firebaseConfig = { 
        apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", 
        authDomain: "kalyan-casino.firebaseapp.com", 
        databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", 
        projectId: "kalyan-casino" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // 🔥 2. LOGIN AUTHENTICATION 🔥
    firebase.auth().onAuthStateChanged(user => {
        if (user && user.email === "vipbharat6@gmail.com") {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadAdminData();
        } else {
            document.getElementById('login-box').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    function loginAsAdmin() {
        const password = document.getElementById('adminInput').value;
        if(!password) return alert("Please enter password!");
        firebase.auth().signInWithEmailAndPassword("vipbharat6@gmail.com", password)
        .catch(error => alert("❌ Login Failed! Password Galat Hai."));
    }

    function logoutAdmin() {
        if(confirm("Logout karna chahte hain?")) {
            firebase.auth().signOut().then(() => location.reload());
        }
    }

    // 🔥 3. LOAD DATA (REAL-TIME SYNC) 🔥
    function loadAdminData() {
        // Load All Users & Calculate Total Balance
        db.ref('users').on('value', snap => {
            document.getElementById('stat-users').innerText = snap.numChildren();
            const body = document.getElementById('p-list-body');
            body.innerHTML = "";
            snap.forEach(p => {
                const data = p.val();
                const depBal = parseFloat(data.balance || 0);
                const winBal = parseFloat(data.winning_balance || 0);
                const bonBal = parseFloat(data.bonus_balance || 0);
                const totalBal = (depBal + winBal + bonBal).toFixed(2);

                body.innerHTML += `
                <tr class="player-row" data-phone="${p.key}">
                    <td style="color:var(--gold); font-weight:bold;">${p.key}</td>
                    <td style="color:var(--green); font-weight:bold;">₹${totalBal}</td>
                    <td><button class="view-btn" onclick="openModal('${p.key}')">VIEW DATA</button></td>
                </tr>`;
            });
        });

        // Load Pending Withdrawals
        db.ref('withdraw_requests').orderByChild('status').equalTo('Pending').on('value', snap => {
            const list = document.getElementById('new-req-list');
            list.innerHTML = "";
            document.getElementById('stat-withdraws').innerText = snap.numChildren();
            if(!snap.exists()) { list.innerHTML = "<p style='text-align:center; color:#555;'>No Pending Requests</p>"; return; }
            
            snap.forEach(child => {
                const d = child.val();
                list.innerHTML += `
                <div class="req-card">
                    <div class="req-header">
                        <div><div style="color:#aaa; font-size:11px;">Player ID</div><div style="font-weight:bold; font-size:14px; color:#fff;">${d.id}</div></div>
                        <div class="req-amt">₹${d.amount}</div>
                    </div>
                    <div class="req-details">
                        <p>Account No: <span>${d.accNo || 'N/A'}</span></p>
                        <p>IFSC Code: <span style="text-transform:uppercase;">${d.ifsc || 'N/A'}</span></p>
                        <p>UPI ID: <span>${d.upi || 'N/A'}</span></p>
                    </div>
                    <div class="btn-grid" style="margin-top: 15px;">
                        <button class="btn btn-add" onclick="handleWithdraw('${child.key}', '${d.id}', 'Approve', ${d.amount})">APPROVE</button>
                        <button class="btn btn-cut" onclick="handleWithdraw('${child.key}', '${d.id}', 'Reject', ${d.amount})">REJECT</button>
                    </div>
                </div>`;
            });
        });

        // Load Global Settings
        db.ref('admin_settings').once('value', snap => {
            const d = snap.val(); if(!d) return;
            if(d.payment) {
                document.getElementById('upiId').value = d.payment.upi_id || ""; 
                document.getElementById('qrStatus').checked = d.payment.show_qr || false;
                if(d.payment.qr_url) { document.getElementById('qrPreview').src = d.payment.qr_url; document.getElementById('qrPreview').style.display = "block"; }
            }
            if(d.support) { document.getElementById('waNo').value = d.support.whatsapp || ""; document.getElementById('tgLink').value = d.support.telegram || ""; }
            if(d.notification) { document.getElementById('notif').value = d.notification || ""; }
        });
    }

    // 🔥 4. PLAYER FULL DATA MODAL (WITH HISTORY) 🔥
    window.openModal = function(phone) {
        document.getElementById('playerModal').style.display = 'block';
        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = "<p style='text-align:center;'><i class='fa-solid fa-spinner fa-spin'></i> Loading Full Data...</p>";
        
        db.ref(`users/${phone}`).once('value', snap => {
            const p = snap.val();
            if(!p) { modalBody.innerHTML = "<p>Data not found!</p>"; return; }

            const depBal = parseFloat(p.balance || 0);
            const winBal = parseFloat(p.winning_balance || 0);
            const bonBal = parseFloat(p.bonus_balance || 0);
            const totalBal = (depBal + winBal + bonBal).toFixed(2);

            db.ref(`user_history/${phone}`).limitToLast(15).once('value', histSnap => {
                let historyHtml = "";
                
                if (histSnap.exists()) {
                    let historyArray = [];
                    histSnap.forEach(child => { historyArray.push(child.val()); });
                    // Reverse array to show latest first
                    historyArray.reverse().forEach(h => {
                        let color = h.status === 'Success' || h.status === 'Approved' ? 'var(--green)' : (h.status === 'Pending' ? 'var(--gold)' : 'var(--red)');
                        historyHtml += `
                            <div class="history-item">
                                <div><strong>${h.type || 'Transaction'}</strong><br><span style="color:#888; font-size:9px;">${h.date || 'N/A'}</span></div>
                                <div style="text-align:right;"><strong style="font-size:13px;">₹${h.amount}</strong><br><span style="color:${color};">${h.status}</span></div>
                            </div>
                        `;
                    });
                } else {
                    historyHtml = "<p style='text-align:center; color:#666; font-size:12px;'>No transactions found.</p>";
                }

                modalBody.innerHTML = `
                    <div class="detail-row"><span>Mobile Number:</span><span style="font-size:15px; color:var(--gold);">${phone}</span></div>
                    <div class="detail-row"><span>TOTAL BALANCE:</span><span style="color:var(--green); font-size:18px; font-weight:900;">₹${totalBal}</span></div>
                    <div class="detail-row"><span>├ Deposit:</span><span style="color:#fff;">₹${depBal.toFixed(2)}</span></div>
                    <div class="detail-row"><span>├ Winning:</span><span style="color:var(--gold);">₹${winBal.toFixed(2)}</span></div>
                    <div class="detail-row"><span>└ Bonus:</span><span style="color:var(--blue);">₹${bonBal.toFixed(2)}</span></div>
                    <div class="detail-row"><span>Password:</span><span style="color:#fff;">${p.password || 'Hidden'}</span></div>
                    <div class="detail-row"><span>Account Status:</span><span style="color:${p.isBanned ? 'var(--red)' : 'var(--green)'}">${p.isBanned ? 'BANNED 🚫' : 'ACTIVE ✅'}</span></div>
                    
                    <button class="btn btn-cut" style="width:100%; margin: 10px 0; background:${p.isBanned ? '#3498db' : 'linear-gradient(45deg, #ff416c, #ff4b2b)'}" onclick="toggleBan('${phone}', ${p.isBanned})">
                        ${p.isBanned ? '<i class="fa-solid fa-unlock"></i> UNBAN PLAYER' : '<i class="fa-solid fa-lock"></i> BAN PLAYER'}
                    </button>

                    <h4 style="margin: 20px 0 10px; color:var(--gold); border-bottom:1px dashed #333; padding-bottom:5px;"><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</h4>
                    <div style="max-height: 200px; overflow-y: auto; padding-right: 5px;">
                        ${historyHtml}
                    </div>
                `;
            });
        });
    }
    window.closeModal = function() { document.getElementById('playerModal').style.display = 'none'; }

    // 🔥 5. BAN / UNBAN LOGIC 🔥
    window.toggleBan = function(phone, isBanned) {
        if(confirm(`Kya aap is player ko ${isBanned ? 'UNBAN' : 'BAN'} karna chahte hain?`)){
            db.ref(`users/${phone}/isBanned`).set(!isBanned).then(() => { 
                alert("Account Status Updated!"); openModal(phone); 
            });
        }
    }

    // 🔥 6. WITHDRAWAL APPROVE/REJECT 🔥
    window.handleWithdraw = function(reqKey, phone, action, amount) {
        if(confirm(`Kya aap is request ko ${action} karna chahte hain?`)) {
            let newStatus = action === 'Approve' ? 'Success' : 'Rejected';
            
            if(action === 'Approve') {
                db.ref(`users/${phone}`).once('value', snap => {
                    let d = snap.val();
                    let winBal = parseFloat(d.winning_balance || 0);
                    let depBal = parseFloat(d.balance || 0);
                    
                    if (winBal + depBal < amount) {
                        alert("⚠️ Error: Player ke account me paryapt balance nahi hai!");
                        return;
                    }

                    let nWin = winBal, nDep = depBal, rem = amount;
                    if(nWin >= rem) { 
                        nWin -= rem; 
                    } else { 
                        rem -= nWin; 
                        nWin = 0; 
                        nDep -= rem; 
                    }

                    db.ref(`users/${phone}`).update({ balance: nDep, winning_balance: nWin }).then(() => {
                        db.ref(`withdraw_requests/${reqKey}`).update({ status: newStatus });
                        db.ref(`user_history/${phone}/${reqKey}`).update({ status: newStatus });
                        alert("✅ Withdraw Approved! Paisa player ke account se CUT gaya hai.");
                    });
                });
            } else {
                db.ref(`withdraw_requests/${reqKey}`).update({ status: newStatus });
                db.ref(`user_history/${phone}/${reqKey}`).update({ status: newStatus });
                alert("❌ Withdraw Rejected! Player ka paisa waisa hi safe hai.");
            }
        }
    }

    // 🔥 7. QUICK WALLET ADD / CUT (100% FIXED) 🔥
    window.quickWallet = function(type) {
        const phone = document.getElementById('quick-phone').value.trim();
        const amt = parseFloat(document.getElementById('quick-amount').value);
        
        if(!phone || isNaN(amt) || amt <= 0) {
            return alert("Bhai, kripya sahi Mobile Number aur Amount daalein!");
        }
        
        db.ref(`users/${phone}`).once('value', snap => {
            if(!snap.exists()){ 
                return alert("❌ Player nahi mila! Number dobara check karein."); 
            }
            
            let d = snap.val();
            let depBal = parseFloat(d.balance || 0);
            let winBal = parseFloat(d.winning_balance || 0);
            let bonBal = parseFloat(d.bonus_balance || 0);
            let totalBal = depBal + winBal + bonBal;
            
            if (type === 'cut') {
                if (amt > totalBal) {
                    return alert(`⚠️ Error: Player ke total wallet mein sirf ₹${totalBal.toFixed(2)} hain! Aap isse zyada cut nahi kar sakte.`);
                }
                
                let rem = amt;
                
                // Pehle Deposit se cut karo
                if (depBal >= rem) { 
                    depBal -= rem; 
                    rem = 0; 
                } else { 
                    rem -= depBal; 
                    depBal = 0; 
                }
                
                // Phir Winning se cut karo
                if (rem > 0) {
                    if (winBal >= rem) { 
                        winBal -= rem; 
                        rem = 0; 
                    } else { 
                        rem -= winBal; 
                        winBal = 0; 
                    }
                }
                
                // Last mein Bonus se cut karo
                if (rem > 0) {
                    bonBal -= rem; 
                }

                db.ref(`users/${phone}`).update({ 
                    balance: depBal, 
                    winning_balance: winBal, 
                    bonus_balance: bonBal 
                }).then(() => {
                    alert(`✅ ₹${amt} Successfully DEDUCTED from ${phone}`);
                    logAdminHistory(phone, amt, 'Admin Deduction');
                }).catch(e => alert("Error: " + e.message));

            } else if (type === 'add') {
                db.ref(`users/${phone}/balance`).set(depBal + amt).then(() => {
                    alert(`✅ ₹${amt} Successfully ADDED to ${phone}`);
                    logAdminHistory(phone, amt, 'Admin Bonus');
                }).catch(e => alert("Error: " + e.message));
            }
        });
    }

    function logAdminHistory(phone, amt, typeName) {
        document.getElementById('quick-phone').value = ""; 
        document.getElementById('quick-amount').value = "";
        let histRef = db.ref(`user_history/${phone}`).push();
        histRef.set({ 
            amount: amt, 
            date: new Date().toLocaleString(), 
            status: "Success", 
            type: typeName 
        });
    }

    // 🔥 8. OTHER UTILITIES 🔥
    window.filterUsers = function() {
        let input = document.getElementById('searchPhone').value.trim();
        document.querySelectorAll('.player-row').forEach(row => { 
            row.style.display = row.dataset.phone.includes(input) ? "" : "none"; 
        });
    }

    function switchTab(pageId, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        element.classList.add('active');
    }

    window.previewAndConvert = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) { 
                document.getElementById('qrPreview').src = e.target.result; 
                document.getElementById('qrPreview').style.display = 'block'; 
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    window.saveAll = function() {
        db.ref('admin_settings').update({
            "payment/upi_id": document.getElementById('upiId').value,
            "payment/show_qr": document.getElementById('qrStatus').checked,
            "payment/qr_url": document.getElementById('qrPreview').src,
            "support/whatsapp": document.getElementById('waNo').value,
            "support/telegram": document.getElementById('tgLink').value,
            "notification": document.getElementById('notif').value
        }).then(() => alert("✅ App Settings Saved Successfully!"));
    }
</script>
</body>
</html>
