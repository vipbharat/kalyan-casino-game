<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kalyan Pro - Strict Profit & Wallet Sync</title>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:'Oswald',sans-serif}
html,body{background:#05000a;display:flex;justify-content:center;align-items:center;width:100%;height:100%;position:fixed;top:0;left:0;overflow:hidden;touch-action:none;}
.a{width:100%;max-width:450px;height:100%;background:linear-gradient(180deg,#1b0a2b 0%,#0d0415 50%,#000 100%);display:flex;flex-direction:column}
.h{display:flex;justify-content:space-between;align-items:center;padding:8px 15px;background:#000;border-bottom:2px solid #d4af37}
.hl{color:#ffd700;font-size:20px;font-weight:bold}
.st{background:#222;border:1px solid #ffd700;color:#ffd700;padding:4px 12px;border-radius:5px;font-size:14px;cursor:pointer}
.pb{background:linear-gradient(90deg,#330000,#4d0000,#330000);padding:8px 5px;border-bottom:2px solid #ff3333;display:flex;justify-content:space-around;align-items:center}
.pi{display:flex;flex-direction:column;align-items:center;width:24%;background:rgba(0,0,0,0.6);border:1px solid #ffcc00;border-radius:5px;padding:4px;text-align:center}
.pv{color:#00ff00;font-size:14px;font-weight:bold;margin-top:2px;text-shadow:0 0 5px #00ff00;white-space:nowrap}
.pt{color:#ffcc00;font-size:10px;font-family:Arial}
.ps{font-size:9px;color:#aaa;margin-top:-2px;margin-bottom:2px}
.sm{flex:1;display:flex;justify-content:center;align-items:center;padding:10px;background:radial-gradient(circle,#331a00,#000)}
.bc{display:flex;gap:6px;width:100%;height:310px;position:relative}
.rb{flex:5;display:flex;gap:4px;padding:5px;background:#1a0a00;border:3px solid #b8860b;border-radius:8px;height:100%;overflow:hidden}
.mb{flex:1.2;padding:5px;background:#2a0033;border:3px solid #ff00ff;border-radius:8px;height:100%;overflow:hidden;box-shadow:inset 0 0 20px #000}
.rw,.mw{width:100%;height:100%;overflow:hidden;position:relative;background:#221100;border-radius:4px;display:block}
.rs{display:block;width:100%}
.sy{height:75px;width:100%;display:flex;justify-content:center;align-items:center;border:1px solid #4a2e00;border-radius:4px;background:linear-gradient(135deg,#222,#444);flex-shrink:0}
.sw{font-size:18px;color:#fff;text-shadow:0 0 10px #ff00ff;font-weight:bold}
.s7{font-size:40px;color:#ff3333;text-shadow:2px 2px 0 #fff}
.se{font-size:35px;filter:drop-shadow(0 4px 5px rgba(0,0,0,0.8))}
.msy{height:75px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid #990099;border-radius:4px;background:radial-gradient(circle,#4d004d,#000);color:#ffdf00;flex-shrink:0}
.mt{font-size:24px;font-weight:bold}
.hm{color:#ff0000;text-shadow:0 0 10px #ff0000,0 0 20px #ffdf00;font-size:28px!important}
@keyframes nb{0%{box-shadow:0 0 10px #0f0,inset 0 0 15px #0f0;border-color:#0f0;background:linear-gradient(135deg,#030,#01a00);transform:scale(1)}50%{box-shadow:0 0 25px #0f0,inset 0 0 30px #0f0;border-color:#fff;background:linear-gradient(135deg,#04d00,#030);transform:scale(1.05)}100%{box-shadow:0 0 10px #0f0,inset 0 0 15px #0f0;border-color:#0f0;background:linear-gradient(135deg,#030,#01a00);transform:scale(1)}}
.wg{animation:nb 0.6s infinite;z-index:20;border-width:3px}
.db{background:#0a0300;padding:10px 15px 25px 15px;display:flex;flex-direction:column;gap:10px;border-top:3px solid #d4af37;z-index:50}
.wd{text-align:center;color:#b8860b;font-size:18px;font-weight:bold}
.wa{color:#fff;font-size:32px;text-shadow:0 0 15px #fff}
.cr{display:flex;justify-content:space-around;align-items:center}
.bctrl{display:flex;align-items:center;gap:15px;background:#111;padding:8px 15px;border-radius:25px;border:1px solid #444}
.bb{width:35px;height:35px;border-radius:50%;background:#333;color:#fff;border:none;font-size:22px;font-weight:bold;cursor:pointer}
.sb{width:85px;height:85px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffdf00 0%,#b8860b 50%,#5a3a15 100%);border:4px solid #fff;box-shadow:0 5px 15px rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;cursor:pointer;transition:0.1s}
.sb:active{transform:scale(0.95)}
.si{width:30px;height:30px;border:4px solid #331a00;border-radius:50%;border-top-color:transparent;border-right-color:transparent;transform:rotate(-45deg);position:relative}
.si::before{content:'';position:absolute;top:-8px;left:-6px;border:6px solid transparent;border-bottom-color:#331a00;transform:rotate(45deg)}
.fc{position:absolute;width:30px;height:30px;background:radial-gradient(circle,#ffd700,#b8860b);border-radius:50%;border:2px solid #fff;z-index:100;transition:all 0.8s cubic-bezier(0.25,0.1,0.25,1);pointer-events:none;display:flex;justify-content:center;align-items:center;font-size:14px}
</style>
</head>
<body>
<div class="a" id="app">
 <div class="h"><div class="hl">VIP ENGINE PRO</div><button class="st" id="stb" onclick="toggleMusic()">MUSIC: ON</button></div>
 <div class="pb">
  <div class="pi" style="border-color:#f0f"><div class="pt">WILD MATCH</div><div class="ps">3 to 5 Match</div><div class="pv" id="pw">Up to ₹500</div></div>
  <div class="pi"><div class="pt">CROWN MATCH</div><div class="ps">3 to 5 Match</div><div class="pv" id="pc">Up to ₹250</div></div>
  <div class="pi"><div class="pt">777 MATCH</div><div class="ps">3 to 5 Match</div><div class="pv" id="p7">Up to ₹50</div></div>
  <div class="pi"><div class="pt">FRUITS MATCH</div><div class="ps">Any Fruit</div><div class="pv" style="color:#f9f">SMALL WIN</div></div>
 </div>
 <div class="sm"><div class="bc"><div class="rb" id="mr"></div><div class="mb" id="ml"></div></div></div>
 <div class="db">
  <div class="wd">TOTAL WIN <br><span class="wa" id="wdp">₹ 0.00</span></div>
  <div class="cr">
   <div class="bctrl"><button class="bb" onclick="changeBet(-1)">-</button><span id="bd" style="color:#fff;width:50px;text-align:center;font-size:18px">₹10</span><button class="bb" onclick="changeBet(1)">+</button></div>
   <div class="sb" id="sb" onclick="startRolling()"><div class="si"></div></div>
   <div class="wb" id="wb" style="color:#0f0;font-size:20px;font-weight:700;text-align:center"><span style="color:#ccc;font-size:12px">Balance</span><br>₹<span id="pb">0.00</span></div>
  </div>
 </div>
</div>
<audio id="aB" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" loop></audio>
<audio id="aS" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
<audio id="aE" src="https://assets.mixkit.co/active_storage/sfx/134/134-preview.mp3"></audio>
<audio id="aW" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

<script>
    // ==========================================
    // 🔥 FIREBASE WALLET CONNECTION (STRICT) 🔥
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo",
        databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com",
        projectId: "kalyan-casino"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Exactly matches your Dashboard and Andar Bahar logic
    const phone = localStorage.getItem('userPhone') || localStorage.getItem('phone');
    
    let totalBal = 0, depBal = 0, winBal = 0, bonBal = 0;

    if (phone && phone !== "Guest" && phone !== "null") {
        db.ref('users/' + phone).on('value', snap => {
            let data = snap.val() || {};
            depBal = parseFloat(data.balance || 0);
            winBal = parseFloat(data.winning_balance || 0);
            bonBal = parseFloat(data.bonus_balance || 0);
            totalBal = Math.max(0, depBal + winBal + bonBal);
            document.getElementById('pb').innerText = totalBal.toFixed(2);
        });
    } else {
        document.getElementById('pb').innerText = "LOGIN!";
        document.getElementById('pb').style.color = "#ff0000";
    }

    // ==========================================
    // 💀 BRUTAL PROFIT LOGIC & MATH ENGINE 💀
    // ==========================================
    const betLevels = [10, 50, 100, 250, 500, 1000, 5000];
    let currentBetIndex = 0, betAmount = 10, isSpinning = false, musicEnabled = true;

    const S = {
        'W': '<div class="sw">WILD</div>', 'C': '<div class="se">👑</div>', '7': '<div class="s7">7</div>',
        'H': '<div class="se">🍒</div>', 'B': '<div class="se">🔔</div>', 'L': '<div class="se">🍋</div>', 'D': '<div class="se">💎</div>'
    };
    const K = Object.keys(S);
    
    // Payouts based on match count (3, 4, or 5)
    const P = {
        'W': {3: 5, 4: 10, 5: 25}, // Reduced payouts
        'C': {3: 2, 4: 5, 5: 10},
        '7': {3: 1, 4: 2, 5: 5},
        'DF': {3: 0.5, 4: 1, 5: 2}
    };

    // VISUAL MULTIPLIERS (To tease the player)
    const vM = ['0.5x', '1x', '2x', '<span class="hm">10x</span>', '<span class="hm">50x</span>', '<span class="hm">100x</span>'];
    
    // SAFE MULTIPLIERS (What they actually get if they win)
    const sM = [0.5, 1, 1.5, 2]; // Max multiplier is just 2x

    const sL = 40, sH = 75, oF = (sL - 4) * sH;

    // --- AUDIO ---
    function toggleMusic() {
        musicEnabled = !musicEnabled;
        let b = document.getElementById('stb'), a = document.getElementById('aB');
        if (!musicEnabled) { a.pause(); b.innerText = "MUSIC: OFF"; } 
        else { a.play().catch(()=>{}); b.innerText = "MUSIC: ON"; }
    }
    function pA(i) {
        if (!musicEnabled) return;
        try { let s = document.getElementById(i); s.currentTime = 0; s.play().catch(()=>{}); } catch(e) {}
    }

    // --- COINS ANIMATION ---
    function sC(amount) {
        let m = document.getElementById('app'), w = document.getElementById('wb').getBoundingClientRect(), r = m.getBoundingClientRect();
        for (let i = 0; i < 15; i++) {
            let c = document.createElement('div'); c.className = 'fc'; c.innerHTML = '🪙';
            c.style.left = (r.width / 2 - 15) + 'px'; c.style.top = '350px';
            m.appendChild(c);
            setTimeout(() => {
                c.style.left = (w.left - r.left + 30) + 'px'; c.style.top = (w.top - r.top + 15) + 'px';
                c.style.opacity = '0'; c.style.transform = 'scale(0.5)';
            }, i * 40);
            setTimeout(() => c.remove(), 1000);
        }
        setTimeout(() => {
            let x = document.getElementById('pb'); x.style.transform = 'scale(1.2)';
            setTimeout(() => x.style.transform = 'scale(1)', 300);
        }, 800);
    }

    function gS() { return K[Math.floor(Math.random() * K.length)]; }

    // --- INITIALIZE REELS ---
    function iB() {
        let mr = document.getElementById('mr'); mr.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            let rw = document.createElement('div'); rw.className = 'rw';
            let rs = document.createElement('div'); rs.className = 'rs'; rs.id = `s-${i}`;
            for (let j = 0; j < sL; j++) {
                let d = document.createElement('div'); d.className = 'sy'; d.innerHTML = S[gS()]; rs.appendChild(d);
            }
            rs.style.transform = 'translateY(0px)'; rw.appendChild(rs); mr.appendChild(rw);
        }
        let ml = document.getElementById('ml'); ml.innerHTML = '';
        let mw = document.createElement('div'); mw.className = 'mw';
        let ms = document.createElement('div'); ms.className = 'rs'; ms.id = 'ms';
        for (let j = 0; j < sL; j++) {
            let d = document.createElement('div'); d.className = 'msy';
            d.innerHTML = `<span class="mt">${vM[Math.floor(Math.random() * vM.length)]}</span>`; ms.appendChild(d);
        }
        ms.style.transform = 'translateY(0px)'; mw.appendChild(ms); ml.appendChild(mw);
    }
    document.addEventListener("DOMContentLoaded", iB);

    function changeBet(d) {
        if (isSpinning) return;
        currentBetIndex = Math.max(0, Math.min(betLevels.length - 1, currentBetIndex + d));
        betAmount = betLevels[currentBetIndex];
        document.getElementById('bd').innerText = "₹" + betAmount;
        document.getElementById('pw').innerText = "Up to ₹" + (betAmount * 50);
        document.getElementById('pc').innerText = "Up to ₹" + (betAmount * 25);
        document.getElementById('p7').innerText = "Up to ₹" + (betAmount * 5);
    }

    // --- SPIN ENGINE ---
    function startRolling() {
        if (isSpinning) return;
        
        if (!phone || phone === "Guest" || phone === "null") {
            alert("Wallet Not Connected! Please login."); return;
        }
        if (totalBal < betAmount) {
            alert("Insufficient Balance!"); return;
        }

        if (musicEnabled) document.getElementById('aB').play().catch(()=>{});
        isSpinning = true;
        
        // 💰 MONEY DEDUCTION LOGIC (Same as Andar Bahar) 💰
        let rem = betAmount, nDep = depBal, nWin = winBal;
        if (nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
        db.ref('users/' + phone).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        
        document.getElementById('wdp').innerText = "₹ 0.00";
        document.querySelectorAll('.wg').forEach(e => e.classList.remove('wg'));
        pA('aS');

        // 💀 80% LOSS RATE (Only 20% Win Chance) 💀
        let isWin = Math.random() < 0.20; 
        let matchSymbol = null, matchCount = 0, baseWin = 0, finalMulti = 1;

        if (isWin) {
            matchSymbol = gS();
            let c = Math.random();
            if (c > 0.95) matchCount = 5; // Very rare 5 match
            else if (c > 0.70) matchCount = 4;
            else matchCount = 3;

            let pt = P[matchSymbol] || P['DF'];
            baseWin = betAmount * pt[matchCount];
            finalMulti = sM[Math.floor(Math.random() * sM.length)]; // Safe multiplier
        }
        
        let finalWin = baseWin * finalMulti;

        for (let i = 0; i < 5; i++) {
            let s = document.getElementById(`s-${i}`);
            s.style.transition = 'none'; s.style.transform = `translateY(-${oF}px)`;
            let ch = s.children;
            for (let j = 0; j < ch.length; j++) ch[j].innerHTML = S[gS()];
            
            if (isWin) {
                if (i < matchCount) ch[1].innerHTML = S[matchSymbol];
                else {
                    let bs = gS(); while (bs === matchSymbol || bs === 'W') bs = gS();
                    ch[1].innerHTML = S[bs];
                }
            } else {
                // Ensure absolute loss on line 1
                if (i === 0) ch[1].innerHTML = S['7'];
                if (i === 1) ch[1].innerHTML = S['H'];
                if (i === 2) ch[1].innerHTML = S['D'];
            }
            
            void s.offsetWidth;
            setTimeout(() => {
                s.style.transition = 'transform 2s cubic-bezier(0.15,0.85,0.2,1.15)';
                s.style.transform = 'translateY(0px)';
                setTimeout(() => pA('aE'), 2000);
            }, i * 150);
        }

        let m = document.getElementById('ms');
        m.style.transition = 'none'; m.style.transform = `translateY(-${oF}px)`;
        let mC = m.children;
        for (let j = 0; j < mC.length; j++) {
            mC[j].innerHTML = `<span class="mt">${vM[Math.floor(Math.random() * vM.length)]}</span>`;
        }
        
        mC[1].innerHTML = `<span class="mt" style="color:#0f0">${finalMulti}x</span>`;
        let tz = '<span class="hm">' + (Math.random() > 0.5 ? '50x' : '100x') + '</span>';
        if (Math.random() > 0.5) mC[0].innerHTML = `<span class="mt">${tz}</span>`;
        else mC[2].innerHTML = `<span class="mt">${tz}</span>`;
        
        void m.offsetWidth;
        setTimeout(() => {
            m.style.transition = 'transform 2s cubic-bezier(0.15,0.85,0.2,1.15)';
            m.style.transform = 'translateY(0px)';
        }, 750);

        setTimeout(() => {
            if (isWin && finalWin > 0) {
                pA('aW');
                // 💰 MONEY ADDITION LOGIC 💰
                db.ref('users/' + phone + '/winning_balance').set(winBal + finalWin);
                sC(finalWin);
                
                for (let i = 0; i < matchCount; i++) document.getElementById(`s-${i}`).children[1].classList.add('wg');
                m.children[1].classList.add('wg');
                
                let w = document.getElementById('wdp');
                w.innerHTML = `₹ ${finalWin.toFixed(2)} <br><span style="font-size:14px;color:#f9f">(${matchCount} Match + ${finalMulti}x)</span>`;
                w.style.color = "#0f0";
                setTimeout(() => w.style.color = "#b8860b", 2500);
            }
            isSpinning = false;
        }, 2800);
    }
</script>
</body>
</html>
