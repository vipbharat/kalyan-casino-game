<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyan Pro - All History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 🔥 COMPACT CASINO UI STYLING 🔥 */
        body { background: #0b0b0b; color: #fff; font-family: 'Arial', sans-serif; margin: 0; padding: 10px 15px; }
        
        .header { display: flex; align-items: center; margin-bottom: 15px; padding-top: 5px; }
        .header i { font-size: 18px; color: gold; cursor: pointer; margin-right: 12px; }
        .header h2 { flex: 1; margin: 0; font-size: 15px; color: gold; text-transform: uppercase; font-weight: 900; }

        .history-container { margin-top: 5px; padding-bottom: 20px; }

        /* Sleek Transaction Row Styling */
        .card { 
            background: #111; 
            padding: 8px 12px; 
            border-radius: 6px; 
            margin-bottom: 6px; 
            border: 1px solid #1a1a1a;
            border-left: 3px solid #444; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* Status Border Colors */
        .card.pending { border-left-color: #ffc107; background: linear-gradient(90deg, rgba(255,193,7,0.05), transparent); } 
        .card.success { border-left-color: #28a745; background: linear-gradient(90deg, rgba(40,167,69,0.05), transparent); } 
        .card.rejected { border-left-color: #dc3545; background: linear-gradient(90deg, rgba(220,53,69,0.05), transparent); } 

        .info { flex: 1; }
        .info b { display: block; font-size: 12px; margin-bottom: 2px; color: #eee; letter-spacing: 0.3px; }
        .info small { color: #777; font-size: 9px; }
        
        /* Amount Styling */
        .amt { font-weight: 900; font-size: 14px; text-align: right; }
        .plus { color: #28a745; } 
        .minus { color: #dc3545; } 

        /* Mini Status Badge */
        .status-badge { 
            font-size: 8px; 
            display: inline-block; 
            margin-top: 3px; 
            text-transform: uppercase; 
            padding: 2px 5px; 
            border-radius: 3px; 
            background: rgba(255,255,255,0.03); 
            font-weight: bold; 
            letter-spacing: 0.5px; 
        }
        .pending .status-badge { color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); }
        .success .status-badge { color: #28a745; border: 1px solid rgba(40, 167, 69, 0.3); }
        .rejected .status-badge { color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); }

        .empty-msg { text-align: center; color: #666; margin-top: 40px; font-size: 12px; font-weight: bold; }
        .empty-msg i { font-size: 28px; color: #333; margin-bottom: 8px; }
        
        /* VIP Limit Notice */
        .limit-notice { text-align: center; font-size: 9px; color: #555; margin-top: 15px; font-style: italic; font-weight: bold; }

        /* 🔥 MASTER AUTO-LOCK (12 AM - 5 AM) 🔥 */
        #market-lock-overlay {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 99999;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: white; padding: 20px; backdrop-filter: blur(10px);
        }
        .lock-icon { font-size: 50px; color: #d32f2f; margin-bottom: 15px; text-shadow: 0 0 15px rgba(211, 47, 47, 0.5); }
        .lock-title { font-size: 20px; font-weight: 900; color: #ffd700; margin-bottom: 8px; }
        .lock-desc { font-size: 12px; color: #ccc; line-height: 1.5; max-width: 280px; }
        .lock-time { margin-top: 15px; background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 8px 15px; border-radius: 6px; font-weight: bold; color: #fff; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fa fa-arrow-left" onclick="window.history.back()"></i>
        <h2>Transaction History</h2>
    </div>

    <div id="history-content" class="history-container">
        <div class="empty-msg">
            <i class="fa-solid fa-spinner fa-spin"></i><br>Loading VIP History...
        </div>
    </div>
    
    <div id="limit-note" class="limit-notice" style="display: none;">Showing Latest 10 Transactions Only</div>

    <!-- 🔥 MARKET LOCK OVERLAY 🔥 -->
    <div id="market-lock-overlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">MARKET IS CLOSED</div>
        <div class="lock-desc">System maintenance aur server refresh ke liye game abhi band hai.</div>
        <div class="lock-time">Opening Time: 5:00 AM (Morning)</div>
        <button onclick="window.history.back()" style="margin-top: 20px; padding: 8px 16px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Go Back</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo",
            databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com",
            projectId: "kalyan-casino"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let userPhone = localStorage.getItem('userPhone') || localStorage.getItem('phone');
        
        let allDeposits = [];
        let allWithdrawals = [];

        // 🔥 MARKET AUTO-LOCK CHECKER 🔥
        function checkMarketTime() {
            let now = new Date();
            let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            let istTime = new Date(utc + (3600000 * 5.5)); 
            let hour = istTime.getHours();

            if (hour >= 0 && hour < 5) {
                document.getElementById('market-lock-overlay').style.display = 'flex';
                document.body.style.overflow = 'hidden'; 
            } else {
                document.getElementById('market-lock-overlay').style.display = 'none';
                document.body.style.overflow = 'auto'; 
            }
        }
        setInterval(checkMarketTime, 10000); 
        checkMarketTime(); 

        if(!userPhone) {
            document.getElementById('history-content').innerHTML = `
                <div class="empty-msg">
                    <i class="fa-solid fa-lock"></i><br>Please Login to view history.
                </div>`;
        } else {
            // Merge & Show Top 10
            function renderTop10History() {
                let combinedHistory = allDeposits.concat(allWithdrawals);
                
                // Safe Date Parsing
                combinedHistory.forEach(item => {
                    if (!item.sortTime) {
                        let parsed = Date.parse(item.date || item.time);
                        item.sortTime = isNaN(parsed) ? 0 : parsed;
                    }
                });

                combinedHistory.sort((a, b) => b.sortTime - a.sortTime);
                
                // Top 20 show kar rahe hain kyunki list choti aur compact ho gayi hai
                let top10 = combinedHistory.slice(0, 20);
                
                let html = "";
                
                if(top10.length === 0) {
                    document.getElementById('history-content').innerHTML = `
                        <div class="empty-msg">
                            <i class="fa-solid fa-receipt"></i><br>No Transactions Found
                        </div>`;
                    document.getElementById('limit-note').style.display = "none";
                    return;
                }

                document.getElementById('limit-note').style.display = "block";
                document.getElementById('limit-note').innerText = "Showing Latest Transactions Only";

                top10.forEach((d) => {
                    let type = (d.type || "Transaction").toUpperCase(); 
                    let rawStatus = (d.status || "Pending").toLowerCase();
                    let displayStatus = (d.status || "Pending").toUpperCase();
                    
                    let statusClass = "pending"; 
                    if(rawStatus.includes("success") || rawStatus.includes("approved") || rawStatus.includes("done")) {
                        statusClass = "success";
                    } else if(rawStatus.includes("rejected") || rawStatus.includes("failed") || rawStatus.includes("cancel")) {
                        statusClass = "rejected";
                    }

                    let isWithdraw = type.includes("WITHDRAW");
                    let colorClass = isWithdraw ? "minus" : "plus";
                    let sign = isWithdraw ? "-" : "+";
                    let displayTime = d.date || d.time || "Recent";

                    html += `
                    <div class="card ${statusClass}">
                        <div class="info">
                            <b>${isWithdraw ? '⬆️ ' + type : '⬇️ ' + type}</b>
                            <small><i class="fa-regular fa-calendar"></i> ${displayTime}</small><br>
                            <span class="status-badge">${displayStatus}</span>
                        </div>
                        <div class="amt ${colorClass}">${sign} ₹${d.amount}</div>
                    </div>`;
                });
                
                document.getElementById('history-content').innerHTML = html;
            }

            // Fetch DEPOSITS (Data Saver)
            db.ref('requests').orderByChild('phone').equalTo(userPhone).on('value', (snap) => {
                allDeposits = [];
                if(snap.exists()) {
                    snap.forEach((child) => {
                        let d = child.val();
                        allDeposits.push({
                            ...d,
                            type: "DEPOSIT",
                            sortTime: d.timestamp || Date.parse(d.time) || Date.now()
                        });
                    });
                }
                renderTop10History();
            });

            // Fetch WITHDRAWALS 
            db.ref(`user_history/${userPhone}`).on('value', (snap) => {
                allWithdrawals = [];
                if(snap.exists()) {
                    snap.forEach((child) => {
                        let w = child.val();
                        allWithdrawals.push({
                            ...w,
                            type: w.type || "WITHDRAWAL",
                            sortTime: w.timestamp || Date.parse(w.date || w.time) || Date.now()
                        });
                    });
                }
                renderTop10History();
            });
        }
    </script>
</body>
</html>
