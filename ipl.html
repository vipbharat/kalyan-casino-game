<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Mega League - VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffd700; --green: #00ff88; --locked: rgba(30, 30, 30, 0.85); }
        body { background: #05050a; color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; text-align: center; overflow-x: hidden; padding-bottom: 50px;}

        .header { background: linear-gradient(180deg, #1a1a2e, #000); padding: 10px; border-bottom: 2px solid var(--gold); }
        .timer-wrap { width: 70px; height: 70px; border: 3px solid var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 10px auto; }
        #timer { font-size: 20px; font-weight: 900; }

        /* 🃏 CARDS AREA */
        .cards-container { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
        .card-box { width: 65px; height: 95px; border-radius: 8px; position: relative; border: 1.5px solid var(--gold); overflow: hidden; }
        .card-back { background: #111; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back img { width: 40px; height: 40px; object-fit: contain; }

        /* 🔒 LOCK OVERLAY */
        .lock-overlay { position: absolute; inset: 0; background: var(--locked); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 10px; backdrop-filter: blur(2px); }
        .lock-overlay i { font-size: 24px; color: #ff3333; }
        .lock-text { font-size: 10px; color: #fff; margin-top: 5px; }

        .sec-title { font-size: 12px; color: var(--gold); border-bottom: 1px dashed #333; padding-bottom: 3px; margin: 15px 10px 8px; text-align: left; }
        .payout-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
        .tag-live { color: #00ff88; border: 1px solid #00ff88; background: rgba(0,255,136,0.1); }
        .tag-semi { color: #ff004c; border: 1px solid #ff004c; background: rgba(255,0,76,0.1); }

        /* ⚔️ GRIDS */
        .bet-section { position: relative; padding: 0 5px; }
        .bet-grid { display: flex; justify-content: space-around; gap: 8px; }
        .team-bet-card { flex: 1; padding: 10px 5px; border-radius: 10px; border: 2px solid #4da6ff; background: rgba(0,0,0,0.3); cursor: pointer; }
        .champion-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .champ-box { background: #111; border: 1px solid #333; border-radius: 6px; padding: 6px 2px; font-size: 9px; cursor: pointer; }
        .champ-box img { width: 25px; height: 25px; margin-bottom: 3px;}

        /* 🎯 COMBO BOX VIP DESIGN */
        .combo-box { background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid var(--gold); border-radius: 10px; padding: 12px; margin: 0 10px; }
        .combo-selects { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        select { background: #222; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 5px; font-weight: bold; outline: none; }
        .combo-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; font-weight: 900; cursor: pointer; color: #000; font-size: 11px; }
        .btn-semi { background: linear-gradient(90deg, #ff9900, #ffcc00); }
        .btn-final { background: linear-gradient(90deg, #00ff88, #00cc66); }
    </style>
</head>
<body>

<div class="header">
    <div style="color:var(--gold); font-size: 11px;">MATCH #<span id="match-no-display">1</span> / 74</div>
    <div style="font-size: 16px; font-weight: 900;">MEGA CHAMPIONS LEAGUE</div>
</div>

<div class="timer-wrap"><div id="timer">09:30</div></div>

<div class="sec-title">⚔️ LIVE MATCH (1.95X)</div>
<div class="cards-container">
    <div class="card-box"><div class="card-back"><img id="logo-t1" src="IPL_team_5001.png"><span id="name-t1">CSK</span></div></div>
    <div class="card-box"><div class="card-back"><img id="logo-t2" src="IPL_team_5006.png"><span id="name-t2">MI</span></div></div>
</div>
<div class="bet-grid">
    <div class="team-bet-card" onclick="placeBet('live-t1')">
        <div id="l-name-t1" style="font-size:16px; font-weight:bold;">CSK</div>
        <div class="payout-tag tag-live">100 ➔ 195</div>
        <div style="font-size:11px; color:var(--gold)">₹<span id="bet-l1">0</span></div>
    </div>
    <div class="team-bet-card" style="border-color:#ff4d4d" onclick="placeBet('live-t2')">
        <div id="l-name-t2" style="font-size:16px; font-weight:bold;">MI</div>
        <div class="payout-tag tag-live">100 ➔ 195</div>
        <div style="font-size:11px; color:var(--gold)">₹<span id="bet-l2">0</span></div>
    </div>
</div>

<div class="bet-section" id="combo-sec">
    <div class="lock-overlay" id="combo-lock"><i class="fa-solid fa-lock"></i><div class="lock-text">LOCKED</div></div>
    <div class="sec-title">🎯 COMBO BET (PREDICT 2 TEAMS)</div>
    <div class="combo-box">
        <div class="combo-selects">
            <select id="teamA"></select>
            <span style="color:var(--gold); font-weight:900;">&</span>
            <select id="teamB"></select>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="combo-btn btn-semi" onclick="placeCombo('SEMI', 30)">SEMI (30X)<br><span style="font-size:8px">100 ➔ 3000</span></button>
            <button class="combo-btn btn-final" onclick="placeCombo('FINAL', 18)">FINAL (18X)<br><span style="font-size:8px">100 ➔ 1800</span></button>
        </div>
        <div id="combo-msg" style="color:var(--green); font-size:10px; margin-top:6px; font-weight:bold;"></div>
    </div>
</div>

<div class="bet-section" id="semi-final-sec">
    <div class="lock-overlay" id="semi-lock"><i class="fa-solid fa-lock"></i><div class="lock-text">LOCKED</div></div>
    <div class="sec-title">🎖️ SINGLE SEMI-FINAL PREDICTION (9X)</div>
    <div class="bet-grid">
        <div class="team-bet-card" style="border-color:#ffcc00;" onclick="placeBet('semi-t1')">
            <div id="s-name-t1" style="font-weight:bold;">CSK</div>
            <div class="payout-tag tag-semi">100 ➔ 900</div>
            <div style="font-size:11px; color:var(--gold)">₹<span id="bet-s1">0</span></div>
        </div>
        <div class="team-bet-card" style="border-color:#ff4d4d;" onclick="placeBet('semi-t2')">
            <div id="s-name-t2" style="font-weight:bold;">MI</div>
            <div class="payout-tag tag-semi">100 ➔ 900</div>
            <div style="font-size:11px; color:var(--gold)">₹<span id="bet-s2">0</span></div>
        </div>
    </div>
</div>

<div class="bet-section" id="champion-sec">
    <div class="lock-overlay" id="champ-lock"><i class="fa-solid fa-lock"></i><div class="lock-text">LOCKED</div></div>
    <div class="sec-title">👑 TOURNAMENT CHAMPION (6X)</div>
    <div class="champion-grid" id="teams-grid"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const teams = ["CSK", "DC", "GT", "KKR", "LSG", "MI", "PBKS", "RR", "RCB", "SRH"];
    const teamLogos = { "CSK": "IPL_team_5001.png", "DC": "IPL_team_5002.png", "GT": "IPL_team_5003.png", "KKR": "IPL_team_5004.png", "LSG": "IPL_team_5005.png", "MI": "IPL_team_5006.png", "PBKS": "IPL_team_5007.png", "RR": "IPL_team_5008.png", "RCB": "IPL_team_5009.png", "SRH": "IPL_team_5010.png" };
    
    // Auto Generate Champion Grid (6X)
    let gridHTML = "", selectHTML = "";
    teams.forEach(t => {
        gridHTML += `<div class="champ-box" onclick="placeBet('champ-${t}')"><img src="${teamLogos[t]}"><div style="font-weight:bold;">${t}</div><div style="color:var(--green);">₹<span id="bet-c-${t}">0</span></div></div>`;
        selectHTML += `<option value="${t}">${t}</option>`;
    });
    document.getElementById('teams-grid').innerHTML = gridHTML;
    document.getElementById('teamA').innerHTML = selectHTML;
    document.getElementById('teamB').innerHTML = selectHTML;
    document.getElementById('teamB').selectedIndex = 1; // Default alag rakho

    // Dynamic Locks
    db.ref('Game/IPL_Match/Status').on('value', snap => {
        let matchNo = (snap.val() || {}).matchNo || 1;
        document.getElementById('match-no-display').innerText = matchNo;

        if(matchNo > 20) {
            document.getElementById('champ-lock').style.display = 'flex';
            document.getElementById('champion-sec').style.pointerEvents = 'none';
        }
        if(matchNo > 70) {
            document.getElementById('semi-lock').style.display = 'flex';
            document.getElementById('semi-final-sec').style.pointerEvents = 'none';
            document.getElementById('combo-lock').style.display = 'flex';
            document.getElementById('combo-sec').style.pointerEvents = 'none';
        }
    });

    db.ref('Game/IPL_Match/Today').on('value', snap => {
        let d = snap.val();
        if(d) {
            ['name-t1','l-name-t1','s-name-t1'].forEach(id => document.getElementById(id).innerText = d.Team1);
            ['name-t2','l-name-t2','s-name-t2'].forEach(id => document.getElementById(id).innerText = d.Team2);
            document.getElementById('logo-t1').src = teamLogos[d.Team1] || "";
            document.getElementById('logo-t2').src = teamLogos[d.Team2] || "";
        }
    });

    // 9:30 Timer
    let totalTime = 570;
    setInterval(() => {
        document.getElementById('timer').innerText = Math.floor(totalTime/60).toString().padStart(2,'0') + ":" + (totalTime%60).toString().padStart(2,'0');
        if(totalTime <= 0) totalTime = 570; else totalTime--;
    }, 1000);

    // Normal Bet
    function placeBet(id) { 
        let span = document.getElementById(id.replace('live-', 'bet-l').replace('semi-', 'bet-s').replace('champ-', 'bet-c-'));
        if(span) span.innerText = parseInt(span.innerText) + 100;
    }

    // Naya Combo Bet (2 Teams)
    function placeCombo(type, multi) {
        let t1 = document.getElementById('teamA').value;
        let t2 = document.getElementById('teamB').value;
        if(t1 === t2) { alert("⚠️ Dono teams alag-alag honi chahiye!"); return; }
        
        let msgBox = document.getElementById('combo-msg');
        msgBox.innerText = `✅ ₹100 Bet placed on ${t1} & ${t2} for ${type}!`;
        setTimeout(() => msgBox.innerText = "", 2000);
    }
</script>
</body>
</html>
