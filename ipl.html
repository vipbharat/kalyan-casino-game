<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Mega League - VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffd700; --green: #00ff88; --locked: rgba(30, 30, 30, 0.85); }
        body { background: #05050a; color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; text-align: center; overflow-x: hidden; padding-bottom: 50px;}

        /* 💰 HEADER & WALLET */
        .header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #1a1a2e, #000); padding: 10px 15px; border-bottom: 2px solid var(--gold); }
        .wallet-box { background: rgba(0,255,136,0.1); border: 1px solid var(--green); padding: 5px 10px; border-radius: 5px; color: var(--green); font-size: 14px; font-weight: bold; }
        .match-info { color: var(--gold); font-size: 11px; }

        /* 🎯 ACTION BUTTONS */
        .top-btns { display: flex; justify-content: space-around; padding: 10px; gap: 10px; }
        .action-btn { flex: 1; padding: 8px; background: #222; border: 1px solid var(--gold); color: var(--gold); border-radius: 5px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .action-btn:active { background: var(--gold); color: #000; }

        /* 🃏 CARDS & TIMER IN MIDDLE */
        .cards-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 10px 0; }
        .card-box { width: 65px; height: 95px; border-radius: 8px; border: 1.5px solid var(--gold); overflow: hidden; }
        .card-back { background: #111; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back img { width: 40px; height: 40px; object-fit: contain; }
        
        /* Chhota Timer Center mein */
        .timer-wrap { width: 55px; height: 55px; border: 3px solid var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--green); background: #000;}
        #timer { font-size: 14px; font-weight: 900; }

        /* 🔒 LOCK */
        .lock-overlay { position: absolute; inset: 0; background: var(--locked); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 10px; }
        .lock-overlay i { font-size: 20px; color: #ff3333; }

        /* ⚔️ GRIDS */
        .sec-title { font-size: 12px; color: var(--gold); border-bottom: 1px dashed #333; padding-bottom: 3px; margin: 10px 10px 5px; text-align: left; }
        .bet-section { position: relative; padding: 0 5px; }
        .bet-grid { display: flex; justify-content: space-around; gap: 8px; }
        .team-bet-card { flex: 1; padding: 8px 5px; border-radius: 8px; border: 2px solid #4da6ff; background: rgba(0,0,0,0.3); cursor: pointer; }
        
        .champion-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .champ-box { background: #111; border: 1px solid #333; border-radius: 6px; padding: 6px 2px; font-size: 9px; cursor: pointer; }
        .champ-box img { width: 25px; height: 25px; margin-bottom: 3px;}

        /* 🎯 COMBO */
        .combo-box { background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid var(--gold); border-radius: 8px; padding: 8px; margin: 0 10px; }
        .combo-selects { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        select { background: #222; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; font-size: 10px; }
        .combo-btn { padding: 5px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; font-size: 10px; }
        
        /* 📱 MODALS (POPUPS) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: #111; border: 2px solid var(--gold); border-radius: 10px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 15px; position: relative;}
        .close-btn { position: absolute; right: 10px; top: 10px; color: red; font-size: 20px; font-weight: bold; cursor: pointer; }
        .record-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 8px 0; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <div class="match-info">MATCH #<span id="match-no-display">1</span> / 74<br><span style="font-size: 14px; font-weight: bold; color:#fff;">IPL MEGA VIP</span></div>
    <div class="wallet-box"><i class="fa-solid fa-wallet"></i> ₹<span id="wallet-bal">10000</span></div>
</div>

<div class="top-btns">
    <button class="action-btn" onclick="openModal('points-modal')"><i class="fa-solid fa-trophy"></i> POINTS TABLE</button>
    <button class="action-btn" onclick="openModal('my-bets-modal')"><i class="fa-solid fa-receipt"></i> MY RECORD</button>
</div>

<div class="sec-title">⚔️ LIVE MATCH (1.95X)</div>
<div class="cards-container">
    <div class="card-box"><div class="card-back"><img id="logo-t1" src="Assets/IPL_team_5001.png"><span id="name-t1" style="font-size:11px;">CSK</span></div></div>
    
    <div class="timer-wrap"><div id="timer">09:30</div></div>
    
    <div class="card-box"><div class="card-back"><img id="logo-t2" src="Assets/IPL_team_5006.png"><span id="name-t2" style="font-size:11px;">MI</span></div></div>
</div>

<div class="bet-grid">
    <div class="team-bet-card" onclick="placeBet('live-t1', 'Live Match', document.getElementById('name-t1').innerText)">
        <div id="l-name-t1" style="font-weight:bold;">CSK</div>
        <div style="font-size:9px; color:var(--green)">100➔195</div>
        <div style="font-size:11px; color:var(--gold)">₹<span id="bet-l1">0</span></div>
    </div>
    <div class="team-bet-card" style="border-color:#ff4d4d" onclick="placeBet('live-t2', 'Live Match', document.getElementById('name-t2').innerText)">
        <div id="l-name-t2" style="font-weight:bold;">MI</div>
        <div style="font-size:9px; color:var(--green)">100➔195</div>
        <div style="font-size:11px; color:var(--gold)">₹<span id="bet-l2">0</span></div>
    </div>
</div>

<div class="bet-section" id="combo-sec">
    <div class="lock-overlay" id="combo-lock"><i class="fa-solid fa-lock"></i></div>
    <div class="sec-title">🎯 COMBO BET</div>
    <div class="combo-box">
        <div class="combo-selects">
            <select id="teamA"></select> & <select id="teamB"></select>
        </div>
        <div style="display: flex; gap: 5px; justify-content: center;">
            <button class="combo-btn btn-semi" onclick="placeCombo('Combo SEMI (30X)')">SEMI (30X)</button>
            <button class="combo-btn btn-final" onclick="placeCombo('Combo FINAL (18X)')">FINAL (18X)</button>
        </div>
    </div>
</div>

<div class="bet-section" id="semi-final-sec">
    <div class="lock-overlay" id="semi-lock"><i class="fa-solid fa-lock"></i></div>
    <div class="sec-title">🎖️ SEMI-FINAL (9X)</div>
    <div class="bet-grid">
        <div class="team-bet-card" style="border-color:#ffcc00;" onclick="placeBet('semi-t1', 'Semi-Final', document.getElementById('name-t1').innerText)">
            <div id="s-name-t1" style="font-weight:bold;">CSK</div>
            <div style="font-size:11px; color:var(--gold)">₹<span id="bet-s1">0</span></div>
        </div>
        <div class="team-bet-card" style="border-color:#ff4d4d;" onclick="placeBet('semi-t2', 'Semi-Final', document.getElementById('name-t2').innerText)">
            <div id="s-name-t2" style="font-weight:bold;">MI</div>
            <div style="font-size:11px; color:var(--gold)">₹<span id="bet-s2">0</span></div>
        </div>
    </div>
</div>

<div class="bet-section" id="champion-sec">
    <div class="lock-overlay" id="champ-lock"><i class="fa-solid fa-lock"></i></div>
    <div class="sec-title">👑 CHAMPION (6X)</div>
    <div class="champion-grid" id="teams-grid"></div>
</div>

<div class="modal" id="points-modal">
    <div class="modal-content">
        <div class="close-btn" onclick="closeModal('points-modal')">&times;</div>
        <h3 style="color:var(--gold); margin-top:0;">🏆 POINTS TABLE</h3>
        <div id="points-list">
            <div class="record-item"><span>1. CSK</span> <span style="color:var(--green)">14 Pts</span></div>
            <div class="record-item"><span>2. MI</span> <span style="color:var(--green)">12 Pts</span></div>
            <div class="record-item"><span>3. RCB</span> <span>8 Pts</span></div>
        </div>
    </div>
</div>

<div class="modal" id="my-bets-modal">
    <div class="modal-content">
        <div class="close-btn" onclick="closeModal('my-bets-modal')">&times;</div>
        <h3 style="color:var(--gold); margin-top:0;">📜 MY RECORD</h3>
        <div class="record-item" style="color:var(--gold); font-weight:bold;">
            <span>MATCH/TYPE</span> <span>TEAM</span> <span>AMOUNT</span>
        </div>
        <div id="my-bets-list">
            <div style="font-size: 11px; color: #888; text-align:center; padding:10px;">Koi bet nahi lagayi.</div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const teams = ["CSK", "DC", "GT", "KKR", "LSG", "MI", "PBKS", "RR", "RCB", "SRH"];
    const teamLogos = { "CSK": "Assets/IPL_team_5001.png", "DC": "Assets/IPL_team_5002.png", "GT": "Assets/IPL_team_5003.png", "KKR": "Assets/IPL_team_5004.png", "LSG": "Assets/IPL_team_5005.png", "MI": "Assets/IPL_team_5006.png", "PBKS": "Assets/IPL_team_5007.png", "RR": "Assets/IPL_team_5008.png", "RCB": "Assets/IPL_team_5009.png", "SRH": "Assets/IPL_team_5010.png" };
    
    let walletBal = 10000;
    let myBetsRecord = []; // History yahan save hogi

    // Auto Generate Grids
    let gridHTML = "", selectHTML = "";
    teams.forEach(t => {
        gridHTML += `<div class="champ-box" onclick="placeBet('champ-${t}', 'Champion', '${t}')"><img src="${teamLogos[t]}"><div style="font-weight:bold;">${t}</div><div style="color:var(--green);">₹<span id="bet-c-${t}">0</span></div></div>`;
        selectHTML += `<option value="${t}">${t}</option>`;
    });
    document.getElementById('teams-grid').innerHTML = gridHTML;
    document.getElementById('teamA').innerHTML = selectHTML;
    document.getElementById('teamB').innerHTML = selectHTML;
    document.getElementById('teamB').selectedIndex = 1;

    // Firebase Rules & Sync (Same as before)
    let rules = { champLock: 20, semiLock: 70 }; 
    db.ref('Game/IPL_Match/Rules').on('value', snap => { if(snap.exists()) rules = snap.val(); });

    db.ref('Game/IPL_Match/Status').on('value', snap => {
        let matchNo = (snap.val() || {}).matchNo || 1;
        document.getElementById('match-no-display').innerText = matchNo;
        if(matchNo > rules.champLock) { document.getElementById('champ-lock').style.display = 'flex'; }
        if(matchNo > rules.semiLock) { document.getElementById('semi-lock').style.display = 'flex'; document.getElementById('combo-lock').style.display = 'flex'; }
    });

    db.ref('Game/IPL_Match/Today').on('value', snap => {
        let d = snap.val();
        if(d) {
            ['name-t1','l-name-t1','s-name-t1'].forEach(id => document.getElementById(id).innerText = d.Team1);
            ['name-t2','l-name-t2','s-name-t2'].forEach(id => document.getElementById(id).innerText = d.Team2);
            document.getElementById('logo-t1').src = teamLogos[d.Team1] || "";
            document.getElementById('logo-t2').src = teamLogos[d.Team2] || "";
        }
    });

    // 9:30 Timer
    let totalTime = 570;
    setInterval(() => {
        document.getElementById('timer').innerText = Math.floor(totalTime/60).toString().padStart(2,'0') + ":" + (totalTime%60).toString().padStart(2,'0');
        if(totalTime <= 0) totalTime = 570; else totalTime--;
    }, 1000);

    // ================= BETTING LOGIC & HISTORY =================
    function updateWallet(amount) {
        if(walletBal < amount) { alert("⚠️ Insufficient Balance!"); return false; }
        walletBal -= amount;
        document.getElementById('wallet-bal').innerText = walletBal;
        return true;
    }

    function addRecord(type, team, amount) {
        myBetsRecord.unshift({ type: type, team: team, amt: amount }); // Naya record upar
        let listHTML = "";
        myBetsRecord.forEach(bet => {
            listHTML += `<div class="record-item">
                            <span style="color:#aaa">${bet.type}</span>
                            <span style="font-weight:bold">${bet.team}</span>
                            <span style="color:var(--green)">₹${bet.amt}</span>
                         </div>`;
        });
        document.getElementById('my-bets-list').innerHTML = listHTML;
    }

    function placeBet(id, betType, teamName) { 
        if(!updateWallet(100)) return; // Paise kaato
        let span = document.getElementById(id.replace('live-', 'bet-l').replace('semi-', 'bet-s').replace('champ-', 'bet-c-'));
        if(span) span.innerText = parseInt(span.innerText) + 100;
        addRecord(betType, teamName, 100); // Record mein daalo
    }

    function placeCombo(type) {
        let t1 = document.getElementById('teamA').value, t2 = document.getElementById('teamB').value;
        if(t1 === t2) return alert("⚠️ Dono teams alag-alag honi chahiye!");
        if(!updateWallet(100)) return; // Paise kaato
        addRecord(type, t1 + " & " + t2, 100); // Record mein daalo
        alert(`✅ ₹100 Bet placed on ${t1} & ${t2} for ${type}!`);
    }

    // Modal Control
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
