<html lang="hi">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        
        body { 
            background: #0a110a; 
            background-image: radial-gradient(circle at center, #112d14 0%, #050a05 100%);
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* INITIAL LOADER */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050a05; z-index: 100000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #ffd700; font-weight: 900; font-size: 22px; letter-spacing: 1px;
            transition: opacity 0.5s ease;
        }
        
        .reconnecting-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            color: white; font-weight: 900; font-size: 20px;
        }
        .spinner {
            width: 60px; height: 60px; border: 6px solid rgba(255,215,0,0.2); border-top: 6px solid #ffd700;
            border-radius: 50%; animation: spinLoader 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Headers */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 2px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.7); margin-top: 0; padding-top: 15px;}
        .back-btn { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 5px #000; cursor: pointer; padding-right: 10px;}
        .logo { font-size: 18px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); flex: 1;}
        .server-status { background: rgba(0,0,0,0.8); border: 1.5px solid #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 900; z-index: 100; transition: 0.3s;}
        .server-connected { border-color: #39ff14; color: #39ff14; box-shadow: 0 0 10px rgba(57,255,20,0.4); }
        .server-disconnected { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.4); }

        .sub-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);}
        .wallet-box { border: 1.5px solid #ffd700; color: #ffd700; padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 14px; background: rgba(255,215,0,0.1); box-shadow: 0 0 10px rgba(255,215,0,0.2);}
        
        .history-strip { width: 100%; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.6);}
        .h-tag { font-size: 10px; font-weight: 900; color: #ffd700; }
        .h-list { display: flex; gap: 4px; flex: 1; overflow: hidden; }
        .h-item { min-width: 28px; height: 28px; background: #111; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #ffd700; font-size: 16px; padding: 2px; }
        .h-item img { width: 100%; height: 100%; object-fit: contain; }

        /* 🔥 MAIN GAME BOARD (BADA TRACK - HEIGHT BADHAI) 🔥 */
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 8px; position: relative; }
        
        .game-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; width: 80%; max-width: 300px; display: none; pointer-events: none; }
        .game-alert img, .game-alert video { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); }
        
        .huge-timer { position: absolute; top: 0; left: 50%; transform: translate(-50%, -5%); font-size: 75px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 10px #000; z-index: 50; pointer-events: none; }
        
        .game-board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-template-rows: repeat(7, 1fr); 
            gap: 0px; 
            width: 98vw; 
            max-width: 480px; 
            /* ASPECT RATIO REMOVED - AB YE LAAAMBA KHICHEGA */
            height: 56vh; 
            min-height: 380px;
            border: 3px solid #ffd700; 
            border-radius: 12px; 
            padding: 0px; 
            position: relative; 
            background: #111520; 
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden; 
        }

        .track-item { 
            background: transparent; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.1s; 
            padding: 2px; 
            border: 0.5px solid rgba(255,215,0,0.15); 
            position: relative;
        }
        /* Image object-fit contain rakhega taaki image stretch na ho */
        .track-item img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.8)); }
        
        .track-item.active { 
            background: rgba(255, 215, 0, 0.5); 
            box-shadow: inset 0 0 20px #ffd700; 
            border: 1px solid #ffd700; 
            z-index: 10; 
        }

        .track-item.winning { 
            background: rgba(57, 255, 20, 0.6) !important; 
            box-shadow: 0 0 30px #39ff14, inset 0 0 20px #39ff14 !important; 
            border: 3px solid #39ff14 !important; 
            transform: scale(1.1); 
            z-index: 20;
            border-radius: 6px;
            animation: blinkWin 0.5s infinite alternate;
        }
        
        .center-bets { 
            grid-area: 2 / 2 / 7 / 7; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            padding: 8px; 
            background: rgba(0, 0, 0, 0.85); 
            border: 2px solid #ffd700; 
            border-radius: 10px;
            margin: 2px; 
        }
        
        .bet-btn { background: #222; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #555; position: relative; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.6);}
        .bet-btn:active { transform: scale(0.95); }
        
        .bet-btn.winning { 
            box-shadow: 0 0 35px #39ff14 !important; 
            border: 3px solid #39ff14 !important; 
            background: #003300 !important; 
            transform: scale(1.05);
            z-index: 15;
            animation: blinkWin 0.5s infinite alternate;
        }

        @keyframes blinkWin {
            from { box-shadow: 0 0 15px #39ff14; filter: brightness(1); }
            to { box-shadow: 0 0 40px #39ff14; filter: brightness(1.3); }
        }

        .btn-monkey { border-color: #8d6e63; background: linear-gradient(#4e342e, #111); }
        .btn-peacock { border-color: #00bcd4; background: linear-gradient(#006064, #111); }
        .btn-lion { border-color: #ffb300; background: linear-gradient(#e65100, #111); }
        .btn-shark { border-color: #ffd700; background: linear-gradient(#665100, #111); box-shadow: inset 0 0 15px rgba(255,215,0,0.3);}
        .btn-eagle { border-color: #e53935; background: linear-gradient(#b71c1c, #111); }
        .btn-parrot { border-color: #4caf50; background: linear-gradient(#1b5e20, #111); }
        .btn-rabbit { border-color: #ab47bc; background: linear-gradient(#4a148c, #111); }
        .btn-dove { border-color: #bdbdbd; background: linear-gradient(#424242, #111); }
        .btn-elephant { border-color: #9e9e9e; background: linear-gradient(#616161, #111); }

        .btn-icon-emoji { font-size: 35px; filter: drop-shadow(0 4px 4px #000); margin-bottom: 2px;}
        .btn-img { width: 50%; height: 50%; object-fit: contain; filter: drop-shadow(0 4px 4px #000); margin-bottom: 2px;}
        .btn-multi { border: 1px solid #ffd700; color: #ffd700; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 900; background: #000;}
        
        .pool-text { position: absolute; top: -6px; right: -6px; font-size: 10px; color: #000; font-weight: 900; background: #ffc107; padding: 2px 6px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); border: 1.5px solid #fff; z-index: 10;}
        .my-bet-tag { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; font-size: 10px; padding: 1px 8px; border-radius: 4px; font-weight: 900; display: none; z-index: 20; white-space: nowrap; box-shadow: 0 2px 4px #000;}

        /* Category Bets */
        .category-bets { display: flex; justify-content: space-between; gap: 10px; width: 96vw; max-width: 480px; padding: 0 10px; margin-bottom: 10px; margin-left: auto; margin-right: auto;}
        .cat-btn { flex: 1; height: 50px; border-radius: 8px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #555; transition: 0.1s; box-shadow: 0 4px 8px rgba(0,0,0,0.6);}
        .cat-btn:active { transform: scale(0.95); }
        .bg-beast { background: linear-gradient(145deg, #d32f2f, #660000); border-color: #ff5252; box-shadow: inset 0 0 15px rgba(255,82,82,0.3);}
        .bg-bird { background: linear-gradient(145deg, #1976d2, #002171); border-color: #448aff; box-shadow: inset 0 0 15px rgba(68,138,255,0.3);}
        .cat-title { font-size: 16px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 2px #000; margin-bottom: 2px; line-height: 1;}

        /* Chips Bottom */
        .footer-chips { padding: 10px 0; background: rgba(0,0,0,0.8); display: flex; justify-content: space-evenly; align-items: center; margin-bottom: env(safe-area-inset-bottom, 5px); border-top: 1px solid rgba(255,255,255,0.2);}
        .chip { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: white; cursor: pointer; border: 2.5px solid rgba(255,255,255,0.5); transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5);}
        .chip.selected { transform: translateY(-5px) scale(1.1); border-color: #fff; box-shadow: 0 0 20px #fff; }
        
        .c10 { background: #2196f3; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); } 
        .c50 { background: #9c27b0; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); } 
        .c100 { background: #4caf50; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); } 
        .c500 { background: #f44336; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); } 
        .c1k { background: #ffd700; color: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        .placed-chip { position: fixed; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid white; pointer-events: none; z-index: 100; font-size: 8px; font-weight: 900; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.8); }
        
        /* 🔥 FLYING CHIP ANIMATION CLASS 🔥 */
        .win-anim-chip { transition: all 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); z-index: 999 !important; }

        .toast-msg { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(220, 38, 38, 0.95); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 900; z-index: 9999; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: none; white-space: nowrap; font-size: 13px; text-align: center;}
    </style>
</head>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                let initLoader = document.getElementById('initial-loader');
                if(initLoader) {
                    initLoader.style.opacity = '0';
                    setTimeout(() => initLoader.style.display = 'none', 500); 
                }
            }, 5000); 
        });

        const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const currentUserId = localStorage.getItem('userPhone') || localStorage.getItem('phone');
        
        let userBalance = 0, depBal = 0, winBal = 0, bonBal = 0;
        let selectedChipVal = 10; let selectedChipColor = '#2196f3';
        let isBettingOpen = false, isSpinningLocal = false, liveBettingInterval;
        let myBets = { 'ANIMALS': 0, 'BIRDS': 0 };

        let alertStopTimeout, waitVideoTimeout;

        const beastsList = ['monkey', 'rabbit', 'lion', 'elephant'];
        const birdsList = ['peacock', 'eagle', 'parrot', 'dove'];

        const imgMap = {
            'monkey': 'assets/monkey.png.png',
            'rabbit': 'assets/rabbit.png.png',
            'lion': 'assets/lion.png.png',
            'elephant': 'assets/elephant.png.png',
            'peacock': 'assets/peacock.png.png',
            'eagle': 'assets/eagle.png.png',
            'parrot': 'assets/parrot.png.png',
            'dove': 'assets/dove.png.png'
        };

        const emojiMap = {
            'monkey': '🐒', 'rabbit': '🐇', 'peacock': '🦚', 'lion': '🦁',
            'eagle': '🦅', 'parrot': '🦜', 'elephant': '🐘', 'dove': '🕊️',
            'frog': '🐸', 'shark': '🦈'
        };

        const betData = [
            {id:'monkey', m:8, cls:'btn-monkey'}, {id:'rabbit', m:6, cls:'btn-rabbit'}, {id:'peacock', m:8, cls:'btn-peacock'}, 
            {id:'lion', m:12, cls:'btn-lion'}, {id:'shark', m:24, cls:'btn-shark', type:'emoji'}, 
            {id:'eagle', m:12, cls:'btn-eagle'}, 
            {id:'parrot', m:6, cls:'btn-parrot'}, {id:'elephant', m:8, cls:'btn-elephant'}, {id:'dove', m:8, cls:'btn-dove'}
        ];

        const betContainer = document.getElementById('bet-container');
        betData.forEach(item => {
            myBets[item.id] = 0;
            const div = document.createElement('div');
            div.className = `bet-btn ${item.cls}`; div.id = `btn-${item.id}`;
            div.onclick = (e) => placeBet(div, item.id, selectedChipVal, selectedChipColor, e);
            
            let iconHtml = item.type === 'emoji' ? `<div class="btn-icon-emoji">${emojiMap[item.id]}</div>` : `<img src="${imgMap[item.id]}" class="btn-img">`;

            div.innerHTML = `
                <div class="pool-text">₹<span id="total-${item.id}">0</span></div>
                ${iconHtml}
                <div class="btn-multi">${item.m}x</div>
                <div class="my-bet-tag" id="my-${item.id}">₹<span>0</span></div>
            `;
            betContainer.appendChild(div);
        });

        const trackSequence = [
            'eagle','eagle','eagle','frog','lion','lion','lion', 
            'rabbit','rabbit','monkey','monkey','monkey', 
            'elephant','elephant','parrot','shark','parrot','parrot','dove', 
            'dove','dove','peacock','peacock','peacock'
        ];
        
        let trackElements = [];
        const board = document.getElementById('board');
        
        for(let i=1; i<=7; i++) createTrackItem(trackSequence[trackElements.length], 1, i);
        for(let i=2; i<=6; i++) createTrackItem(trackSequence[trackElements.length], i, 7);
        for(let i=7; i>=1; i--) createTrackItem(trackSequence[trackElements.length], 7, i);
        for(let i=6; i>=2; i--) createTrackItem(trackSequence[trackElements.length], i, 1);

        function createTrackItem(id, row, col) {
            let div = document.createElement('div');
            div.className = 'track-item'; div.style.gridArea = `${row} / ${col}`; 
            
            if(id === 'frog') {
                div.innerHTML = `<span style="font-size: 26px">🐸</span><div style="position:absolute;font-size:8px;bottom:2px;background:red;color:white;padding:1px 4px;font-weight:900;border-radius:4px;">HOUSE</div>`;
            } else if(id === 'shark') {
                div.innerHTML = `<span style="font-size: 26px">🦈</span><div style="position:absolute;font-size:8px;bottom:2px;background:#ffd700;color:black;padding:1px 4px;font-weight:900;border-radius:4px;">24x</div>`;
            } else {
                div.innerHTML = `<img src="${imgMap[id]}" alt="${id}">`;
            }
            board.appendChild(div); trackElements.push(div);
        }

        db.ref('.info/connected').on('value', function(snap) {
            let sBox = document.getElementById('server-status');
            let overlay = document.getElementById('reconnect-screen');
            if (snap.val() === true) {
                sBox.innerHTML = '🟢 Connected';
                sBox.className = 'server-status server-connected';
                overlay.style.display = 'none'; 
            } else {
                sBox.innerHTML = '🔴 Offline';
                sBox.className = 'server-status server-disconnected';
                overlay.style.display = 'flex'; 
            }
        });

        let isAudioInit = false;
        function initAudio() { 
            if(!isAudioInit) {
                isAudioInit = true;
                let vid = document.getElementById('vid-wait');
                vid.muted = true;
                vid.play().catch(e=>{});
            }
        }
        function playSound(obj, vol) { try { if(!isAudioInit) return; let c = obj.cloneNode(); c.volume = vol; c.play().catch(e=>{}); } catch(e){} }

        function showToast(msg) {
            let t = document.getElementById('toastMsg'); t.innerHTML = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function updateHistory(winId) {
            if(!winId) return;
            const list = document.getElementById('history-list');
            const newItem = document.createElement('div');
            newItem.className = 'h-item'; 
            
            let normId = winId.toLowerCase().trim();
            if (normId === 'd24') normId = 'shark';

            if(normId === 'frog' || normId === 'shark') {
                 newItem.innerHTML = `<span style="font-size: 16px">${emojiMap[normId]}</span>`;
            } else if(imgMap[normId]) {
                 newItem.innerHTML = `<img src="${imgMap[normId]}">`;
            } else {
                 newItem.innerText = '?';
            }
            list.insertBefore(newItem, list.firstChild);
            if(list.children.length > 8) list.removeChild(list.lastChild); 
        }

        if (currentUserId) {
            db.ref(`users/${currentUserId}`).on('value', (s) => {
                const d = s.val() || {}; 
                depBal = parseFloat(d.balance||0); winBal = parseFloat(d.winning_balance||0); bonBal = parseFloat(d.bonus_balance||0);
                userBalance = depBal + winBal + bonBal; 
                document.getElementById('wallet-bal').innerText = userBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            });
        }

        db.ref('Game/ZooRoulette/History').once('value', (s) => {
            let pR = s.val();
            if (pR && Array.isArray(pR)) { [...pR].reverse().forEach(win => updateHistory(win)); }
        });

        db.ref('Game/ZooRoulette/Bets').on('value', s => {
            let allB = s.val() || {};
            let tp = {'monkey':0, 'rabbit':0, 'lion':0, 'elephant':0, 'peacock':0, 'eagle':0, 'parrot':0, 'dove':0, 'shark':0, 'ANIMALS':0, 'BIRDS':0};
            for(let u in allB) { if(!u.includes('bot')) for(let c in allB[u]) if(tp[c] !== undefined) tp[c] += allB[u][c]; }
            for(let c in tp) {
                let elem = document.getElementById(`total-${c}`);
                if(elem && tp[c] > 0) elem.innerText = tp[c].toLocaleString();
            }
        });

        function startLivePlayerBets() {
            if (liveBettingInterval) clearInterval(liveBettingInterval);
            liveBettingInterval = setInterval(() => {
                if (!isBettingOpen) return;
                const onlineBox = document.querySelector('.wallet-box').getBoundingClientRect();
                const startX = onlineBox.left + (onlineBox.width / 2); const startY = onlineBox.top + (onlineBox.height / 2);
                
                const targets = ['monkey', 'elephant', 'peacock', 'lion', 'shark', 'eagle', 'parrot', 'rabbit', 'dove', 'ANIMALS', 'BIRDS'];
                const randomTargetId = targets[Math.floor(Math.random() * targets.length)];
                let targetBox = document.getElementById(`btn-${randomTargetId}`);
                if (!targetBox) return;

                const fakeChips = [{ val: 10, color: '#2196f3' }, { val: 50, color: '#9c27b0' }, { val: 100, color: '#4caf50' }, { val: 500, color: '#f44336' }, { val: 1000, color: '#ffd700' }];
                const rChip = fakeChips[Math.floor(Math.random() * fakeChips.length)];

                let flyChip = document.createElement('div');
                flyChip.className = 'placed-chip'; flyChip.style.background = rChip.color; flyChip.style.zIndex = '40';
                flyChip.innerText = rChip.val >= 1000 ? (rChip.val/1000)+'K' : rChip.val;
                if (rChip.val === 10 || rChip.val === 1000) flyChip.style.color = '#000';

                flyChip.style.left = startX + 'px'; flyChip.style.top = startY + 'px'; document.body.appendChild(flyChip);
                playSound(document.getElementById('soundBet'), 0.02); 

                let dest = targetBox.getBoundingClientRect();
                setTimeout(() => {
                    flyChip.style.left = (dest.left + 15 + Math.random() * (dest.width - 30)) + 'px';
                    flyChip.style.top = (dest.top + 15 + Math.random() * (dest.height - 30)) + 'px';
                    let poolSpan = targetBox.querySelector('.pool-text span');
                    if(poolSpan) { poolSpan.innerText = (parseInt(poolSpan.innerText.replace(/,/g, '')) + rChip.val).toLocaleString(); }
                }, 50);
            }, 300); 
        }

        function clearAllLag() {
            clearTimeout(alertStopTimeout);
            clearTimeout(waitVideoTimeout);
            document.getElementById('alert-stop').style.display = 'none';
            document.getElementById('alert-wait').style.display = 'none';
        }

        let lastWinner = '';
        db.ref('Game/ZooRoulette/Status').on('value', (s) => {
            let st = s.val(); if(!st) return;

            if(st.state === 'betting') {
                isSpinningLocal = false;
                clearAllLag(); 
                
                document.getElementById('main-timer').innerText = st.timer;
                document.getElementById('main-timer').style.display = 'block';
                document.getElementById('main-timer').style.color = st.timer <= 5 ? "#ff3333" : "#ffd700";
                
                trackElements.forEach(el => {
                    el.classList.remove('active');
                    el.classList.remove('winning');
                });
                document.querySelectorAll('.bet-btn, .cat-btn').forEach(b => b.classList.remove('winning'));
                
                if(!isBettingOpen) { 
                    isBettingOpen = true; 
                    resetTable(); 
                    
                    let aStart = document.getElementById('alert-start');
                    aStart.style.display = 'block';
                    setTimeout(() => aStart.style.display = 'none', 800); 
                    
                    startLivePlayerBets(); 
                }
            } 
            else if (st.state === 'spinning' || st.state === 'result') {
                if(isBettingOpen && !isSpinningLocal) {
                    isBettingOpen = false; isSpinningLocal = true;
                    clearInterval(liveBettingInterval);
                    document.getElementById('main-timer').style.display = 'none'; 
                    
                    let rawWin = st.winner || st.Winner || st.result || st.Result;
                    
                    if (st.timer > -12 && st.timer < 0) {
                        if(rawWin) runTrackSpinByName(rawWin, true); 
                    } 
                    else {
                        let aStop = document.getElementById('alert-stop');
                        aStop.style.display = 'block';
                        alertStopTimeout = setTimeout(() => {
                            aStop.style.display = 'none';
                            if(rawWin) {
                                runTrackSpinByName(rawWin, false); 
                            }
                        }, 800); 
                    }
                }
            }
        });

        function runTrackSpinByName(winnerNameRaw, skipAnimation) {
            let winnerName = winnerNameRaw.toString().toLowerCase().trim();
            if(winnerName === 'd24') winnerName = 'shark';

            let possibleTargetIndices = [];
            trackSequence.forEach((nameOnGrid, index) => {
                if (nameOnGrid === winnerName) possibleTargetIndices.push(index);
            });

            if (possibleTargetIndices.length === 0) {
                 possibleTargetIndices = [0]; 
                 winnerName = trackSequence[0];
            }

            let finalStopIndex = possibleTargetIndices[Math.floor(Math.random() * possibleTargetIndices.length)];

            if(skipAnimation) {
                trackElements.forEach(el => el.classList.remove('active'));
                showWinnerBox(winnerName, finalStopIndex, true); 
                return;
            }

            let sSnd = document.getElementById('soundSpin'); sSnd.currentTime = 0; sSnd.loop = true; sSnd.volume = 0.8; sSnd.play().catch(e=>{});
            
            let currentIdx = 0;
            let totalSteps = (trackSequence.length * 2) + finalStopIndex; 
            let step = 0;
            let speed = 40; // Thoda fast kiya

            function nextStep() {
                trackElements.forEach(el => el.classList.remove('active'));
                trackElements[currentIdx].classList.add('active');
                
                if (step >= totalSteps) { 
                    sSnd.pause(); 
                    showWinnerBox(winnerName, currentIdx, false); 
                    return; 
                }
                
                step++; 
                currentIdx = (currentIdx + 1) % trackSequence.length;
                if(totalSteps - step < 10) speed += 30;
                
                setTimeout(nextStep, speed);
            }
            nextStep();
        }

        // 🔥 ANIMATE CHIPS FLYING TO WINNERS & COMPANY 🔥
        function animateWinningChips(wId) {
            let boardRect = document.getElementById('board').getBoundingClientRect();
            let onlineRect = document.getElementById('online-badge').getBoundingClientRect();

            let catTarget = null;
            if (beastsList.includes(wId)) catTarget = document.getElementById('btn-ANIMALS').getBoundingClientRect();
            if (birdsList.includes(wId)) catTarget = document.getElementById('btn-BIRDS').getBoundingClientRect();

            let targets = [];
            for(let i=0; i<15; i++) {
                if (catTarget && Math.random() > 0.4) targets.push(catTarget);
                else targets.push(onlineRect);
            }

            playSound(document.getElementById('soundCoins'), 0.8); 

            targets.forEach((target, i) => {
                setTimeout(() => {
                    let chip = document.createElement('div');
                    chip.className = 'placed-chip win-anim-chip';
                    chip.style.background = '#ffd700'; 
                    chip.style.border = '2px solid #fff';
                    chip.style.boxShadow = '0 0 10px #ffd700';
                    chip.style.left = (boardRect.left + boardRect.width/2) + 'px';
                    chip.style.top = (boardRect.top + boardRect.height/2) + 'px';
                    document.body.appendChild(chip);

                    setTimeout(() => {
                        chip.style.left = (target.left + target.width/2 + (Math.random()*30 - 15)) + 'px';
                        chip.style.top = (target.top + target.height/2 + (Math.random()*30 - 15)) + 'px';
                        chip.style.opacity = '0';
                        chip.style.transform = 'scale(0.5)';
                    }, 50);

                    setTimeout(() => chip.remove(), 700);
                }, i * 40); 
            });
        }

        function showWinnerBox(wId, trackIndex, skipDelay) {
            playSound(document.getElementById('soundWin'), 1.0); 
            
            trackElements[trackIndex].classList.add('winning');
            let winBtn = document.getElementById(`btn-${wId}`);
            if(winBtn) winBtn.classList.add('winning');

            if (lastWinner !== wId) { lastWinner = wId; updateHistory(wId); }

            let totalWin = 0;
            if(currentUserId) {
                let winObj = betData.find(z => z.id === wId);
                if(winObj && myBets[wId] > 0) totalWin += myBets[wId] * winObj.m;
                
                if(beastsList.includes(wId) && myBets['ANIMALS'] > 0) {
                    totalWin += myBets['ANIMALS'] * 1.9;
                    document.getElementById('btn-ANIMALS').classList.add('winning');
                }
                if(birdsList.includes(wId) && myBets['BIRDS'] > 0) {
                    totalWin += myBets['BIRDS'] * 1.9;
                    document.getElementById('btn-BIRDS').classList.add('winning');
                }

                if(totalWin > 0) db.ref(`users/${currentUserId}/winning_balance`).set(winBal + totalWin);
            }

            if(totalWin > 0 && !skipDelay) showToast(`🎉 WOOOHOO! Aap jeete ₹${totalWin}`);

            // 🔥 START CHIP ANIMATION IF NOT SKIPPED 🔥
            if(!skipDelay) {
                animateWinningChips(wId);
            }

            if(skipDelay) {
                document.getElementById('alert-wait').style.display = 'block';
                let v = document.getElementById('vid-wait'); v.muted = true; v.play().catch(e=>{});
            } else {
                waitVideoTimeout = setTimeout(() => {
                    document.getElementById('alert-wait').style.display = 'block';
                    let v = document.getElementById('vid-wait'); v.muted = true; v.play().catch(e=>{});
                }, 3500);
            }
        }

        function resetTable() {
            document.querySelectorAll('.placed-chip').forEach(c => c.remove()); 
            betData.forEach(z => { myBets[z.id] = 0; document.getElementById(`my-${z.id}`).style.display = 'none'; document.getElementById(`my-${z.id}`).querySelector('span').innerText = '0'; });
            
            myBets['ANIMALS'] = 0; myBets['BIRDS'] = 0;
            document.getElementById('my-ANIMALS').style.display = 'none'; document.getElementById('my-ANIMALS').querySelector('span').innerText = '0';
            document.getElementById('my-BIRDS').style.display = 'none'; document.getElementById('my-BIRDS').querySelector('span').innerText = '0';

            document.querySelectorAll('.pool-text span').forEach(s => s.innerText = '0');
            lastWinner = '';
        }

        function placeBet(el, targetId, val, color, e) {
            if (!isBettingOpen) return;
            if (!currentUserId) { showToast("⚠️ Login Error!"); return; } 
            if (userBalance < val) { showToast("⚠️ Insufficient Balance!"); return; }
            
            let activeBets = Object.keys(myBets).filter(k => myBets[k] > 0);
            if (myBets[targetId] === 0) { 
                let restrictedBets = activeBets.filter(k => beastsList.includes(k) || birdsList.includes(k));
                if (!birdsList.includes(targetId) && !beastsList.includes(targetId) && targetId !== 'shark' && restrictedBets.length >= 4) {
                    showToast("⚠️ Aap sirf 4 jagah bet laga sakte hain!"); return; 
                }
            }
            
            playSound(document.getElementById('soundBet'), 1.0); 
            
            let nDep = depBal, nWin = winBal, rem = val;
            if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
            db.ref('users/'+currentUserId).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
            db.ref(`Game/ZooRoulette/Bets/${currentUserId}/${targetId}`).set(firebase.database.ServerValue.increment(val));

            myBets[targetId] += val;
            let myTag = document.getElementById(`my-${targetId}`);
            myTag.style.display = 'block'; myTag.querySelector('span').innerText = myBets[targetId];

            var fly = document.createElement('div'); fly.className = 'placed-chip'; fly.style.background = color; 
            fly.innerText = val >= 1000 ? (val/1000)+'K' : val; 
            if(val === 10 || val === 1000) fly.style.color = '#000';
            fly.style.left = e.clientX + 'px'; fly.style.top = e.clientY + 'px'; document.body.appendChild(fly);
            
            var tB = el.getBoundingClientRect();
            setTimeout(() => { fly.style.left = (tB.left + 15 + Math.random()*(tB.width-30))+'px'; fly.style.top = (tB.top + 15 + Math.random()*(tB.height-30))+'px'; fly.style.zIndex='41';}, 50);
        }

        function selectChip(v, el, color) { 
            selectedChipVal = v; selectedChipColor = color;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); 
            el.classList.add('selected'); playSound(document.getElementById('soundBet'), 0.5);
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        
        let currentOnline = 245;
        setInterval(() => { 
            currentOnline += Math.floor(Math.random() * 7) - 3; 
            if(currentOnline < 180) currentOnline = 180;
            document.getElementById('online-count').innerText = currentOnline; 
        }, 2500); 
    </script>
</body>
