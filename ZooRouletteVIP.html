<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan VIP Zoo - Pro Track</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        
        body { 
            background: linear-gradient(135deg, #1f004d, #001a4d, #4d0026, #00332b); 
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
        .star { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 6px #fff, 0 0 12px #ffd700; animation: twinkle linear infinite; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: translateY(0) scale(0.5); } 50% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { opacity: 0.1; transform: translateY(-40px) scale(0.5); } }

        .bg-img-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: screen; }

        #initial-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050a05; z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ffd700; font-weight: 900; font-size: 22px; letter-spacing: 1px; transition: opacity 0.5s ease; }
        
        .reconnecting-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-weight: 900; font-size: 20px; }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(255,215,0,0.2); border-top: 6px solid #ffd700; border-radius: 50%; animation: spinLoader 1s linear infinite; margin-bottom: 20px; }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; border-bottom: 2px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.7); margin-top: 0; padding-top: 12px; position: relative; z-index: 100;}
        .back-btn { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 5px #000; cursor: pointer; padding-right: 10px;}
        .logo { font-size: 18px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); flex: 1;}
        .server-status { background: rgba(0,0,0,0.8); border: 1.5px solid #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 900; z-index: 100; transition: 0.3s;}
        .server-connected { border-color: #39ff14; color: #39ff14; box-shadow: 0 0 10px rgba(57,255,20,0.4); }
        .server-disconnected { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.4); }

        .sub-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); position: relative; z-index: 100;}
        .wallet-box { border: 1.5px solid #ffd700; color: #ffd700; padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 14px; background: rgba(255,215,0,0.1); box-shadow: 0 0 10px rgba(255,215,0,0.2);}
        
        .history-strip { width: 100%; height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.6); position: relative; z-index: 100;}
        .h-tag { font-size: 10px; font-weight: 900; color: #ffd700; }
        .h-list { display: flex; gap: 4px; flex: 1; overflow: hidden; }
        .h-item { min-width: 26px; height: 26px; background: #111; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #ffd700; font-size: 14px; padding: 2px; }
        .h-item img { width: 100%; height: 100%; object-fit: contain; }

        .board-container { flex: 1; display: flex; justify-content: center; align-items: stretch; padding: 5px; position: relative; z-index: 10;}
        
        .game-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; width: 80%; max-width: 300px; display: none; pointer-events: none; }
        .game-alert img, .game-alert video { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); }
        
        .huge-timer { position: absolute; top: 0; left: 50%; transform: translate(-50%, -5%); font-size: 75px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 10px #000; z-index: 50; pointer-events: none; }
        
        /* 🔥 BINA DIBBE WALA CONTINUOUS COLORFUL TRACK 🔥 */
        .game-board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-template-rows: repeat(7, 1fr); 
            gap: 0px; 
            width: 100%; height: 100%; max-width: 480px; 
            border: 3px solid #ffd700; border-radius: 12px; padding: 0px; position: relative; 
            background: linear-gradient(45deg, #2a0845, #004d40, #640b33, #002244); 
            background-size: 300% 300%;
            animation: trackNeon 6s ease infinite;
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,215,0,0.3);
            overflow: hidden; margin: 0 auto; 
        }
        @keyframes trackNeon { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .track-item { 
            background: transparent; 
            border: none; 
            display: flex; align-items: center; justify-content: center; transition: 0.1s; position: relative;
        }
        .track-item img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.9)); }
        
        .track-item.active { background: rgba(255, 215, 0, 0.6); box-shadow: 0 0 20px #ffd700, inset 0 0 15px #ffd700; border-radius: 8px; z-index: 10; }
        .track-item.winning { background: rgba(57, 255, 20, 0.8) !important; box-shadow: 0 0 30px #39ff14, inset 0 0 20px #39ff14 !important; transform: scale(1.15); z-index: 20; border-radius: 8px; animation: blinkWin 0.5s infinite alternate;}
        
        .center-bets { 
            grid-area: 2 / 2 / 7 / 7; 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; 
            background: #111520; 
            border: 2px solid #ffd700; border-radius: 10px; margin: 2px; 
        }
        
        .bet-btn { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #555; position: relative; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.6);}
        .bet-btn:active { transform: scale(0.95); }
        .btn-monkey { border-color: #8d6e63; background: #3e2723; }
        .btn-rabbit { border-color: #ab47bc; background: #4a148c; }
        .btn-peacock { border-color: #00bcd4; background: #006064; }
        .btn-lion { border-color: #ffb300; background: #e65100; }
        .btn-shark { border-color: #ffd700; background: #212121; box-shadow: inset 0 0 15px rgba(255,215,0,0.3);}
        .btn-eagle { border-color: #e53935; background: #b71c1c; }
        .btn-parrot { border-color: #4caf50; background: #1b5e20; }
        .btn-elephant { border-color: #9e9e9e; background: #424242; }
        .btn-dove { border-color: #bdbdbd; background: #212121; }

        .bet-btn.winning { box-shadow: 0 0 35px #39ff14 !important; border: 3px solid #39ff14 !important; background: #003300 !important; transform: scale(1.05); z-index: 15; animation: blinkWin 0.5s infinite alternate; }
        @keyframes blinkWin { from { box-shadow: 0 0 15px #39ff14; filter: brightness(1); } to { box-shadow: 0 0 40px #39ff14; filter: brightness(1.3); } }

        .btn-icon-emoji { font-size: 35px; filter: drop-shadow(0 4px 4px #000); margin-bottom: 2px;}
        .btn-img { width: 50%; height: 50%; object-fit: contain; filter: drop-shadow(0 4px 4px #000); margin-bottom: 2px;}
        .btn-multi { border: 1px solid #ffd700; color: #ffd700; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 900; background: #000;}
        
        .pool-text { position: absolute; top: -6px; right: -6px; font-size: 10px; color: #000; font-weight: 900; background: #ffc107; padding: 2px 6px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); border: 1.5px solid #fff; z-index: 10;}
        .my-bet-tag { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; font-size: 10px; padding: 1px 8px; border-radius: 4px; font-weight: 900; display: none; z-index: 20; white-space: nowrap; box-shadow: 0 2px 4px #000;}

        .category-bets { display: flex; justify-content: space-between; gap: 10px; width: 98vw; max-width: 480px; padding: 0 5px; margin-bottom: 5px; margin-left: auto; margin-right: auto; position: relative; z-index: 100;}
        .cat-btn { flex: 1; height: 50px; border-radius: 8px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #555; transition: 0.1s; box-shadow: 0 4px 8px rgba(0,0,0,0.6);}
        .cat-btn:active { transform: scale(0.95); }
        .bg-beast { background: linear-gradient(145deg, #d32f2f, #660000); border-color: #ff5252; box-shadow: inset 0 0 15px rgba(255,82,82,0.3);}
        .bg-bird { background: linear-gradient(145deg, #1976d2, #002171); border-color: #448aff; box-shadow: inset 0 0 15px rgba(68,138,255,0.3);}
        .cat-title { font-size: 16px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 2px #000; margin-bottom: 2px; line-height: 1;}

        .footer-chips { padding: 6px 0; background: rgba(0,0,0,0.9); display: flex; justify-content: space-evenly; align-items: center; border-top: 1px solid rgba(255,255,255,0.2); position: relative; z-index: 100;}
        .chip-img { width: 42px; height: 42px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); flex-shrink: 0; }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 10px #ffd700); }

        .placed-chip-img { position: fixed; width: 22px; height: 22px; pointer-events: none; z-index: 100; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8)); transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .win-anim-chip { z-index: 999 !important; }

        .toast-msg { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(220, 38, 38, 0.95); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 900; z-index: 9999; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: none; white-space: nowrap; font-size: 13px; text-align: center;}
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        function createStars() {
            const container = document.getElementById('stars-container');
            for(let i=0; i<40; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px'; star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        window.addEventListener('load', function() {
            setTimeout(function() {
                let initLoader = document.getElementById('initial-loader');
                if(initLoader) { initLoader.style.opacity = '0'; setTimeout(() => initLoader.style.display = 'none', 500); }
            }, 3000); 
        });

        // ---------------- FIREBASE INITIALIZATION ----------------
        const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const currentUserId = localStorage.getItem('userPhone') || localStorage.getItem('phone');
        
        let userBalance = 0, depBal = 0, winBal = 0, bonBal = 0;
        const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png" };
        let selectedChipVal = 10; 
        let selectedChipSrc = chipImgs[10];

        const beastsList = ['monkey', 'rabbit', 'lion', 'elephant'];
        const birdsList = ['peacock', 'eagle', 'parrot', 'dove'];
        const imgMap = {
            'monkey': 'assets/monkey.png.png', 'rabbit': 'assets/rabbit.png.png', 'lion': 'assets/lion.png.png',
            'elephant': 'assets/elephant.png.png', 'peacock': 'assets/peacock.png.png', 'eagle': 'assets/eagle.png.png',
            'parrot': 'assets/parrot.png.png', 'dove': 'assets/dove.png.png'
        };
        const emojiMap = { 'monkey': '🐒', 'rabbit': '🐇', 'peacock': '🦚', 'lion': '🦁', 'eagle': '🦅', 'parrot': '🦜', 'elephant': '🐘', 'dove': '🕊️', 'frog': '🐸', 'shark': '🦈' };

        const betData = [
            {id:'monkey', m:8, cls:'btn-monkey'}, {id:'rabbit', m:6, cls:'btn-rabbit'}, {id:'peacock', m:8, cls:'btn-peacock'}, 
            {id:'lion', m:12, cls:'btn-lion'}, {id:'shark', m:24, cls:'btn-shark', type:'emoji'}, 
            {id:'eagle', m:12, cls:'btn-eagle'}, 
            {id:'parrot', m:6, cls:'btn-parrot'}, {id:'elephant', m:8, cls:'btn-elephant'}, {id:'dove', m:8, cls:'btn-dove'}
        ];

        let myBets = { 'ANIMALS': 0, 'BIRDS': 0 };
        const betContainer = document.getElementById('bet-container');
        
        betData.forEach(item => {
            myBets[item.id] = 0;
            const div = document.createElement('div');
            div.className = `bet-btn ${item.cls}`; div.id = `btn-${item.id}`;
            div.onclick = (e) => placeBet(div, item.id, e);
            let iconHtml = item.type === 'emoji' ? `<div class="btn-icon-emoji">${emojiMap[item.id]}</div>` : `<img src="${imgMap[item.id]}" class="btn-img">`;
            div.innerHTML = `<div class="pool-text">₹<span id="total-${item.id}">0</span></div>${iconHtml}<div class="btn-multi">${item.m}x</div><div class="my-bet-tag" id="my-${item.id}">₹<span>0</span></div>`;
            betContainer.appendChild(div);
        });

        const trackSequence = [ 'eagle','eagle','eagle','frog','lion','lion','lion', 'rabbit','rabbit','monkey','monkey','monkey', 'elephant','elephant','parrot','shark','parrot','parrot','dove', 'dove','dove','peacock','peacock','peacock' ];
        let trackElements = [];
        const board = document.getElementById('board');
        
        for(let i=1; i<=7; i++) createTrackItem(trackSequence[trackElements.length], 1, i);
        for(let i=2; i<=6; i++) createTrackItem(trackSequence[trackElements.length], i, 7);
        for(let i=7; i>=1; i--) createTrackItem(trackSequence[trackElements.length], 7, i);
        for(let i=6; i>=2; i--) createTrackItem(trackSequence[trackElements.length], i, 1);

        function createTrackItem(id, row, col) {
            let div = document.createElement('div');
            div.className = 'track-item'; div.style.gridArea = `${row} / ${col}`; 
            if(id === 'frog') { div.innerHTML = `<span style="font-size: 26px">🐸</span><div style="position:absolute;font-size:8px;bottom:2px;background:red;color:white;padding:1px 4px;font-weight:900;border-radius:4px;">HOUSE</div>`; } 
            else if(id === 'shark') { div.innerHTML = `<span style="font-size: 26px">🦈</span><div style="position:absolute;font-size:8px;bottom:2px;background:#ffd700;color:black;padding:1px 4px;font-weight:900;border-radius:4px;">24x</div>`; } 
            else { div.innerHTML = `<img src="${imgMap[id]}" alt="${id}">`; }
            board.appendChild(div); trackElements.push(div);
        }

        // ---------------- FIREBASE CONNECTIONS (TIMER & WALLET) ----------------
        db.ref('.info/connected').on('value', function(snap) {
            let sBox = document.getElementById('server-status');
            let overlay = document.getElementById('reconnect-screen');
            if (snap.val() === true) {
                sBox.innerHTML = '🟢 Connected'; sBox.className = 'server-status server-connected'; overlay.style.display = 'none'; 
            } else {
                sBox.innerHTML = '🔴 Offline'; sBox.className = 'server-status server-disconnected'; overlay.style.display = 'flex'; 
            }
        });

        if (currentUserId) {
            db.ref(`users/${currentUserId}`).on('value', (s) => {
                const d = s.val() || {}; 
                depBal = parseFloat(d.balance||0); winBal = parseFloat(d.winning_balance||0); bonBal = parseFloat(d.bonus_balance||0);
                userBalance = depBal + winBal + bonBal; 
                document.getElementById('wallet-bal').innerText = userBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            });
        }

        db.ref('Game/ZooRoulette/History').once('value', (s) => {
            let pR = s.val(); if (pR && Array.isArray(pR)) { [...pR].reverse().forEach(win => updateHistory(win)); }
        });

        db.ref('Game/ZooRoulette/Bets').on('value', s => {
            let allB = s.val() || {};
            let tp = {'monkey':0, 'rabbit':0, 'lion':0, 'elephant':0, 'peacock':0, 'eagle':0, 'parrot':0, 'dove':0, 'shark':0, 'ANIMALS':0, 'BIRDS':0};
            for(let u in allB) { if(!u.includes('bot')) for(let c in allB[u]) if(tp[c] !== undefined) tp[c] += allB[u][c]; }
            for(let c in tp) { let elem = document.getElementById(`total-${c}`); if(elem && tp[c] > 0) elem.innerText = tp[c].toLocaleString(); }
        });

        let isBettingOpen = false, isSpinningLocal = false, liveBettingInterval;
        let alertStopTimeout, waitVideoTimeout;
        let lastWinner = '';

        // 🔥 FIREBASE TIMER LISTENER (Fixed Timer not running) 🔥
        db.ref('Game/ZooRoulette/Status').on('value', (s) => {
            let st = s.val(); if(!st) return;

            if(st.state === 'betting') {
                isSpinningLocal = false; clearAllLag(); 
                document.getElementById('main-timer').innerText = st.timer;
                document.getElementById('main-timer').style.display = 'block';
                document.getElementById('main-timer').style.color = st.timer <= 5 ? "#ff3333" : "#ffd700";
                
                trackElements.forEach(el => { el.classList.remove('active'); el.classList.remove('winning'); });
                document.querySelectorAll('.bet-btn, .cat-btn').forEach(b => b.classList.remove('winning'));
                
                if(!isBettingOpen) { 
                    isBettingOpen = true; resetTable(); 
                    let aStart = document.getElementById('alert-start');
                    aStart.style.display = 'block'; setTimeout(() => aStart.style.display = 'none', 800); 
                    startLivePlayerBets(); 
                }
            } 
            else if (st.state === 'spinning' || st.state === 'result') {
                if(isBettingOpen && !isSpinningLocal) {
                    isBettingOpen = false; isSpinningLocal = true;
                    clearInterval(liveBettingInterval);
                    document.getElementById('main-timer').style.display = 'none'; 
                    
                    let rawWin = st.winner || st.Winner || st.result || st.Result;
                    
                    if (st.timer > -12 && st.timer < 0) {
                        if(rawWin) runTrackSpinByName(rawWin, true); 
                    } else {
                        let aStop = document.getElementById('alert-stop');
                        aStop.style.display = 'block';
                        alertStopTimeout = setTimeout(() => {
                            aStop.style.display = 'none';
                            if(rawWin) { runTrackSpinByName(rawWin, false); }
                        }, 800); 
                    }
                }
            }
        });

        // ---------------- SOUND & ANIMATION ----------------
        let isAudioInit = false;
        function initAudio() { 
            if(!isAudioInit) { isAudioInit = true; let vid = document.getElementById('vid-wait'); vid.muted = true; vid.play().catch(e=>{}); }
        }
        function playSound(obj, vol) { try { if(!isAudioInit) return; let c = obj.cloneNode(); c.volume = vol; c.play().catch(e=>{}); } catch(e){} }
        function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerHTML = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 3000); }

        function updateHistory(winId) {
            if(!winId) return;
            const list = document.getElementById('history-list');
            const newItem = document.createElement('div');
            newItem.className = 'h-item'; 
            let normId = winId.toLowerCase().trim(); if (normId === 'd24') normId = 'shark';
            if(normId === 'frog' || normId === 'shark') { newItem.innerHTML = `<span style="font-size: 16px">${emojiMap[normId]}</span>`; } 
            else if(imgMap[normId]) { newItem.innerHTML = `<img src="${imgMap[normId]}">`; } else { newItem.innerText = '?'; }
            list.insertBefore(newItem, list.firstChild);
            if(list.children.length > 8) list.removeChild(list.lastChild); 
        }

        function startLivePlayerBets() {
            if (liveBettingInterval) clearInterval(liveBettingInterval);
            liveBettingInterval = setInterval(() => {
                if (!isBettingOpen) return;
                const onlineBox = document.getElementById('online-badge').getBoundingClientRect();
                const startX = onlineBox.left + (onlineBox.width / 2); const startY = onlineBox.top + (onlineBox.height / 2);
                
                const targets = ['monkey', 'elephant', 'peacock', 'lion', 'shark', 'eagle', 'parrot', 'rabbit', 'dove', 'ANIMALS', 'BIRDS'];
                const randomTargetId = targets[Math.floor(Math.random() * targets.length)];
                let targetBox = document.getElementById(`btn-${randomTargetId}`);
                if (!targetBox) return;

                const fakeChipVals = [10, 50, 100, 500, 1000, 5000];
                const rVal = fakeChipVals[Math.floor(Math.random() * fakeChipVals.length)];

                let flyChip = document.createElement('img');
                flyChip.className = 'placed-chip-img'; flyChip.src = chipImgs[rVal] || chipImgs[100];
                flyChip.style.left = startX + 'px'; flyChip.style.top = startY + 'px'; document.body.appendChild(flyChip);
                playSound(document.getElementById('soundBet'), 0.02); 

                let dest = targetBox.getBoundingClientRect();
                setTimeout(() => {
                    flyChip.style.left = (dest.left + 15 + Math.random() * (dest.width - 30)) + 'px';
                    flyChip.style.top = (dest.top + 15 + Math.random() * (dest.height - 30)) + 'px';
                    let poolSpan = targetBox.querySelector('.pool-text span');
                    if(poolSpan) { poolSpan.innerText = (parseInt(poolSpan.innerText.replace(/,/g, '')) + rVal).toLocaleString(); }
                }, 50);
            }, 100); 
        }

        function clearAllLag() {
            clearTimeout(alertStopTimeout); clearTimeout(waitVideoTimeout);
            document.getElementById('alert-stop').style.display = 'none';
            document.getElementById('alert-wait').style.display = 'none';
        }

        function runTrackSpinByName(winnerNameRaw, skipAnimation) {
            let winnerName = winnerNameRaw.toString().toLowerCase().trim();
            if(winnerName === 'd24') winnerName = 'shark';

            let possibleTargetIndices = [];
            trackSequence.forEach((nameOnGrid, index) => { if (nameOnGrid === winnerName) possibleTargetIndices.push(index); });
            if (possibleTargetIndices.length === 0) { possibleTargetIndices = [0]; winnerName = trackSequence[0]; }
            let finalStopIndex = possibleTargetIndices[Math.floor(Math.random() * possibleTargetIndices.length)];

            if(skipAnimation) { trackElements.forEach(el => el.classList.remove('active')); showWinnerBox(winnerName, finalStopIndex, true); return; }

            let sSnd = document.getElementById('soundSpin'); sSnd.currentTime = 0; sSnd.loop = true; sSnd.volume = 0.8; sSnd.play().catch(e=>{});
            let currentIdx = 0; let totalSteps = (trackSequence.length * 2) + finalStopIndex; let step = 0; let speed = 40;

            function nextStep() {
                trackElements.forEach(el => el.classList.remove('active'));
                trackElements[currentIdx].classList.add('active');
                if (step >= totalSteps) { sSnd.pause(); showWinnerBox(winnerName, currentIdx, false); return; }
                step++; currentIdx = (currentIdx + 1) % trackSequence.length;
                if(totalSteps - step < 10) speed += 30;
                setTimeout(nextStep, speed);
            }
            nextStep();
        }

        function animateWinningChips(wId) {
            let boardRect = document.getElementById('board').getBoundingClientRect();
            let onlineRect = document.getElementById('online-badge').getBoundingClientRect();
            let catTarget = null;
            if (beastsList.includes(wId)) catTarget = document.getElementById('btn-ANIMALS').getBoundingClientRect();
            if (birdsList.includes(wId)) catTarget = document.getElementById('btn-BIRDS').getBoundingClientRect();

            let targets = [];
            for(let i=0; i<15; i++) { if (catTarget && Math.random() > 0.4) targets.push(catTarget); else targets.push(onlineRect); }
            playSound(document.getElementById('soundCoins'), 0.8); 

            targets.forEach((target, i) => {
                setTimeout(() => {
                    let chip = document.createElement('img'); chip.className = 'placed-chip-img win-anim-chip'; chip.src = chipImgs[100]; 
                    chip.style.left = (boardRect.left + boardRect.width/2) + 'px'; chip.style.top = (boardRect.top + boardRect.height/2) + 'px';
                    document.body.appendChild(chip);

                    setTimeout(() => {
                        chip.style.left = (target.left + target.width/2 + (Math.random()*30 - 15)) + 'px';
                        chip.style.top = (target.top + target.height/2 + (Math.random()*30 - 15)) + 'px';
                        chip.style.opacity = '0'; chip.style.transform = 'scale(0.5)';
                    }, 50);
                    setTimeout(() => chip.remove(), 700);
                }, i * 40); 
            });
        }

        function showWinnerBox(wId, trackIndex, skipDelay) {
            playSound(document.getElementById('soundWin'), 1.0); 
            trackElements[trackIndex].classList.add('winning');
            let winBtn = document.getElementById(`btn-${wId}`); if(winBtn) winBtn.classList.add('winning');

            document.querySelectorAll('.placed-chip-img:not(.win-anim-chip)').forEach(c => {
                c.style.opacity = '0'; c.style.transform = 'scale(0)'; setTimeout(() => c.remove(), 500); 
            });

            document.querySelectorAll('.pool-text span').forEach(s => s.innerText = '0');
            document.querySelectorAll('.my-bet-tag').forEach(tag => tag.style.display = 'none');
            if (lastWinner !== wId) { lastWinner = wId; updateHistory(wId); }

            let totalWin = 0;
            if(currentUserId && db) {
                let winObj = betData.find(z => z.id === wId);
                if(winObj && myBets[wId] > 0) totalWin += myBets[wId] * winObj.m;
                if(beastsList.includes(wId) && myBets['ANIMALS'] > 0) { totalWin += myBets['ANIMALS'] * 1.9; document.getElementById('btn-ANIMALS').classList.add('winning'); }
                if(birdsList.includes(wId) && myBets['BIRDS'] > 0) { totalWin += myBets['BIRDS'] * 1.9; document.getElementById('btn-BIRDS').classList.add('winning'); }
                if(totalWin > 0) db.ref(`users/${currentUserId}/winning_balance`).set(winBal + totalWin);
            }

            if(totalWin > 0 && !skipDelay) showToast(`🎉 WOOOHOO! Aap jeete ₹${totalWin}`);
            if(!skipDelay) { animateWinningChips(wId); }

            if(skipDelay) {
                document.getElementById('alert-wait').style.display = 'block'; let v = document.getElementById('vid-wait'); v.muted = true; v.play().catch(e=>{});
            } else {
                waitVideoTimeout = setTimeout(() => { document.getElementById('alert-wait').style.display = 'block'; let v = document.getElementById('vid-wait'); v.muted = true; v.play().catch(e=>{}); }, 3500);
            }
        }

        function resetTable() {
            document.querySelectorAll('.placed-chip-img').forEach(c => c.remove()); 
            betData.forEach(z => { myBets[z.id] = 0; document.getElementById(`my-${z.id}`).style.display = 'none'; document.getElementById(`my-${z.id}`).querySelector('span').innerText = '0'; });
            myBets['ANIMALS'] = 0; myBets['BIRDS'] = 0;
            document.getElementById('my-ANIMALS').style.display = 'none'; document.getElementById('my-ANIMALS').querySelector('span').innerText = '0';
            document.getElementById('my-BIRDS').style.display = 'none'; document.getElementById('my-BIRDS').querySelector('span').innerText = '0';
            document.querySelectorAll('.pool-text span').forEach(s => s.innerText = '0'); lastWinner = '';
        }

        function placeBet(el, targetId, e) {
            if (!isBettingOpen) return;
            if (!currentUserId || !db) { showToast("⚠️ Login Error!"); return; } 
            if (userBalance < selectedChipVal) { showToast("⚠️ Insufficient Balance!"); return; }
            
            let activeBets = Object.keys(myBets).filter(k => myBets[k] > 0);
            if (myBets[targetId] === 0) { 
                let restrictedBets = activeBets.filter(k => beastsList.includes(k) || birdsList.includes(k));
                if (!birdsList.includes(targetId) && !beastsList.includes(targetId) && targetId !== 'shark' && restrictedBets.length >= 4) {
                    showToast("⚠️ Aap sirf 4 jagah bet laga sakte hain!"); return; 
                }
            }
            
            playSound(document.getElementById('soundBet'), 1.0); 
            
            let nDep = depBal, nWin = winBal, rem = selectedChipVal;
            if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
            db.ref('users/'+currentUserId).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
            db.ref(`Game/ZooRoulette/Bets/${currentUserId}/${targetId}`).set(firebase.database.ServerValue.increment(selectedChipVal));

            myBets[targetId] += selectedChipVal;
            let myTag = document.getElementById(`my-${targetId}`);
            myTag.style.display = 'block'; myTag.querySelector('span').innerText = myBets[targetId];

            var fly = document.createElement('img'); fly.className = 'placed-chip-img'; fly.src = selectedChipSrc; 
            fly.style.left = e.clientX + 'px'; fly.style.top = e.clientY + 'px'; document.body.appendChild(fly);
            
            var tB = el.getBoundingClientRect();
            setTimeout(() => { fly.style.left = (tB.left + 15 + Math.random()*(tB.width-30))+'px'; fly.style.top = (tB.top + 15 + Math.random()*(tB.height-30))+'px'; fly.style.zIndex='41';}, 50);
        }

        function selectChip(v, el) { 
            selectedChipVal = v; selectedChipSrc = chipImgs[v];
            document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active')); 
            el.classList.add('active'); playSound(document.getElementById('soundBet'), 0.5);
        }
        
        let currentOnline = 245;
        setInterval(() => { currentOnline += Math.floor(Math.random() * 7) - 3; if(currentOnline < 180) currentOnline = 180; document.getElementById('online-count').innerText = currentOnline; }, 2500); 
    </script>
</body>
