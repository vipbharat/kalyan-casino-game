<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Kalyan VIP Zoo - Perfect Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; position: fixed; }

        #landscape-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #0f172a, #020617, #000000);
            overflow: hidden;
        }

        @media screen and (orientation: portrait) {
            #landscape-canvas {
                top: 50%; left: 50%; width: 100vh; height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
            }
        }

        /* LOADERS */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-weight: 900; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(0, 229, 255, 0.2); border-top: 5px solid #00e5ff; border-radius: 50%; animation: spinLoader 1s linear infinite; margin-bottom: 15px; }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* BANNER ANIMATION */
        .banner-overlay { 
            position: absolute; top: 50%; left: -150%; 
            transform: translate(-50%, -50%) scale(2.2); 
            width: 60%; z-index: 2000; pointer-events: none; 
            transition: left 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .banner-overlay.show { left: 50%; }
        .banner-overlay.exit { left: 250%; }
        .banner-overlay.hide-instant { transition: none !important; left: -150%; }

        /* PANELS */
        .left-panel { position: absolute; left: 5px; top: 5px; bottom: 5px; width: 65px; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.6); border: 1px solid #334155; border-radius: 8px; padding: 5px; z-index: 100; }
        .back-btn { font-size: 20px; cursor: pointer; margin-bottom: 10px; filter: drop-shadow(0 2px 2px #000); }
        .server-status { font-size: 9px; font-weight: bold; color: #39ff14; margin-bottom: 10px; }
        .r-title { color: #ffd700; font-size: 9px; font-weight: bold; margin-bottom: 5px; background: #222; width: 100%; text-align: center; border-radius: 4px; }
        .h-list { display: flex; flex-direction: column; gap: 4px; width: 100%; flex: 1; overflow: hidden; align-items: center; }
        .h-item { width: 26px; height: 26px; background: #1e293b; border-radius: 4px; border: 1px solid #00e5ff; display: flex; justify-content: center; align-items: center; padding: 2px; }
        .h-item img { width: 100%; height: 100%; object-fit: contain; }

        .bottom-right-panel { position: absolute; bottom: 5px; right: 5px; height: 50px; display: flex; align-items: center; z-index: 100; }
        .online-players { background: rgba(0,0,0,0.8); border: 2px solid #00e5ff; color: #00e5ff; padding: 4px 15px; border-radius: 20px; font-size: 14px; font-weight: 900; box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }

        /* WALLET & CHIPS */
        .bottom-panel { position: absolute; bottom: 5px; left: 75px; right: 120px; height: 50px; display: flex; align-items: stretch; justify-content: space-between; gap: 10px; z-index: 100; }
        .wallet-panel { width: 40%; background: linear-gradient(135deg, #220066, #440099); border-radius: 12px; border: 2px solid #ffd700; display: flex; flex-direction: column; justify-content: center; padding-left: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.9); }
        .w-id { font-size: 9px; color: #ccc; font-weight: bold; text-transform: uppercase; } 
        .w-bal { font-size: 16px; color: #ffd700; font-weight: 900; }

        .chips-tray { width: 58%; background: rgba(0,0,0,0.85); border-radius: 30px; display: flex; justify-content: space-evenly; align-items: center; border: 2px solid #00e5ff; }
        .chip-img { width: 38px; height: 38px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 3px 4px #000); }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 10px #00e5ff); }

        /* BOARD */
        .center-panel { position: absolute; left: 75px; right: 5px; top: 5px; bottom: 65px; display: flex; justify-content: center; align-items: stretch; z-index: 10; }
        .game-board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr)); height: 100%; width: 100%; margin: auto; background: #020617; border: 4px solid #00e5ff; border-radius: 14px; gap: 0; overflow: hidden; }

        .track-item { display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(180deg, #311b92, #120136); border: 0.5px solid rgba(0, 229, 255, 0.4); box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .track-item img { width: 85%; height: 85%; object-fit: contain; z-index: 2; image-rendering: crisp-edges; pointer-events: none; }
        .track-item .mult-tag { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #00e5ff; font-weight: 900; z-index: 3; text-shadow: 0 1px 2px #000; pointer-events: none; }

        .track-item.active { background: #00e5ff !important; box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #fff; z-index: 10; transform: scale(1.05); border-radius: 4px; border-color: #fff;}
        .track-item.winning { background: #007bff !important; animation: blinkWinBlue 0.5s infinite alternate; z-index: 20; transform: scale(1.15); border-radius: 6px; border-color: #fff;}
        @keyframes blinkWinBlue { to { background: #00e5ff; box-shadow: 0 0 35px #00e5ff; filter: brightness(1.5); } }

        /* 13 BOX GRID */
        .center-bets { grid-area: 2 / 2 / 7 / 8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; background: rgba(0,0,0,0.8); border: 2px solid #1e3a8a; border-radius: 12px; position: relative; }
        
        .bet-btn { border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid; position: relative; cursor: pointer; overflow: hidden; }
        .bet-btn.winning { border-color: #00e5ff !important; background: #001a4d !important; transform: scale(1.02); box-shadow: 0 0 20px #00e5ff; }

        /* Box Colors */
        .btn-monkey { border-color: #a1887f; background: linear-gradient(to bottom, #4e342e, #3e2723); }
        .btn-rabbit { border-color: #ce93d8; background: linear-gradient(to bottom, #6a1b9a, #4a148c); }
        .btn-peacock { border-color: #80deea; background: linear-gradient(to bottom, #00838f, #006064); }
        .btn-lion { border-color: #ffca28; background: linear-gradient(to bottom, #f57c00, #e65100); }
        .btn-shark { border-color: #00e5ff; background: radial-gradient(circle, #001a4d, #000); }
        .btn-eagle { border-color: #ef9a9a; background: linear-gradient(to bottom, #c62828, #b71c1c); }
        .btn-parrot { border-color: #a5d6a7; background: linear-gradient(to bottom, #2e7d32, #1b5e20); }
        .btn-elephant { border-color: #b0bec5; background: linear-gradient(to bottom, #546e7a, #37474f); }
        .btn-dove { border-color: #eeeeee; background: linear-gradient(to bottom, #616161, #424242); }
        
        /* PNGs & Texts (Clear UI) */
        .img-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; pointer-events: none; position: relative; }
        .bet-btn img { max-width: 75%; max-height: 70%; object-fit: contain; filter: drop-shadow(0 4px 5px #000); transform: translateY(-5%) scale(1.12); }
        .btn-icon-emoji { font-size: 38px; filter: drop-shadow(0 3px 4px #000); transform: translateY(-5%); }

        .btn-multi { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); color: #ffd700; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 0 0 8px #000; z-index: 5; pointer-events: none; }
        .pool-text { position: absolute; top: 4px; right: 8px; font-size: 14px; color: #fff; font-weight: 900; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 0 0 8px #000; z-index: 10; pointer-events: none; }
        .my-bet-text { position: absolute; top: 4px; left: 8px; font-size: 14px; color: #39ff14; font-weight: 900; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 0 0 8px #000; display: none; z-index: 10; pointer-events: none; }

        /* 🔥 TIMER FIXED: VS Removed, Tabular-nums prevents box resize 🔥 */
        .center-png-box { 
            grid-area: 1 / 3 / span 2 / span 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(0,0,0,0.4); 
            border: 2px solid #00e5ff; 
            border-radius: 6px; 
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.4); 
            pointer-events: none; 
            overflow: hidden; /* Prevents box expansion */
            width: 100%;
            height: 100%;
        }
        
        .huge-timer { 
            z-index: 10; 
            font-size: clamp(35px, 6vw, 60px); 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 15px #ff007f, 0 0 5px #ff007f, 2px 2px 5px #000; 
            transition: opacity 0.2s; 
            pointer-events: none; 
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Magic trick: keeps 1 and 0 same width */
            text-align: center;
            width: 100%;
        }

        #chips-layer { position: absolute; inset: 0; pointer-events: none; z-index: 500; }
        .placed-chip-img { position: absolute; width: 22px; height: 22px; transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.2s; z-index: 100; }

        .toast-msg { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0, 229, 255, 0.95); color: #000; padding: 10px 25px; border-radius: 8px; font-weight: 900; z-index: 9999; display: none; }
    </style>
</head>
<body>

    <div class="overlay" id="tap-to-start" style="display:flex; background:#000;" onclick="startAudio()">
        <div class="start-text">TAP TO START GAME</div>
    </div>

    <div id="landscape-canvas">
        <img src="assets/kaishitouzhub.png" id="alert-start" class="banner-overlay">
        <img src="assets/tingzhitouzhu.png" id="alert-stop" class="banner-overlay">

        <div class="overlay" id="initial-loader">
            <div class="spinner"></div><div>LOADING...</div>
        </div>
        <div class="toast-msg" id="toastMsg"></div>
        <div id="chips-layer"></div>

        <div class="left-panel">
            <div class="back-btn" onclick="history.back()">⬅️</div>
            <div id="server-status" class="server-status">🟢 On</div>
            <div class="r-title">REC</div>
            <div class="h-list" id="history-list"></div>
        </div>

        <div class="center-panel">
            <div class="game-board" id="board">
                <div class="center-bets" id="bet-container">
                    </div>
            </div>
        </div>

        <div class="bottom-right-panel" id="online-players-box">
            <div class="online-players">👥 <span id="online-count">245</span></div>
        </div>

        <div class="bottom-panel">
            <div class="wallet-panel" id="my-wallet">
                <div class="w-id" id="p-id">ID: ...</div>
                <div class="w-bal">₹ <span id="wallet-bal">0</span></div>
            </div>
            <div class="chips-tray" id="chips-tray"></div>
        </div>
    </div>

    <audio id="soundSpin" src="https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3" preload="auto"></audio>
    <audio id="soundWin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>
    <audio id="snd-beep" src="assets/22d0dc27-b727-42be-ac04-d9182459f976.mp3" preload="auto"></audio>
    <audio id="snd-drop" src="assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3" preload="auto"></audio>
    <audio id="snd-fly" src="assets/7ba0aedc-0356-404d-9c4a-c34acec66469.mp3" preload="auto"></audio>

<script>
    let isAudioInit = false;
    const $ = id => document.getElementById(id);

    function startAudio() {
        if(isAudioInit) return;
        let elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen();
        $('tap-to-start').style.display = 'none';
        isAudioInit = true;
        
        ['soundSpin','soundWin','snd-beep','snd-drop','snd-fly'].forEach(id => {
            let a = $(id); if(a) a.play().then(()=>a.pause()).catch(()=>{});
        });
        setTimeout(() => $('initial-loader').style.display='none', 1000);
    }

    function showToast(msg) {
        let t = $('toastMsg'); t.innerHTML = msg; t.style.display='block';
        setTimeout(()=> t.style.display='none', 2500);
    }

    function playSound(id, vol) { 
        try { 
            if(!isAudioInit) return; 
            let c = $(id).cloneNode(); 
            c.volume = vol || 1.0; 
            c.play().catch(()=>{}); 
        } catch(e){} 
    }

    function getPos(el) {
        let x = 0, y = 0;
        while(el && el.id !== 'landscape-canvas' && el.tagName !== 'BODY') {
            x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent;
        }
        return {x, y};
    }

    function triggerBanner(id) {
        let el = $(id);
        el.className = 'banner-overlay hide-instant';
        void el.offsetWidth;
        el.className = 'banner-overlay show';
        setTimeout(() => { el.className = 'banner-overlay exit'; }, 1200);
    }

    const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png", 10000: "assets/10000_0.png" };
    const chipVals = [10, 50, 100, 500, 1000, 5000, 10000];
    let selectedChipVal = 10, selectedChipSrc = chipImgs[10];
    
    const betKeys = ['monkey','rabbit','parrot','dove','lion','elephant','peacock','eagle','ANIMALS','shark','BIRDS'];
    let myBets = {}, fakePools = {}, realPools = {};
    betKeys.forEach(k => { myBets[k]=0; fakePools[k]=0; realPools[k]=0; });

    // GENERATE 13 BOXES
    const bc = $('bet-container');
    const layout = [
        {id:'monkey',m:8,r:1,c:1},{id:'rabbit',m:6,r:1,c:2},
        {id:'VS',type:'vs',r:1,c:3,rs:2},{id:'parrot',m:6,r:1,c:4},{id:'dove',m:8,r:1,c:5},
        {id:'lion',m:12,r:2,c:1},{id:'elephant',m:8,r:2,c:2},
        {id:'peacock',m:8,r:2,c:4},{id:'eagle',m:12,r:2,c:5},
        {id:'ANIMALS',m:1.9,r:3,c:1,cs:2},{id:'shark',m:24,r:3,c:3},
        {id:'BIRDS',m:1.9,r:3,c:4,cs:2}
    ];

    layout.forEach(b => {
        let div = document.createElement('div');
        div.style.gridArea = `${b.r}/${b.c}/span ${b.rs||1}/span ${b.cs||1}`;
        if(b.type === 'vs') {
            div.className = 'center-png-box';
            // 🔥 FIXED: VS REMOVED, ONLY TIMER KEPT TO PREVENT BOX EXPANSION 🔥
            div.innerHTML = `<div class="huge-timer" id="main-timer">15</div>`;
        } else {
            div.className = `bet-btn btn-${b.id.toLowerCase()} ${b.id==='ANIMALS'?'btn-animals':''} ${b.id==='BIRDS'?'btn-birds':''}`; 
            div.id = `btn-${b.id}`;
            div.onclick = (e) => placeBet(div, b.id, e);
            
            let iconStr = b.id === 'shark' ? `<div class="btn-icon-emoji">🦈</div>` : 
                         (b.id === 'ANIMALS' ? `<div class="btn-icon-emoji" style="transform:none;font-size:30px;">🦁</div><div style="font-size:18px;font-weight:900;color:#fff;text-shadow: 0 2px 4px #000;">BEAST (1.9x)</div>` : 
                         (b.id === 'BIRDS' ? `<div class="btn-icon-emoji" style="transform:none;font-size:30px;">🦅</div><div style="font-size:18px;font-weight:900;color:#fff;text-shadow: 0 2px 4px #000;">BIRD (1.9x)</div>` : 
                         `<img src="assets/${b.id.toLowerCase()}.png.png" onerror="this.innerHTML='🐾';">`));
            
            div.innerHTML = `
                <div class="my-bet-text" id="mybet-${b.id}">0</div>
                <div class="pool-text"><span id="total-${b.id}">0</span></div>
                <div class="img-wrapper" ${b.id==='ANIMALS'||b.id==='BIRDS'?'style="flex-direction:row;gap:10px;"':''}>${iconStr}</div>
                ${b.id!=='ANIMALS' && b.id!=='BIRDS' ? `<div class="btn-multi">x${b.m}</div>` : ''}
            `;
        }
        bc.appendChild(div);
    });

    const trackSequence = [
        {id:'eagle', m:'x12'},{id:'eagle', m:'x12'},{id:'eagle', m:'x12'},{id:'frog', m:'HOUSE'},{id:'lion', m:'x12'},{id:'lion', m:'x12'},{id:'lion', m:'x12'},
        {id:'rabbit', m:'x6'},{id:'rabbit', m:'x6'},{id:'rabbit', m:'x6'},{id:'monkey', m:'x8'},{id:'monkey', m:'x8'},{id:'monkey', m:'x8'},
        {id:'elephant', m:'x8'},{id:'elephant', m:'x8'},{id:'elephant', m:'x8'},{id:'shark', m:'x24'},{id:'parrot', m:'x6'},{id:'parrot', m:'x6'},{id:'parrot', m:'x6'},
        {id:'dove', m:'x8'},{id:'dove', m:'x8'},{id:'dove', m:'x8'},{id:'peacock', m:'x8'},{id:'peacock', m:'x8'},{id:'peacock', m:'x8'}
    ];
    let trackElements = [];
    const board = $('board');
    function addTrackItem(obj, r, c) {
        let d = document.createElement('div'); d.className = `track-item bg-${obj.id}`; d.style.gridArea = `${r}/${c}`;
        d.innerHTML = obj.id==='frog' ? '🐸' : (obj.id==='shark'?'🦈':`<img src="assets/${obj.id}.png.png">`);
        d.innerHTML += `<span class="mult-tag">${obj.m}</span>`;
        board.appendChild(d); trackElements.push({elem:d, id:obj.id});
    }
    for(let i=1;i<=8;i++) addTrackItem(trackSequence[trackElements.length],1,i);
    for(let i=2;i<=6;i++) addTrackItem(trackSequence[trackElements.length],i,8);
    for(let i=8;i>=1;i--) addTrackItem(trackSequence[trackElements.length],7,i);
    for(let i=6;i>=2;i--) addTrackItem(trackSequence[trackElements.length],i,1);

    const tray = $('chips-tray');
    chipVals.forEach(v => {
        let m = document.createElement('img'); m.className = 'chip-img'; m.src = chipImgs[v];
        m.onclick = () => { selectedChipVal=v; selectedChipSrc=m.src; document.querySelectorAll('.chip-img').forEach(c=>c.classList.remove('active')); m.classList.add('active'); };
        tray.appendChild(m);
    });

    // FIREBASE
    firebase.initializeApp({ apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" });
    const db = firebase.database();
    const currentUserId = localStorage.getItem('userPhone') || "GUEST";
    let userBalance = 0, depB=0, winB=0, bonB=0, isBettingOpen=false;

    $('p-id').innerText = "ID: " + (currentUserId==="GUEST" ? "0000" : currentUserId.slice(-4));
    if(currentUserId!=="GUEST") {
        db.ref('users/'+currentUserId).on('value', s => {
            let d=s.val()||{}; depB=parseFloat(d.balance||0); winB=parseFloat(d.winning_balance||0); bonB=parseFloat(d.bonus_balance||0);
            userBalance = depB+winB+bonB;
            $('wallet-bal').innerText = Math.floor(userBalance);
        });
    }

    function updHistory(wId) {
        if(!wId) return;
        const list = $('history-list');
        const n = document.createElement('div'); n.className = 'h-item'; 
        let normId = wId.toLowerCase().trim(); if (normId === 'd24') normId = 'shark';
        n.innerHTML = normId === 'frog' ? `<span>🐸</span>` : (normId === 'shark' ? `<span>🦈</span>` : `<img src="assets/${normId}.png.png" onerror="this.innerHTML='🐾';">`);
        list.insertBefore(n, list.firstChild); 
        if(list.children.length > 8) list.removeChild(list.lastChild); 
    }

    db.ref('Game/ZooRoulette/History').once('value', s => { 
        let r = s.val(); if (r && Array.isArray(r)) { [...r].forEach(w => updHistory(w)); }
    });

    // GAME ENGINE & 5 SECOND BEEP
    let localTimer=15, localState='betting', botInt, lastBeep=-1;
    
    setInterval(() => {
        localTimer--;
        let tmr = $('main-timer');

        if (localState === 'betting' && localTimer <= 5 && localTimer > 0 && lastBeep !== localTimer) {
            playSound('snd-beep', 0.8);
            lastBeep = localTimer;
        }

        if(localState === 'betting' && localTimer === 1) {
            isBettingOpen = false;
            clearInterval(botInt); 
            triggerBanner('alert-stop');
        }

        if(localTimer <= 0) {
            if(localState === 'betting') {
                localState = 'result';
                localTimer = 8;
                lastBeep = -1;
                
                tmr.innerText = "STOP";
                tmr.style.color = "#ff3333";
                setTimeout(() => { tmr.style.opacity = '0'; }, 1000); 
                
                let randomWin = trackSequence[Math.floor(Math.random() * trackSequence.length)].id;
                runSpin(randomWin, false);
            }
            else if(localState === 'result') {
                localState = 'waiting';
                localTimer = 5;
            }
            else {
                localState = 'betting';
                localTimer = 15;
                lastBeep = -1;
                isBettingOpen = true;
                tmr.style.opacity = '1';
                tmr.style.color = "#fff";

                betKeys.forEach(k => { 
                    myBets[k]=0; fakePools[k]=0; realPools[k]=0;
                    let e=$(`total-${k}`); if(e) e.innerText="0"; 
                    let mb=$(`mybet-${k}`); if(mb) { mb.style.display='none'; mb.innerText="0"; }
                });
                document.querySelectorAll('.winning, .active').forEach(e=>e.classList.remove('winning','active'));
                $('chips-layer').innerHTML = ''; 

                triggerBanner('alert-start'); 
                clearInterval(botInt); 
                botInt = setInterval(botAction, 150); 
            }
        }

        if(localState === 'betting') {
            tmr.innerText = localTimer > 0 ? localTimer : 0;
            tmr.style.color = localTimer <= 5 ? "#ff3333" : "#fff";
        }
    }, 1000);

    // BOTS BETTING (Stealth Fade)
    function botAction() {
        if(!isBettingOpen) return;
        let count = Math.floor(Math.random()*5)+4; 
        for(let i=0; i<count; i++) {
            let k = betKeys[Math.floor(Math.random()*betKeys.length)];
            if(Math.random() > 0.6) k = Math.random() > 0.5 ? 'ANIMALS' : 'BIRDS'; 
            
            let val = chipVals[Math.floor(Math.random()*chipVals.length)];
            if(Math.random() > 0.4) val = chipVals[Math.floor(Math.random()*3)+2]; 
            
            fakePools[k] += val;
            let el = $(`total-${k}`); if(el) el.innerText = fakePools[k] + realPools[k]; 

            let f = document.createElement('img'); f.className='placed-chip-img'; f.src=chipImgs[val];
            f.style.opacity = '0'; 
            
            let sP = getPos($('online-players-box'));
            f.style.left = (sP.x+20+Math.random()*20)+'px'; f.style.top = (sP.y+10+Math.random()*10)+'px';
            $('chips-layer').appendChild(f);
            
            if(Math.random() > 0.85) playSound('snd-drop', 0.05);
            
            let tP = getPos($('btn-'+k));
            if(tP) {
                setTimeout(() => {
                    f.style.opacity = '1'; 
                    f.style.left = (tP.x+10+Math.random()*40)+'px'; f.style.top = (tP.y+10+Math.random()*30)+'px';
                    setTimeout(() => { f.style.opacity='0'; setTimeout(()=>f.remove(),200); }, 250);
                }, 20 + (i*10));
            }
        }
    }

    function runSpin(win) {
        let stop = trackElements.findIndex(e=>e.id===win);
        let curr=0, steps=0, total=(trackElements.length*2)+stop, speed=50;
        function step() {
            trackElements.forEach(e=>e.elem.classList.remove('active'));
            trackElements[curr].elem.classList.add('active');
            if(steps>=total) { 
                trackElements[curr].elem.classList.add('winning'); 
                let b=$('btn-'+win); if(b) b.classList.add('winning');
                processWin(win); 
                return; 
            }
            steps++; curr=(curr+1)%trackElements.length;
            setTimeout(step, speed + (steps>total-10?steps*2:0));
        }
        step();
    }

    function processWin(winId) {
        playSound('soundWin', 1.0); 
        updHistory(winId); 
        
        let totalWin = 0;
        let isBeast = ['monkey','rabbit','lion','elephant'].includes(winId);
        let isBird = ['peacock','eagle','parrot','dove'].includes(winId);

        if (currentUserId !== "GUEST") {
            db.ref(`Game/ZooRoulette/Bets/${currentUserId}`).once('value', s => {
                let uBets = s.val() || {};
                let bW = uBets[winId] || 0;
                let bBeast = uBets['ANIMALS'] || 0;
                let bBird = uBets['BIRDS'] || 0;

                if (bW > 0) {
                    let ob = trackSequence.find(z => z.id === winId);
                    if(ob) totalWin += bW * parseInt(ob.m.replace('x',''));
                }
                if (isBeast && bBeast > 0) { totalWin += bBeast * 1.9; document.getElementById('btn-ANIMALS').classList.add('winning'); }
                if (isBird && bBird > 0) { totalWin += bBird * 1.9; document.getElementById('btn-BIRDS').classList.add('winning'); }

                if (totalWin > 0) {
                    showToast(`🎉 WOOOHOO! Aap jeete ₹${Math.floor(totalWin)}`);
                    db.ref(`users/${currentUserId}/winning_balance`).set(winB + totalWin);
                }
            });
        }
        
        let b = document.getElementById(`btn-${winId}`);
        if(b) {
            let winBoxPos = getPos(b);
            let walletPos = getPos(document.getElementById('my-wallet'));
            let onlinePos = getPos(document.getElementById('online-players-box'));
            let isPortrait = window.matchMedia("(orientation: portrait)").matches;

            playSound('snd-fly', 1.0);

            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    let c = document.createElement('img'); c.className = 'placed-chip-img'; c.src = chipImgs[100]; 
                    c.style.left = (winBoxPos.x + b.offsetWidth/2) + 'px'; 
                    c.style.top = (winBoxPos.y + b.offsetHeight/2) + 'px'; 
                    c.style.zIndex = 999;
                    if (isPortrait) c.style.transform = 'rotate(90deg)';
                    document.getElementById('chips-layer').appendChild(c);
                    
                    setTimeout(() => { 
                        let targetPos = Math.random() > 0.4 ? walletPos : onlinePos;
                        c.style.left = (targetPos.x + 30) + 'px'; 
                        c.style.top = (targetPos.y + 15) + 'px'; 
                        c.style.opacity = '0'; 
                    }, 50); 
                    setTimeout(() => c.remove(), 700);
                }, i * 40); 
            }
        }
    }

    // 🔥 SMART BETTING LIMITS 🔥
    window.placeBet = function(el, id, ev) {
        if(!isBettingOpen) { showToast("⛔ Wait! Betting is closed."); return; }
        if(userBalance < selectedChipVal) { showToast("⚠️ Low Balance!"); return; }

        let activeBets = Object.keys(myBets).filter(k => myBets[k] > 0);
        let betCount = activeBets.length;

        // Limit Check Logic
        if (myBets[id] === 0) {
            if (betCount >= 5 && id !== 'shark') {
                showToast("Aap maximum 5 jagah bet laga sakte hain!");
                return;
            }
            if (id === 'shark' && betCount < 4) {
                showToast("Shark par lagane ke liye pehle 4 jagah bet lagayein!");
                return;
            }
        }

        playSound('snd-drop', 1.0); 
        
        let nD=depB, nW=winB, rm=selectedChipVal;
        if(nD>=rm) nD-=rm; else { rm-=nD; nD=0; nW-=rm; }
        db.ref('users/'+currentUserId).update({balance:nD, winning_balance:nW});
        
        realPools[id] += selectedChipVal;
        let tEl = $(`total-${id}`); tEl.innerText = fakePools[id] + realPools[id];
        
        myBets[id] += selectedChipVal;
        let mb = $(`mybet-${id}`);
        if(mb) { mb.innerText = myBets[id]; mb.style.display = 'block'; }

        let wP = getPos($('my-wallet')), f = document.createElement('img');
        f.className='placed-chip-img'; f.src=selectedChipSrc;
        f.style.left=(wP.x+50)+'px'; f.style.top=(wP.y+20)+'px';
        $('chips-layer').appendChild(f);
        let tP = getPos(el);
        setTimeout(() => {
            f.style.left=(tP.x+20)+'px'; f.style.top=(tP.y+20)+'px';
            setTimeout(()=> { f.style.opacity='0'; setTimeout(()=>f.remove(),200); }, 300);
        }, 50);
    };
</script>
