<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kalyan VIP Zoo - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; position: fixed; }

        /* 🔥 PREMIUM WRAPPER 🔥 */
        #game-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background: radial-gradient(circle at center, #1b263b, #0d1b2a, #000000);
            box-sizing: border-box; overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Portrait Mode auto-rotate logic */
        @media screen and (orientation: portrait) {
            #game-wrapper {
                top: 50%; left: 50%; width: 100vh; height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
            }
        }

        .bg-img-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.2; pointer-events: none; }
        
        /* Modals and Alerts */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-weight: 900; font-size: 18px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,215,0,0.2); border-top: 5px solid #ffd700; border-radius: 50%; animation: spinLoader 1s linear infinite; margin-bottom: 15px; }
        @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Top Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 15px; background: linear-gradient(90deg, #111, #333, #111); border-bottom: 1px solid #ffd700; position: relative; z-index: 100; height: 35px; }
        .logo { font-size: 16px; font-weight: 900; color: #ffd700; text-shadow: 0 0 5px rgba(255,215,0,0.8); flex: 1; text-align: center; letter-spacing: 1px; }
        .back-btn { font-size: 18px; cursor: pointer; color: #fff; width: 30px; }

        /* 🔥 MAIN 3-COLUMN LAYOUT 🔥 */
        .main-area { flex: 1; display: flex; flex-direction: row; align-items: stretch; position: relative; z-index: 10; padding: 5px; gap: 5px; min-height: 0; }

        /* LEFT PANEL (Profile & Wallet) */
        .left-panel { width: 65px; background: rgba(0,0,0,0.5); border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; padding: 5px 2px; }
        .avatar-box { width: 45px; height: 45px; background: #222; border-radius: 50%; border: 2px solid #ffd700; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .wallet-box { width: 100%; text-align: center; background: #111; color: #ffd700; border: 1px solid #ffd700; border-radius: 4px; padding: 4px 0; font-size: 10px; font-weight: 900; margin-bottom: 5px; }
        .server-status { font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 10px; border: 1px solid #ff3333; color: #ff3333; text-align: center; width: 100%; margin-bottom: auto; }
        .online-count { font-size: 9px; color: #00ff88; font-weight: bold; text-align: center; margin-top: auto; }

        /* CENTER PANEL (Game Board) */
        .center-panel { flex: 1; display: flex; justify-content: center; align-items: center; min-width: 0; position: relative; }
        
        .game-board { 
            display: grid; 
            grid-template-columns: repeat(8, minmax(0, 1fr)); 
            grid-template-rows: repeat(7, minmax(0, 1fr)); 
            height: 100%; max-width: 100%; aspect-ratio: 8 / 7; margin: 0 auto;
            background: #0b0f19; border: 3px solid #ffb300; border-radius: 12px; padding: 4px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            gap: 2px;
        }

        /* 🔥 PREMIUM TRACK ITEMS 🔥 */
        .track-item { 
            background: #1c2438; border: 1px solid #3a4763; border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; transition: 0.1s; overflow: hidden;
        }
        .track-item img { width: 75%; height: 75%; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8)); z-index: 2; }
        .track-item .mult-tag { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #ffd700; font-weight: 900; z-index: 3; }
        
        .track-item.active { background: #ffd700; border-color: #fff; box-shadow: 0 0 15px #ffd700; z-index: 10; }
        .track-item.winning { background: #39ff14 !important; border-color: #fff; transform: scale(1.1); box-shadow: 0 0 20px #39ff14; z-index: 20; animation: blinkWin 0.5s infinite alternate; }

        /* CENTER BETS INNER BOX */
        .center-bets { 
            grid-area: 2 / 2 / 7 / 8; 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            grid-template-rows: repeat(3, minmax(0, 1fr)); 
            gap: 4px; padding: 6px; background: rgba(0,0,0,0.4); 
            border: 2px solid #555; border-radius: 8px; position: relative; 
        }

        .bet-btn { 
            border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 2px solid; position: relative; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); 
            min-width: 0; min-height: 0; overflow: hidden; 
        }
        .bet-btn:active { transform: scale(0.95); }
        .bet-btn.winning { border-color: #39ff14 !important; background: #003300 !important; transform: scale(1.05); z-index: 15; box-shadow: 0 0 20px #39ff14; animation: blinkWin 0.5s infinite alternate; }
        @keyframes blinkWin { to { box-shadow: 0 0 30px #39ff14; filter: brightness(1.3); } }
        
        .btn-monkey { border-color: #a1887f; background: linear-gradient(to bottom, #4e342e, #3e2723); }
        .btn-rabbit { border-color: #ce93d8; background: linear-gradient(to bottom, #6a1b9a, #4a148c); }
        .btn-peacock { border-color: #80deea; background: linear-gradient(to bottom, #00838f, #006064); }
        .btn-lion { border-color: #ffca28; background: linear-gradient(to bottom, #f57c00, #e65100); }
        .btn-shark { border-color: #ffd700; background: radial-gradient(circle, #424242, #212121); }
        .btn-eagle { border-color: #ef9a9a; background: linear-gradient(to bottom, #c62828, #b71c1c); }
        .btn-parrot { border-color: #a5d6a7; background: linear-gradient(to bottom, #2e7d32, #1b5e20); }
        .btn-elephant { border-color: #b0bec5; background: linear-gradient(to bottom, #546e7a, #37474f); }
        .btn-dove { border-color: #eeeeee; background: linear-gradient(to bottom, #616161, #424242); }

        .bet-btn img { width: 50%; height: 50%; object-fit: contain; filter: drop-shadow(0 3px 3px #000); margin-bottom: 2px; }
        .btn-icon-emoji { font-size: 26px; filter: drop-shadow(0 3px 3px #000); margin-bottom: 2px; }
        
        .pool-text { position: absolute; top: -2px; right: 0px; font-size: 9px; color: #fff; background: #ff0000; padding: 1px 4px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .my-bet-tag { position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; font-size: 9px; padding: 1px 6px; border-radius: 4px 4px 0 0; font-weight: 900; display: none; z-index: 20; }
        .btn-multi { color: #ffd700; font-size: 10px; font-weight: 900; background: rgba(0,0,0,0.6); padding: 0 4px; border-radius: 4px; }

        .huge-timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 45px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #ff007f; 
            background: rgba(0,0,0,0.9); padding: 10px 40px; border-radius: 10px; border: 3px solid #ff007f; 
            z-index: 999; display: none;
        }

        /* 🔥 RIGHT PANEL (VERTICAL RECORD) 🔥 */
        .right-panel { width: 45px; background: rgba(0,0,0,0.5); border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; padding: 5px 2px; }
        .r-title { color: #ffd700; font-size: 9px; font-weight: bold; margin-bottom: 5px; writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }
        .h-list { display: flex; flex-direction: column; gap: 4px; flex: 1; width: 100%; overflow: hidden; align-items: center; }
        .h-item { width: 30px; height: 30px; background: #1c2438; border-radius: 50%; border: 1px solid #ffd700; display: flex; justify-content: center; align-items: center; padding: 3px; }
        .h-item img { width: 100%; height: 100%; object-fit: contain; }

        /* BOTTOM AREA (Categories & Chips) */
        .bottom-area { padding: 5px 15px; display: flex; flex-direction: column; gap: 5px; background: linear-gradient(0deg, #000, transparent); z-index: 100; position: relative; }
        
        .category-bets { display: flex; justify-content: space-evenly; gap: 10px; width: 100%; max-width: 600px; margin: 0 auto; }
        .cat-btn { flex: 1; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid; box-shadow: 0 4px 6px rgba(0,0,0,0.6); position: relative; }
        .bg-beast { background: linear-gradient(145deg, #d32f2f, #660000); border-color: #ff5252; }
        .bg-bird { background: linear-gradient(145deg, #1976d2, #002171); border-color: #448aff; }
        
        .footer-chips { display: flex; justify-content: space-evenly; align-items: center; width: 100%; padding: 4px 0; background: rgba(0,0,0,0.6); border-radius: 10px; }
        .chip-img { width: 38px; height: 38px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 4px 4px #000); }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 10px #ffd700); }

        .placed-chip-img { position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 100; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.8)); transition: all 0.5s ease; }
        .win-anim-chip { z-index: 999 !important; }

        .alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; width: 50%; max-width: 250px; display: none; pointer-events: none; }
        .alert img, .alert video { width: 100%; filter: drop-shadow(0 0 20px rgba(0,0,0,1)); border-radius: 10px; }
        .toast-msg { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(220, 38, 38, 0.95); color: white; padding: 8px 16px; border-radius: 8px; font-weight: 900; z-index: 9999; border: 2px solid #fff; display: none; font-size: 13px; text-align: center; }
    </style>
</head>

<script>
    setTimeout(() => document.getElementById('initial-loader').style.display = 'none', 3000);

    let isAudioInit = false;
    function initAudio() { 
        if(!isAudioInit) { 
            isAudioInit = true; 
            let vid = document.getElementById('vid-wait'); 
            vid.muted = true; vid.play().catch(e=>{}); 
        }
        let elem = document.documentElement;
        if (elem.requestFullscreen) { elem.requestFullscreen().catch(err => console.log(err)); }
    }

    function playSound(id, vol) { 
        try { if(!isAudioInit) return; let c = document.getElementById(id).cloneNode(); c.volume = vol; c.play().catch(e=>{}); } catch(e){} 
    }
    function showToast(msg) { 
        let t = document.getElementById('toastMsg'); t.innerHTML = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); 
    }

    const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png", 10000: "assets/10000_0.png" };
    let selectedChipVal = 10; let selectedChipSrc = chipImgs[10];

    const betData = [
        {id:'monkey', m:8, cls:'btn-monkey', type:'img'}, {id:'rabbit', m:6, cls:'btn-rabbit', type:'img'}, {id:'peacock', m:8, cls:'btn-peacock', type:'img'}, 
        {id:'lion', m:12, cls:'btn-lion', type:'img'}, {id:'shark', m:24, cls:'btn-shark', type:'emoji', emoji:'🦈'}, 
        {id:'eagle', m:12, cls:'btn-eagle', type:'img'}, 
        {id:'parrot', m:6, cls:'btn-parrot', type:'img'}, {id:'elephant', m:8, cls:'btn-elephant', type:'img'}, {id:'dove', m:8, cls:'btn-dove', type:'img'}
    ];
    let myBets = { 'ANIMALS': 0, 'BIRDS': 0 };
    
    const betContainer = document.getElementById('bet-container');
    betData.forEach(item => {
        myBets[item.id] = 0;
        const div = document.createElement('div');
        div.className = `bet-btn ${item.cls}`; div.id = `btn-${item.id}`;
        div.onclick = (event) => placeBet(div, item.id, event);
        let iconHtml = item.type === 'emoji' ? `<div class="btn-icon-emoji">${item.emoji}</div>` : `<img src="assets/${item.id}.png.png" onerror="this.style.display='none'">`;
        div.innerHTML = `
            <div class="pool-text"><span id="total-${item.id}">0</span></div>
            ${iconHtml}
            <div class="btn-multi">x${item.m}</div>
            <div class="my-bet-tag" id="my-${item.id}">₹<span>0</span></div>
        `;
        betContainer.appendChild(div);
    });

    // HAR JANWAR PAR MULTIPLIER ADD KIYA
    const trackSequence = [
        {id:'eagle', m:'x12'},{id:'eagle', m:'x12'},{id:'eagle', m:'x12'},{id:'frog', m:'HOUSE'},{id:'lion', m:'x12'},{id:'lion', m:'x12'},{id:'lion', m:'x12'},
        {id:'rabbit', m:'x6'},{id:'rabbit', m:'x6'},{id:'rabbit', m:'x6'},{id:'monkey', m:'x8'},{id:'monkey', m:'x8'},{id:'monkey', m:'x8'},
        {id:'elephant', m:'x8'},{id:'elephant', m:'x8'},{id:'elephant', m:'x8'},{id:'parrot', m:'x6'},{id:'parrot', m:'x6'},{id:'parrot', m:'x6'},
        {id:'shark', m:'x24'},{id:'dove', m:'x8'},{id:'dove', m:'x8'},{id:'dove', m:'x8'},{id:'peacock', m:'x8'},{id:'peacock', m:'x8'},{id:'peacock', m:'x8'}
    ];
    
    let trackElements = [];
    const board = document.getElementById('board');
    
    function addTrackItem(obj, row, col) {
        let div = document.createElement('div'); div.className = 'track-item'; div.style.gridArea = `${row} / ${col}`; 
        if (obj.id === 'frog') { 
            div.innerHTML = `<span style="font-size: 22px">🐸</span><div style="position:absolute;font-size:7px;bottom:1px;background:red;color:white;padding:1px 3px;font-weight:900;border-radius:3px;z-index:3;">HOUSE</div>`; 
        } else if (obj.id === 'shark') { 
            div.innerHTML = `<span style="font-size: 22px">🦈</span><div style="position:absolute;font-size:7px;bottom:1px;background:#ffd700;color:black;padding:1px 3px;font-weight:900;border-radius:3px;z-index:3;">x24</div>`; 
        } else { 
            div.innerHTML = `<img src="assets/${obj.id}.png.png" onerror="this.style.display='none'"><span class="mult-tag">${obj.m}</span>`; 
        }
        board.appendChild(div); trackElements.push({ elem: div, id: obj.id });
    }
    
    for(let i=1; i<=8; i++) addTrackItem(trackSequence[trackElements.length], 1, i);
    for(let i=2; i<=6; i++) addTrackItem(trackSequence[trackElements.length], i, 8);
    for(let i=8; i>=1; i--) addTrackItem(trackSequence[trackElements.length], 7, i);
    for(let i=6; i>=2; i--) addTrackItem(trackSequence[trackElements.length], i, 1);

    const chipVals = [10, 50, 100, 500, 1000, 5000, 10000];
    const tray = document.getElementById('chips-tray');
    chipVals.forEach((val, idx) => {
        let m = document.createElement('img'); m.className = `chip-img ${idx === 0 ? 'act' : ''}`; 
        m.src = chipImgs[val] || `assets/${val}_0.png`;
        m.onclick = () => {
            selectedChipVal = val; selectedChipSrc = m.src;
            document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('act'));
            m.classList.add('act'); playSound('soundBet', 0.5);
        };
        tray.appendChild(m);
    });

    // ----------------------------------------------------
    // 🔥 FIREBASE CONNECTION 🔥
    // ----------------------------------------------------
    const fConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(fConfig);
    const db = firebase.database();
    
    const currentUserId = localStorage.getItem('phone') || "VIP_TEST_USER"; 
    let userBalance = 0, depBal = 10000, winBal = 0, bonBal = 0;
    let isBettingOpen = false, isSpinningLocal = false;
    let botInterval, alertTimeout, waitTimeout;
    const beastsList = ['monkey', 'rabbit', 'lion', 'elephant'];
    const birdsList = ['peacock', 'eagle', 'parrot', 'dove'];

    db.ref('.info/connected').on('value', snap => {
        let sbox = document.getElementById('server-status');
        if (snap.val() === true) {
            sbox.innerHTML = '🟢 Online'; sbox.style.color = '#39ff14'; sbox.style.borderColor = '#39ff14';
        } else {
            sbox.innerHTML = '🔴 Offline'; sbox.style.color = '#ff3333'; sbox.style.borderColor = '#ff3333';
        }
    });

    if (currentUserId !== "GUEST") {
        db.ref(`users/${currentUserId}`).on('value', s => { 
            let data = s.val() || {}; 
            depBal = parseFloat(data.balance || 10000); 
            winBal = parseFloat(data.winning_balance || 0); 
            bonBal = parseFloat(data.bonus_balance || 0);
            userBalance = depBal + winBal + bonBal; 
            document.getElementById('wallet-bal').innerText = userBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        });
    }

    // VERTICAL HISTORY APPEND
    function updHistory(wId) {
        if(!wId) return;
        const list = document.getElementById('history-list');
        const n = document.createElement('div'); n.className = 'h-item'; 
        let normId = wId.toLowerCase().trim(); if (normId === 'd24') normId = 'shark';
        if(normId === 'frog') n.innerHTML = `<span style="font-size:16px">🐸</span>`;
        else if(normId === 'shark') n.innerHTML = `<span style="font-size:16px">🦈</span>`;
        else n.innerHTML = `<img src="assets/${normId}.png.png" onerror="this.style.display='none'">`;
        
        list.insertBefore(n, list.firstChild);
        if(list.children.length > 7) list.removeChild(list.lastChild); 
    }

    db.ref('Game/ZooRoulette/History').once('value', s => { 
        let r = s.val(); if (r && Array.isArray(r)) { [...r].reverse().forEach(w => updHistory(w)); }
    });

    db.ref('Game/ZooRoulette/Bets').on('value', s => {
        let allB = s.val() || {};
        let tp = {'monkey':0, 'rabbit':0, 'lion':0, 'elephant':0, 'peacock':0, 'eagle':0, 'parrot':0, 'dove':0, 'shark':0, 'ANIMALS':0, 'BIRDS':0};
        for(let u in allB) { if(!u.includes('bot')) for(let c in allB[u]) if(tp[c] !== undefined) tp[c] += allB[u][c]; }
        for(let c in tp) { 
            let elem = document.getElementById(`total-${c}`); 
            if(elem && tp[c] > 0) elem.innerText = tp[c] > 999 ? (tp[c]/1000).toFixed(1)+'k' : tp[c]; 
            else if(elem) elem.innerText = "0";
        }
    });

    // ----------------------------------------------------
    // 🔥 AUTO-FALLBACK TIMER FOR TESTING 🔥
    // ----------------------------------------------------
    let localTimer = 15;
    let localState = 'betting';
    
    function updateGameState(st) {
        let tEl = document.getElementById('main-timer'); 
        tEl.innerText = st.timer; 
        tEl.style.color = st.timer <= 5 ? "#ff3333" : "#fff";
        
        if (st.state === 'betting') {
            isSpinningLocal = false; 
            clearTimeout(alertTimeout); clearTimeout(waitTimeout);
            document.getElementById('alert-stop').style.display = 'none'; 
            document.getElementById('alert-wait').style.display = 'none'; 
            tEl.style.display = 'block';
            trackElements.forEach(e => { e.elem.classList.remove('active', 'winning'); });
            document.querySelectorAll('.bet-btn, .cat-btn').forEach(b => b.classList.remove('winning'));
            
            if (!isBettingOpen) {
                isBettingOpen = true; 
                document.querySelectorAll('.placed-chip-img').forEach(c => c.remove()); 
                document.getElementById('alert-start').style.display = 'block'; 
                setTimeout(() => document.getElementById('alert-start').style.display = 'none', 800); 
                clearInterval(botInterval); botInterval = setInterval(botAction, 250); 
            }
        } 
        else if (st.state === 'result' || st.state === 'waiting') {
            if (isBettingOpen && !isSpinningLocal) {
                isBettingOpen = false; isSpinningLocal = true; 
                clearInterval(botInterval); 
                tEl.style.display = 'none'; 
                document.getElementById('alert-stop').style.display = 'block'; 
                alertTimeout = setTimeout(() => { document.getElementById('alert-stop').style.display = 'none'; }, 800);
            }
        }
    }

    setInterval(() => {
        localTimer--;
        if (localTimer <= 0) {
            if (localState === 'betting') { 
                localState = 'result'; localTimer = 8; 
                document.getElementById('alert-stop').style.display = 'none';
                let randomWin = trackSequence[Math.floor(Math.random() * trackSequence.length)].id;
                runSpin(randomWin, false);
            }
            else if (localState === 'result') { localState = 'waiting'; localTimer = 5; }
            else { 
                localState = 'betting'; localTimer = 15; 
                Object.keys(myBets).forEach(k => { 
                    myBets[k] = 0; 
                    let m = document.getElementById(`my-${k}`); 
                    if(m){ m.style.display = 'none'; m.querySelector('span').innerText = '0'; }
                }); 
                document.querySelectorAll('.pool-text span').forEach(sp => sp.innerText = '0');
                document.querySelectorAll('.placed-chip-img').forEach(c => c.remove()); 
            }
        }
        updateGameState({ timer: localTimer, state: localState });
    }, 1000);

    // ----------------------------------------------------
    // 5. GAMEPLAY & CHIP ANIMATIONS
    // ----------------------------------------------------
    function botAction() {
        if(!isBettingOpen) return; 
        if(Math.random() > 0.4) return;
        const targets = ['monkey','elephant','peacock','lion','shark','eagle','parrot','rabbit','dove','ANIMALS','BIRDS'];
        let tId = targets[Math.floor(Math.random() * targets.length)];
        let fV = chipVals[Math.floor(Math.random() * chipVals.length)];
        
        let fly = document.createElement('img'); fly.className = 'placed-chip-img'; 
        fly.src = chipImgs[fV] || chipImgs[100]; 
        
        let isPortrait = window.matchMedia("(orientation: portrait)").matches;
        fly.style.left = (window.innerWidth / 2) + 'px'; 
        fly.style.top = (window.innerHeight / 2) + 'px'; 
        if (isPortrait) fly.style.transform = 'rotate(90deg)';
        document.body.appendChild(fly); 
        playSound('soundBet', 0.02);
        
        let destNode = document.getElementById(`btn-${tId}`);
        if(!destNode) return;
        let dest = destNode.getBoundingClientRect();
        
        setTimeout(() => {
            fly.style.left = (dest.left + 10 + Math.random() * (dest.width - 20)) + 'px';
            fly.style.top = (dest.top + 10 + Math.random() * (dest.height - 20)) + 'px';
        }, 50);
        if (document.querySelectorAll('.placed-chip-img').length > 100) document.querySelector('.placed-chip-img').remove();
    }

    function runSpin(winRaw, skipAnim) {
        let w = winRaw.toString().toLowerCase().trim(); if (w === 'd24') w = 'shark';
        let p = []; trackElements.forEach((n, i) => { if (n.id === w) p.push(i); }); 
        if (!p.length) { p = [0]; w = trackElements[0].id; }
        let finalStop = p[Math.floor(Math.random() * p.length)];
        if (skipAnim) { processWin(w, finalStop, true); return; }
        
        let snd = document.getElementById('soundSpin'); snd.currentTime = 0; snd.loop = true; snd.volume = 0.8; snd.play().catch(()=>{});
        let curr = 0, stepsDone = 0, totalSteps = (trackElements.length * 2) + finalStop, speed = 40;
        function step() {
            trackElements.forEach(e => e.elem.classList.remove('active')); 
            trackElements[curr].elem.classList.add('active');
            if (stepsDone >= totalSteps) { snd.pause(); processWin(w, curr, false); return; }
            stepsDone++; curr = (curr + 1) % trackElements.length;
            if (totalSteps - stepsDone < 10) speed += 30;
            setTimeout(step, speed);
        }
        step();
    }

    function processWin(winId, trackIdx, skipAnim) {
        playSound('soundWin', 1.0); 
        trackElements[trackIdx].elem.classList.add('winning'); 
        let b = document.getElementById(`btn-${winId}`); if(b) b.classList.add('winning');
        
        document.querySelectorAll('.placed-chip-img:not(.win-anim-chip)').forEach(c => {
            c.style.opacity = '0'; c.style.transform = 'scale(0)'; setTimeout(() => c.remove(), 500);
        });
        
        updHistory(winId); let totalWin = 0;
        if (currentUserId !== "GUEST") {
            let ob = betData.find(z => z.id === winId); 
            if(ob && myBets[winId] > 0) totalWin += myBets[winId] * ob.m;
            if (beastsList.includes(winId) && myBets['ANIMALS'] > 0) { totalWin += myBets['ANIMALS'] * 1.9; document.getElementById('btn-ANIMALS').classList.add('winning'); }
            if (birdsList.includes(winId) && myBets['BIRDS'] > 0) { totalWin += myBets['BIRDS'] * 1.9; document.getElementById('btn-BIRDS').classList.add('winning'); }
            if (totalWin > 0) { db.ref(`users/${currentUserId}/winning_balance`).set(winBal + totalWin); }
        }
        
        if (totalWin > 0 && !skipAnim) showToast(`🎉 WOOOHOO! Aap jeete ₹${totalWin}`);
        if (!skipAnim) {
            let bRect = document.getElementById('board').getBoundingClientRect();
            let isPortrait = window.matchMedia("(orientation: portrait)").matches;
            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    let c = document.createElement('img'); c.className = 'placed-chip-img win-anim-chip'; c.src = chipImgs[100]; 
                    c.style.left = (bRect.left + bRect.width/2) + 'px'; c.style.top = (bRect.top + bRect.height/2) + 'px'; 
                    c.style.zIndex = 999; 
                    if(isPortrait) c.style.transform = 'rotate(90deg)';
                    document.body.appendChild(c);
                    setTimeout(() => { 
                        c.style.left = (Math.random() * window.innerWidth) + 'px'; 
                        c.style.top = '10vh'; c.style.opacity = '0'; 
                    }, 50); 
                    setTimeout(() => c.remove(), 700);
                }, i * 40); 
            }
            playSound('soundCoins', 0.8);
        }
        
        if (skipAnim) {
            document.getElementById('alert-wait').style.display = 'block'; 
            document.getElementById('vid-wait').play().catch(()=>{});
        } else {
            waitTimeout = setTimeout(() => { 
                document.getElementById('alert-wait').style.display = 'block'; 
                document.getElementById('vid-wait').play().catch(()=>{}); 
            }, 3500);
        }
    }

    window.placeBet = function(el, id, event) {
        if (!isBettingOpen || currentUserId === "GUEST" || userBalance < selectedChipVal) return;
        
        let activeB = Object.keys(myBets).filter(k => myBets[k] > 0);
        let restrictB = activeB.filter(k => beastsList.includes(k) || birdsList.includes(k));
        if (myBets[id] === 0 && !birdsList.includes(id) && !beastsList.includes(id) && id !== 'shark' && restrictB.length >= 4) {
            showToast("⚠️ Aap sirf 4 jagah bet laga sakte hain!"); return;
        }
        
        playSound('soundBet', 1.0); 
        let nDep = depBal, nWin = winBal, rem = selectedChipVal; 
        if(nDep >= rem) nDep -= rem; 
        else { rem -= nDep; nDep = 0; nWin -= rem; }
        
        db.ref(`users/${currentUserId}`).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        db.ref(`Game/ZooRoulette/Bets/${currentUserId}/${id}`).set(firebase.database.ServerValue.increment(selectedChipVal));
        
        myBets[id] += selectedChipVal; 
        let mTag = document.getElementById(`my-${id}`); 
        mTag.style.display = 'block'; mTag.querySelector('span').innerText = myBets[id];
        
        let startX = event.clientX; let startY = event.clientY;
        let isPortrait = window.matchMedia("(orientation: portrait)").matches;

        if (isPortrait) { startX = event.clientY; startY = window.innerWidth - event.clientX; }

        let f = document.createElement('img'); f.className = 'placed-chip-img'; f.src = selectedChipSrc; 
        f.style.left = startX + 'px'; f.style.top = startY + 'px'; 
        if (isPortrait) f.style.transform = 'rotate(90deg)'; 
        document.body.appendChild(f);
        
        let tB = el.getBoundingClientRect();
        setTimeout(() => { 
            f.style.left = (tB.left + 10 + Math.random()*(tB.width-20)) + 'px'; 
            f.style.top = (tB.top + 10 + Math.random()*(tB.height-20)) + 'px'; 
            f.style.zIndex = 41; 
        }, 50);
    };

    setInterval(() => { 
        let c = 245 + Math.floor(Math.random() * 7) - 3; 
        document.querySelector('.online-count span').innerText = c < 180 ? 180 : c; 
    }, 2500);
</script>
