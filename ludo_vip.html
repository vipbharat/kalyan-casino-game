<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUDO VIP - PLAY TABLE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffd700; --bg: #0a0a0c; --board: #1a1a24; }
        body { margin: 0; background: var(--bg); font-family: 'Arial Black', sans-serif; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* 🔍 MATCHMAKING SCREEN (NEW) */
        #matchmaking-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a24 0%, #000 100%); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .radar { width: 120px; height: 120px; border: 3px solid #00ff88; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,255,136,0.3); margin-bottom: 20px; }
        .radar::before { content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 50%; background: linear-gradient(45deg, rgba(0,255,136,0.8), transparent); transform-origin: top left; animation: radarSpin 1.5s linear infinite; }
        @keyframes radarSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .mm-title { font-size: 22px; color: #fff; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px #fff; }
        .mm-details { margin-top: 15px; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--gold); }
        .mm-details span { color: var(--gold); font-size: 18px; }

        /* 🏆 Header Info (Updated with Table ID) */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #111; border-bottom: 1px solid var(--gold); }
        .table-id-box { background: #222; border: 1px solid #555; padding: 3px 8px; border-radius: 5px; font-size: 10px; color: #aaa; font-family: monospace; }
        .match-info { font-size: 12px; color: var(--gold); text-align: center; }
        .win-amt { color: #00ff88; font-size: 16px; text-shadow: 0 0 5px #00ff88; }

        /* 👤 Player Profiles */
        .player-area { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(255,255,255,0.02); transition: 0.3s; }
        .top-player { border-bottom: 2px dashed #333; }
        .bottom-player { border-top: 2px dashed #333; margin-top: auto; }
        
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); background: #333; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .name { font-size: 14px; color: #ccc; }

        /* 🎲 3D Dice Design */
        .dice-container { position: relative; width: 60px; height: 60px; perspective: 1000px; cursor: pointer; }
        .dice { width: 100%; height: 100%; background: linear-gradient(145deg, #fff, #e6e6e6); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; font-size: 45px; color: #000; border: 2px solid #ccc; transition: 0.1s; line-height: 1; }
        
        .rolling { animation: shake 0.4s infinite; background: #f1c40f !important; }
        @keyframes shake { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-15deg) scale(1.1); } 50% { transform: rotate(15deg) scale(1.1); } 75% { transform: rotate(-15deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1); } }

        /* 🟦 Center Board Area */
        .ludo-board-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; gap: 20px; }
        .turn-indicator { padding: 8px 25px; background: #00ff88; color: #000; border-radius: 20px; font-size: 14px; font-weight: bold; box-shadow: 0 0 15px rgba(0,255,136,0.4); display: none; text-transform: uppercase; letter-spacing: 1px; }
        .board-placeholder { width: 280px; height: 280px; background: var(--board); border: 4px solid var(--gold); border-radius: 15px; box-shadow: 0 0 30px rgba(255,215,0,0.1); display: flex; justify-content: center; align-items: center; color: #555; text-align: center; }
    </style>
</head>
<body>

    <div id="matchmaking-screen">
        <div class="radar"></div>
        <div class="mm-title">Finding Opponent...</div>
        <div style="color: #00ff88; font-size: 12px; margin-top: 5px;">ESTIMATED WAIT: 00:03s</div>
        <div class="mm-details">
            <div>TABLE ENTRY: <span>₹<span id="mm-fee">0</span></span></div>
            <div style="font-size: 12px; margin-top: 5px; color: #ccc;">Joining Table #<span id="mm-table-id">0000</span></div>
        </div>
    </div>

    <div class="header">
        <button onclick="window.location.href='dashboard.html'" style="background:none; border:none; color:white; font-size:18px;">◀</button>
        <div class="match-info">
            <div><span id="mode-text">2</span> PLAYERS • ENTRY: ₹<span id="fee-text">0</span></div>
            <div class="win-amt">WIN: ₹<span id="win-text">0</span></div>
        </div>
        <div class="table-id-box">T-ID: <span id="header-table-id">0000</span></div>
    </div>

    <div class="player-area top-player" id="opp-area">
        <div class="profile">
            <div class="avatar">🤖</div>
            <div>
                <div class="name">Opponent_99</div>
                <div style="font-size:10px; color:#ff4444;" id="opp-status">MATCHING...</div>
            </div>
        </div>
        <div class="dice-container">
            <div class="dice" id="opp-dice">🎲</div>
        </div>
    </div>

    <div class="ludo-board-area">
        <div class="turn-indicator" id="turn-text">YOUR TURN</div>
        <div class="board-placeholder">
            <div>
                <i class="fa-solid fa-chess-board" style="font-size: 50px; margin-bottom: 10px; color: var(--gold);"></i>
                <br>LUDO BOARD<br><span style="font-size:10px;">(Tokens will move here)</span>
            </div>
        </div>
    </div>

    <div class="player-area bottom-player" id="my-area" style="background: rgba(0, 255, 136, 0.05);">
        <div class="profile">
            <div class="avatar" style="border-color: #00ff88;">😎</div>
            <div>
                <div class="name" style="color: #00ff88;">YOU (Player 1)</div>
                <div style="font-size:10px; color:#00ff88;">GET READY!</div>
            </div>
        </div>
        <div class="dice-container" onclick="rollMyDice()">
            <div class="dice" id="my-dice" style="border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3);">🎲</div>
        </div>
    </div>

    <script>
        // Data from Dashboard
        var savedFee = localStorage.getItem('ludo_fee') || '0';
        var savedWin = localStorage.getItem('ludo_win') || '0';
        var savedMode = localStorage.getItem('ludo_mode') || '2';
        
        // Generate random Table ID
        var tableId = Math.floor(1000 + Math.random() * 9000); 

        // Set Values in UI
        document.getElementById('fee-text').innerText = savedFee;
        document.getElementById('win-text').innerText = savedWin;
        document.getElementById('mode-text').innerText = savedMode;
        document.getElementById('mm-fee').innerText = savedFee;
        document.getElementById('mm-table-id').innerText = tableId;
        document.getElementById('header-table-id').innerText = tableId;

        var myTurn = false; // Game start hone par true hoga
        var diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅']; 

        // 🟢 MATCHMAKING LOGIC (Hides after 3.5 seconds)
        setTimeout(function() {
            document.getElementById('matchmaking-screen').style.display = 'none'; // Overlay hatao
            document.getElementById('opp-status').innerText = 'CONNECTED';
            document.getElementById('opp-status').style.color = '#00ff88';
            
            // Game start kardo
            setTimeout(function() {
                myTurn = true;
                document.getElementById('turn-text').style.display = 'block';
            }, 500);
        }, 3500);

        // 🎲 DICE LOGIC (Same as before)
        function rollMyDice() {
            if (!myTurn) return; 
            myTurn = false;
            
            var myDice = document.getElementById('my-dice');
            myDice.classList.add('rolling'); 
            document.getElementById('turn-text').style.visibility = 'hidden';

            var rolls = 0;
            var shuffleInterval = setInterval(function() {
                var randomFace = Math.floor(Math.random() * 6);
                myDice.innerText = diceFaces[randomFace];
                rolls++;

                if (rolls >= 12) {
                    clearInterval(shuffleInterval);
                    myDice.classList.remove('rolling');
                    
                    var finalResult = Math.floor(Math.random() * 6) + 1;
                    myDice.innerText = diceFaces[finalResult - 1]; 
                    
                    setTimeout(rollOpponentDice, 2000); 
                }
            }, 100);
        }

        function rollOpponentDice() {
            document.getElementById('turn-text').innerText = "OPPONENT'S TURN";
            document.getElementById('turn-text').style.background = "#ff4444";
            document.getElementById('turn-text').style.color = "white";
            document.getElementById('turn-text').style.boxShadow = "0 0 15px rgba(255,68,68,0.4)";
            document.getElementById('turn-text').style.visibility = 'visible';

            var oppDice = document.getElementById('opp-dice');
            oppDice.classList.add('rolling');

            var rolls = 0;
            var shuffleInterval = setInterval(function() {
                var randomFace = Math.floor(Math.random() * 6);
                oppDice.innerText = diceFaces[randomFace];
                rolls++;

                if (rolls >= 12) {
                    clearInterval(shuffleInterval);
                    oppDice.classList.remove('rolling');
                    
                    var finalResult = Math.floor(Math.random() * 6) + 1;
                    oppDice.innerText = diceFaces[finalResult - 1];
                    
                    setTimeout(function() {
                        myTurn = true;
                        document.getElementById('turn-text').innerText = "YOUR TURN";
                        document.getElementById('turn-text').style.background = "#00ff88";
                        document.getElementById('turn-text').style.color = "black";
                        document.getElementById('turn-text').style.boxShadow = "0 0 15px rgba(0,255,136,0.4)";
                    }, 1000);
                }
            }, 100);
        }
    </script>
</body>
</html>
