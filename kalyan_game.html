    <script>
        const oldConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
        const newConfig = { apiKey: "AIzaSyA3BdEPFah2Vj5ksxVgHrTV0NKu147YwjA", databaseURL: "https://kalyan-live-engine-default-rtdb.firebaseio.com", projectId: "kalyan-live-engine" };

        if (!firebase.apps.length) { firebase.initializeApp(oldConfig); }
        const dbOld = firebase.database();

        firebase.initializeApp(newConfig, "NewEngine");
        const dbNew = firebase.app("NewEngine").database();

        const oldServerGames = ['AndarBahar', 'AndarBahar2', 'DragonTiger', 'DragonTiger2', 'MegaSpin'];

        window.db = {
            ref: function(path) {
                if (path.includes("users") || path.includes("recharge") || path.includes("withdrawal") || path.includes(".info/connected")) { return dbOld.ref(path); }
                let isOldGame = oldServerGames.some(function(g) { return path.includes(g); });
                if (isOldGame) { return dbOld.ref(path); } else { return dbNew.ref(path); }
            }
        };

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at 50% 50%, #004d26 0%, #001a0d 100%); color: white; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; padding-bottom: 80px;}
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 2px solid #ffd700; background: rgba(0,0,0,0.9); height: 7vh; z-index: 1000; position: sticky; top: 0;}
        .logo { font-size: 18px; font-weight: 900; color: #ffd700; }
        .online-box { background: rgba(57, 255, 20, 0.2); border: 1.5px solid #39ff14; color: #39ff14; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; position: relative; }

        .history-strip { width: 100%; height: 40px; background: rgba(0,0,0,0.8); display: flex; align-items: center; gap: 10px; padding: 0 15px; border-bottom: 1px solid #444; z-index: 900; }

        .sub-header { display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; background: rgba(17, 17, 17, 0.9); font-size: 13px; border-bottom: 1px solid #333; z-index: 900; }
        .wallet-box { color: #ffd700; font-weight: 800; display: flex; align-items: center; gap: 5px; font-size: 15px;}

        /* GAME STATUS AREA */
        .game-status-area { height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-top: 5px; }
        #main-timer { font-size: 70px; font-weight: 900; color: #39ff14; text-shadow: 0 0 20px #39ff14; line-height: 1; transition: color 0.1s;}
        
        #result-container { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        #wait-timer { font-size: 16px; color: #ffd700; font-weight: bold; text-shadow: 0 2px 4px #000; }
        #result-card { width: 70px; height: 95px; background: white; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 30px #ffd700; border: 4px solid #ffd700; }

        .my-bet-container { width: 100%; max-width: 480px; margin: 0 auto 5px; text-align: center; z-index: 20; }
        #my-bet-btn { display: inline-block; background: linear-gradient(to right, #e67e22, #d35400); color: white; padding: 5px 20px; border-radius: 20px; font-weight: 900; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 13px; }

        .matka-grid { width: 100%; max-width: 480px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 5px 10px; margin: 0 auto;}
        .card-box { width: calc(20% - 6px); background: linear-gradient(145deg, #fff, #ccc); border-radius: 8px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; border: 2.2px solid #333; position: relative; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.6); transition: transform 0.1s;}
        .card-box:active { transform: scale(0.95); } 
        
        .card-special { border-color: #ffd700; background: linear-gradient(135deg, #fff, #ffd700); }
        .c-val { font-size: 22px; font-weight: 900; color: #000; line-height: 1;}
        .c-red { color: #d32f2f; }
        .total-pool { position: absolute; top: 1px; right: 3px; font-size: 9px; color: #000; font-weight: 900; }
        .win-glow { transform:scale(1.05); box-shadow: 0 0 25px #ffd700; border-color: #ffd700; z-index: 50; }

        .color-betting-area { width: 100%; max-width: 480px; display: flex; gap: 10px; padding: 5px 10px; margin: 0 auto;}
        .color-box { flex: 1; height: 60px; border-radius: 10px; border: 3px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.5); transition: transform 0.1s;}
        .color-box:active { transform: scale(0.95); }
        .box-red { background: linear-gradient(135deg, #ff3333, #800000); }
        .box-black { background: linear-gradient(135deg, #333, #000); }
        .color-name { font-weight: 900; font-size: 14px; }
        .color-multi { font-size: 10px; background: rgba(255,255,255,0.2); padding: 1px 8px; border-radius: 10px; margin-top: 2px;}

        .my-bet-tag { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 900; display: none; z-index: 20; border: 1px solid #fff; white-space: nowrap; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; background-color: rgba(17, 17, 17, 0.95); padding: 10px 15px; border-top: 2px solid #ffd700; width: 100%; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); z-index: 1000;}
        .chips-area { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; width: 100%; justify-content: space-around; align-items: center;}
        .chips-area::-webkit-scrollbar { display: none; }
        .chip-img { width: 45px; height: 45px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); flex-shrink: 0; }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 12px #ffd700); }
        .chip-img.locked { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        
        .placed-chip { position: absolute; width: 24px; height: 24px; z-index: 100; pointer-events: none; transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8)); }
        #chips-layer { position: absolute; inset: 0; pointer-events: none; z-index: 90; overflow: hidden;}

        .win-calc-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #111, #000); border: 2px solid #39ff14; padding: 20px; border-radius: 15px; text-align: center; display: none; z-index: 10000; box-shadow: 0 0 30px rgba(57,255,20,0.5); width: 85%; max-width: 300px; }
        .win-calc-alert h2 { color: #39ff14; margin-bottom: 10px; font-weight: 900;}
        .win-calc-alert .net-win { color: #ffd700; font-size: 22px; font-weight: 900; margin-top: 10px;}
    </style>

<body onclick="initAudio()">

    <div class="color-betting-area">

            <div class="total-pool" id="a-RED">₹0</div>
            <span class="color-name">RED</span>

            <div class="my-bet-tag" id="my-RED">My: ₹<span>0</span></div>
        </div>
        <div class="color-box box-black" id="box-BLACK" onclick="userBet('BLACK', event)">
            <div class="total-pool" id="a-BLACK">₹0</div>
            <span class="color-name">BLACK</span>
            <span class="color-multi">1.95x</span>
            <div class="my-bet-tag" id="my-BLACK">My: ₹<span>0</span></div>

    <div class="bottom-bar">
        <div class="chips-area" id="chips-tray">
            <img src="assets/10_0.png" class="chip-img active" data-val="10" onclick="chooseChip(10, this)">

            <img src="assets/100_0.png" class="chip-img" data-val="100" onclick="chooseChip(100, this)">
            <img src="assets/500_0.png" class="chip-img" data-val="500" onclick="chooseChip(500, this)">
            <img src="assets/1000_0.png" class="chip-img" data-val="1000" onclick="chooseChip(1000, this)">
            <img src="assets/5000_1.png" class="chip-img" data-val="5000" onclick="chooseChip(5000, this)">
        </div>
    </div>

    <script>
        const db = window.db;
        
        const userID = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "GUEST";
        
        let totalBal = 0, depBal = 0, winBal = 0, bonBal = 0;
        let myTotalBet = 0; 
        let myBets = {};
        let isBettingOpen = false;
        let currentState = '';
        let localHistory = [];
        let botSimulationInterval;
        let serverTimerSync = 0; 

        const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png" };
        let currentChip = 10;
        let currentChipSrc = chipImgs[10];

        const cardsData = [
            {v:'A', m:10, s:'♠️'}, {v:'2', m:10, s:'♥️', r:true}, {v:'3', m:10, s:'♣️'}, {v:'4', m:10, s:'♦️', r:true}, {v:'5', m:10, s:'♠️'},
            {v:'6', m:10, s:'♥️', r:true}, {v:'7', m:10, s:'♣️'}, {v:'8', m:10, s:'♦️', r:true}, {v:'9', m:10, s:'♠️'}, {v:'10', m:10, s:'♥️', r:true},
            {v:'J', m:11, s:'🃏', sp:true}, {v:'Q', m:12, s:'🃏', sp:true}, {v:'K', m:30, s:'🃏', sp:true}
        ];

        let audioUnlocked = false;
        function initAudio() {
            if(!audioUnlocked) {
                const s = new Audio(); s.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"; s.play().catch(()=>{});
                audioUnlocked = true;
            }
        }

        const grid = document.getElementById('grid-container');
        cardsData.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card-box ' + (c.sp ? 'card-special' : '');
            div.id = 'box-' + c.v;
            div.onclick = (e) => userBet(c.v, e);
            div.innerHTML = '<div class="total-pool" id="a-' + c.v + '">₹0</div><div class="c-val ' + (c.r?'c-red':'') + '">' + c.v + '</div><div style="font-size:14px">' + c.s + '</div><div style="font-size:9px; background:#000; color:#ffd700; padding:1px 4px; border-radius:4px; font-weight:bold;">' + c.m + 'x</div><div class="my-bet-tag" id="my-' + c.v + '">My: ₹<span>0</span></div>';
            grid.appendChild(div);
            myBets[c.v] = 0;
        });
        myBets['RED'] = 0; myBets['BLACK'] = 0;

        if (userID && userID !== "GUEST") {
            db.ref('users/' + userID).on('value', (snap) => {
                const data = snap.val() || {};
                depBal = parseFloat(data.balance || 0); winBal = parseFloat(data.winning_balance || 0); bonBal = parseFloat(data.bonus_balance || 0);
                totalBal = depBal + winBal + bonBal; 
                document.getElementById('wallet-bal').innerText = totalBal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                
                document.querySelectorAll('.chip-img').forEach(c => { 
                    if(parseInt(c.dataset.val) > totalBal) c.classList.add('locked'); 
                    else c.classList.remove('locked'); 
                });
            });

            db.ref('Game/KalyanMatka/Bets/' + userID).once('value', snap => {
                let saved = snap.val();
                if(saved) {
                    setTimeout(() => {
                        Object.keys(saved).forEach(opt => {
                            let val = saved[opt];
                            if(val > 0 && myBets[opt.toUpperCase()] !== undefined) {
                                myBets[opt.toUpperCase()] = val;
                                myTotalBet += val;
                                document.getElementById('my-bet-btn').innerText = "Total Bet: ₹" + myTotalBet;
                                let tag = document.getElementById('my-' + opt.toUpperCase());
                                if(tag) { tag.style.display = 'block'; tag.querySelector('span').innerText = val; }
                            }
                        });
                    }, 500);
                }
            });
        }

        db.ref('Game/KalyanMatka/Status').on('value', (snap) => {
            let data = snap.val();
            if(!data) return;

            serverTimerSync = data.timer;

            if(data.state === 'betting') {
                if(currentState !== 'betting') {
                    isBettingOpen = true; 
                    currentState = 'betting';
                    document.getElementById('result-container').style.display = 'none';
                    document.getElementById('main-timer').style.display = 'block';
                    document.querySelectorAll('.card-box, .color-box').forEach(b => b.classList.remove('win-glow'));
                    
                    resetRound();
                    startBotSimulation();
                }
            } 
            else if (data.state === 'result' || data.state === 'processing') {
                if(currentState !== 'result') {
                    currentState = 'result';
                    isBettingOpen = false;
                    clearInterval(botSimulationInterval);
                    if(data.winner) {
                        showResult(data.winner); 
                    }
                }
                const t = document.getElementById('main-timer');
                t.innerText = "STOP";
                t.style.color = '#fff';
            }
        });

        setInterval(() => {
            if(currentState === 'betting' && isBettingOpen) {
                if(serverTimerSync > 0) {
                    const t = document.getElementById('main-timer');
                    t.innerText = serverTimerSync;
                    t.style.color = serverTimerSync <= 5 ? '#ff3333' : '#39ff14';
                    
                    if(serverTimerSync <= 5 && audioUnlocked) {
                        try { new Audio('assets/22d0dc27-b727-42be-ac04-d9182459f976.mp3').play().catch(()=>{}); } catch(e){}
                    }
                    
                    serverTimerSync--;
                }
            }
        }, 1000);

        function showResult(winVal) {
            document.getElementById('main-timer').style.display = 'none';
            document.getElementById('result-container').style.display = 'flex';
            
            let winCard = cardsData.find(c => c.v === winVal) || cardsData[0];
            let winColor = winCard.r ? 'RED' : 'BLACK';

            document.getElementById('res-val').innerText = winCard.v;
            document.getElementById('res-suit').innerText = winCard.s;
            document.getElementById('res-val').style.color = winCard.r ? '#d32f2f' : '#000';

            let boxVal = document.getElementById('box-' + winCard.v);
            let boxCol = document.getElementById('box-' + winColor);
            if(boxVal) boxVal.classList.add('win-glow');
            if(boxCol) boxCol.classList.add('win-glow');

            updateHistory(winCard);

            setTimeout(() => {
                let winAmt = 0;
                if(myBets[winVal] > 0) winAmt += myBets[winVal] * winCard.m;
                if(myBets[winColor] > 0) winAmt += myBets[winColor] * 1.95;

                if(winAmt > 0) {
                    let net = winAmt - (winAmt * 0.05);
                    try { new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3').play().catch(()=>{}); } catch(e){}
                    let popup = document.getElementById('win-calc-alert');
                    document.getElementById('w-net').innerText = "+₹" + net.toLocaleString();
                    popup.style.display = 'block';
                    setTimeout(() => popup.style.display = 'none', 3500);
                }
            }, 1000);
        }

        function resetRound() {
            myBets = {}; 
            cardsData.forEach(c => myBets[c.v] = 0);
            myBets['RED'] = 0; myBets['BLACK'] = 0;
            myTotalBet = 0;
            document.getElementById('my-bet-btn').innerText = "Total Bet: ₹0";
            
            document.querySelectorAll('.my-bet-tag').forEach(el => { el.style.display = 'none'; el.querySelector('span').innerText = '0'; });
            document.querySelectorAll('.total-pool').forEach(el => el.innerText = '₹0');
            document.getElementById('chips-layer').innerHTML = '';
        }

        function chooseChip(val, elem) {
            if(elem.classList.contains('locked')) return;
            currentChip = val; currentChipSrc = chipImgs[val];
            document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active'));
            elem.classList.add('active');
            try { new Audio('assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3').play().catch(()=>{}); } catch(e){}
        }

        window.userBet = function(target, e) {
            if (!isBettingOpen) { alert("Betting is closed!"); return; }
            if (serverTimerSync <= 2) { alert("⏳ Time is up! Wait for the next round."); return; }
            if (userID === "GUEST") { alert("Login required!"); return; }
            if (totalBal < currentChip) { alert("Low balance!"); return; }

            totalBal -= currentChip;
            document.getElementById('wallet-bal').innerText = totalBal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            myBets[target] += currentChip;
            myTotalBet += currentChip;
            document.getElementById('my-bet-btn').innerText = "Total Bet: ₹" + myTotalBet;
            
            let myTag = document.getElementById('my-' + target);
            if(myTag) {
                myTag.style.display = 'block';
                myTag.querySelector('span').innerText = myBets[target];
            }

            throwChipVisual(target, true);

            let nDep = depBal, nWin = winBal, rem = currentChip;
            if (nDep >= rem) { nDep -= rem; rem = 0; } else { rem -= nDep; nDep = 0; }
            if (rem > 0) { if (nWin >= rem) { nWin -= rem; rem = 0; } else { rem -= nWin; nWin = 0; } }
            
            db.ref('users/' + userID).update({ balance: nDep, winning_balance: nWin });
            db.ref('Game/KalyanMatka/Bets/' + userID + '/' + target.toLowerCase()).set(firebase.database.ServerValue.increment(currentChip));
        }

        let lastBotSound = 0;
        function playBotChipSound() {
            if(!audioUnlocked) return;
            let now = Date.now();
            if(now - lastBotSound > 150) { 
                try { 
                    let sfx = new Audio('assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3');
                    sfx.volume = 0.3; 
                    sfx.play().catch(()=>{}); 
                    lastBotSound = now;
                } catch(e){}
            }
        }

        function throwChipVisual(target, isMe) {
            let box = document.getElementById('box-' + target);
            if(!box) return;
            let bR = box.getBoundingClientRect();
            
            let chip = document.createElement('img');
            chip.src = currentChipSrc;
            chip.className = 'placed-chip';
            
            let startX, startY;
            if(isMe) {
                let activeC = document.querySelector('.chip-img.active');
                let cR = activeC ? activeC.getBoundingClientRect() : {left: window.innerWidth/2, top: window.innerHeight};
                startX = cR.left; startY = cR.top;
                try { new Audio('assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3').play().catch(()=>{}); } catch(e){}
            } else {
                startX = Math.random() * window.innerWidth;
                startY = -50;
                let botChips = [10,50,100,500];
                chip.src = chipImgs[botChips[Math.floor(Math.random()*4)]];
                playBotChipSound();
            }

            chip.style.left = startX + 'px'; chip.style.top = startY + 'px';
            document.getElementById('chips-layer').appendChild(chip);

            setTimeout(() => {
                chip.style.left = (bR.left + 5 + Math.random()*(bR.width-30)) + 'px';
                chip.style.top = (bR.top + 5 + Math.random()*(bR.height-30)) + 'px';
                chip.style.transform = 'scale(0.8) rotate(' + (Math.random()*360) + 'deg)';
            }, 10);

            if(document.getElementById('chips-layer').childElementCount > 250) {
                document.getElementById('chips-layer').firstChild.remove();
            }
        }

        db.ref('Game/KalyanMatka/Bets').on('value', snap => {
            let allB = snap.val() || {};
            let pools = {};
            cardsData.forEach(c => pools[c.v] = 0);
            pools['RED'] = 0; pools['BLACK'] = 0;

            for(let u in allB) {
                if(!u.includes('bot') && u !== 'GUEST') {
                    for(let opt in allB[u]) {
                        if(pools[opt.toUpperCase()] !== undefined) {
                            pools[opt.toUpperCase()] += allB[u][opt];
                        }
                    }
                }
            }
            
            Object.keys(pools).forEach(opt => {
                let el = document.getElementById('a-' + opt);
                if(el) {
                    let v = pools[opt] + (Math.floor(Math.random()*5)*100); 
                    el.innerText = v >= 1000 ? (v/1000).toFixed(1)+'K' : (v===0?'₹0':v);
                }
            });
        });

        function startBotSimulation() {
            botSimulationInterval = setInterval(() => {
                if(!isBettingOpen) return;
                
                let chipsToThrow = Math.floor(Math.random() * 3) + 1;
                for(let i = 0; i < chipsToThrow; i++) {
                    let targets = [...cardsData.map(c=>c.v), 'RED', 'BLACK'];
                    let t = targets[Math.floor(Math.random()*targets.length)];
                    throwChipVisual(t, false);
                }
                
                document.getElementById('live-users').innerText = 500 + Math.floor(Math.random()*50);
            }, 150); 
        }

        function updateHistory(winCard) {
            localHistory.push(winCard);
            if(localHistory.length > 10) localHistory.shift();
            renderHistory();
        }

        function renderHistory() {
            let html = "";
            localHistory.forEach(c => {
                html += '<div class="h-item" style="color:' + (c.r ? '#d32f2f' : '#000') + '">' + c.v + '</div>';
            });
            document.getElementById('history-row').innerHTML = html;
        }

        db.ref('Game/KalyanMatka/History').limitToLast(10).once('value', snap => {
            if(snap.exists()) {
                snap.forEach(child => {
                    let v = child.val();
                    let wc = cardsData.find(c => c.v == v) || cardsData[0];
                    localHistory.push(wc);
                });
                renderHistory();
            }
        });
    </script>
</body>
</html>
