    <style>

        input { width: 90%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        button { width: 90%; padding: 14px; background: #ffd700; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; margin-top: 10px; font-size: 16px; transition: 0.3s;}
        button:disabled { background: #555; color: #888; cursor: not-allowed; }

        .go-btn { background: linear-gradient(90deg, #00ff88, #00d2d3); color: #000; box-shadow: 0 4px 15px rgba(0,255,136,0.3); }
        .logout-btn { background: transparent; color: #ff004c; border: 1px solid #ff004c; margin-top: 15px; padding: 10px; font-size: 12px; }

        /* 🔥 ASLI SMS NOTIFICATION DESIGN 🔥 */
        #sms-popup {
            position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px; background: #ffffff; color: #000; 
            padding: 12px 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            display: flex; gap: 15px; align-items: center; z-index: 9999; 
            transition: top 0.5s ease-in-out; text-align: left;
        }
        .sms-icon-box { background: #00e676; min-width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
        
        #autofill-text { color: #00ff88; font-size: 11px; font-weight: bold; margin-bottom: -5px; display: none; }
    </style>
</head>
<body>

<div id="sms-popup">

    </div>
</div>

<div class="card">

            <button onclick="handleLogin()">LOGIN NOW</button>
        </div>

        <div id="reg-box" class="hidden">
            <input type="number" id="r-phone" placeholder="Mobile Number">
            
            <div id="reg-step2" class="hidden">
                <div id="autofill-text"><i class="fa-solid fa-magic-wand-sparkles"></i> OTP AUTO-FILLED</div>
                <input type="number" id="r-otp" placeholder="Enter OTP">
                <input type="password" id="r-pass1" placeholder="Create Password">
                <input type="password" id="r-pass2" placeholder="Confirm Password">
            </div>
            
            <div id="recaptcha-container"></div>
            <button id="main-btn" onclick="checkDeviceAndRegister()">SEND OTP</button>
        </div>
    </div>
</div>

<script>
    var firebaseConfig = { 
        apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo",
        databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    var database = firebase.database();

    var isRealSMS = false;

    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });

    let deviceId = localStorage.getItem('kalyan_device_id') || ("DEV_" + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('kalyan_device_id', deviceId);

    window.onload = function() {
        var savedPhone = localStorage.getItem('userPhone');
        if(savedPhone) {
            document.getElementById('normal-auth-box').classList.add('hidden');
            document.getElementById('quick-login-box').classList.remove('hidden');
            document.getElementById('saved-phone-text').innerText = "📱 " + savedPhone;
        }
    };

    function logoutUser() { localStorage.removeItem('userPhone'); window.location.reload(); }

    function toggleView(mode) {
        document.getElementById('login-box').classList.toggle('hidden', mode === 'r');
        document.getElementById('reg-box').classList.toggle('hidden', mode === 'l');
        document.getElementById('tab1').className = (mode === 'l' ? 'tab-btn active-tab' : 'tab-btn');
        document.getElementById('tab2').className = (mode === 'r' ? 'tab-btn active-tab' : 'tab-btn');
    }

    function checkDeviceAndRegister() {
        var ph = document.getElementById('r-phone').value;
        if(ph.length !== 10) return alert("⚠️ Sahi number daalein!");
        var btn = document.getElementById('main-btn');
        btn.disabled = true;
        btn.innerText = "CHECKING...";

        database.ref('DeviceLocks/' + deviceId).once('value').then(function(snap) {
            if(snap.exists() && snap.val().phone !== ph) {
                alert("🚨 DEVICE LOCKED!");
                btn.innerText = "LOCKED";
            } else {
                sendHybridOTP(ph, btn);
            }
        });
    }

    function sendHybridOTP(ph, btn) {
        btn.innerText = "SENDING...";
        firebase.auth().signInWithPhoneNumber("+91" + ph, window.recaptchaVerifier)
            .then(function (confirmationResult) {
                isRealSMS = true;
                window.confirmationResult = confirmationResult;
                document.getElementById('autofill-text').style.display = 'none';
                showStep2(btn, false);
            }).catch(function (error) {
                // FALLBACK JUGAAD WITH AUTO-FILL
                isRealSMS = false;
                globalFakeOTP = Math.floor(100000 + Math.random() * 899999).toString();
                
                // Show SMS Popup
                document.getElementById('fake-otp-text').innerText = globalFakeOTP;
                document.getElementById('sms-popup').style.top = '15px';
                setTimeout(() => { document.getElementById('sms-popup').style.top = '-120px'; }, 6000);
                
                // 🔥 AUTO-FILL LOGIC 🔥
                document.getElementById('r-otp').value = globalFakeOTP;
                document.getElementById('autofill-text').style.display = 'block';
                
                window.recaptchaVerifier.render().then(function(id) { grecaptcha.reset(id); });
                showStep2(btn, true);
            });
    }

    function showStep2(btn, isAuto) {
        document.getElementById('reg-step2').classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = isAuto ? "AUTO-FILL VERIFY" : "VERIFY & GET ₹51";
        btn.onclick = verifyHybridOTP; 
    }

    function verifyHybridOTP() {
        var ph = document.getElementById('r-phone').value, otp = document.getElementById('r-otp').value;
        var p1 = document.getElementById('r-pass1').value, p2 = document.getElementById('r-pass2').value;

        if(otp.length !== 6 || p1 === "" || p1 !== p2) return alert("Check OTP/Password!");
        
        var btn = document.getElementById('main-btn');
        btn.disabled = true; btn.innerText = "VERIFYING...";

        if(isRealSMS) {
            window.confirmationResult.confirm(otp).then(() => saveNewUser(ph, p1)).catch(() => { alert("Wrong OTP!"); btn.disabled = false; });
        } else {
            if(otp === globalFakeOTP) saveNewUser(ph, p1);
            else { alert("Wrong OTP!"); btn.disabled = false; }
        }
    }

    function saveNewUser(ph, password) {
        database.ref('users/' + ph).set({ phone: ph, password: password, balance: 51, uid: "VIP"+Math.floor(100000+Math.random()*899999), deviceId: deviceId })
        .then(() => { database.ref('DeviceLocks/' + deviceId).set({ phone: ph }); localStorage.setItem('userPhone', ph); window.location.href = "dashboard.html"; });
    }

    function handleLogin() {
        var ph = document.getElementById('l-phone').value, ps = document.getElementById('l-pass').value;
        database.ref('users/' + ph).once('value').then(snap => {
            if(snap.exists() && (snap.val().password == ps || snap.val().pass == ps)) {
                localStorage.setItem('userPhone', ph); window.location.href = "dashboard.html";
            } else alert("Invalid Login!");
        });
    }
</script>
