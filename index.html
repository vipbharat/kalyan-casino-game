<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyan Pro - VIP Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        /* 🌈 Colorful & Animated Background */
        body { 
            background: linear-gradient(-45deg, #0f0f13, #1e006b, #090947, #000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff; font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ✨ Glassy VIP Card */
        .card { 
            background: rgba(20, 20, 25, 0.8); 
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 25px; width: 320px; 
            border: 2px solid rgba(255, 215, 0, 0.4); 
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.05);
            text-align: center; position: relative;
        }

        .logo-text { font-size: 30px; font-weight: 900; color: #fff; margin-bottom: 20px; letter-spacing: 2px; }
        .logo-text span { color: #ffd700; text-shadow: 0 0 15px #ffd700; }

        .tab-btn { padding: 12px; cursor: pointer; color: #888; display: inline-block; width: 45%; font-weight: 900; font-size: 14px; transition: 0.3s; }
        .active-tab { color: #ffd700; border-bottom: 3px solid #ffd700; }

        /* 🔘 Inputs & Buttons with Neon Glow */
        input { 
            width: 100%; padding: 14px; margin: 12px 0; background: rgba(0,0,0,0.4); 
            border: 1.5px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; 
            outline: none; box-sizing: border-box; transition: 0.3s; font-weight: 600;
        }
        input:focus { border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }

        .main-btn { 
            width: 100%; padding: 15px; background: linear-gradient(90deg, #ffd700, #ff8c00); 
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; color: #000; 
            margin-top: 15px; font-size: 16px; box-shadow: 0 5px 20px rgba(255,140,0,0.4);
            transition: 0.3s; text-transform: uppercase;
        }
        .main-btn:active { transform: scale(0.95); }

        /* 🏆 Success Overlay Design */
        #success-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            display: none; /* Initial hidden */
        }
        .check-icon { font-size: 80px; color: #00ff88; animation: scaleUp 0.5s ease-out; }
        .success-text { font-size: 24px; font-weight: 900; color: #fff; margin-top: 20px; letter-spacing: 1px; }
        .success-sub { color: #00ff88; font-size: 14px; margin-top: 5px; }

        @keyframes scaleUp {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 📱 SMS Popup Style */
        #sms-popup {
            position: fixed; top: -120px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px; background: #ffffff; color: #000; 
            padding: 12px 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            display: flex; gap: 15px; align-items: center; z-index: 9999; 
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); text-align: left;
        }
        .sms-icon { background: #00e676; min-width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
        
        .hidden { display: none !important; }
        #autofill-text { color: #00ff88; font-size: 11px; font-weight: 900; margin-bottom: -5px; display: none; }
    </style>
</head>
<body>

<div id="success-overlay">
    <div class="check-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div class="success-text">VERIFICATION SUCCESSFUL</div>
    <div class="success-sub">Entering VIP Dashboard...</div>
</div>

<div id="sms-popup">
    <div class="sms-icon"><i class="fa-solid fa-comment-dots"></i></div>
    <div>
        <div style="font-size:11px; color:#666; font-weight:bold;">MESSAGES • JUST NOW</div>
        <div style="font-size:14px; font-weight:900;">KALYAN VIP</div>
        <div style="font-size:13px; color:#333;">Your login OTP is <span id="fake-otp-text" style="font-weight:900; color:#000;"></span>.</div>
    </div>
</div>

<div class="card">
    <div id="quick-login-box" class="hidden">
        <div class="logo-text">WELCOME <span>BACK</span></div>
        <div id="saved-phone-text" style="font-size: 18px; font-weight: 900; color: #00ff88; margin-bottom: 20px;"></div>
        <button class="main-btn" onclick="window.location.href='dashboard.html'" style="background: linear-gradient(90deg, #00ff88, #00d2d3);">PLAY NOW</button>
        <div onclick="logoutUser()" style="margin-top:20px; color:#ff4d4d; font-size:12px; cursor:pointer; font-weight:bold;">LOGOUT ACCOUNT</div>
    </div>

    <div id="normal-auth-box">
        <div class="logo-text">KALYAN <span>PRO</span></div>
        <div style="margin-bottom: 25px;">
            <div id="tab1" class="tab-btn active-tab" onclick="toggleView('l')">LOGIN</div>
            <div id="tab2" class="tab-btn" onclick="toggleView('r')">REGISTER</div>
        </div>

        <div id="login-box">
            <input type="number" id="l-phone" placeholder="Mobile Number">
            <input type="password" id="l-pass" placeholder="Password">
            <button class="main-btn" onclick="handleLogin()">LOGIN NOW</button>
        </div>

        <div id="reg-box" class="hidden">
            <input type="number" id="r-phone" placeholder="Enter Mobile Number">
            <div id="reg-step2" class="hidden">
                <div id="autofill-text"><i class="fa-solid fa-bolt"></i> OTP AUTO-FILLED</div>
                <input type="number" id="r-otp" placeholder="6-Digit OTP">
                <input type="password" id="r-pass1" placeholder="Create Password">
                <input type="password" id="r-pass2" placeholder="Confirm Password">
            </div>
            <div id="recaptcha-container"></div>
            <button class="main-btn" id="main-btn" onclick="checkDeviceAndRegister()">SEND OTP</button>
        </div>
    </div>
</div>

<script>
    var firebaseConfig = { 
        apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo",
        databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();

    var isRealSMS = false, globalFakeOTP = "", otpTimer;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });

    let deviceId = localStorage.getItem('kalyan_device_id') || ("DEV_" + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('kalyan_device_id', deviceId);

    window.onload = function() {
        var savedPhone = localStorage.getItem('userPhone');
        if(savedPhone) {
            document.getElementById('normal-auth-box').classList.add('hidden');
            document.getElementById('quick-login-box').classList.remove('hidden');
            document.getElementById('saved-phone-text').innerText = "📱 " + savedPhone;
        }
    };

    function toggleView(mode) {
        document.getElementById('login-box').classList.toggle('hidden', mode === 'r');
        document.getElementById('reg-box').classList.toggle('hidden', mode === 'l');
        document.getElementById('tab1').className = (mode === 'l' ? 'tab-btn active-tab' : 'tab-btn');
        document.getElementById('tab2').className = (mode === 'r' ? 'tab-btn active-tab' : 'tab-btn');
    }

    function checkDeviceAndRegister() {
        var ph = document.getElementById('r-phone').value;
        if(ph.length !== 10) return alert("⚠️ Sahi number daalein!");
        var btn = document.getElementById('main-btn');
        btn.disabled = true; btn.innerText = "CHECKING...";

        database.ref('DeviceLocks/' + deviceId).once('value').then(snap => {
            if(snap.exists() && snap.val().phone !== ph) {
                alert("🚨 THIS DEVICE IS ALREADY REGISTERED WITH ANOTHER NUMBER!");
                btn.disabled = false; btn.innerText = "SEND OTP";
            } else {
                sendHybridOTP(ph, btn);
            }
        });
    }

    function sendHybridOTP(ph, btn) {
        btn.innerText = "WAITING...";
        firebase.auth().signInWithPhoneNumber("+91" + ph, window.recaptchaVerifier)
        .then(res => {
            isRealSMS = true; window.confirmationResult = res;
            startCountdown(btn);
        }).catch(() => { triggerFallback(btn); });
    }

    function startCountdown(btn) {
        let sec = 30;
        btn.innerText = "WAIT (" + sec + "s)";
        otpTimer = setInterval(() => {
            sec--; btn.innerText = "WAIT (" + sec + "s)";
            if(sec <= 0) { clearInterval(otpTimer); triggerFallback(btn); }
        }, 1000);
        document.getElementById('reg-step2').classList.remove('hidden');
    }

    function triggerFallback(btn) {
        clearInterval(otpTimer); isRealSMS = false;
        globalFakeOTP = Math.floor(100000 + Math.random() * 899999).toString();
        document.getElementById('fake-otp-text').innerText = globalFakeOTP;
        document.getElementById('sms-popup').style.top = '15px';
        setTimeout(() => { document.getElementById('sms-popup').style.top = '-120px'; }, 6000);
        document.getElementById('r-otp').value = globalFakeOTP;
        document.getElementById('autofill-text').style.display = 'block';
        document.getElementById('reg-step2').classList.remove('hidden');
        btn.disabled = false; btn.innerText = "AUTO-FILL VERIFY";
        btn.onclick = verifyOTP;
    }

    function verifyOTP() {
        var otp = document.getElementById('r-otp').value, ph = document.getElementById('r-phone').value;
        var p1 = document.getElementById('r-pass1').value, p2 = document.getElementById('r-pass2').value;
        if(otp.length < 6 || p1 === "" || p1 !== p2) return alert("⚠️ Check OTP & Password!");

        if(isRealSMS) {
            window.confirmationResult.confirm(otp).then(() => { showSuccess(ph, p1); }).catch(() => alert("Wrong OTP!"));
        } else {
            if(otp === globalFakeOTP) showSuccess(ph, p1); else alert("Wrong OTP!");
        }
    }

    // 🏆 Success Logic with Overlay
    function showSuccess(ph, pass) {
        document.getElementById('success-overlay').style.display = 'flex';
        database.ref('users/' + ph).set({ 
            phone: ph, password: pass, balance: 51, 
            uid: "VIP"+Math.floor(1000+Math.random()*9000), deviceId: deviceId 
        }).then(() => {
            database.ref('DeviceLocks/' + deviceId).set({ phone: ph });
            localStorage.setItem('userPhone', ph);
            setTimeout(() => { window.location.href = "dashboard.html"; }, 2500);
        });
    }

    function handleLogin() {
        var ph = document.getElementById('l-phone').value, ps = document.getElementById('l-pass').value;
        database.ref('users/' + ph).once('value').then(snap => {
            if(snap.exists() && (snap.val().password == ps)) {
                localStorage.setItem('userPhone', ph); window.location.href = "dashboard.html";
            } else alert("Invalid Login!");
        });
    }

    function logoutUser() { localStorage.removeItem('userPhone'); window.location.reload(); }
</script>
</body>
</html>
