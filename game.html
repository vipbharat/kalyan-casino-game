    if (!spineAssetManager.isLoadingComplete()) return;

    let jsonName = animType === 'start' ? "kaishitouzhub" : "tingzhitouzhu";
    let animName = animType === 'start' ? "game_start_anim" : "game_stop_anim";

    let atlas = new spine.TextureAtlas(spineAssetManager.get("assets/animations/" + jsonName + ".atlas"), function(path) {
        return spineAssetManager.get("assets/animations/" + path);
    });

    let atlasLoader = new spine.AtlasAttachmentLoader(atlas);
    let skeletonJson = new spine.SkeletonJson(atlasLoader);
    let skeletonData = skeletonJson.readSkeletonData(JSON.parse(spineAssetManager.get("assets/animations/" + jsonName + ".json")));

    activeSkeleton = new spine.Skeleton(skeletonData);
    let animationStateData = new spine.AnimationStateData(skeletonData);
    animationState = new spine.AnimationState(animationStateData);

    activeSkeleton.x = spineCanvas.width / 2;
    activeSkeleton.y = spineCanvas.height / 2;
    activeSkeleton.scaleY = -1; 

    $('spine-container').style.display = 'block';
    
    animationState.setAnimation(0, animName, false);

    animationState.addListener({
        complete: function() {
            setTimeout(() => { $('spine-container').style.display = 'none'; }, 200);
        }
    });
}

function renderSpine() {
    let now = Date.now();
    let delta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    let gl = spineWebGLContext.gl;
    gl.clearColor(0, 0, 0, 0); 
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (activeSkeleton && animationState && $('spine-container').style.display === 'block') {
        animationState.update(delta);
        animationState.apply(activeSkeleton);
        activeSkeleton.updateWorldTransform();

        spineRenderer.begin();
        spineRenderer.drawSkeleton(activeSkeleton, true);
        spineRenderer.end();
    }
    requestAnimationFrame(renderSpine);
}

window.addEventListener('load', initSpine);
</script>

</html>
