<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andar Bahar 2 - K-VIP Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --neon-green: #00ff88; --bg-dark: #0f0f13; --red: #ff3333; --blue: #00e5ff; --gold: #ffd700; --panel: #1a1a24; --card-back: #222 url('https://deckofcardsapi.com/static/img/back.png') center/cover; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: var(--bg-dark); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden;}
        
        /* Header */
        .header { background: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--red); box-shadow: 0 4px 15px rgba(255, 51, 51, 0.2); z-index: 10; }
        .back-btn { color: #fff; font-size: 20px; text-decoration: none; }
        .wallet { font-weight: 900; font-size: 18px; color: var(--neon-green); background: rgba(0, 255, 136, 0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--neon-green); }

        /* Main Game Area */
        .game-area { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: radial-gradient(circle at center, #1a1c23, #000); }
        
        /* Timer Display */
        #timer-display { font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #fff, 0 0 5px #000; margin-bottom: 10px;}

        /* Betting Areas Flex Layout */
        .bet-areas-container { display: flex; width: 100%; max-width: 600px; gap: 15px; margin-bottom: 15px;}
        
        .bet-area { flex: 1; aspect-ratio: 1; border-radius: 12px; border: 3px solid; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: pointer; transition: 0.1s; }
        .bet-area:active { transform: scale(0.97); }
        
        .bet-area.andar { border-color: var(--blue); background: linear-gradient(145deg, #1d212b, #001222); }
        .bet-area.bahar { border-color: var(--red); background: linear-gradient(145deg, #2b1d1d, #220000); }

        .area-title { font-size: 20px; font-weight: 900; color: #fff; text-transform: uppercase; text-shadow: 0 2px 4px #000; position: absolute; top: 10px; width: 100%; text-align: center; }
        .area-multi { font-size: 12px; font-weight: 800; color: var(--gold); background: rgba(0,0,0,0.8); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--gold); position: absolute; top: 35px; left: 50%; transform: translateX(-50%); white-space: nowrap;}
        
        .area-card-symbol { font-size: 80px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; filter: grayscale(100%); }
        .bet-area.andar .area-card-symbol { color: var(--blue); }
        .bet-area.bahar .area-card-symbol { color: var(--red); }

        .pool-text { font-size: 12px; font-weight: 900; color: #000; background: var(--gold); padding: 2px 10px; border-radius: 8px; position: absolute; bottom: 8px; left: 8px; border: 1px solid #fff;}
        .my-bet-text { font-size: 11px; font-weight: 900; color: #000; background: var(--neon-green); padding: 2px 10px; border-radius: 8px; position: absolute; bottom: 8px; right: 8px; display: none; border: 1px solid #fff;}

        /* Card Displays */
        .card { width: 70px; height: 100px; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 5px 15px #000; display: flex; align-items: center; justify-content: center; font-size: 30px;}
        .card-inner { width: 100%; height: 100%; border-radius: 6px; background: #fff; color: #000; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; }
        .text-card { color: #212121; } .red-suit { color: #d32f2f; }
        .cbk { background: var(--card-back); width: 100%; height: 100%; border-radius: 6px;}

        /* Central Card (Joker) */
        .central-joker-card { border-color: var(--gold); box-shadow: 0 0 30px var(--gold); position: absolute; top: -110px; left: 50%; transform: translateX(-50%); animation: centralCardPulse 1.5s infinite alternate;}
        @keyframes centralCardPulse { 0% { box-shadow: 0 0 20px var(--gold); } 100% { box-shadow: 0 0 45px var(--gold); } }

        /* Sides Cards (Andar, Bahar) */
        .sides-display-container { display: flex; width: 100%; max-width: 600px; gap: 15px; margin-top: 15px;}
        .side-row { flex: 1; aspect-ratio: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;}
        .side-row .card { transform: scale(0.6); }

        /* Payout Animation Full Screen Winner Effect */
        .result-payout-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; pointer-events: none; opacity: 0; transition: opacity 0.4s;}
        .result-payout-overlay.show-win { opacity: 1; animation: payoutNeonGlow 0.4s 4 alternate; }
        @keyframes payoutNeonGlow { 0% { box-shadow: inset 0 0 30px var(--neon-green), 0 0 20px var(--neon-green); } 100% { box-shadow: inset 0 0 90px var(--neon-green), 0 0 60px var(--neon-green); } }

        /* Banners & Animation */
        .banner-overlay { position: fixed; top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 60px; overflow: hidden; z-index: 12000; display: none;}
        .banner-overlay.show { display: block; }
        .banner-image { height: 100%; width: auto; position: absolute; top: 0; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));}
        
        .animation-ltr { animation: marquee_ltr 2.5s ease-in-out forwards; }
        .animation-rtl { animation: marquee_rtl 2.5s ease-in-out forwards; }

        @keyframes marquee_ltr { 
            0% { left: 100vw; transform: translateX(0); opacity: 0;} 
            15% { left: 50vw; transform: translateX(-50%); opacity: 1;} 
            85% { left: 50vw; transform: translateX(-50%); opacity: 1;} 
            100% { left: -100vw; transform: translateX(-100%); opacity: 0;} 
        }
        @keyframes marquee_rtl { 
            0% { left: -100vw; transform: translateX(-100%); opacity: 0;} 
            15% { left: 50vw; transform: translateX(-50%); opacity: 1;} 
            85% { left: 50vw; transform: translateX(-50%); opacity: 1;} 
            100% { left: 100vw; transform: translateX(0); opacity: 0;} 
        }

        /* Controls / Bet amount Input */
        .controls { padding: 15px; background: var(--panel); border-top: 2px solid #333; z-index: 10; display: flex; gap: 10px;}
        .input-box { flex: 1; background: #000; border: 1px solid #444; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; text-align: center;}
        .input-box label { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        /* MIN VALUE IS SET TO 50 */
        .input-box input { background: transparent; border: none; color: var(--neon-green); font-size: 20px; font-weight: 900; outline: none; width: 100%; text-align: center; border-bottom: 2px solid #444; padding-bottom: 4px;}

        /* Chips Grid updated for images - 10 REMOVED */
        .footer-chips-tray { flex: 2; display: flex; gap: 8px; overflow-x: auto; padding: 10px 5px 15px 5px; align-items: center; justify-content: flex-start; }
        .footer-chips-tray::-webkit-scrollbar { display: none; }
        .chip-img { width: 44px; height: 44px; cursor: pointer; transition: 0.2s; border-radius: 50%; flex-shrink: 0; filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.6)); }
        .chip-img.active { transform: scale(1.15) translateY(-8px); filter: drop-shadow(0 0 15px #ffd700); }
        
        /* Win Popup Neon Green */
        #winMsg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 3px solid var(--neon-green); color: var(--neon-green); padding: 20px 40px; border-radius: 20px; font-weight: 900; display: none; z-index: 20000; box-shadow: 0 0 30px var(--neon-green), inset 0 0 20px rgba(0, 255, 136, 0.4); text-align: center; animation: popIn 0.4s ease-out; }
    </style>
</head>
<body>

    <audio id="soundChips" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
    <audio id="soundWin" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>

    <div class="result-payout-overlay" id="payout-overlay"></div>

    <div class="header">
        <a href="Dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div style="font-weight: 900; font-size: 18px; color: #fff;">ANDAR <span style="color:var(--red)">BAHAR 2</span></div>
        <div class="wallet">₹<span id="balance">0.00</span></div>
    </div>

    <div class="game-area">
        <div id="timer-display">Waiting...</div>
        
        <div class="bet-areas-container">
            <div id="central-card-area">
                <div class="card central-joker-card" id="joker-display"><div class="cbk"></div></div>
            </div>
            
            <div class="bet-area andar" id="bx-A" onclick="placeBetOn('A')">
                <div class="area-title">ANDAR</div>
                <div class="area-multi">1.9x</div>
                <div class="area-card-symbol">A</div>
                <div class="pool-text">Total: ₹<span id="total-A">0</span></div>
                <div class="my-bet-text" id="my-A">My: ₹<span>0</span></div>
            </div>
            <div class="bet-area bahar" id="bx-B" onclick="placeBetOn('B')">
                <div class="area-title">BAHAR</div>
                <div class="area-multi">1.9x</div>
                <div class="area-card-symbol">B</div>
                <div class="pool-text">Total: ₹<span id="total-B">0</span></div>
                <div class="my-bet-text" id="my-B">My: ₹<span>0</span></div>
            </div>
        </div>

        <div class="sides-display-container">
            <div class="side-row" id="ardar-display"></div>
            <div class="side-row" id="bahar-display"></div>
        </div>

        <div id="winMsg">
            <div style="font-size: 16px; text-transform: uppercase; color: #aaa; margin-bottom: 5px;">Result Paid</div>
            <div id="winAmountText" style="font-size: 32px;">+ ₹0.00</div>
        </div>

        <div class="banner-overlay" id="banner-ov">
            <img class="banner-image" id="banner-img" src="">
        </div>
    </div>

    <div class="controls">
        <div class="input-box">
            <label>Amount (₹)</label>
            <input type="number" id="betAmountInput" value="50" min="50">
        </div>
        
        <div class="footer-chips-tray">
            <img src="assets/50_0.png" class="chip-img active" onclick="selectChip(this, 50)">
            <img src="assets/100_0.png" class="chip-img" onclick="selectChip(this, 100)">
            <img src="assets/200_0.png" class="chip-img" onclick="selectChip(this, 200)">
            <img src="assets/500_0.png" class="chip-img" onclick="selectChip(this, 500)">
            <img src="assets/1000_0.png" class="chip-img" onclick="selectChip(this, 1000)">
            <img src="assets/5000_1.png" class="chip-img" onclick="selectChip(this, 5000)">
            <img src="assets/10000_0.png" class="chip-img" onclick="selectChip(this, 10000)">
        </div>
    </div>

    <script>
        const $=i=>document.getElementById(i);
        const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), phone = localStorage.getItem('userPhone') || "Guest";

        let currentBalance = 0;
        let isAudioUnlocked = false;

        if (phone === "Guest") {
            alert("Please login first!");
            window.location.href = "index.html";
        }

        db.ref('users/' + phone).on('value', (snapshot) => {
            const d = snapshot.val() || {};
            currentBalance = (parseFloat(d.balance||0) + parseFloat(d.winning_balance||0) + parseFloat(d.bonus_balance||0));
            $('balance').innerText = currentBalance.toFixed(2);
        });

        function initAudioContext() { if(!isAudioUnlocked) { $('soundChips').play().then(() => $('soundChips').pause()); $('soundWin').play().then(() => $('soundWin').pause()); isAudioUnlocked = true; } }
        function playSound(id) { if(isAudioUnlocked) { let s = $(id); s.currentTime = 0; s.play().catch(e => console.log(e)); } }

        // Game State Variables (Default chip is 50 now)
        let canBet = false, totalBetThisRound = 0, currentMultiplier = 1.9, andarBets = 0, baharBets = 0, selectedChipVal = 50; 

        // 🔥 Banner Dikhane Wala Function 🔥
        function showBanner(type) {
            let ov = $('banner-ov');
            let img = $('banner-img');
            if(type === 'start') {
                img.src = 'assets/kaishitouzhub.png';
                img.className = 'banner-image animation-ltr';
            } else {
                img.src = 'assets/tingzhitouzhu.png';
                img.className = 'banner-image animation-rtl';
            }
            ov.style.display = 'block';
            setTimeout(() => { ov.style.display = 'none'; }, 2600);
        }

        // 🔥 SMART LOCAL TIMER LOGIC (FIREBASE PATH UPDATED TO AndarBahar2) 🔥
        db.ref('Game/AndarBahar2/Status').on('value', snap => {
            let st = snap.val(); if(!st) return;
            let tDisp = $('timer-display');

            if(st.state === 'betting') {
                if(!canBet) {
                    canBet = true;
                    resetGameForNewRound();
                    showBanner('start');
                }
                
                if(st.jokerVal && st.jokerSuit) {
                    $('joker-display').innerHTML = createCardHTML(st.jokerVal, st.jokerSuit);
                }

                if(st.timer > 0 && st.timer <= 20) {
                    if(window.localTimerInterval) clearInterval(window.localTimerInterval);
                    
                    let currentT = st.timer;
                    tDisp.innerText = `Place Your Bet: ${currentT}s`;
                    tDisp.style.color = currentT <= 5 ? 'var(--red)' : '#fff';
                    
                    window.localTimerInterval = setInterval(() => {
                        currentT--;
                        if(currentT >= 0) {
                            tDisp.innerText = `Place Your Bet: ${currentT}s`;
                            tDisp.style.color = currentT <= 5 ? 'var(--red)' : '#fff';
                        } else {
                            clearInterval(window.localTimerInterval);
                        }
                    }, 1000);
                }
            } 
            else if(st.state === 'dealing' || st.state === 'result') {
                if(window.localTimerInterval) clearInterval(window.localTimerInterval);
                if(canBet) {
                    canBet = false;
                    showBanner('stop');
                    tDisp.innerText = "Bet Closed - Wait Result";
                    tDisp.style.color = "#fff";
                }
            }
        });

        // POOL SYNC (FIREBASE PATH UPDATED TO AndarBahar2)
        db.ref('Game/AndarBahar2/Bets').on('value', snap => {
            let allB = snap.val() || {};
            let tPool = {A:0, B:0};
            for(let u in allB) { 
                if(!u.includes('bot')) {
                    tPool.A += (allB[u]['A'] || 0);
                    tPool.B += (allB[u]['B'] || 0);
                }
            }
            $('total-A').innerText = tPool.A.toLocaleString();
            $('total-B').innerText = tPool.B.toLocaleString();
        });


        function placeBetOn(side) {
            let now = new Date().getTime(); if(!canBet) return;
            initAudioContext(); let amt = parseFloat($('betAmountInput').value);
            // Validation updated for 50
            if(isNaN(amt) || amt < 50) return alert("Min bet is ₹50");
            if(amt > currentBalance) return alert("Insufficient Balance!");

            playSound('soundChips'); 
            deductBalance(amt);
            if(side==='A') andarBets+=amt; else baharBets+=amt;
            totalBetThisRound+=amt;

            updateMyBetsDisplay(side);
            
            // FIREBASE PATH UPDATED TO AndarBahar2
            db.ref(`Game/AndarBahar2/Bets/${phone}/${side}`).set(firebase.database.ServerValue.increment(amt));
        }

        function deductBalance(amt) {
            let rem = amt; if(depBal>=rem)depBal-=rem;else{rem-=depBal;depBal=0;winBal-=rem;}
            db.ref('users/'+phone).update({balance:Math.max(0,depBal),winning_balance:Math.max(0,winBal)});
        }

        function updateMyBetsDisplay(side) {
            let myTag=$('my-'+side), amt = side === 'A' ? andarBets : baharBets;
            if(amt>0){myTag.style.display='block';myTag.querySelector('span').innerText=amt.toLocaleString();}
        }

        function resetGameForNewRound() {
            andarBets=0;baharBets=0;totalBetThisRound=0;$('payout-overlay').className='result-payout-overlay';
            $('my-A').style.display='none';$('my-B').style.display='none';$('winMsg').style.display='none';
            $('bx-A').style.boxShadow = ''; $('bx-B').style.boxShadow = '';
            $('ardar-display').innerHTML='';$('bahar-display').innerHTML='';
            $('joker-display').innerHTML='<div class="cbk"></div>';
        }

        function createCardHTML(v, s) {
            let y=s==='S'?'♠':s==='H'?'♥':s==='D'?'♦':'♣', c=(s==='H'||s==='D')?'red-suit':'black-suit';
            return `<div class="card-inner text-card ${c}"><div style="font-size:14px;font-weight:900;line-height:1">${v}<br><span style="font-size:14px">${y}</span></div><div style="font-size:24px;text-align:center;margin-top:-5px">${y}</div><div style="font-size:14px;font-weight:900;line-height:1;text-align:left;transform:rotate(180deg);margin-top:-5px">${v}<br><span style="font-size:14px">${y}</span></div></div>`;
        }

        window.selectChip=function(el,v){
            selectedChipVal=v;
            $('betAmountInput').value = v;
            document.querySelectorAll('.chip-img').forEach(b=>b.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
