<script>
    const $ = i => document.getElementById(i);
    if(!firebase.apps.length) firebase.initializeApp({apiKey:"AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL:"https://kalyan-casino-default-rtdb.firebaseio.com", projectId:"kalyan-casino"});
    const db = firebase.database(), ph = localStorage.getItem('userPhone') || localStorage.getItem('phone');
    
    let iBO=0, cC=1000, cCc='radial-gradient(circle, #e57373, #d32f2f)', tB=0, dB=0, wB=0, bB=0;
    let mB={andar:0, bahar:0}, sPl={andar:0, bahar:0}, bPl={andar:0, bahar:0};
    let bI, iAI=0, iD=0, bL=[], lockedJoker = "";

    function sT(m){ let t=$('tst'); if(!t){t=document.createElement('div');t.id='tst';t.className='tst';document.body.appendChild(t);} t.innerText=m; t.classList.add('sh'); pS('bS',0.5); setTimeout(()=>t.classList.remove('sh'),2500); }
    function uA(){ if(!iAI){ ['bS','cS'].forEach(i=>{let e=$(i); if(e){e.play().then(()=>{e.pause();e.currentTime=0;}).catch(()=>{});}}); iAI=1; } }
    function pS(i,v){ try{let s=$(i); if(s){s.currentTime=0; s.volume=v; s.play().catch(()=>{});}} catch(e){} }
    
    setInterval(()=>{$('oc').innerText=Math.floor(Math.random()*50)+1200},4000);

    // Balance & Auto-recover
    if(ph){
        db.ref('users/'+ph).on('value', s=>{ let d=s.val()||{}; dB=parseFloat(d.balance||0); wB=parseFloat(d.winning_balance||0); bB=parseFloat(d.bonus_balance||0); tB=Math.max(0,dB+wB+bB); $('bal').innerText=tB.toFixed(2); });
        db.ref(`Game/AndarBahar/Bets/${ph}`).once('value', s=>{
            let v=s.val(); if(v) setTimeout(()=>{
                ['andar','bahar'].forEach(sd=>{
                    let val=v[sd]; if(val>0){
                        mB[sd]=val; let mt=$('mb-'+(sd=='andar'?'d':'t')); 
                        if(mt){ mt.innerText="MY BET: ₹"+val; mt.style.display='block'; }
                    }
                })
            },500);
        });
    }

    // Bot Logic
    function gB(){ bL=[]; for(let i=0;i<5;i++) bL.push({b:Math.floor(Math.random()*100000)+50000}); } gB();
    function uP(){ $('md').innerText="₹"+(sPl.andar+bPl.andar).toLocaleString(); $('mt').innerText="₹"+(sPl.bahar+bPl.bahar).toLocaleString(); }
    
    window.pB = function(s){
        if(!iBO) return; if(!ph) return sT("Login Error!"); if(tB<cC) return sT("INSUFFICIENT BALANCE!");
        let nD=dB, nW=wB, rm=cC; if(nD>=rm) nD-=rm; else {rm-=nD; nD=0; nW-=rm;}
        db.ref('users/'+ph).update({balance:Math.max(0,nD), winning_balance:Math.max(0,nW)});
        db.ref(`Game/AndarBahar/Bets/${ph}/${s}`).set(firebase.database.ServerValue.increment(cC));
        mB[s]+=cC; let mt=$('mb-'+(s=='andar'?'d':'t')); mt.innerText="MY BET: ₹"+mB[s]; mt.style.display='block';
        spC(s, cC, cCc); pS('bS',1);
    };

    function spC(s,a,c){
        let sid=(s=='andar'?'d':'t'); let b=$('ch-'+sid); if(!b) return;
        let p=document.createElement('div'); p.className='cp'; p.innerText=a>=1000?(a/1000)+'K':a; p.style.background=c; p.style.color=(a===10000||a===10)?'#000':'#fff';
        p.style.top="150%"; p.style.left=s==='andar'?"-50px":"150px"; p.style.opacity="0"; b.appendChild(p);
        setTimeout(()=>{ p.style.left=(Math.random()*60+20)+"%"; p.style.top=(Math.random()*60+20)+"%"; p.style.opacity="1"; },50);
        if(b.children.length>50) b.firstChild.remove();
    }
    function gBC(a){ return a===10?'radial-gradient(circle, #fff, #ccc)':a===100?'radial-gradient(circle, #4fc3f7, #0288d1)':a===500?'radial-gradient(circle, #81c784, #388e3c)':a===1000?'radial-gradient(circle, #e57373, #d32f2f)':a===5000?'radial-gradient(circle, #ba68c8, #7b1fa2)':'radial-gradient(circle, #ffd54f, #f57f17)'; }
    function bBA(){
        if(!iBO) return; let bb=0; ['andar','bahar'].forEach(s=>{
            let a=[10,100,500,1000][Math.floor(Math.random()*4)], rb=bL[Math.floor(Math.random()*bL.length)];
            if(rb.b>=a){ rb.b-=a; spC(s,a,gBC(a)); bPl[s]+=a; bb=1; }
        }); if(bb){ uP(); pS('bS',.05); }
    }

    // MAIN LISTENER (Connected to Engine)
    db.ref('Game/AndarBahar/Status').on('value', s=>{
        let st=s.val(); if(!st) return; let te=$('tmr');
        
        if(st.state === 'betting'){
            if(!iBO){
                iBO=1; iD=0; rUI();
                lockedJoker = st.jokerVal; // Engine sends jokerVal
                $('joker-spot').innerHTML = cCD(st.jokerVal, st.jokerSuit || 'S');
                clearInterval(bI); bI=setInterval(bBA,700);
            }
            te.innerText=st.timer+"s";
            te.style.color=st.timer<=5?"#f33":"#d4af37";
        } 
        else if (st.state === 'result' || st.state === 'dealing'){
            if(iBO && !iD){
                iBO=0; iD=1; clearInterval(bI);
                te.innerText="DEALING..."; te.style.color="#fff";
                if(st.winner) sR(st.winner, st.jokerVal, st.jokerSuit || 'S');
            }
        }
    });

    db.ref('Game/AndarBahar/Bets').on('value', s=>{
        let a=s.val()||{}; sPl={andar:0, bahar:0};
        for(let u in a){ if(!u.includes('bot')){ sPl.andar+=(a[u].andar||0); sPl.bahar+=(a[u].bahar||0); } } uP();
    });

    // Client-Side Card Generation Logic
    function cCD(v,s){
        let y=s==='S'?'♠':s==='H'?'♥':s==='D'?'♦':'♣', c=(s==='H'||s==='D')?'#ff1a1a':'#000';
        let actV = v == "10" ? "0" : v;
        return `<img src="https://deckofcardsapi.com/static/img/${actV}${s}.png" style="width:100%; height:100%; border-radius:4px; box-shadow:0 0 5px rgba(0,0,0,0.5);">`;
    }

    // MAGIC: Generate deterministic cards so all phones show the same sequence!
    async function sR(w, jVal, jSuit){
        const vs=["A","2","3","4","5","6","7","8","9","0","J","Q","K"], ss=["S","D","C","H"];
        
        // Use Winner and Joker to seed the number of cards (Hack for Syncing)
        let seed = w.charCodeAt(0) + jVal.charCodeAt(0);
        let numCards = (seed % 10) + 3; // Random 3 to 12 cards before win
        if (w === 'andar' && numCards % 2 !== 0) numCards++; // Andar wins on Even index (0, 2, 4...)
        if (w === 'bahar' && numCards % 2 === 0) numCards++; // Bahar wins on Odd index (1, 3, 5...)

        for (let i = 0; i <= numCards; i++) {
            let side = (i % 2 === 0) ? 'andar' : 'bahar';
            let cV, cS;
            
            if (i === numCards) {
                // Final card is the winner
                cV = jVal; cS = ss[Math.floor((seed+i)%4)];
            } else {
                // Random non-winning card
                do { 
                    cV = vs[(seed+i*7)%13]; 
                    cS = ss[(seed+i)%4]; 
                } while(cV === jVal); // Don't show joker before end
            }

            let track = $('track-' + side);
            let div = document.createElement('div');
            div.className = 'playing-card';
            div.innerHTML = cCD(cV, cS);
            track.appendChild(div);
            track.scrollTo({ left: track.scrollWidth, behavior: 'smooth' });
            
            pS('cS', 1);
            await new Promise(r => setTimeout(r, 700)); // Delay between cards
        }

        // Announce Winner
        $('tmr').innerText = w.toUpperCase() + " WINS!";
        $('bx-' + (w === 'andar' ? 'd' : 't')).classList.add('gw');
        
        // Payout
        let wa=0; if(w==='andar') wa=mB.andar*1.9; else if(w==='bahar') wa=mB.bahar*2.0;
        if(wa>0 && ph) db.ref('users/'+ph+'/winning_balance').set(wB+wa);
    }

    function rUI(){
        ['bx-d','bx-t'].forEach(i=>$(i).classList.remove('gw'));
        ['d','t'].forEach(s=>{let mt=$('mb-'+s); if(mt){mt.style.display='none'; mt.innerText="MY BET: ₹0"}});
        $('track-andar').innerHTML = '<span class="track-label">ANDAR</span>';
        $('track-bahar').innerHTML = '<span class="track-label">BAHAR</span>';
        document.querySelectorAll('.cp').forEach(c=>c.remove());
        sPl={andar:0, bahar:0}; bPl={andar:0, bahar:0}; mB={andar:0, bahar:0}; uP();
    }

    window.sC=function(v,e){cC=v; cCc=window.getComputedStyle(e).backgroundImage; document.querySelectorAll('.cb').forEach(b=>b.classList.remove('sel')); e.classList.add('sel'); pS('bS',.5);}
</script>
