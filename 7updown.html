<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalyan VIP Zoo - Pro Recovery Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* - Original Design Preserved */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: #0a110a; background-image: radial-gradient(circle at center, #112d14 0%, #050a05 100%); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px 8px; border-bottom: 2px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.7); }
        .logo { font-size: 18px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); flex: 1;}
        .wallet-box { border: 1.5px solid #ffd700; color: #ffd700; padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 14px; background: rgba(255,215,0,0.1); }
        
        /* 🔥 SLIDING BANNERS CSS 🔥 */
        .banner-overlay { position: fixed; top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 60px; z-index: 12000; display: none; pointer-events: none;}
        .banner-image { height: 100%; width: auto; position: absolute; top: 0; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8)); }
        .animation-ltr { animation: marquee_ltr 2.5s ease-in-out forwards; }
        .animation-rtl { animation: marquee_rtl 2.5s ease-in-out forwards; }
        @keyframes marquee_ltr { 0% { left: 100vw; transform: translateX(0); opacity: 0;} 15% { left: 50vw; transform: translateX(-50%); opacity: 1;} 85% { left: 50vw; transform: translateX(-50%); opacity: 1;} 100% { left: -100vw; transform: translateX(-100%); opacity: 0;} }
        @keyframes marquee_rtl { 0% { left: -100vw; transform: translateX(-100%); opacity: 0;} 15% { left: 50vw; transform: translateX(-50%); opacity: 1;} 85% { left: 50vw; transform: translateX(-50%); opacity: 1;} 100% { left: 100vw; transform: translateX(0); opacity: 0;} }

        /* Board & Grid */
        .board-container { flex: 1; display: flex; justify-content: center; align-items: stretch; padding: 5px; position: relative; }
        .game-board { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); width: 100%; height: 100%; max-width: 480px; border: 3px solid #ffd700; border-radius: 12px; background: #111520; position: relative; }
        .track-item { display: flex; align-items: center; justify-content: center; border: 0.5px solid rgba(255,215,0,0.15); transition: 0.1s; }
        .track-item img { width: 85%; height: 85%; object-fit: contain; }
        .track-item.active { background: rgba(255, 215, 0, 0.5); box-shadow: inset 0 0 20px #ffd700; }
        
        .center-bets { grid-area: 2 / 2 / 7 / 7; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700; border-radius: 10px; }
        .bet-btn { background: #222; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #555; position: relative; cursor: pointer; }
        .pool-text { position: absolute; top: -6px; right: -6px; font-size: 10px; color: #000; background: #ffc107; padding: 2px 6px; border-radius: 8px; font-weight: 900; }
        .my-bet-tag { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #00e5ff; color: #000; font-size: 10px; padding: 1px 8px; border-radius: 4px; font-weight: 900; display: none; }

        /* 🔥 IMAGE CHIPS TRAY 🔥 */
        .footer-chips { padding: 8px 10px; background: rgba(0,0,0,0.9); display: flex; gap: 8px; overflow-x: auto; border-top: 2.5px solid #ffd700; }
        .footer-chips::-webkit-scrollbar { display: none; }
        .chip-img { width: 45px; height: 45px; cursor: pointer; transition: 0.2s; border-radius: 50%; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
        .chip-img.active { transform: translateY(-8px) scale(1.15); filter: drop-shadow(0 0 15px #fff); }

        .placed-chip { position: fixed; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid white; pointer-events: none; z-index: 100; font-size: 8px; font-weight: 900; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.8); }
        .huge-timer { position: absolute; top: 0; left: 50%; transform: translate(-50%, -5%); font-size: 75px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 10px #000; z-index: 50; pointer-events: none; }
    </style>
</head>
<body onclick="initAudio()">

    <div class="header">
        <div class="back-btn" onclick="window.history.back()">⬅️</div>
        <div class="logo">KALYAN VIP ZOO</div>
        <div class="wallet-box">💰 ₹<span id="wallet-bal">0.00</span></div>
    </div>

    <div class="banner-overlay" id="banner-ov">
        <img class="banner-image" id="banner-img" src="">
    </div>

    <div class="board-container">
        <div class="huge-timer" id="main-timer">...</div>
        <div class="game-board" id="board">
            <div class="center-bets" id="bet-container"></div>
        </div>
    </div>

    <div class="footer-chips">
        <img src="assets/10_0.png" class="chip-img active" onclick="selectChip(this, 10)">
        <img src="assets/20_0.png" class="chip-img" onclick="selectChip(this, 20)">
        <img src="assets/50_0.png" class="chip-img" onclick="selectChip(this, 50)">
        <img src="assets/100_0.png" class="chip-img" onclick="selectChip(this, 100)">
        <img src="assets/200_0.png" class="chip-img" onclick="selectChip(this, 200)">
        <img src="assets/500_0.png" class="chip-img" onclick="selectChip(this, 500)">
        <img src="assets/1000_0.png" class="chip-img" onclick="selectChip(this, 1000)">
        <img src="assets/5000_1.png" class="chip-img" onclick="selectChip(this, 5000)">
        <img src="assets/10000_0.png" class="chip-img" onclick="selectChip(this, 10000)">
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        /* - Core Logic with Recovery & Smart Timer */
        const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const currentUserId = localStorage.getItem('userPhone') || "Guest";
        
        let userBalance = 0, depBal = 0, winBal = 0, selectedChipVal = 10, isBettingOpen = false, lastState = '';
        let myBets = {}; 

        // 🔥 BANNER FUNCTION 🔥
        function showBanner(type) {
            let ov = document.getElementById('banner-ov');
            let img = document.getElementById('banner-img');
            img.src = type === 'start' ? 'assets/kaishitouzhub.png' : 'assets/tingzhitouzhu.png';
            img.className = type === 'start' ? 'banner-image animation-ltr' : 'banner-image animation-rtl';
            ov.style.display = 'block';
            setTimeout(() => { ov.style.display = 'none'; }, 2600);
        }

        // 🔥 SMART RECOVERY & TIMER 🔥
        db.ref('Game/ZooRoulette/Status').on('value', snap => {
            let st = snap.val(); if(!st) return;
            let tDisp = document.getElementById('main-timer');

            if(st.state === 'betting') {
                if(!isBettingOpen) {
                    isBettingOpen = true;
                    resetTable();
                    recoverMyBets(); // 🔥 Recovery Chips wapas layega 🔥
                    showBanner('start');
                }
                
                // Smart Background Timer
                let currentT = st.timer;
                let now = Date.now();
                let savedEndTime = localStorage.getItem('zoo_endTime');
                if (savedEndTime && savedEndTime > now && (savedEndTime - now) <= (st.timer * 1000 + 2000)) {
                    currentT = Math.floor((savedEndTime - now) / 1000);
                } else {
                    localStorage.setItem('zoo_endTime', now + (currentT * 1000));
                }

                if(currentT >= 0) {
                    if(window.localTimerInterval) clearInterval(window.localTimerInterval);
                    tDisp.innerText = currentT;
                    tDisp.style.color = currentT <= 5 ? "#ff3333" : "#ffd700";
                    window.localTimerInterval = setInterval(() => {
                        currentT--;
                        if(currentT >= 0) { tDisp.innerText = currentT; tDisp.style.color = currentT <= 5 ? "#ff3333" : "#ffd700"; }
                        else { clearInterval(window.localTimerInterval); }
                    }, 1000);
                }
            } 
            else if(st.state === 'spinning' || st.state === 'result') {
                if(window.localTimerInterval) clearInterval(window.localTimerInterval);
                if(isBettingOpen) { isBettingOpen = false; showBanner('stop'); tDisp.style.display = 'none'; }
            }
        });

        function recoverMyBets() {
            if(currentUserId === "Guest") return;
            db.ref(`Game/ZooRoulette/Bets/${currentUserId}`).once('value', snap => {
                let saved = snap.val();
                if(saved) {
                    Object.keys(saved).forEach(id => {
                        let val = saved[id];
                        if(val > 0) {
                            myBets[id] = val;
                            let tag = document.getElementById(`my-${id}`);
                            if(tag) { tag.style.display = 'block'; tag.querySelector('span').innerText = val; }
                            // Place static recovery chip
                            let box = document.getElementById(`btn-${id}`);
                            if(box) { /* Logic to place static visual chip */ }
                        }
                    });
                }
            });
        }

        window.selectChip = function(el, v) {
            selectedChipVal = v;
            document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        };

        function resetTable() {
            document.querySelectorAll('.placed-chip').forEach(c => c.remove());
            document.querySelectorAll('.my-bet-tag').forEach(t => t.style.display = 'none');
            myBets = {};
        }

        function initAudio() { /* Audio Unlock Logic */ }
    </script>
</body>
</html>
