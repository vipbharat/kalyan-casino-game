<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root { --gold: #ffcc00; --blue: #00e5ff; --pink: #ff007f; --green: #00ff88; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width:100%; height:100%; overflow:hidden; color:white; font-family: 'Segoe UI', sans-serif; perspective: 1000px; background: linear-gradient(45deg, #1a0033, #001f3f, #3a0028, #002b2b); background-size: 400% 400%; animation: gradientBG 12s ease infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .top-status { width: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border-bottom: 2px solid var(--gold); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-sizing: border-box; }
        .back-btn { font-size: 22px; cursor: pointer; color: #d4af37; margin-right: 10px; }
        .total-money { font-size: 1.1rem; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px;}
        .total-money span { color: var(--gold); font-size: 1.2rem; font-weight: 900; text-shadow: 0 0 10px var(--gold); }
        
        .hist-container { display: flex; gap: 4px; overflow: hidden; max-width: 50%; justify-content: flex-end;}
        .h-ank { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 900; border: 1px solid rgba(255,255,255,0.8); text-shadow: 1px 1px 2px #000; flex-shrink: 0;}
        
        /* 🔥 ALERTS & NETWORK 🔥 */
        .game-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; width: 70%; max-width: 250px; display: none; pointer-events: none; }
        .game-alert img { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); }
        
        .newest-record { animation: popNew 0.5s ease-out forwards; border: 2px solid #fff; box-shadow: 0 0 8px #fff; }
        @keyframes popNew { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); } 100% { transform: scale(1); opacity: 1; } }

        #network-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 99999999; display: none; flex-direction: column; justify-content: center; align-items: center; color: #ffd700; }
        .loading-chakra { width: 60px; height: 60px; border: 6px solid rgba(255, 215, 0, 0.2); border-top-color: #ffd700; border-radius: 50%; animation: spinChakra 1s linear infinite; margin-bottom: 20px; }
        @keyframes spinChakra { 100% { transform: rotate(360deg); } }
        .net-text { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
        .net-sub { font-size: 12px; color: #aaa; margin-top: 5px; }

        .game-area { height: calc(100% - 190px); display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; position: relative; }
        .table-center { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; margin-top: 30px; }
        .center-timer { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); font-size: 2.2rem; color: #fff; text-shadow: 0 0 20px #ff007f; font-weight: 900; z-index: 60; background: rgba(0,0,0,0.6); padding: 2px 20px; border-radius: 12px; border: 2px solid #ff007f; white-space: nowrap;}
        .casino-cup { position: absolute; width: 130px; height: 120px; background: linear-gradient(to right, #4a00e0, #8e2de2, #4a00e0); border-bottom: 4px solid var(--gold); border-radius: 10px 10px 15px 15px; bottom: 10px; z-index: 50; transition: transform 0.8s; transform: translateY(-160px); }
        .casino-cup::before { content: ''; position: absolute; top: -15px; left: 0; width: 100%; height: 30px; background: #2a006e; border-radius: 50%; border: 2px solid #b266ff; }
        
        /* 3D Dice */
        .dice-wrapper { display: flex; gap: 15px; z-index: 10; perspective: 600px; }
        .scene { width: 40px; height: 40px; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .face { position: absolute; width: 40px; height: 40px; background: #fff; border-radius: 5px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 4px; border: 1px solid #ddd; }
        .pip { width: 8px; height: 8px; background: #111; border-radius: 50%; margin: auto; }
        .front { transform: rotateY(0deg) translateZ(20px); } .right { transform: rotateY(90deg) translateZ(20px); }
        .back { transform: rotateY(180deg) translateZ(20px); } .left { transform: rotateY(-90deg) translateZ(20px); }
        .top { transform: rotateX(90deg) translateZ(20px); } .bottom { transform: rotateX(-90deg) translateZ(20px); }
        .show-1 { transform: translateZ(-20px) rotateY(0deg); } .show-2 { transform: translateZ(-20px) rotateY(-90deg); }
        .show-3 { transform: translateZ(-20px) rotateY(-180deg); } .show-4 { transform: translateZ(-20px) rotateY(90deg); }
        .show-5 { transform: translateZ(-20px) rotateX(-90deg); } .show-6 { transform: translateZ(-20px) rotateX(90deg); }
        .rolling-dice { animation: roll3D 0.4s linear infinite; }
        @keyframes roll3D { 0% { transform: translateZ(-20px) rotateX(0deg) rotateY(0deg); } 100% { transform: translateZ(-20px) rotateX(360deg) rotateY(360deg); } }
        .shake-cup { animation: shakeAction 0.15s infinite; }
        @keyframes shakeAction { 0%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-5px) rotate(5deg)} 75%{transform:translateY(-5px) rotate(-5deg)} 100%{transform:translateY(0) rotate(0)} }
        
        .board { display:flex; gap:10px; width:98%; max-width: 500px; z-index: 20;}
        .bet-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .box { height:130px; border-radius:15px; border:2px solid; background:rgba(0,0,0,0.4); display:flex; flex-direction:column; align-items:center; justify-content: center; cursor:pointer; position: relative; transition: 0.3s; }
        #low { border-color: var(--blue); } #tie { border-color: var(--gold); } #high { border-color: var(--pink); }
        .box-num { font-size: 1.8rem; font-weight: 900; line-height: 1.2; text-shadow: 0 0 15px currentColor; }
        .box-title { font-size: 0.8rem; font-weight: bold; }
        .payout-rate { font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 5px; margin-top: 5px; }
        .box b { position:absolute; bottom:5px; font-size:1rem; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; }
        .win-glow { transform:scale(1.08); background: rgba(255,255,255,0.2) !important; box-shadow: 0 0 40px currentColor !important; z-index: 30;}
        
        .my-bet-text { font-size: 0.85rem; color: #fff; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 8px; text-align: center; border: 1px dashed var(--green); font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: none;}
        
        .chip-visual { pointer-events: none; position: absolute; width: 24px; height: 24px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.8); z-index: 15; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; color: white; transition: 0.4s ease-out; box-shadow: 2px 2px 5px rgba(0,0,0,0.8);}
        
        /* 🔥 FULL CHIPS TRAY 🔥 */
        .chips-bar { display:flex; gap:6px; overflow-x: auto; padding-bottom: 5px; width: 95%; justify-content: center; align-items: center; z-index: 100;}
        .chips-bar::-webkit-scrollbar { display: none; }
        .chip-btn { width:45px; height:45px; border-radius:50%; border:2px dashed #fff; display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:bold; cursor:pointer; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: 0.2s;}
        .chip-btn.active { transform:scale(1.2) translateY(-5px); border-style:solid; box-shadow: 0 0 15px #d4af37; border-color: #d4af37;}
        .chip-btn.locked { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .c50 { background: linear-gradient(135deg, #1e3c72, #2a5298); } .c100 { background: linear-gradient(135deg, #e65c00, #F9D423); } .c500 { background: linear-gradient(135deg, #1D976C, #93F9B9); color: black; } .c1k { background: linear-gradient(135deg, #cb2d3e, #ef473a); } .c5k { background: linear-gradient(135deg, #11998e, #38ef7d); color: black; } .c10k { background: linear-gradient(135deg, #4a00e0, #8e2de2); }
        
        /* 🔥 VIP AVATARS FOOTER 🔥 */
        .footer { height: auto; min-height: 80px; background:rgba(0,0,0,0.8); border-top:2px solid var(--green); display:flex; gap:10px; overflow-x: auto; padding:8px 10px; align-items: center; justify-content: space-around; box-sizing: border-box; }
        .footer::-webkit-scrollbar { display: none; }
        .player { text-align: center; display: flex; flex-direction: column; align-items: center; min-width: 50px; }
        .p-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1.5px solid #d4af37; background: #222;}
        .p-id { font-size: 9px; color: #ccc; margin-top: 3px; font-weight: bold;}
        .p-bal { font-size: 10px; color: #00ff88; font-weight: bold;}

        .win-popup { pointer-events: none; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; color: #00ff88; font-weight: 900; text-shadow: 0 0 20px #00ff88; z-index: 2000; opacity: 0; transition: 0.5s; }
        .win-popup.show { opacity: 1; transform: translate(-50%, -80%); }
    </style>
</head>
<body onclick="initAudio()">
    
    <div id="network-overlay">
        <div class="loading-chakra"></div>
        <div class="net-text">CONNECTION LOST</div>

    </div>

    <div class="top-status">
        <div class="total-money">
            <div class="back-btn" onclick="window.history.back()">⬅️</div>

        </div>
        <div class="hist-container" id="hist-row"></div>
    </div>

    <div id="win-popup" class="win-popup">+₹0</div>

    <div id="alert-start" class="game-alert"><img src="assets/start-logo-261-5745.png" alt="Start Betting"></div>

    <div class="game-area">
        <div class="table-center">

            <div class="casino-cup" id="cup"></div>
            <div class="dice-wrapper">
                <div class="scene"><div class="cube show-3" id="d1"></div></div>
                <div class="scene"><div class="cube show-4" id="d2"></div></div>
            </div>
        </div>
        
        <div class="board">
            <div class="bet-col">
                <div class="box" id="low" onclick="userBet('low', event)" style="color:var(--blue)">
                    <div class="box-num">2 - 6</div><div class="box-title">DOWN</div><div class="payout-rate">1:1</div><b id="a-low">₹0</b>
                </div>
                <div class="my-bet-text" id="my-low">My Bet: ₹0</div>
            </div>
            
            <div class="bet-col">
                <div class="box" id="tie" onclick="userBet('tie', event)" style="color:var(--gold)">
                    <div class="box-num">7</div><div class="box-title">TIE (LUCKY)</div><div class="payout-rate">1:4</div><b id="a-tie">₹0</b>
                </div>
                <div class="my-bet-text" id="my-tie">My Bet: ₹0</div>
            </div>
            
            <div class="bet-col">
                <div class="box" id="high" onclick="userBet('high', event)" style="color:var(--pink)">
                    <div class="box-num">8 - 12</div><div class="box-title">UP</div><div class="payout-rate">1:1</div><b id="a-high">₹0</b>
                </div>
                <div class="my-bet-text" id="my-high">My Bet: ₹0</div>
            </div>
        </div>

        <div class="chips-bar" id="chips-tray">
            <div class="chip-btn c50 active" data-val="50" onclick="sel(50, this, '#2a5298')">50</div>
            <div class="chip-btn c100" data-val="100" onclick="sel(100, this, '#e65c00')">100</div>
            <div class="chip-btn c500" data-val="500" onclick="sel(500, this, '#1D976C')">500</div>
            <div class="chip-btn c1k" data-val="1000" onclick="sel(1000, this, '#ef473a')">1000</div>
            <div class="chip-btn c5k" data-val="5000" onclick="sel(5000, this, '#11998e')">5000</div>
            <div class="chip-btn c10k" data-val="10000" onclick="sel(10000, this, '#b266ff')">10000</div>
        </div>
    </div>
    
    <div class="footer" id="plist"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const socket = io("https://kalyan-engine.onrender.com");
    let userID = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "GUEST";
    
    let totalBal = 0, depBal = 0, winBal = 0, bonBal = 0; 
    let botsList = [];
    let myBets = { low:0, tie:0, high:0 };
    let realPool = { low:0, tie:0, high:0 }, botPool = { low:0, tie:0, high:0 };
    
    // Default 50 Chip
    let currentChip = 50, currentChipColor = '#2a5298';
    let isBettingOpen = false, isResultProcessing = false;
    let botSimulationInterval;

    const pips = { 1:[5], 2:[3,7], 3:[3,5,7], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
    const faceOrder = ['front', 'right', 'back', 'left', 'top', 'bottom'];

    let audioCtx;
    let audioUnlocked = false;
    function initAudio() {
        if(!audioUnlocked) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioUnlocked = true;
        }
    }

    function playCoinSound() {
        if(!audioCtx || audioCtx.state === 'suspended') return;
        try {
            const n = audioCtx.currentTime; const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(2000, n); o.frequency.exponentialRampToValueAtTime(500, n + 0.1);
            g.gain.setValueAtTime(0.05, n); g.gain.exponentialRampToValueAtTime(0.01, n + 0.1);
            o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(n + 0.1);
        } catch(e){}
    }

    function initGame() {
        build3DDice('d1'); build3DDice('d2');
        
        const avs = ['Avatar0.png', 'Avatar2.png', 'Avatar3.png', 'Avatar4.png', 'Avatar5.png', 'Avatar6.png', 'Avatar7.png', 'Avatar9.png', 'Avatar11.png'];
        for(let i=0; i<6; i++) {
            botsList.push({
                id: Math.floor(1000+Math.random()*9000), 
                bal: Math.floor(20000+Math.random()*50000),
                avatar: avs[Math.floor(Math.random()*avs.length)]
            });
        }
        renderBotsUI();
        
        setInterval(() => {
            botsList.forEach(b => {
                b.bal += Math.floor(Math.random() * 8000) - 3000; 
                if(b.bal > 150000) b.bal = 90000; if(b.bal < 10000) b.bal = 30000;
            });
            renderBotsUI();
        }, 3000);

        if (userID && userID !== "GUEST") {
            db.ref(`users/${userID}`).on('value', (snap) => {
                const data = snap.val() || {};
                depBal = parseFloat(data.balance || 0); winBal = parseFloat(data.winning_balance || 0); bonBal = parseFloat(data.bonus_balance || 0);
                totalBal = depBal + winBal + bonBal; 
                document.getElementById('user-balance').innerText = totalBal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                
                document.querySelectorAll('.chip-btn').forEach(c => { 
                    if(parseInt(c.dataset.val) > totalBal) c.classList.add('locked'); 
                    else c.classList.remove('locked'); 
                });
            });

            db.ref(`Game/7UpDown/Bets/${userID}`).once('value', snap => {
                let saved = snap.val();
                if(saved) {
                    setTimeout(() => {
                        Object.keys(saved).forEach(side => {
                            let val = saved[side];
                            if(val > 0 && myBets[side] !== undefined) {
                                myBets[side] = val;
                                document.getElementById('my-'+side).innerText = "My Bet: ₹" + val.toLocaleString();
                                document.getElementById('my-'+side).style.display = 'block';
                            }
                        });
                    }, 500);
                }
            });
        }
    }
    
    initGame();

    function renderBotsUI() { 
        document.getElementById('plist').innerHTML = botsList.map((p,i) => `
            <div class="player" id="bot-${i}">
                <img class="p-avatar" src="assets/${p.avatar}">
                <div class="p-id">ID_${p.id}</div>
                <div class="p-bal">₹${p.bal.toLocaleString()}</div>
            </div>
        `).join(''); 
    }

    // 🔥 NETWORK CHAKRA 🔥
    window.addEventListener('offline', () => { document.getElementById('network-overlay').style.display = 'flex'; });
    window.addEventListener('online', () => { if(socket.connected) document.getElementById('network-overlay').style.display = 'none'; });
    socket.on('disconnect', () => { document.getElementById('network-overlay').style.display = 'flex'; });
    socket.on('connect', () => { 
        if(navigator.onLine) {
            document.getElementById('network-overlay').style.display = 'none'; 
            isBettingOpen = false;
            fetchInitialHistory();
        }
    });

    // 🔥 HISTORY MASTER LOCK 🔥
    function fetchInitialHistory() {
        db.ref('Game/7UpDown/History').orderByKey().limitToLast(10).once('value', snap => {
            let hist = snap.val();
            if(hist) {
                let hr = document.getElementById('hist-row');
                hr.innerHTML = '';
                Object.values(hist).forEach(w => {
                    let winId = w.toLowerCase().trim();
                    let col = winId === 'low' ? 'var(--blue)' : (winId === 'high' ? 'var(--pink)' : 'var(--gold)');
                    let txt = winId === 'low' ? 'D' : (winId === 'high' ? 'U' : '7');
                    hr.innerHTML += `<div class="h-ank" style="background:${col}">${txt}</div>`;
                });
            }
        });
    }

    function addNewHistoryDot(winId) {
        let col = winId === 'low' ? 'var(--blue)' : (winId === 'high' ? 'var(--pink)' : 'var(--gold)');
        let txt = winId === 'low' ? 'D' : (winId === 'high' ? 'U' : '7');
        
        let hr = document.getElementById('hist-row');
        let d = document.createElement('div');
        d.className = 'h-ank newest-record';
        d.style.background = col;
        d.innerText = txt;
        hr.appendChild(d); // Right side pe add hoga
        
        while(hr.children.length > 10) { hr.removeChild(hr.firstChild); }
    }

    // 🔥 SOCKET SYNC 🔥
    socket.on('7UpDown_timerUpdate', (data) => {
        const timerEl = document.getElementById('timer');
        if(data.state === 'betting') {
            if(!isBettingOpen) {
                isBettingOpen = true;
                isResultProcessing = false;
                resetTable();
                
                let aStart = document.getElementById('alert-start');
                aStart.style.display = 'block'; setTimeout(() => aStart.style.display = 'none', 1000);
                
                clearInterval(botSimulationInterval); botSimulationInterval = setInterval(botBetAction, 300);
            }
            timerEl.innerText = data.timer + "s";
            timerEl.style.color = data.timer <= 5 ? '#ff007f' : '#fff';
        } else {
            timerEl.innerText = "STOP";
            timerEl.style.color = '#fff';
            if(isBettingOpen) {
                isBettingOpen = false;
                clearInterval(botSimulationInterval);
                let aStop = document.getElementById('alert-stop');
                aStop.style.display = 'block'; setTimeout(() => aStop.style.display = 'none', 1000);
            }
        }
    });

    socket.on('7UpDown_result', (data) => {
        if(isResultProcessing) return;
        isResultProcessing = true;
        
        let v1, v2;
        let win = data.winner || 'tie';
        if(win === 'low') {
            do { v1 = Math.floor(Math.random()*6)+1; v2 = Math.floor(Math.random()*6)+1; } while(v1+v2 >= 7);
        } else if(win === 'high') {
            do { v1 = Math.floor(Math.random()*6)+1; v2 = Math.floor(Math.random()*6)+1; } while(v1+v2 <= 7);
        } else {
            let pairs = [[1,6], [2,5], [3,4], [4,3], [5,2], [6,1]];
            let p = pairs[Math.floor(Math.random()*pairs.length)];
            v1 = p[0]; v2 = p[1];
        }
        startRoll(v1, v2, win);
    });

    socket.on('7UpDown_newRound', () => { isResultProcessing = false; });

    // Server Bets Read for Real Pool
    db.ref('Game/7UpDown/Bets').on('value', snap => {
        let allB = snap.val() || {};
        realPool = {low:0, tie:0, high:0};
        for(let u in allB) { 
            if(!u.includes('bot')) { realPool.low += (allB[u].low||0); realPool.tie += (allB[u].tie||0); realPool.high += (allB[u].high||0); } 
        }
        updatePoolUI();
    });

    function updatePoolUI() {
        document.getElementById('a-low').innerText = "₹" + (realPool.low + botPool.low).toLocaleString();
        document.getElementById('a-tie').innerText = "₹" + (realPool.tie + botPool.tie).toLocaleString();
        document.getElementById('a-high').innerText = "₹" + (realPool.high + botPool.high).toLocaleString();
    }

    function startRoll(v1, v2, winId) {
        document.getElementById('timer').innerText = "ROLL";
        const cup = document.getElementById('cup'), d1 = document.getElementById('d1'), d2 = document.getElementById('d2');
        cup.style.transform = 'translateY(0)'; 
        
        setTimeout(() => {
            cup.classList.add('shake-cup'); d1.className = 'cube rolling-dice'; d2.className = 'cube rolling-dice';
            setTimeout(() => {
                cup.classList.remove('shake-cup'); cup.style.transform = 'translateY(-160px)'; 
                d1.className = 'cube show-' + v1; d2.className = 'cube show-' + v2;
                
                let winBox = document.getElementById(winId);
                if(winBox) winBox.classList.add('win-glow');
                
                addNewHistoryDot(winId); // MASTER LOCK History Update
                checkPayout(winId);
                
            }, 2500);
        }, 500);
    }

    function userBet(side, e) {
        if(!isBettingOpen) return;
        if(!userID || userID === "GUEST") { alert("Guest account can't bet!"); return; }
        if(totalBal < currentChip) return;
        
        let nDep = depBal, nWin = winBal, rem = currentChip;
        if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
        db.ref(`users/${userID}`).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        
        db.ref(`Game/7UpDown/Bets/${userID}/${side}`).set(firebase.database.ServerValue.increment(currentChip));
        
        myBets[side] += currentChip;
        document.getElementById('my-'+side).innerText = "My Bet: ₹" + myBets[side].toLocaleString();
        document.getElementById('my-'+side).style.display = 'block';
        
        spawnChip(side, currentChip, currentChipColor, e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);
    }

    function checkPayout(winId) {
        if(myBets[winId] > 0 && userID) {
            let winAmt = (winId === 'tie') ? myBets[winId] * 5 : myBets[winId] * 2;
            db.ref(`users/${userID}/winning_balance`).set(winBal + winAmt);
            
            let p = document.getElementById('win-popup'); 
            p.innerText = "+₹"+winAmt.toLocaleString(); p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }
    }

    function spawnChip(side, val, color, x, y) {
        let chip = document.createElement('div'); chip.className = 'chip-visual';
        chip.style.background = color; chip.innerText = val >= 1000 ? (val/1000)+'K' : val;
        if(val === 50 || val === 100 || val === 10000) chip.style.color = '#fff'; else chip.style.color = '#000';
        
        let box = document.getElementById(side);
        if(!box) return;
        let rect = box.getBoundingClientRect();
        chip.style.left = x + 'px'; chip.style.top = y + 'px';
        document.body.appendChild(chip);
        
        setTimeout(() => {
            chip.style.left = (rect.left + 15 + Math.random()*(rect.width-30)) + 'px';
            chip.style.top = (rect.top + 15 + Math.random()*(rect.height-40)) + 'px';
            playCoinSound();
        }, 30);
        
        setTimeout(() => { if(chip && chip.parentNode) chip.remove(); }, 12000);
    }

    function resetTable() {
        document.querySelectorAll('.chip-visual').forEach(c => c.remove());
        document.querySelectorAll('.box').forEach(b => b.classList.remove('win-glow'));
        document.querySelectorAll('.newest-record').forEach(el => el.classList.remove('newest-record'));
        
        myBets = {low:0,tie:0,high:0}; botPool = {low:0, tie:0, high:0}; updatePoolUI();
        
        ['low','tie','high'].forEach(s => {
            document.getElementById('my-'+s).innerText = "My Bet: ₹0";
            document.getElementById('my-'+s).style.display = 'none';
        });
        document.getElementById('cup').style.transform = 'translateY(-160px)';
    }

    function botBetAction() {
        if(!isBettingOpen) return;
        botsList.forEach((bot, i) => {
            if(Math.random() < 0.3) {
                const sides = ['low', 'high', 'tie'];
                const target = sides[Math.floor(Math.random()*3)];
                const chipData = [
                    {v:50,c:'#2a5298'}, {v:100,c:'#e65c00'}, {v:500,c:'#1D976C'}, 
                    {v:1000,c:'#ef473a'}
                ];
                const ch = chipData[Math.floor(Math.random()*chipData.length)];
                
                if(bot.bal >= ch.v) {
                    bot.bal -= ch.v;
                    let botEl = document.getElementById('bot-'+i);
                    let sX = window.innerWidth/2, sY = window.innerHeight;
                    if(botEl) { let br = botEl.getBoundingClientRect(); sX = br.left; sY = br.top; }
                    
                    spawnChip(target, ch.v, ch.c, sX, sY);
                    botPool[target] += ch.v; updatePoolUI();
                }
            }
        });
    }

    function build3DDice(id) {
        const cube = document.getElementById(id); cube.innerHTML = '';
        for(let i=1; i<=6; i++) {
            let face = document.createElement('div'); face.className = `face ${faceOrder[i-1]}`;
            for(let j=1; j<=9; j++) {
                let slot = document.createElement('div'); if(pips[i].includes(j)) slot.innerHTML = '<div class="pip"></div>';
                face.appendChild(slot);
            }
            cube.appendChild(face);
        }
    }

    function sel(v, el, color) { 
        if(el.classList.contains('locked')) return;
        currentChip = v; currentChipColor = color; 
        document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active')); 
        el.classList.add('active'); playCoinSound(); 
    }
</script>
</body>
</html>
