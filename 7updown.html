<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7 Up Down - Socket VIP Edition (Asset Chips)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root { --gold: #ffcc00; --blue: #00e5ff; --pink: #ff007f; --green: #00ff88; }
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; color:white; font-family: 'Segoe UI', sans-serif; perspective: 1000px; background: linear-gradient(45deg, #1a0033, #001f3f, #3a0028, #002b2b); background-size: 400% 400%; animation: gradientBG 12s ease infinite; user-select: none; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .top-status { width: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border-bottom: 2px solid var(--gold); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-sizing: border-box; }
        .back-btn { padding: 4px 15px; background: rgba(0,0,0,0.8); border: 2px solid #ffd700; border-radius: 20px; color: #ffd700; font-size: 14px; cursor: pointer; font-weight: bold;}
        .total-money { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .total-money span { color: var(--gold); font-size: 1.3rem; font-weight: 900; text-shadow: 0 0 10px var(--gold); }
        
        .hist-container { display: flex; gap: 5px; }
        .h-ank { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 900; border: 1px solid rgba(255,255,255,0.8); text-shadow: 1px 1px 2px #000;}
        
        .game-area { height: calc(100% - 200px); display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; position: relative; }
        .table-center { position: relative; width: 150px; height: 150px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; margin-top: 30px; z-index: 50; }
        .center-timer { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); font-size: 2.2rem; color: #fff; text-shadow: 0 0 20px #ff007f; font-weight: 900; z-index: 60; background: rgba(0,0,0,0.6); padding: 2px 20px; border-radius: 12px; border: 2px solid #ff007f; transition: 0.3s;}
        
        .casino-cup { position: absolute; width: 130px; height: 120px; background: linear-gradient(to right, #4a00e0, #8e2de2, #4a00e0); border-bottom: 4px solid var(--gold); border-radius: 10px 10px 15px 15px; bottom: 10px; z-index: 50; transition: transform 0.6s ease-in-out; transform: translateY(-160px); }
        .casino-cup::before { content: ''; position: absolute; top: -15px; left: 0; width: 100%; height: 30px; background: #2a006e; border-radius: 50%; border: 2px solid #b266ff; }
        
        /* 3D Dice */
        .dice-wrapper { display: flex; gap: 15px; z-index: 10; perspective: 600px; }
        .scene { width: 40px; height: 40px; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .face { position: absolute; width: 40px; height: 40px; background: #fff; border-radius: 5px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 4px; border: 1px solid #ddd; }
        .pip { width: 8px; height: 8px; background: #111; border-radius: 50%; margin: auto; }
        .front { transform: rotateY(0deg) translateZ(20px); } .right { transform: rotateY(90deg) translateZ(20px); }
        .back { transform: rotateY(180deg) translateZ(20px); } .left { transform: rotateY(-90deg) translateZ(20px); }
        .top { transform: rotateX(90deg) translateZ(20px); } .bottom { transform: rotateX(-90deg) translateZ(20px); }
        .show-1 { transform: translateZ(-20px) rotateY(0deg); } .show-2 { transform: translateZ(-20px) rotateY(-90deg); }
        .show-3 { transform: translateZ(-20px) rotateY(-180deg); } .show-4 { transform: translateZ(-20px) rotateY(90deg); }
        .show-5 { transform: translateZ(-20px) rotateX(-90deg); } .show-6 { transform: translateZ(-20px) rotateX(90deg); }
        .rolling-dice { animation: roll3D 0.4s linear infinite; }
        @keyframes roll3D { 0% { transform: translateZ(-20px) rotateX(0deg) rotateY(0deg); } 100% { transform: translateZ(-20px) rotateX(360deg) rotateY(360deg); } }
        .shake-cup { animation: shakeAction 0.15s infinite; }
        @keyframes shakeAction { 0%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-5px) rotate(5deg)} 75%{transform:translateY(-5px) rotate(-5deg)} 100%{transform:translateY(0) rotate(0)} }
        
        .board { display:flex; gap:10px; width:98%; max-width: 500px; z-index: 20;}
        .bet-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .box { height:130px; border-radius:15px; border:2px solid; background:rgba(0,0,0,0.4); display:flex; flex-direction:column; align-items:center; padding-top: 5px; cursor:pointer; position: relative; transition: 0.3s; overflow: visible;}
        #bx-low { border-color: var(--blue); } #bx-tie { border-color: var(--gold); } #bx-high { border-color: var(--pink); }
        .box-num { font-size: 1.6rem; font-weight: 900; line-height: 1; text-shadow: 0 0 15px currentColor; pointer-events: none;}
        .box-title { font-size: 0.8rem; font-weight: bold; pointer-events: none;}
        .payout-rate { font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 5px; margin-top: 3px; pointer-events: none;}
        .box b { position:absolute; bottom:5px; font-size:1.1rem; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; }
        .win-glow { transform:scale(1.05); background: rgba(255,255,255,0.2) !important; box-shadow: 0 0 40px currentColor !important; z-index: 20;}
        
        .my-bet-text { font-size: 0.85rem; color: #fff; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 8px; text-align: center; border: 1px dashed var(--green); font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: none;}
        
        /* 🔥 ASSET CHIPS LAYER 🔥 */
        #chips-layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; overflow: hidden;}
        .chip-visual { pointer-events: none; position: absolute; width: 28px; height: 28px; z-index: 15; transition: 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));}
        .win-anim-chip { transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); z-index: 9999 !important; filter: drop-shadow(0 0 15px var(--gold));}
        
        /* 🔥 ASSET CHIPS TRAY 🔥 */
        .chips-bar { display:flex; gap:6px; margin-top: 10px; z-index: 100; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);}
        .chip-img { width: 42px; height: 42px; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .chip-img.active { transform: scale(1.15) translateY(-5px); filter: drop-shadow(0 0 10px var(--gold)); }
        .chip-img.locked { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        
        .footer { height: auto; min-height: 85px; background:rgba(0,0,0,0.8); border-top:2px solid var(--green); display:flex; gap:6px; padding:6px; overflow-x: auto; box-sizing: border-box; z-index: 100; position: relative;}
        .footer::-webkit-scrollbar { display: none; }
        .p-card { background:linear-gradient(to bottom, #111, #222); padding:4px 8px; border-radius:6px; text-align:center; border: 1px solid rgba(255,255,255,0.2); font-size:0.7rem; height: 45px; min-width: 60px; display: flex; flex-direction: column; justify-content: center; position: relative;}
        
        .win-popup { pointer-events: none; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; color: #00ff88; font-weight: 900; text-shadow: 0 0 20px #00ff88; z-index: 200; opacity: 0; transition: 0.5s; }
        .win-popup.show { opacity: 1; transform: translate(-50%, -80%); }

        .game-alert { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; width: 80%; max-width: 300px; display: none; pointer-events: none; }
        .game-alert img { width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(0,0,0,0.8)); }
    </style>
</head>
<body onclick="initAudio()">

    <audio id="snd-beep" src="assets/22d0dc27-b727-42be-ac04-d9182459f976.mp3" preload="auto"></audio>
    <audio id="snd-drop" src="assets/c9c7036e-1502-4e98-9b70-b8fec24836e4.mp3" preload="auto"></audio>
    <audio id="snd-fly" src="assets/7ba0aedc-0356-404d-9c4a-c34acec66469.mp3" preload="auto"></audio>

    <div class="top-status">
        <div class="back-btn" onclick="window.history.back()">⬅️ HOME</div>
        <div class="total-money">💰 <span id="user-balance">₹0.00</span></div>
        <div class="hist-container" id="hist-row"></div>
    </div>
    
    <div id="win-popup" class="win-popup">+₹0</div>

    <div id="alert-start" class="game-alert"><img src="assets/start-logo-261-5745.png"></div>
    <div id="alert-stop" class="game-alert"><img src="assets/stop-2-5754.gif"></div>

    <div class="game-area" id="game-mount">
        <div id="chips-layer"></div>
        
        <div class="table-center">
            <div class="center-timer" id="timer">15s</div>
            <div class="casino-cup" id="cup"></div>
            <div class="dice-wrapper">
                <div class="scene"><div class="cube show-3" id="d1"></div></div>
                <div class="scene"><div class="cube show-4" id="d2"></div></div>
            </div>
        </div>
        
        <div class="board">
            <div class="bet-col">
                <div class="box" id="bx-low" onclick="userBet('low', event)" style="color:var(--blue)">
                    <div class="box-num">2 - 6</div><div class="box-title">DOWN</div><div class="payout-rate">1:1</div><b id="a-low">₹0</b>
                </div>
                <div class="my-bet-text" id="my-low">My Bet: ₹0</div>
            </div>
            
            <div class="bet-col">
                <div class="box" id="bx-tie" onclick="userBet('tie', event)" style="color:var(--gold)">
                    <div class="box-num">7</div><div class="box-title">TIE (LUCKY)</div><div class="payout-rate">1:4</div><b id="a-tie">₹0</b>
                </div>
                <div class="my-bet-text" id="my-tie">My Bet: ₹0</div>
            </div>
            
            <div class="bet-col">
                <div class="box" id="bx-high" onclick="userBet('high', event)" style="color:var(--pink)">
                    <div class="box-num">8 - 12</div><div class="box-title">UP</div><div class="payout-rate">1:1</div><b id="a-high">₹0</b>
                </div>
                <div class="my-bet-text" id="my-high">My Bet: ₹0</div>
            </div>
        </div>
        
        <div class="chips-bar" id="my-wallet">
            <img src="assets/10_0.png" class="chip-img" data-val="10" onclick="sel(10, this)">
            <img src="assets/50_0.png" class="chip-img" data-val="50" onclick="sel(50, this)">
            <img src="assets/100_0.png" class="chip-img" data-val="100" onclick="sel(100, this)">
            <img src="assets/500_0.png" class="chip-img" data-val="500" onclick="sel(500, this)">
            <img src="assets/1000_0.png" class="chip-img active" data-val="1000" onclick="sel(1000, this)">
            <img src="assets/5000_1.png" class="chip-img" data-val="5000" onclick="sel(5000, this)">
            <img src="assets/10000_0.png" class="chip-img" data-val="10000" onclick="sel(10000, this)">
        </div>
    </div>
    
    <div class="footer" id="plist"></div>

<script>
    const $ = i => document.getElementById(i);
    
    const firebaseConfig = { apiKey: "AIzaSyCy2zsDDJeVTQEbHCenkLIlz3lWWyo-Pqo", databaseURL: "https://kalyan-casino-default-rtdb.firebaseio.com", projectId: "kalyan-casino" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // 🔥 RENDER SERVER SOCKET 🔥
    const socket = io("https://kalyan-engine.onrender.com");

    let totalBal = 0, depBal = 0, winBal = 0, bonBal = 0; 
    let userID = localStorage.getItem('userPhone') || localStorage.getItem('phone') || "GUEST"; 
    
    let historyAnk = [];
    let myBets = { low:0, tie:0, high:0 }, sPool = { low:0, tie:0, high:0 };
    
    // 🔥 ASSET CONFIG 🔥
    const chipImgs = { 10: "assets/10_0.png", 50: "assets/50_0.png", 100: "assets/100_0.png", 500: "assets/500_0.png", 1000: "assets/1000_0.png", 5000: "assets/5000_1.png", 10000: "assets/10000_0.png" };
    let currentChip = 1000, currentChipSrc = chipImgs[1000];
    
    let isRolling = false, iBO = 0, lastBeep = -1;
    let botSimulationInterval;

    const pips = { 1:[5], 2:[3,7], 3:[3,5,7], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
    const faceOrder = ['front', 'right', 'back', 'left', 'top', 'bottom'];

    let iAI = 0;
    function initAudio() { 
        if(!iAI) {
            ['snd-beep','snd-drop','snd-fly'].forEach(i => { try{ let s=$(i); s.play().then(()=>s.pause()).catch(()=>{}); }catch(e){} });
            iAI = 1;
        }
    }

    function pS(i,v) { try{ let s=$(i); if(s){let cl=s.cloneNode(); cl.volume=v; cl.play().catch(()=>{});} }catch(e){} }

    function build3DDice(id) {
        const cube = $(id); cube.innerHTML = '';
        for(let i=1; i<=6; i++) {
            let face = document.createElement('div'); face.className = `face ${faceOrder[i-1]}`;
            for(let j=1; j<=9; j++) {
                let slot = document.createElement('div'); if(pips[i].includes(j)) slot.innerHTML = '<div class="pip"></div>';
                face.appendChild(slot);
            }
            cube.appendChild(face);
        }
    }

    function genPlayers() {
        let h = "";
        for(let i=0; i<6; i++) {
            h += `<div class="p-card" id="bot-${i}"><div style="color:var(--gold)">ID_${Math.floor(1000+Math.random()*9000)}</div><b>₹${Math.floor((50000+Math.random()*150000)/1000)}K</b></div>`;
        }
        $('plist').innerHTML = h;
    }
    
    build3DDice('d1'); build3DDice('d2'); genPlayers();

    // 🔥 PRECISE IMAGE CHIP ANIMATION 🔥
    function spC(side, val, imgSrc, srcId) {
        let layer = $('chips-layer'), box = $('bx-' + side);
        if(!box || !layer) return;

        let chip = document.createElement('img');
        chip.className = 'chip-visual';
        chip.src = imgSrc;
        
        let srcEl = $(srcId) || $('my-wallet');
        let sR = srcEl.getBoundingClientRect(), mR = $('game-mount').getBoundingClientRect(), bR = box.getBoundingClientRect();
        
        chip.style.left = (sR.left - mR.left + sR.width/2 - 14) + "px";
        chip.style.top = (sR.top - mR.top + sR.height/2 - 14) + "px";
        chip.style.transform = "scale(0.3)";
        layer.appendChild(chip);

        setTimeout(() => {
            let randX = 15 + Math.random() * (bR.width - 45);
            let randY = 15 + Math.random() * (bR.height - 45);
            chip.style.left = (bR.left - mR.left + randX) + "px";
            chip.style.top = (bR.top - mR.top + randY) + "px";
            chip.style.transform = "scale(1)";
        }, 50);

        chip.setAttribute('data-side', side);
        if(layer.children.length > 80) layer.firstChild.remove();
        pS('snd-drop', 0.5);
    }

    // Server Socket Listeners
    socket.on('7UpDown_timerUpdate', (data) => {
        let tmr = $('timer');
        if(data.state === 'betting') {
            tmr.innerText = data.timer + "s";
            if(!iBO) {
                iBO=1; isRolling=false; rUI();
                $('alert-start').classList.add('show'); setTimeout(()=>$('alert-start').classList.remove('show'), 1200);
            }
            if(data.timer <= 5) {
                tmr.style.color = '#ff007f'; tmr.style.textShadow = '0 0 20px #ff007f';
                if(data.timer > 0 && lastBeep !== data.timer) { pS('snd-beep', 0.8); lastBeep = data.timer; }
            } else {
                tmr.style.color = '#fff'; tmr.style.textShadow = 'none'; lastBeep = -1;
            }
        }
    });

    socket.on('7UpDown_result', (data) => {
        iBO = 0; isRolling = true; lastBeep = -1;
        $('timer').innerText = "ROLL"; $('timer').style.color = "#fff";
        $('alert-stop').classList.add('show'); setTimeout(()=>$('alert-stop').classList.remove('show'), 1000);
        
        // Smart Dice Calculation Based on Result
        let w = data.winner || 'tie', v1, v2;
        if(w === 'high') { let c = [[2,6],[3,5],[4,4],[4,5],[4,6],[5,5],[5,6],[6,6]]; let r=c[Math.floor(Math.random()*c.length)]; v1=r[0]; v2=r[1]; } 
        else if(w === 'tie') { let c = [[1,6],[2,5],[3,4]]; let r=c[Math.floor(Math.random()*c.length)]; v1=r[0]; v2=r[1]; } 
        else { let c = [[1,1],[1,2],[1,3],[2,2],[2,3],[3,3]]; let r=c[Math.floor(Math.random()*c.length)]; v1=r[0]; v2=r[1]; }
        
        setTimeout(() => startRoll(v1, v2, w), 1000);
    });

    socket.on('7UpDown_newRound', () => {
        iBO = 1; isRolling = false; rUI();
        $('alert-start').classList.add('show'); setTimeout(()=>$('alert-start').classList.remove('show'), 1200);
    });

    if(userID) {
        db.ref(`users/${userID}`).on('value', snap => {
            const d = snap.val() || {};
            depBal = parseFloat(d.balance || 0); winBal = parseFloat(d.winning_balance || 0); bonBal = parseFloat(d.bonus_balance || 0);
            totalBal = depBal + winBal + bonBal; 
            $('user-balance').innerText = "₹" + totalBal.toFixed(2);
            document.querySelectorAll('.chip-img').forEach(c => { if(parseInt(c.dataset.val) > totalBal) c.classList.add('locked'); else c.classList.remove('locked'); });
        });
        
        db.ref('Game/7UpDown/History').on('value', snap => {
            let hist = snap.val() || [];
            let hM = '';
            [...hist].reverse().slice(0, 8).forEach(w => {
                let col = w === 'low' ? 'var(--blue)' : (w === 'high' ? 'var(--pink)' : 'var(--gold)');
                let txt = w === 'low' ? 'D' : (w === 'high' ? 'U' : '7');
                hM += `<div class="h-ank" style="background:${col}">${txt}</div>`;
            });
            $('hist-row').innerHTML = hM;
        });

        // 🔥 RECOVERY 🔥
        db.ref(`Game/7UpDown/Bets/${userID}`).once('value', snap => {
            let saved = snap.val();
            if(saved) {
                setTimeout(() => {
                    Object.keys(saved).forEach(side => {
                        let val = saved[side];
                        if(val > 0 && myBets[side] !== undefined) {
                            myBets[side] = val;
                            $('my-'+side).innerText = "My Bet: ₹" + val; $('my-'+side).style.display = 'block';
                            let box = $('bx-'+side);
                            if(box) {
                                let rect = box.getBoundingClientRect();
                                let c = document.createElement('img'); c.className = 'chip-visual';
                                c.src = chipImgs[1000]; // Recovery chip visual
                                c.style.left = (rect.left + rect.width/2 - 14) + 'px';
                                c.style.top = (rect.top + rect.height/2 - 14) + 'px';
                                document.body.appendChild(c);
                            }
                        }
                    });
                }, 500);
            }
        });
    }

    function sel(v, el) { 
        if(el.classList.contains('locked')) return; 
        currentChip = v; currentChipSrc = chipImgs[v]; 
        document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active')); 
        el.classList.add('active'); 
        pS('snd-drop', 0.5); 
    }

    function userBet(side, e) {
        if(isRolling || !iBO) return;
        if(!userID || userID === "GUEST") { alert("Login Error!"); return; }
        if(totalBal < currentChip) return;
        
        let nDep = depBal, nWin = winBal, rem = currentChip;
        if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
        db.ref(`users/${userID}`).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        db.ref(`Game/7UpDown/Bets/${userID}/${side}`).set(firebase.database.ServerValue.increment(currentChip));
        
        myBets[side] += currentChip;
        $('my-'+side).innerText = "My Bet: ₹" + myBets[side]; $('my-'+side).style.display = 'block';
        spC(side, currentChip, currentChipSrc, 'my-wallet');
    }

    // Bot Animation Loop
    setInterval(() => {
        if(iBO && !isRolling) {
            let s = Math.random() > 0.5 ? 'low' : 'high'; if(Math.random() > 0.8) s = 'tie';
            let chVals = [10, 50, 100, 500, 1000];
            let ch = chVals[Math.floor(Math.random() * chVals.length)];
            let srcId = 'bot-' + Math.floor(Math.random()*6);
            
            spC(s, ch, chipImgs[ch], srcId);
            sPool[s] += ch;
            $('a-'+s).innerText = "₹" + sPool[s].toLocaleString();
        }
    }, 250);

    function startRoll(v1, v2, winId) {
        const cup = $('cup'), d1 = $('d1'), d2 = $('d2');
        cup.style.transform = 'translateY(0)'; 
        
        setTimeout(() => {
            cup.classList.add('shake-cup'); d1.className = 'cube rolling-dice'; d2.className = 'cube rolling-dice';
            setTimeout(() => {
                cup.classList.remove('shake-cup'); cup.style.transform = 'translateY(-160px)'; 
                d1.className = 'cube show-' + v1; d2.className = 'cube show-' + v2;
                
                let winBox = $('bx-'+winId);
                if(winBox) winBox.classList.add('win-glow');
                
                setTimeout(() => {
                    let mR = $('game-mount').getBoundingClientRect(), wR = winBox.getBoundingClientRect();
                    
                    // 1. Losing Chips go to Winner Box
                    document.querySelectorAll('.chip-visual').forEach(c => {
                        if(c.getAttribute('data-side') !== winId) {
                            c.style.left = (wR.left - mR.left + wR.width/2 - 14) + "px";
                            c.style.top = (wR.top - mR.top + wR.height/2 - 14) + "px";
                            c.style.opacity = '0';
                        }
                    });

                    // 2. Winning Chips Explode
                    setTimeout(() => {
                        pS('snd-fly', 1);
                        document.querySelectorAll('.chip-visual').forEach(c => { if(c.style.opacity === '0') c.remove(); });
                        for(let i=0; i<15; i++) {
                            let c = document.createElement('img'); c.className = 'chip-visual win-anim-chip';
                            c.src = chipImgs[100]; 
                            c.style.left = (wR.left - mR.left + wR.width/2 - 14) + "px"; c.style.top = (wR.top - mR.top + wR.height/2 - 14) + "px";
                            $('chips-layer').appendChild(c);
                            
                            setTimeout(() => { 
                                let r = Math.random(), tId = r < 0.3 ? 'my-wallet' : 'bot-'+Math.floor(Math.random()*6);
                                let tR = $(tId).getBoundingClientRect();
                                c.style.left = (tR.left - mR.left + tR.width/2 - 14) + "px"; c.style.top = (tR.top - mR.top + tR.height/2 - 14) + "px"; 
                                c.style.opacity='0';
                            }, 50);
                            setTimeout(()=>c.remove(), 1000);
                        }

                        // 🔥 Winning Payout 🔥
                        if(myBets[winId] > 0 && userID && userID !== "GUEST") {
                            let winAmt = (winId === 'tie') ? myBets[winId] * 5 : myBets[winId] * 2;
                            db.ref(`users/${userID}/winning_balance`).set(winBal + winAmt);
                            let p = $('win-popup'); p.innerText = "+₹" + winAmt.toLocaleString(); p.classList.add('show');
                            setTimeout(() => p.classList.remove('show'), 3000);
                        }
                    }, 800);
                }, 800);
            }, 2500);
        }, 500);
    }

    function rUI() {
        $('chips-layer').innerHTML = '';
        myBets = {low:0, tie:0, high:0}; sPool = {low:0, tie:0, high:0};
        ['low','tie','high'].forEach(s => {
            $('my-'+s).innerText = "My Bet: ₹0"; $('my-'+s).style.display = 'none';
            $('bx-'+s).classList.remove('win-glow');
            $('a-'+s).innerText = "₹0";
        });
        $('cup').style.transform = 'translateY(-160px)';
    }
</script>
</body>
</html>
