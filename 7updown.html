            ['snd-drop', 'snd-win', 'snd-shake', 'snd-beep'].forEach(i => { try{ let s=document.getElementById(i); s.play().then(()=>s.pause()).catch(()=>{}); }catch(e){} });

    }

        const avs = ['Avatar0.png', 'Avatar2.png', 'Avatar3.png', 'Avatar4.png', 'Avatar5.png', 'Avatar6.png', 'Avatar7.png', 'Avatar9.png', 'Avatar11.png'];

            fetchInitialHistory();

    // 🔥 OMNI-TRANSLATOR (Safe Result Parser) 🔥
    function getSafeRecord(raw) {
        if(raw === undefined || raw === null) return { id: 'tie', char: '7', bg: '#d4af37', txt: '#000' };
        let s = String(raw).toLowerCase().trim();
        
        if(s === 'low' || s === 'down' || s === '2-6' || s === 'd' || s === '0') 
            return { id: 'low', char: 'D', bg: '#00e5ff', txt: '#fff' };
            
        if(s === 'high' || s === 'up' || s === '8-12' || s === 'u' || s === '2') 
            return { id: 'high', char: 'U', bg: '#ff007f', txt: '#fff' };
            
        return { id: 'tie', char: '7', bg: '#d4af37', txt: '#000' };
    }

    // 🔥 PERFECT 15-SLOT HISTORY ARRAY 🔥
    function fetchInitialHistory() {
        db.ref('Game/7UpDown/History').orderByKey().limitToLast(15).once('value', snap => {
            localHistory = [];
            if(snap.exists()) {
                snap.forEach(child => {
                    localHistory.push(child.val());
                });
            }
            renderHistory();
        });
    }

    function renderHistory() {
        let hHtml = "";
        let slots = new Array(15).fill(null);
        let showArr = [...localHistory].slice(-15);
        
        // Fill from the right side
        for(let i=0; i<showArr.length; i++) {
            slots[15 - showArr.length + i] = showArr[i];
        }

        slots.forEach((w, idx) => {
            if(w === null) {
                hHtml += `<div class="h-dot empty-dot"></div>`;
            } else {
                let rec = getSafeRecord(w);
                let isNewest = (idx === 14); 
                let extraClass = isNewest ? 'newest-record filled-dot' : 'filled-dot';
                hHtml += `<div class="h-dot ${extraClass}" style="background:${rec.bg}; color:${rec.txt}; border-color:${rec.bg}">${rec.char}</div>`;
            }
        });
        document.getElementById('history-row').innerHTML = hHtml;
    }

    socket.on('7UpDown_timerUpdate', (data) => {
        const timerEl = document.getElementById('timer');
        if(data.state === 'betting') {
            if(!isBettingOpen) {
                isBettingOpen = true;
                isResultProcessing = false;
                resetTable();
                
                let aStart = document.getElementById('alert-start');
                aStart.style.display = 'block'; setTimeout(() => aStart.style.display = 'none', 1000);
                
                clearInterval(botSimulationInterval); botSimulationInterval = setInterval(botBetAction, 300);
            }
            timerEl.innerText = data.timer + "s";
            if(data.timer <= 5) {
                timerEl.style.color = '#ff007f';
                if(data.timer > 0 && lastBeep !== data.timer) { playSound('snd-beep', 0.8); lastBeep = data.timer; }
            } else {
                timerEl.style.color = '#fff'; lastBeep = -1;
            }
        } else {
            timerEl.innerText = "STOP";
            timerEl.style.color = '#fff';
            if(isBettingOpen) {
                isBettingOpen = false;
                clearInterval(botSimulationInterval);
                let aStop = document.getElementById('alert-stop');
                aStop.style.display = 'block'; setTimeout(() => aStop.style.display = 'none', 1000);
            }
        }
    });

    // 🔥 STRICT DICE AUTO-CORRECTION 🔥
    socket.on('7UpDown_result', (data) => {
        if(isResultProcessing) return;
        isResultProcessing = true; lastBeep = -1;
        
        let winId = getSafeRecord(data.winner).id; 
        let v1 = data.v1;
        let v2 = data.v2;

        if(v1 !== undefined && v2 !== undefined) {
            let sum = v1 + v2;
            if(sum < 7) winId = 'low';
            else if(sum > 7) winId = 'high';
            else winId = 'tie';
        } else {
            if(winId === 'low') {
                do { v1 = Math.floor(Math.random()*6)+1; v2 = Math.floor(Math.random()*6)+1; } while(v1+v2 >= 7);
            } else if(winId === 'high') {
                do { v1 = Math.floor(Math.random()*6)+1; v2 = Math.floor(Math.random()*6)+1; } while(v1+v2 <= 7);
            } else {
                let pairs = [[1,6], [2,5], [3,4], [4,3], [5,2], [6,1]];
                let p = pairs[Math.floor(Math.random()*pairs.length)];
                v1 = p[0]; v2 = p[1];
            }
        }
        
        startRoll(v1, v2, winId);
    });

    socket.on('7UpDown_newRound', () => { isResultProcessing = false; });

    db.ref('Game/7UpDown/Bets').on('value', snap => {
        let allB = snap.val() || {};
        realPool = {low:0, tie:0, high:0};
        for(let u in allB) { 
            if(!u.includes('bot')) { realPool.low += (allB[u].low||0); realPool.tie += (allB[u].tie||0); realPool.high += (allB[u].high||0); } 
        }
        updatePoolUI();
    });

    function updatePoolUI() {
        document.getElementById('a-low').innerText = "₹" + (realPool.low + botPool.low).toLocaleString();
        document.getElementById('a-tie').innerText = "₹" + (realPool.tie + botPool.tie).toLocaleString();
        document.getElementById('a-high').innerText = "₹" + (realPool.high + botPool.high).toLocaleString();
    }

    function startRoll(v1, v2, winId) {
        document.getElementById('timer').innerText = "ROLL";
        const cup = document.getElementById('cup'), d1 = document.getElementById('d1'), d2 = document.getElementById('d2');
        cup.style.transform = 'translateY(0)'; 
        playSound('snd-shake', 1.0);
        
        setTimeout(() => {
            cup.classList.add('shake-cup'); d1.className = 'cube rolling-dice'; d2.className = 'cube rolling-dice';
            setTimeout(() => {
                cup.classList.remove('shake-cup'); cup.style.transform = 'translateY(-160px)'; 
                d1.className = 'cube show-' + v1; d2.className = 'cube show-' + v2;
                
                let winBox = document.getElementById(winId);
                if(winBox) winBox.classList.add('win-glow');
                
                // Perfect Sync: Update history ONLY when dice results are shown
                localHistory.push(winId);
                if(localHistory.length > 15) localHistory.shift();
                renderHistory();

                playSound('snd-win', 1.0);

                let centerPos = cup.getBoundingClientRect();
                document.querySelectorAll('.chip-visual').forEach(c => {
                    if(c.getAttribute('data-side') !== winId) {
                        c.style.left = (centerPos.left + centerPos.width/2 - 13) + 'px';
                        c.style.top = (centerPos.top + centerPos.height/2 - 13) + 'px';
                        c.style.opacity = '0';
                        setTimeout(() => c.remove(), 600);
                    }
                });

                setTimeout(() => {
                    let winBoxTop = document.getElementById('top-'+winId).getBoundingClientRect(); // Animate from TOP area ONLY
                    let targets = [];
                    for(let i=0; i<5; i++) {
                        let bot = document.getElementById('bot-'+i);
                        if(bot) targets.push(bot.getBoundingClientRect());
                    }
                    targets.push(document.getElementById('user-balance').getBoundingClientRect());

                    for(let i=0; i<15; i++) {
                        let c = document.createElement('img');
                        c.className = 'chip-visual';
                        c.src = chipImgs[100]; 
                        c.style.left = (winBoxTop.left + winBoxTop.width/2 - 13) + "px";
                        c.style.top = (winBoxTop.top + winBoxTop.height/2 - 13) + "px";
                        c.style.zIndex = '999';
                        c.style.filter = 'drop-shadow(0 0 10px #d4af37)';
                        document.getElementById('chips-layer').appendChild(c);

                        setTimeout(() => {
                            let t = targets[Math.floor(Math.random() * targets.length)];
                            c.style.left = (t.left + t.width/2 - 13) + "px";
                            c.style.top = (t.top + t.height/2 - 13) + "px";
                            c.style.opacity = '0';
                        }, 50);
                        setTimeout(() => c.remove(), 800);
                    }

                    document.querySelectorAll('.chip-visual').forEach(c => {
                        if(c.getAttribute('data-side') === winId) {
                            let t = targets[Math.floor(Math.random() * targets.length)];
                            c.style.left = (t.left + t.width/2 - 13) + "px";
                            c.style.top = (t.top + t.height/2 - 13) + "px";
                            c.style.opacity = '0';
                            setTimeout(() => c.remove(), 800);
                        }
                    });

                    document.querySelectorAll('.player').forEach(bot => {
                        let tag = bot.querySelector('.wl-tag');
                        if(tag) {
                            let isWin = Math.random() > 0.5;
                            let amtNum = (Math.floor(Math.random() * 90) + 10) * 100;
                            tag.innerText = isWin ? '+' + amtNum : '-' + amtNum;
                            tag.className = 'wl-tag ' + (isWin ? 'show-win' : 'show-lose');
                        }
                    });

                    checkPayout(winId);

                }, 400);

            }, 2500);
        }, 500);
    }

    function chooseChip(val, el) {
        if(el.classList.contains('locked')) return;
        document.querySelectorAll('.chip-img').forEach(c => c.classList.remove('active'));
        el.classList.add('active'); currentChip = val; currentChipSrc = chipImgs[val];
        playSound('snd-drop', 0.5);
    };

    window.userBet = function(side, e) {
        if(!isBettingOpen) return;
        if(!userID || userID === "GUEST") { alert("Guest account can't bet!"); return; }
        if(totalBal < currentChip) return;
        
        let nDep = depBal, nWin = winBal, rem = currentChip;
        if(nDep >= rem) { nDep -= rem; } else { rem -= nDep; nDep = 0; nWin -= rem; }
        db.ref(`users/${userID}`).update({ balance: Math.max(0, nDep), winning_balance: Math.max(0, nWin) });
        
        db.ref(`Game/7UpDown/Bets/${userID}/${side}`).set(firebase.database.ServerValue.increment(currentChip));
        
        myBets[side] += currentChip;
        document.getElementById('my-'+side).innerText = "My: ₹" + myBets[side].toLocaleString();
        document.getElementById('my-'+side).style.display = 'block';
        
        spawnChip(side, currentChipSrc, 'my-wallet', false); 
    }

    function checkPayout(winId) {
        if(myBets[winId] > 0 && userID) {
            let winAmt = (winId === 'tie') ? myBets[winId] * 5 : myBets[winId] * 2;
            db.ref(`users/${userID}/winning_balance`).set(winBal + winAmt);
            
            let p = document.getElementById('win-popup'); 
            p.innerText = "+₹"+winAmt.toLocaleString(); p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }
    }

    // 🔥 FIX: Chip Drop Area Restricted to UPPER HALF of the box 🔥
    function spawnChip(side, imgSrc, srcId, isSystemAnim=false) {
        let layer = document.getElementById('chips-layer'), boxTop = document.getElementById('top-'+side);
        if(!boxTop || !layer) return;

        let chip = document.createElement('img');
        chip.className = 'chip-visual';
        chip.src = imgSrc;
        chip.setAttribute('data-side', side);
        
        let srcEl = document.getElementById(srcId) || document.getElementById('my-wallet');
        let sR = srcEl.getBoundingClientRect(), bR = boxTop.getBoundingClientRect();
        
        chip.style.left = (sR.left + sR.width/2 - 13) + "px";
        chip.style.top = (sR.top + sR.height/2 - 13) + "px";
        chip.style.transform = "scale(0.3)";
        layer.appendChild(chip);

        setTimeout(() => {
            // Drop inside the Top part of the Box only
            let randX = 10 + Math.random() * (bR.width - 30);
            let randY = 10 + Math.random() * (bR.height - 20); 
            
            chip.style.left = (bR.left + randX) + "px";
            chip.style.top = (bR.top + randY) + "px";
            chip.style.transform = "scale(1)";
            
            playSound('snd-drop', isSystemAnim ? 0.3 : 0.8);
        }, 50);
        
        if(layer.children.length > 150) layer.firstChild.remove();
    }

    function resetTable() {
        document.getElementById('chips-layer').innerHTML = '';
        document.querySelectorAll('.box').forEach(b => b.classList.remove('win-glow'));
        document.querySelectorAll('.newest-record').forEach(el => el.classList.remove('newest-record'));
        document.querySelectorAll('.wl-tag').forEach(t => t.className = 'wl-tag'); 
        
        myBets = {low:0,tie:0,high:0}; botPool = {low:0, tie:0, high:0}; updatePoolUI();
        
        ['low','tie','high'].forEach(s => {
            document.getElementById('my-'+s).innerText = "My: ₹0";
            document.getElementById('my-'+s).style.display = 'none';
        });
        document.getElementById('cup').style.transform = 'translateY(-160px)';
    }

    function botBetAction() {
        if(!isBettingOpen) return;
        botsList.forEach((bot, i) => {
            if(Math.random() < 0.3) {
                const sides = ['low', 'high', 'tie'];
                const target = sides[Math.floor(Math.random()*3)];
                const chipData = [50, 100, 500, 1000];
                const amt = chipData[Math.floor(Math.random()*chipData.length)];
                
                if(bot.bal >= amt) {
                    bot.bal -= amt;
                    spawnChip(target, chipImgs[amt], 'bot-'+i, true);
                    botPool[target] += amt; updatePoolUI();
                }
            }
        });
    }

    function build3DDice(id) {
        const cube = document.getElementById(id); cube.innerHTML = '';
        for(let i=1; i<=6; i++) {
            let face = document.createElement('div'); face.className = `face ${faceOrder[i-1]}`;
            for(let j=1; j<=9; j++) {
                let slot = document.createElement('div'); if(pips[i].includes(j)) slot.innerHTML = '<div class="pip"></div>';
                face.appendChild(slot);
            }
            cube.appendChild(face);
        }
    }
</script>
</body>
